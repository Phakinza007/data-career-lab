    q: "อธิบายลำดับการทำงานของ tool use กับ LLM API"
    a: |
      ส่งรายการ tools (name, description, input_schema) มาพร้อมคำขอ ถ้าโมเดลต้องการเครื่องมือ มันตอบด้วยคำขอเรียกเครื่องมือ (tool_use: id, name, input) แทนข้อความสุดท้าย โค้ดของเราตรวจอาร์กิวเมนต์ รันฟังก์ชันจริง แล้วส่ง tool_result (พร้อม id เดิม) กลับเป็นข้อความถัดไป วนจนโมเดลตอบข้อความสุดท้าย
  - id: "i2"
    q: "คุณจะออกแบบ description และ schema ของเครื่องมืออย่างไรให้โมเดลใช้ถูก"
    a: |
      ตั้งชื่อสื่อความหมาย เขียน description ว่าเครื่องมือทำอะไร เมื่อไรควรใช้ และไม่ควรใช้เมื่อไร ระบุชนิดและความหมายของแต่ละพารามิเตอร์ ใช้ enum เมื่อมีค่าที่กำหนดได้ ระบุ required ให้ตรง และให้ผลลัพธ์กลับมาสั้นชัดเจน จากนั้นทดสอบกับคำขอจริงหลายแบบเพื่อดูว่าโมเดลเลือกใช้ถูกไหม
flashcards:
  - id: "c1"
    front: "dispatcher ในระบบ agent ทำอะไร"
    back: "ด่านตรวจระหว่างคำขอของโมเดลกับฟังก์ชันจริง: ตรวจชื่อ อาร์กิวเมนต์ ชนิด แล้วรันและจับ error"
  - id: "c2"
    front: "ทำไมต้องส่ง error กลับเป็นข้อความให้โมเดล"
    back: "เพื่อให้โมเดลเห็นว่าผิดตรงไหนแล้วแก้อาร์กิวเมนต์ลองใหม่ได้ แทนที่โปรแกรมจะล้ม"
