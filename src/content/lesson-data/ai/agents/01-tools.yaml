                      return {'ok': False, 'error': f'bad type for {arg}: expected {expected}'}
              try:
                  return {'ok': True, 'result': REGISTRY[name](**args)}
              except Exception as e:
                  return {'ok': False, 'error': f'{type(e).__name__}: {e}'}
          [dispatch({'name': 'get_order', 'input': {}}), dispatch({'name': 'get_order', 'input': {'order_id': '1'}})]
    pitfall:
      text: |
        รันเครื่องมือด้วย REGISTRY[name](**args) โดยไม่ตรวจอะไรเลย — อาร์กิวเมนต์ที่โมเดลสร้างอาจผิดชนิด ขาด หรือมีตัวแปลกปลอมที่ทำให้เกิดผลข้างเคียง ตรวจก่อนรันเสมอและส่ง error ที่อ่านรู้เรื่องกลับให้โมเดล
