    front: "เงื่อนไขหยุดของ agent loop มีอะไรบ้าง"
    back: "โมเดลตอบเป็นข้อความสุดท้าย, ครบ max_steps, (และอาจมีงบ token/เวลา หรือ error ร้ายแรง)"
