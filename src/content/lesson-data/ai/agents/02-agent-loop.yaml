quiz:
  - id: "q1"
    question: "ทำไม agent loop ต้องมี max_steps"
    choices:
      - text: "เพื่อให้โมเดลฉลาดขึ้น"
        why: "ไม่เกี่ยว"
      - text: "กันโมเดลที่วนขอเครื่องมือซ้ำไม่จบ ซึ่งจะเผาเงินและเวลา"
        correct: true
        why: "ถ้าโมเดลวนขอเครื่องมือเดิมซ้ำ ลูปจะไม่จบและจ่ายเงินทุกรอบ — ในตัวอย่าง looping_model ลูปหยุดได้เพราะมีเพดาน max_steps เท่านั้น"
      - text: "เพราะ API บังคับ"
        why: "API ไม่บังคับ ต้องเขียนเอง"
      - text: "ไม่จำเป็น"
        why: "จำเป็น"
  - id: "q2"
    question: "tool_use_id ของ tool_result ต้องเป็นอะไร"
    choices:
      - text: "เลขสุ่มใดๆ"
        why: "ต้องจับคู่"
      - text: "ชื่อของเครื่องมือ"
        why: "ต้องเป็น id"
      - text: "ตรงกับ id ของคำขอ tool_use ที่มันตอบ"
        correct: true
        why: "API จับคู่ผลกับคำขอด้วย id ถ้า tool_use_id ไม่ตรงกับ id ของ tool_use โมเดลไม่รู้ว่าผลนี้ตอบคำขอไหน (โดยเฉพาะเมื่อขอหลายเครื่องมือ) และ API จริงจะปฏิเสธข้อความนั้น"
      - text: "ว่างเปล่า"
        why: "ต้องมี"
  - id: "q3"
    question: "เมื่อ get_order คืน error \"order not found\" ในลูป ควรเกิดอะไรขึ้น"
    choices:
      - text: "โปรแกรมล้ม"
        why: "ไม่นุ่มนวล"
      - text: "เรียกซ้ำไม่จำกัด"
        why: "อันตราย"
      - text: "ซ่อน error"
        why: "ทำให้โมเดลเข้าใจผิด"
      - text: "ส่ง error เป็น observation ให้โมเดลตัดสินใจต่อ (เช่น แจ้งว่าหาไม่พบ) ลูปไม่ล้ม"
        correct: true
        why: "ผล \"order not found\" เป็นข้อมูลที่โมเดลใช้ตอบผู้ใช้ได้ (ตัวอย่างของเราตอบ \"I could not find that order.\") การให้ลูปล้มทำให้ผู้ใช้ได้ error แทนคำตอบที่เป็นประโยชน์"
  - id: "q4"
    question: "ทำไมต้นทุนของ agent จึงโตเร็วกว่าจำนวนรอบ"
    choices:
      - text: "ทุกรอบต้องส่งประวัติทั้งหมดกลับไป ประวัติจึงยาวขึ้นเรื่อยๆ"
        correct: true
        why: "รอบที่ n ต้องส่ง messages ทั้งหมดของรอบก่อนหน้าไปด้วย input จึงโตสะสม (ในแบบฝึกหัดจะเห็นขนาดประวัติเพิ่มขึ้นทุกครั้งที่เรียกโมเดล) ต้นทุนจึงโตเร็วกว่าเส้นตรง"
      - text: "เพราะราคาต่อ token เพิ่มขึ้นเอง"
        why: "ไม่จริง"
      - text: "เพราะเครื่องมือแพง"
        why: "ไม่ใช่เหตุผลหลัก"
      - text: "ไม่โตเร็วกว่า"
        why: "โตเร็วกว่าเส้นตรง"
summary:
  - "Agent loop: เรียกโมเดล → ถ้าขอเครื่องมือ ให้ dispatch แล้วต่อ tool_result (id ตรงกัน) → วนจนได้ข้อความสุดท้ายหรือครบ max_steps (ต้องมี max_steps เสมอ)"
  - "ตัวอย่าง: \"Where is order 1?\" ใช้ 2 รอบ 4 ข้อความ; คำถามสองส่วนใช้ 3 รอบ (count_orders(675) = 14); ออเดอร์ที่ไม่มีอยู่เป็น observation ไม่ทำให้ลูปล้ม"
  - "ประวัติสะสมทำให้ต้นทุนโตเร็วกว่าจำนวนรอบ (โมเดลในบทนี้เป็นสคริปต์จำลอง ส่วนเครื่องมือและ dispatcher เป็นของจริงบนตาราง orders)"
interview:
  - id: "i1"
    q: "อธิบายว่า agent ต่างจากการเรียก LLM ครั้งเดียวอย่างไร"
    a: |
      agent เรียกโมเดลเป็นลูป: โมเดลตัดสินใจว่าจะตอบเลยหรือเรียกเครื่องมือ โค้ดรันเครื่องมือแล้วส่งผลกลับให้โมเดลเห็น วนจนได้คำตอบ จึงทำงานที่ต้องหาข้อมูลหลายขั้นได้ แต่แลกกับต้นทุน ความช้า และความเสี่ยงที่ต้องควบคุม (จำนวนรอบ สิทธิ์ของเครื่องมือ)
  - id: "i2"
    q: "คุณจะดีบัก agent ที่ให้คำตอบผิดอย่างไร"
    a: |
      ดู trace ทั้งลำดับ (ข้อความ tool_use อาร์กิวเมนต์ tool_result) ว่าโมเดลเลือกเครื่องมือ/อาร์กิวเมนต์ถูกไหม เครื่องมือคืนอะไร โมเดลตีความผลผิดหรือไม่ แล้วแก้ที่ต้นเหตุ (description ของเครื่องมือ รูปแบบผลลัพธ์ prompt) และเก็บกรณีที่ผิดไว้เป็นชุดทดสอบ
flashcards:
