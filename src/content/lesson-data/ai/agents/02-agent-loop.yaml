    pitfall:
      text: |
        ไม่ใส่ max_steps ในลูป agent — เมื่อโมเดลวนขอเครื่องมือซ้ำ ลูปไม่จบและเสียเงินทุกรอบ ตั้งเพดานจำนวนรอบเสมอ และคืนสถานะที่บอกว่าหยุดเพราะเพดาน
