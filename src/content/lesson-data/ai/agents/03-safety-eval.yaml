    pitfall:
      text: |
        เขียนใน prompt ว่า 'ห้ามยกเลิกออเดอร์เว้นแต่ผู้ใช้ยืนยัน' แล้วเปิดเครื่องมือยกเลิกให้โมเดลเรียกได้ตรงๆ — คำสั่งใน prompt ถูกชักจูงได้ บังคับด้วยโค้ด: allowlist ต่อเซสชัน + การยืนยันที่ไม่ได้มาจากโมเดล
