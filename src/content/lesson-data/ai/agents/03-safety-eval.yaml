summary:
  - "ควบคุม agent ด้วยโค้ด: allowlist ต่อเซสชัน (สิทธิ์น้อยที่สุด), ยืนยันจากคนสำหรับเครื่องมือเขียน, idempotency, งบ (รอบ/ขนาด/เวลา) — ไม่พึ่งการขอร้องใน prompt"
  - "ข้อความในผลลัพธ์ของเครื่องมืออาจแฝงคำสั่ง: แม้โมเดลหลงเชื่อ cancel_order ก็ถูกปฏิเสธที่ allowlist และไม่มีการกระทำเกิดขึ้น"
  - "ประเมิน trajectory: mock_model success 1.0 / tool match 1.0 / 2.0 รอบ; sloppy_model success 0.8 แต่ tool match 0.6 (success มองไม่เห็นความผิดข้อที่สาม) — ทั้งสองเป็นสคริปต์จำลอง โมเดลจริงต้องรันซ้ำและใช้ชุดทดสอบใหญ่กว่า"
interview:
  - id: "i1"
    q: "คุณจะออกแบบ agent ที่มีเครื่องมือยกเลิกออเดอร์ให้ปลอดภัยอย่างไร"
    a: |
      แยกเครื่องมืออ่านอย่างเดียวกับเครื่องมือเขียน ให้เซสชันทั่วไปเห็นเฉพาะอ่านอย่างเดียว การเขียนต้องผ่านการยืนยันจากผู้ใช้/เจ้าหน้าที่ที่ไม่ได้มาจากโมเดล ตรวจสิทธิ์ผู้ใช้กับทรัพยากร (ยกเลิกได้เฉพาะออเดอร์ของตัวเอง) ใส่ idempotency key จำกัดจำนวนรอบและงบ บันทึก audit log ทุกการกระทำ และทดสอบด้วยกรณี injection
  - id: "i2"
    q: "คุณจะวัดคุณภาพของ agent อย่างไร"
    a: |
      สร้างชุดทดสอบที่มีเฉลย (คำถาม คำตอบ/ผลที่คาด ลำดับเครื่องมือที่ควรเรียก) วัดอัตราสำเร็จ ความถูกต้องของการเลือกเครื่องมือ จำนวนรอบ/ต้นทุน/เวลา และอัตราการทำงานของ guardrail รันหลายครั้งเพราะผลไม่คงที่ วิเคราะห์เคสที่พลาดจาก trace แล้วเพิ่มเป็นเคสทดสอบ
