summary:
  - "Capstone RAG: retrieval → prompt ที่ยึดบริบท/อ้างอิง/ปฏิเสธ → เรียกโมเดล (API จริงหรือตัวสำรอง) → ตรวจ+fallback → ประเมินด้วยตัวเลขและวิเคราะห์จุดที่พลาด"
  - "baseline จากบทเรียน: hit@3 0.8333, MRR 0.752, ประโยคจากเอกสารเฉลย 0.6333 — วัดเองเมื่อปรับปรุง และเก็บชุดคำถามใหม่ไว้ตรวจสุดท้าย"
  - "เก็บ API key นอก repo เสมอ; รายงานข้อจำกัดและต้นทุนอย่างตรงไปตรงมา"
interview:
  - id: "i1"
    q: "เล่าโปรเจกต์ RAG ของคุณใน 1 นาทีให้คนสัมภาษณ์ฟัง"
    a: |
      โครง: ปัญหา (ตอบคำถามลูกค้าจากฐานความรู้) → สถาปัตยกรรม (chunk/ค้นหา/prompt ที่ยึดบริบทและอ้างอิง/ตรวจผล/fallback) → วิธีประเมิน (ชุดคำถามมีเฉลย hit@k MRR อัตราการปฏิเสธถูก การอ้างอิงถูกต้อง ต้นทุนต่อคำถาม) → ผลและสิ่งที่พลาด (เช่น หมวด returns ที่ paraphrase) → สิ่งที่ทำต่อ (embeddings, hybrid, reranker) การชี้จุดอ่อนพร้อมตัวเลขทำให้น่าเชื่อถือ
flashcards:
  - id: "c1"
    front: "สิ่งแรกที่ต้องมีก่อนปรับปรุงระบบ RAG"
    back: "ชุดคำถามที่มีเฉลยและตัวเลขประเมิน (baseline) เพื่อรู้ว่าการเปลี่ยนแปลงดีขึ้นหรือแย่ลง"
