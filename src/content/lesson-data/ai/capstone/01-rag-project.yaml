goals:
  - "สร้างผู้ช่วยตอบคำถามแบบ RAG ตั้งแต่ retrieval, prompt, การเรียกโมเดล, การตรวจผล จนถึงการประเมินด้วยตัวเลข"
  - "ใช้ rubric ตรวจงานตัวเอง (baseline, การอ้างอิง, คำถามนอกขอบเขต, ต้นทุน, ความลับของ API key) ก่อนเผยแพร่"
  - "เผยแพร่ notebook พร้อม README ที่บอกวิธีรันแบบออฟไลน์และข้อจำกัดอย่างซื่อตรง"
