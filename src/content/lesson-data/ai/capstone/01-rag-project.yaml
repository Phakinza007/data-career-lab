exercises:
  - id: "e1"
    level: "basic"
    lang: "python"
    prompt: |
      ตรวจว่าข้อมูลพร้อม: docs มีกี่เอกสาร (n_docs) qs มีกี่คำถาม (n_questions) และเอกสารเฉลยของคำถามทั้งหมดครอบคลุมกี่เอกสารที่ไม่ซ้ำ (n_gold_docs)
    starter: |
      import pandas as pd

      docs = pd.read_csv("data/kb_docs.csv")
      qs = pd.read_csv("data/kb_questions.csv")
      import math
      import re

      import numpy as np
      from sklearn.feature_extraction.text import ENGLISH_STOP_WORDS, TfidfVectorizer
      from sklearn.metrics.pairwise import cosine_similarity

      vec = TfidfVectorizer(stop_words='english')
      D = vec.fit_transform(docs['text'])
      sims = cosine_similarity(vec.transform(qs['question']), D)

      TEMPLATE_RAG = (
          "Answer the question using ONLY the context below. Cite the doc ids in square brackets. "
          "If the answer is not in the context, reply exactly: I don't know.\n\n"
          "Context:\n{context}\n\n"
          "Question: {question}\n"
          "Answer:"
      )


      def est_tokens(text):
          return math.ceil(len(text) / 4)


      def retrieve(question, k=3):
          """คืน [(doc_id, คะแนน cosine)] ของ k เอกสารที่คล้ายที่สุด"""
          s = cosine_similarity(vec.transform([question]), D)[0]
          order = np.argsort(-s, kind='stable')[:k]
          return [(docs['doc_id'][j], float(s[j])) for j in order]
      n_docs = ___
      n_questions = ___
      n_gold_docs = ___
