    solution: |
      import pandas as pd

      docs = pd.read_csv("data/kb_docs.csv")
      qs = pd.read_csv("data/kb_questions.csv")
      import math
      import re

      PRICE_IN = 3.0    # USD ต่อ 1 ล้าน input token (ตัวเลขสมมติ ไม่ใช่ราคาจริง)
      PRICE_OUT = 15.0  # USD ต่อ 1 ล้าน output token (ตัวเลขสมมติ ไม่ใช่ราคาจริง)


      def est_tokens(text):
          return math.ceil(len(text) / 4)


      def toy_tokens(text):
          return re.findall(r"\w+|[^\w\s]", text)
      from collections import Counter

      words = ['low', 'low', 'lower', 'newest', 'newest', 'widest']
      corpus = [list(w) for w in words]
      pairs = Counter((a, b) for word in corpus for a, b in zip(word, word[1:]))
      best = min(pairs, key=lambda p: (-pairs[p], p))
      tokens_before = sum(len(word) for word in corpus)
      merged = []
      for word in corpus:
          out, i = [], 0
          while i < len(word):
              if i + 1 < len(word) and (word[i], word[i + 1]) == best:
                  out.append(word[i] + word[i + 1])
                  i += 2
              else:
                  out.append(word[i])
                  i += 1
          merged.append(out)
      tokens_after = sum(len(word) for word in merged)
    check: |
      check_value(tokens_before, _sol["tokens_before"], name="tokens_before")
      check_value(tokens_after, _sol["tokens_after"], name="tokens_after")
    hints:
      - "วนแต่ละคำ ถ้าคู่ตำแหน่ง i,i+1 ตรงกับ best ให้รวมแล้วข้าม 2 ตำแหน่ง"
