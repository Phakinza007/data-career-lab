goals:
  - "ประมาณจำนวน token และคำนวณต้นทุนของคำขอ LLM (input/output แยกกัน)"
  - "เข้าใจ context window เป็นงบ token และเห็นว่าทำไมจึงไม่ควรยัดทุกอย่างเข้า prompt"
  - "อธิบายแนวคิด subword/BPE ได้ด้วยตัวอย่างที่คำนวณเอง"
examples:
  - id: "x1"
    title: "ประมาณ token และต้นทุน"
    lang: "python"
    prompt: |
      ใช้ตัวประมาณกับฐานความรู้ร้านค้า (kb_docs) แล้วคิดเป็นเงิน
    steps:
      - text: |
          ประมาณ token ของทุกเอกสารด้วยกฎ 4 ตัวอักษร — ผลรวม 1,398 เฉลี่ย ≈ 58 ต่อเอกสาร
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import math
          import re

          PRICE_IN = 3.0    # USD ต่อ 1 ล้าน input token (ตัวเลขสมมติ ไม่ใช่ราคาจริง)
          PRICE_OUT = 15.0  # USD ต่อ 1 ล้าน output token (ตัวเลขสมมติ ไม่ใช่ราคาจริง)


          def est_tokens(text):
              return math.ceil(len(text) / 4)


          def toy_tokens(text):
              return re.findall(r"\w+|[^\w\s]", text)
          tok = docs['text'].map(est_tokens)
          int(tok.sum()), round(tok.mean(), 2)
      - text: |
          ต้นทุนของคำขอหนึ่งครั้ง: input 1,200 + output 300 token → 0.0081 USD (ที่ราคาสมมติ)
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import math
          import re

          PRICE_IN = 3.0    # USD ต่อ 1 ล้าน input token (ตัวเลขสมมติ ไม่ใช่ราคาจริง)
          PRICE_OUT = 15.0  # USD ต่อ 1 ล้าน output token (ตัวเลขสมมติ ไม่ใช่ราคาจริง)


          def est_tokens(text):
              return math.ceil(len(text) / 4)


          def toy_tokens(text):
              return re.findall(r"\w+|[^\w\s]", text)
          round(1200 * PRICE_IN / 1e6 + 300 * PRICE_OUT / 1e6, 6)
    pitfall:
      text: |
        คิดต้นทุนจาก input อย่างเดียวหรือนับคำแทน token — output แพงกว่า input หลายเท่า และ token ไม่เท่ากับคำ ให้คิดแยก input/output และใช้ค่า usage ที่ API รายงานเป็นตัวจริง
  - id: "x2"
    title: "ยัดทุกอย่าง vs ดึงเฉพาะที่เกี่ยว"
    lang: "python"
    prompt: |
      เทียบขนาด prompt ตอนยัดทั้งฐานความรู้กับตอนใส่แค่ 3 เอกสาร
    steps:
      - text: |
          ยัดทุกเอกสารเข้า prompt ≈ 1,405 token ส่วนใส่ 3 เอกสารแรก ≈ 198 token (คำถามข้อแรกต่อท้าย)
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import math
          import re

          PRICE_IN = 3.0    # USD ต่อ 1 ล้าน input token (ตัวเลขสมมติ ไม่ใช่ราคาจริง)
          PRICE_OUT = 15.0  # USD ต่อ 1 ล้าน output token (ตัวเลขสมมติ ไม่ใช่ราคาจริง)


          def est_tokens(text):
              return math.ceil(len(text) / 4)


          def toy_tokens(text):
              return re.findall(r"\w+|[^\w\s]", text)
          question = qs['question'][0]
          all_docs = ' '.join(docs['text'])
          first3 = ' '.join(docs['text'][:3])
          est_tokens(all_docs + question), est_tokens(first3 + question)
      - text: |
          ต้นทุน input ต่อคำถาม (ราคาสมมติ): ≈ 0.0042 เทียบ 0.0006 USD
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import math
          import re

          PRICE_IN = 3.0    # USD ต่อ 1 ล้าน input token (ตัวเลขสมมติ ไม่ใช่ราคาจริง)
          PRICE_OUT = 15.0  # USD ต่อ 1 ล้าน output token (ตัวเลขสมมติ ไม่ใช่ราคาจริง)


          def est_tokens(text):
              return math.ceil(len(text) / 4)


          def toy_tokens(text):
              return re.findall(r"\w+|[^\w\s]", text)
          question = qs['question'][0]
          n_all = est_tokens(' '.join(docs['text']) + question)
          n_3 = est_tokens(' '.join(docs['text'][:3]) + question)
          round(n_all * PRICE_IN / 1e6, 6), round(n_3 * PRICE_IN / 1e6, 6)
    pitfall:
      text: |
        สรุปว่า 'context window ใหญ่พอ ยัดทุกอย่างไปเลย' — แม้จะใส่ได้ แต่จ่ายทุกครั้งที่เรียก ช้าลง และข้อมูลไม่เกี่ยวข้องอาจทำให้คำตอบแย่ลง ดึงเฉพาะส่วนที่ต้องใช้
