    solution: |
      import pandas as pd

      docs = pd.read_csv("data/kb_docs.csv")
      qs = pd.read_csv("data/kb_questions.csv")
      import math
      import re

      PRICE_IN = 3.0    # USD ต่อ 1 ล้าน input token (ตัวเลขสมมติ ไม่ใช่ราคาจริง)
      PRICE_OUT = 15.0  # USD ต่อ 1 ล้าน output token (ตัวเลขสมมติ ไม่ใช่ราคาจริง)


      def est_tokens(text):
          return math.ceil(len(text) / 4)


      def toy_tokens(text):
          return re.findall(r"\w+|[^\w\s]", text)
      n_fit = 0
      used_tokens = 0
      for text in docs['text']:
          t = est_tokens(text)
          if used_tokens + t > 500:
              break
          used_tokens += t
          n_fit += 1
    check: |
      check_value(n_fit, _sol["n_fit"], name="n_fit")
      check_value(used_tokens, _sol["used_tokens"], name="used_tokens")
    hints:
      - "วนเอกสารตามลำดับ หยุดเมื่อจะเกิน 500"
