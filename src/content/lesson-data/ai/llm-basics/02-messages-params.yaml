      import numpy as np

      tokens = ['the', 'a', 'cat', 'dog']
      logits = np.array([2.0, 1.0, 0.5, 0.1])


      def softmax(values, temperature=1.0):
          z = values / temperature
          z = z - z.max()
          e = np.exp(z)
          return e / e.sum()
      p = softmax(logits, 1.0)
      order = np.argsort(-p)[:2]
      q = p[order] / p[order].sum()
      p_top2_first = round(float(q[0]), 4)
      p_top2_second = round(float(q[1]), 4)
    check: |
