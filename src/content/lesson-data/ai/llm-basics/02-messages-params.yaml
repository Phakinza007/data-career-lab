    prompt: |
      top-k = 2: เก็บเฉพาะ 2 token ที่ความน่าจะเป็น (T = 1.0) สูงสุด แล้วปรับให้ผลรวมเป็น 1 — ความน่าจะเป็นใหม่ของอันดับ 1 และ 2 (ปัด 4 ตำแหน่ง) เก็บไว้ใน p_top2_first, p_top2_second
    starter: |
      import numpy as np

      tokens = ['the', 'a', 'cat', 'dog']
      logits = np.array([2.0, 1.0, 0.5, 0.1])


