    solution: |
      import numpy as np

      tokens = ['the', 'a', 'cat', 'dog']
      logits = np.array([2.0, 1.0, 0.5, 0.1])


      def softmax(values, temperature=1.0):
          z = values / temperature
          z = z - z.max()
          e = np.exp(z)
          return e / e.sum()
      grid = [round(0.05 * i, 2) for i in range(1, 41)]
      t_for_90 = max(t for t in grid if softmax(logits, t)[0] >= 0.9)
    check: |
      check_value(t_for_90, _sol["t_for_90"], name="t_for_90")
