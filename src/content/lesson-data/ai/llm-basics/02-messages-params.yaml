        why: "เป็นพฤติกรรมปกติ"
      - text: "temperature ต่ำทำให้การสุ่มเข้าใกล้การเลือกตัวที่น่าจะเป็นที่สุดเสมอ"
        correct: true
        why: "ถูกต้อง"
  - id: "q4"
    question: "เมื่อประวัติยาวเกินงบ token วิธีตัดที่เหมาะสมกว่าคือ"
    choices:
      - text: "เก็บ system prompt ไว้เสมอ แล้วเก็บข้อความใหม่ล่าสุดย้อนหลังเท่าที่งบพอ"
        correct: true
        why: "ถูกต้อง"
      - text: "ตัดข้อความล่าสุดทิ้ง"
        why: "ข้อความล่าสุดสำคัญที่สุด"
      - text: "ตัดสุ่ม"
        why: "บทสนทนาจะขาดตอน"
      - text: "ส่งทั้งหมดแล้วหวังว่าไม่เกิน"
        why: "จะ error หรือแพง"
summary:
  - "API ไม่มีความจำ: ส่ง system + messages ที่จำเป็นทุกครั้ง และตัดประวัติเก่าสุดให้พอดีงบ token (เก็บ system ไว้เสมอ)"
  - "softmax(logits / T): T ต่ำ → คมและนิ่ง, T สูง → แบนและหลากหลาย (T=0.2 เลือก \"the\" 99.6%, T=1.0 เลือก 58.2% ใน 1,000 ครั้ง seed 42)"
  - "top-k เก็บ k ตัวแรก, top-p เก็บชุดเล็กสุดที่ความน่าจะเป็นสะสม ≥ p; งานที่ต้องแม่นใช้ T ต่ำและ cache ผลที่ต้องทำซ้ำได้"
interview:
  - id: "i1"
    q: "LLM API ไม่มีความจำ แล้วแชตบอตจำบทสนทนาได้อย่างไร"
    a: |
      ตัวแอปเก็บประวัติเองแล้วส่ง messages ที่เกี่ยวข้องกลับไปทุกคำขอ เมื่อประวัติยาวเกินงบ token ต้องตัดหรือสรุปข้อความเก่า (เก็บ system prompt และข้อความล่าสุด) และอาจดึงข้อมูลที่เกี่ยวข้องมาจากฐานความรู้ภายนอกแทนการพกทุกอย่างไว้ในประวัติ
  - id: "i2"
    q: "เมื่อไรควรใช้ temperature ต่ำและเมื่อไรควรสูง"
    a: |
      งานที่ต้องการความถูกต้อง สม่ำเสมอ เช่น สกัดข้อมูลเป็น JSON หรือตอบจากเอกสาร ควรใช้ต่ำ ส่วนงานที่ต้องการความหลากหลาย เช่น ระดมไอเดีย เขียนสร้างสรรค์ ใช้สูงกว่า และไม่ควรพึ่ง temperature อย่างเดียวเพื่อให้ผลทำซ้ำได้ ควรเก็บ/แคชผลที่สำคัญ
flashcards:
  - id: "c1"
    front: "temperature ทำอะไรกับ softmax"
    back: "หาร logits ด้วย T ก่อน softmax: T ต่ำทำให้การกระจายคมขึ้น, T สูงทำให้แบนลง"
  - id: "c2"
    front: "top-p (nucleus) คืออะไร"
    back: "เลือกชุด token ที่เล็กที่สุดซึ่งความน่าจะเป็นสะสมถึง p แล้วสุ่มเฉพาะในชุดนั้น"
