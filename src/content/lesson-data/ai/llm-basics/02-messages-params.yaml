  - id: "e8"
    level: "challenge"
    lang: "python"
    prompt: |
      ในช่วง temperature 0.05, 0.10, …, 2.00 (ห่างกัน 0.05 ใช้ round(0.05 * i, 2) เมื่อ i = 1..40) ค่า temperature ที่มากที่สุดที่ทำให้ token แรกยังมีความน่าจะเป็น ≥ 0.9 คือเท่าไร เก็บไว้ใน t_for_90
    starter: |
      import numpy as np

      tokens = ['the', 'a', 'cat', 'dog']
      logits = np.array([2.0, 1.0, 0.5, 0.1])


