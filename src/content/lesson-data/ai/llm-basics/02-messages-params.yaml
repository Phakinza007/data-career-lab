    solution: |
      import numpy as np

      tokens = ['the', 'a', 'cat', 'dog']
      logits = np.array([2.0, 1.0, 0.5, 0.1])


      def softmax(values, temperature=1.0):
          z = values / temperature
          z = z - z.max()
          e = np.exp(z)
          return e / e.sum()
      def frac_first(temperature):
          rng = np.random.RandomState(42)
          draws = rng.choice(len(tokens), size=1000, p=softmax(logits, temperature))
          return float((draws == 0).mean())


      frac_t1 = frac_first(1.0)
      frac_t02 = frac_first(0.2)
    check: |
      check_value(frac_t1, _sol["frac_t1"], name="frac_t1", tol=1e-09)
      check_value(frac_t02, _sol["frac_t02"], name="frac_t02", tol=1e-09)
