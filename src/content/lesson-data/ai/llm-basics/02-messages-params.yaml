goals:
  - "สร้างคำขอแบบ messages (system + user/assistant) และตัดประวัติให้พอดีงบ token"
  - "คำนวณ softmax ที่ปรับด้วย temperature และเข้าใจผลต่อความหลากหลายของคำตอบ"
  - "อธิบาย top-k และ top-p (nucleus) ด้วยการคำนวณเอง"
examples:
  - id: "x1"
    title: "softmax กับ temperature"
    lang: "python"
    prompt: |
      ดูว่า temperature เปลี่ยนความน่าจะเป็นอย่างไร
    steps:
      - text: |
          ที่ T = 1.0 ตัวเลือกแรก ("the") ได้ 0.5745
        code: |
          import numpy as np

          tokens = ['the', 'a', 'cat', 'dog']
          logits = np.array([2.0, 1.0, 0.5, 0.1])


          def softmax(values, temperature=1.0):
              z = values / temperature
              z = z - z.max()
              e = np.exp(z)
              return e / e.sum()
          dict(zip(tokens, softmax(logits, 1.0).round(4)))
      - text: |
          T = 0.5 คมขึ้น (0.8282) และ T = 2.0 แบนลง (0.4056)
        code: |
          import numpy as np

          tokens = ['the', 'a', 'cat', 'dog']
          logits = np.array([2.0, 1.0, 0.5, 0.1])


          def softmax(values, temperature=1.0):
              z = values / temperature
              z = z - z.max()
              e = np.exp(z)
              return e / e.sum()
          round(softmax(logits, 0.5)[0], 4), round(softmax(logits, 2.0)[0], 4)
    pitfall:
      text: |
        คิดว่าตั้ง temperature เป็น 0 (หรือต่ำมาก) แล้วผลจะเหมือนเดิมทุกครั้งเสมอ — ในทางปฏิบัติผู้ให้บริการอาจยังให้ผลต่างกันเล็กน้อย เก็บคำตอบที่ต้องทำซ้ำได้ไว้ด้วย cache
  - id: "x2"
    title: "ตัดประวัติให้พอดีงบ token"
    lang: "python"
    prompt: |
      เก็บข้อความใหม่ล่าสุดย้อนหลังจนเต็มงบ
    steps:
      - text: |
          ประมาณ token ของแต่ละข้อความ: [10, 20, 30, 10, 15]
        code: |
          import math

          SYSTEM = 'You are a helpful support assistant for an online store.'
          history = [
              {'role': 'user', 'content': 'x' * 40},
              {'role': 'assistant', 'content': 'y' * 80},
              {'role': 'user', 'content': 'z' * 120},
              {'role': 'assistant', 'content': 'w' * 40},
              {'role': 'user', 'content': 'v' * 60},
          ]


          def est_tokens(text):
              return math.ceil(len(text) / 4)
          [est_tokens(m['content']) for m in history]
      - text: |
          งบ 60 token: เก็บจากท้ายมาต้น — ได้ 3 ข้อความ รวม 55 token
        code: |
          import math

          SYSTEM = 'You are a helpful support assistant for an online store.'
          history = [
              {'role': 'user', 'content': 'x' * 40},
              {'role': 'assistant', 'content': 'y' * 80},
              {'role': 'user', 'content': 'z' * 120},
              {'role': 'assistant', 'content': 'w' * 40},
              {'role': 'user', 'content': 'v' * 60},
          ]


          def est_tokens(text):
              return math.ceil(len(text) / 4)
          kept, used = [], 0
          for m in reversed(history):
              t = est_tokens(m['content'])
              if used + t > 60:
                  break
              kept.insert(0, m)
              used += t
          len(kept), used
    pitfall:
      text: |
        ตัดประวัติจากต้นทางแบบสุ่มหรือทิ้ง system prompt — คำสั่งระบบหายทำให้พฤติกรรมเปลี่ยน และบทสนทนาขาดตอนกลางคัน เก็บ system เสมอ แล้วตัดข้อความเก่าสุดก่อน
