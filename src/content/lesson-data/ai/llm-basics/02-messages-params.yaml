  - id: "e9"
    level: "challenge"
    lang: "python"
    prompt: |
      top-p (nucleus) ที่ p = 0.9 ที่ T = 1.0: เรียง token ตามความน่าจะเป็นมากไปน้อย แล้วเลือกชุดเล็กสุดที่ความน่าจะเป็นสะสม ≥ 0.9 — เก็บจำนวนไว้ใน nucleus_size และรายชื่อ token (list ตามลำดับ) ไว้ใน nucleus_tokens
    starter: |
      import numpy as np

      tokens = ['the', 'a', 'cat', 'dog']
      logits = np.array([2.0, 1.0, 0.5, 0.1])


      def softmax(values, temperature=1.0):
          z = values / temperature
          z = z - z.max()
          e = np.exp(z)
          return e / e.sum()
      nucleus_size = ___
      nucleus_tokens = ___
    solution: |
      import numpy as np

      tokens = ['the', 'a', 'cat', 'dog']
      logits = np.array([2.0, 1.0, 0.5, 0.1])


      def softmax(values, temperature=1.0):
          z = values / temperature
          z = z - z.max()
          e = np.exp(z)
          return e / e.sum()
      p = softmax(logits, 1.0)
      order = np.argsort(-p)
      cum = np.cumsum(p[order])
      nucleus_size = int(np.searchsorted(cum, 0.9) + 1)
      nucleus_tokens = [tokens[i] for i in order[:nucleus_size]]
    check: |
      check_value(nucleus_size, _sol["nucleus_size"], name="nucleus_size")
      check_value(nucleus_tokens, _sol["nucleus_tokens"], name="nucleus_tokens")
    hints:
      - "np.cumsum และ np.searchsorted(cum, 0.9) + 1"
