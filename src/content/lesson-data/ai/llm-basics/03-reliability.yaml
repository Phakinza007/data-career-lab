summary:
  - "retry เฉพาะ 429/5xx/timeout ด้วย backoff 1, 2, 4, 8… (มีเพดานและ jitter) และห้าม retry คำขอผิด (400/401) หรือคำขอที่มีผลข้างเคียงโดยไม่มี idempotency key"
  - "cache ด้วยกุญแจ sha256(json.dumps(req, sort_keys=True)); ตัวอย่างลำดับ 8 คำขอมี 4 ข้อความไม่ซ้ำ hit rate 0.5"
  - "sliding window จำกัดอัตราคำขอ; circuit breaker เปิดหลังล้มเหลวติดกัน 3 ครั้งเพื่อหยุดถล่มบริการ (บทนี้จำลองบริการด้วยฟังก์ชัน ไม่ได้เรียก API จริง)"
interview:
  - id: "i1"
    q: "คุณจะทำให้แอปที่เรียก LLM API ทนต่อ rate limit และ downtime ได้อย่างไร"
    a: |
      retry เฉพาะข้อผิดพลาดชั่วคราวด้วย exponential backoff + jitter และจำกัดจำนวนครั้ง ตั้ง timeout, ใช้ cache สำหรับคำขอซ้ำ, ใส่ rate limiter ฝั่งเราเพื่อไม่ชนเพดาน, circuit breaker/fallback เมื่อบริการล่มนาน, ทำ idempotency สำหรับคำขอที่มีผลข้างเคียง และบันทึก log/metrics ของทุก retry เพื่อดูแนวโน้ม
  - id: "i2"
    q: "เมื่อไรที่การ cache คำตอบของ LLM ไม่เหมาะสม"
    a: |
      เมื่อต้องการความหลากหลายของคำตอบ เมื่อคำตอบขึ้นกับข้อมูลที่เปลี่ยนตลอดเวลาหรือบริบทเฉพาะผู้ใช้ (ต้องรวมสิ่งเหล่านั้นในกุญแจหรือไม่ cache) และเมื่อเนื้อหาต้นทางเปลี่ยน (ต้องมี TTL/การล้าง cache) รวมถึงข้อมูลส่วนบุคคลที่ไม่ควรเก็บ
