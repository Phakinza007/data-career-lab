      import hashlib
      import json
      import random


      class RateLimitError(Exception):
          pass


      def make_flaky(fail_times):
          """จำลองบริการที่ล้มเหลว fail_times ครั้งแรกแล้วค่อยสำเร็จ"""
          state = {'calls': 0}

          def call(prompt):
              state['calls'] += 1
              if state['calls'] <= fail_times:
                  raise RateLimitError('429')
              return 'ok: ' + prompt

          return call
      timestamps = [0, 1, 2, 3, 10, 11, 11.5, 12, 12.5, 13]
      window, limit = 5, 3
      allowed = []
      rejected = 0
      for t in timestamps:
          recent = [a for a in allowed if a > t - window]
          if len(recent) < limit:
              allowed.append(t)
          else:
              rejected += 1
      accepted = len(allowed)
    check: |
      check_value(accepted, _sol["accepted"], name="accepted")
      check_value(rejected, _sol["rejected"], name="rejected")
    hints:
      - "เก็บเฉพาะเวลาที่ allowed และดูเฉพาะที่ > t − 5"
