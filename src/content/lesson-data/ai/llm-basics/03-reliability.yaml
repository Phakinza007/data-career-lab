goals:
  - "retry เฉพาะข้อผิดพลาดชั่วคราวด้วย exponential backoff (พร้อมเพดานและ jitter)"
  - "ทำ cache ที่มีกุญแจ deterministic และวัด hit rate / ต้นทุนที่ประหยัดได้"
  - "อธิบายและจำลอง sliding-window rate limiter และ circuit breaker"
examples:
  - id: "x1"
    title: "retry ด้วย backoff"
    lang: "python"
    prompt: |
      ลองเรียกบริการที่ล้มเหลว 2 ครั้งแรก
    steps:
      - text: |
          ตารางเวลารอ (base 1 วินาที เพดาน 8): [1, 2, 4, 8, 8]
        code: |
          def backoff_delays(attempts, base=1, cap=8):
              return [min(cap, base * 2 ** k) for k in range(attempts)]


          backoff_delays(5)
      - text: |
          retry_call ลองสูงสุด 4 ครั้ง — สำเร็จครั้งที่ 3 โดยรอ 1 + 2 = 3 วินาที (บันทึกไว้ใน log ไม่ได้รอจริง)
        code: |
          import hashlib
          import json
          import random


          class RateLimitError(Exception):
              pass


          def make_flaky(fail_times):
              """จำลองบริการที่ล้มเหลว fail_times ครั้งแรกแล้วค่อยสำเร็จ"""
              state = {'calls': 0}

              def call(prompt):
                  state['calls'] += 1
                  if state['calls'] <= fail_times:
                      raise RateLimitError('429')
                  return 'ok: ' + prompt

              return call
          def retry_call(fn, prompt, max_attempts=4):
              waits = []
              for attempt in range(max_attempts):
                  try:
                      return fn(prompt), attempt + 1, waits
                  except RateLimitError:
                      waits.append(min(8, 1 * 2 ** attempt))
              raise RuntimeError('giving up')


          retry_call(make_flaky(2), 'hello')
    pitfall:
      text: |
        retry ทุกข้อผิดพลาดแบบไม่จำกัดรอบและไม่รอ (tight loop) — ถล่มบริการที่กำลังล่มซ้ำ และคำขอที่ผิดตั้งแต่ต้น (400) จะล้มเหลวตลอดไป จำกัดรอบ รอแบบ exponential และ retry เฉพาะข้อผิดพลาดชั่วคราว
  - id: "x2"
    title: "cache และ hit rate"
    lang: "python"
    prompt: |
      สร้างกุญแจ cache และวัดว่าประหยัดกี่คำขอ
    steps:
      - text: |
          กุญแจ cache เป็น sha256 ของ JSON ที่เรียง key — dict ลำดับต่างกันได้กุญแจเดียวกัน
        code: |
          import hashlib
          import json
          import random


          class RateLimitError(Exception):
              pass


          def make_flaky(fail_times):
              """จำลองบริการที่ล้มเหลว fail_times ครั้งแรกแล้วค่อยสำเร็จ"""
              state = {'calls': 0}

              def call(prompt):
                  state['calls'] += 1
                  if state['calls'] <= fail_times:
                      raise RateLimitError('429')
                  return 'ok: ' + prompt

              return call
          a = {'model': 'demo', 'prompt': 'hello'}
          b = {'prompt': 'hello', 'model': 'demo'}


          def cache_key(req):
              return hashlib.sha256(json.dumps(req, sort_keys=True).encode()).hexdigest()


          cache_key(a) == cache_key(b), len(cache_key(a))
      - text: |
          ลำดับคำขอ 8 ครั้งมี 4 ข้อความไม่ซ้ำ → เรียกจริง 4 ครั้ง hit rate 0.5
        code: |
          prompts = ['a', 'b', 'a', 'c', 'b', 'a', 'd', 'a']
          cache, api_calls = {}, 0
          for p in prompts:
              if p not in cache:
                  api_calls += 1
                  cache[p] = 'answer to ' + p
          api_calls, (len(prompts) - api_calls) / len(prompts)
    pitfall:
      text: |
        ใช้ str(dict) หรือ hash() ของ Python เป็นกุญแจ cache — ลำดับ key ทำให้กุญแจต่างกัน และ hash() ของข้อความเปลี่ยนไปในแต่ละรอบการรันโปรแกรม ใช้ json.dumps(sort_keys=True) + sha256
