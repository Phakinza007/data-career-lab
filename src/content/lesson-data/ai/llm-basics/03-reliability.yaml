      import pandas as pd

      docs = pd.read_csv("data/kb_docs.csv")
      qs = pd.read_csv("data/kb_questions.csv")
      questions = list(qs['question'])
      stream = questions[:10] * 3 + questions[10:]
      unique_calls = len(set(stream))
      calls_saved = len(stream) - unique_calls
      saving_pct = round(100 * calls_saved / len(stream), 1)
    check: |
      check_value(unique_calls, _sol["unique_calls"], name="unique_calls")
      check_value(calls_saved, _sol["calls_saved"], name="calls_saved")
      check_value(saving_pct, _sol["saving_pct"], name="saving_pct", tol=0.001)
    hints:
      - "questions[:10] * 3 + questions[10:] แล้วนับ set"
