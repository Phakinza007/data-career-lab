goals:
  - "ตัดเอกสารเป็น chunk แบบ sliding window (size/overlap) และคำนวณจำนวน chunk ได้"
  - "ประเมินขนาด chunk ด้วย hit@k คู่กับปริมาณข้อความที่ส่งเข้า prompt"
  - "ระวังตัวเลขที่หลอกตาเมื่อ chunk ใหญ่ครอบคลุมหลายเอกสาร"
examples:
  - id: "x1"
    title: "ตัดคู่มือเป็น chunk"
    lang: "python"
    prompt: |
      ต่อ 24 เอกสารเป็นคู่มือเล่มเดียวแล้วตัดด้วยหน้าต่างเลื่อน
    steps:
      - text: |
          คู่มือมี 973 คำ; เอกสาร d05 อยู่ที่ช่วงคำ (ค่า start, end) ใด
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import numpy as np
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.metrics.pairwise import cosine_similarity

          # ต่อทุกเอกสารเป็น "คู่มือ" เล่มเดียว แล้วจดว่าแต่ละเอกสารอยู่ที่คำลำดับไหนถึงไหน
          words = []
          spans = {}
          for doc_id, text in zip(docs['doc_id'], docs['text']):
              w = text.split()
              spans[doc_id] = (len(words), len(words) + len(w))
              words += w
          len(words), spans['d05']
      - text: |
          ขนาด 100 overlap 20 ได้ 12 chunk เลื่อนทีละ 80 คำ (ตำแหน่งเริ่ม 0, 80, 160, …) และ chunk สุดท้ายเหลือ 93 คำ
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import numpy as np
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.metrics.pairwise import cosine_similarity

          # ต่อทุกเอกสารเป็น "คู่มือ" เล่มเดียว แล้วจดว่าแต่ละเอกสารอยู่ที่คำลำดับไหนถึงไหน
          words = []
          spans = {}
          for doc_id, text in zip(docs['doc_id'], docs['text']):
              w = text.split()
              spans[doc_id] = (len(words), len(words) + len(w))
              words += w


          def chunk(words, size, overlap):
              """คืน list ของ (ตำแหน่งคำเริ่มต้น, ข้อความ) — หน้าต่างยาว size คำ เลื่อนทีละ size - overlap"""
              step = size - overlap
              out = []
              for start in range(0, len(words), step):
                  out.append((start, ' '.join(words[start:start + size])))
                  if start + size >= len(words):
                      break
              return out
          chunks = chunk(words, 100, 20)
          len(chunks), [s for s, _ in chunks][:4], len(chunks[-1][1].split())
    pitfall:
      text: |
        ตั้ง overlap ≥ size — step (size − overlap) จะเป็น 0 หรือติดลบ ทำให้ range() error หรือวนไม่จบ ตรวจให้ overlap < size เสมอ
  - id: "x2"
    title: "ขนาด chunk กับ hit@k และปริมาณที่ส่ง"
    lang: "python"
    prompt: |
      วัดด้วย evaluate (ให้ไว้ ค้นด้วย TF-IDF)
    steps:
      - text: |
          ขนาด 40 ไม่ overlap: 25 chunk, hit@1 0.6333, hit@3 0.9
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import numpy as np
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.metrics.pairwise import cosine_similarity

          # ต่อทุกเอกสารเป็น "คู่มือ" เล่มเดียว แล้วจดว่าแต่ละเอกสารอยู่ที่คำลำดับไหนถึงไหน
          words = []
          spans = {}
          for doc_id, text in zip(docs['doc_id'], docs['text']):
              w = text.split()
              spans[doc_id] = (len(words), len(words) + len(w))
              words += w


          def chunk(words, size, overlap):
              """คืน list ของ (ตำแหน่งคำเริ่มต้น, ข้อความ) — หน้าต่างยาว size คำ เลื่อนทีละ size - overlap"""
              step = size - overlap
              out = []
              for start in range(0, len(words), step):
                  out.append((start, ' '.join(words[start:start + size])))
                  if start + size >= len(words):
                      break
              return out


          def evaluate(size, overlap):
              """คืน (จำนวน chunk, hit@1, hit@3) — chunk ถูกต้องถ้าช่วงคำของมันทับกับเอกสารเฉลยอย่างน้อยหนึ่งคำ"""
              chunks = chunk(words, size, overlap)
              starts = [s for s, _ in chunks]
              texts = [t for _, t in chunks]
              vec = TfidfVectorizer(stop_words='english')
              D = vec.fit_transform(texts)
              sims = cosine_similarity(vec.transform(qs['question']), D)
              hit1 = hit3 = 0
              for i, gold in enumerate(qs['gold_doc_id']):
                  g_start, g_end = spans[gold]
                  order = np.argsort(-sims[i], kind='stable')

                  def ok(c):
                      s = starts[c]
                      return s < g_end and s + len(texts[c].split()) > g_start

                  hit1 += ok(order[0])
                  hit3 += any(ok(c) for c in order[:3])
              return len(chunks), round(hit1 / len(qs), 4), round(hit3 / len(qs), 4)
          evaluate(40, 0)
      - text: |
          เทียบประสิทธิภาพต่อปริมาณที่ส่ง (hit@3 ÷ (3 × ขนาด ÷ 100)): ขนาด 40 ได้ 0.75 ขนาด 200 ได้ 0.1667
        code: |
