    question: "ถ้าตั้ง overlap = size จะเกิดอะไรกับ chunk แบบ sliding window ในบทนี้"
    choices:
      - text: "step = 0 ทำให้ range() error/วนไม่จบ ต้องให้ overlap < size"
        correct: true
        why: "ถูกต้อง"
      - text: "ได้ chunk ที่ดีที่สุด"
        why: "ไม่จริง"
      - text: "จำนวน chunk เป็นครึ่งหนึ่ง"
        why: "ไม่จริง"
      - text: "ไม่มีผลอะไร"
        why: "มีผล"
summary:
  - "RAG ค้นหาระดับ chunk: ตัดเอกสารด้วย size/overlap (973 คำ ขนาด 100 overlap 20 → 12 chunk) โดยให้ chunk เป็นหน่วยความหมายที่อ่านเดี่ยวๆ รู้เรื่อง"
  - "hit@k เพิ่มตามขนาด chunk (ขนาด 200 hit@3 = 1.0, ทั้งเล่ม = 1.0) แต่เป็นเพราะครอบคลุมหลายเอกสาร — ต้องดูปริมาณที่ส่งควบคู่ (ขนาด 40: 0.75 ต่อ 100 คำ vs ขนาด 200: 0.1667)"
  - "ไม่มีขนาดสากล เลือกจากการวัดบนคำถามจริง; overlap ต้องน้อยกว่า size"
interview:
  - id: "i1"
    q: "คุณจะเลือกขนาด chunk สำหรับระบบ RAG อย่างไร"
    a: |
      เริ่มจากตัดตามโครงสร้างเอกสาร (หัวข้อ ย่อหน้า) แล้วจำกัดความยาว จากนั้นทดลองหลายขนาดและ overlap บนชุดคำถามที่มีเฉลย วัด hit@k/recall ของ retrieval และปริมาณ token ที่ส่งเข้า prompt พร้อมคุณภาพคำตอบ เลือกจุดที่คุ้ม ระวังตัวชี้วัดที่ดีขึ้นเพียงเพราะ chunk ใหญ่ครอบคลุมทุกอย่าง
  - id: "i2"
    q: "chunk เล็กเกินไปและใหญ่เกินไปมีปัญหาอะไร"
    a: |
      เล็กเกินไปตัดบริบทขาด ข้อมูลที่ต้องอ่านร่วมกันแยกไปอยู่คนละ chunk และมีจำนวน chunk มาก; ใหญ่เกินไปมีหลายเรื่องปน retrieval ไม่แม่นยำ สิ้นเปลือง token และสิ่งรบกวนทำให้โมเดลตอบแย่ลง
flashcards:
  - id: "c1"
    front: "chunk overlap คืออะไร"
    back: "จำนวนคำ/token ที่ซ้อนกันระหว่าง chunk ติดกัน เพื่อไม่ให้ข้อมูลสำคัญถูกตัดขาดตรงรอยต่อ"
  - id: "c2"
    front: "hit@k คืออะไรในงาน retrieval"
    back: "สัดส่วนคำถามที่ผลลัพธ์อันดับ 1..k มีเอกสาร/ส่วนที่ถูกต้องอยู่ด้วย"
