    solution: |
      import pandas as pd

      docs = pd.read_csv("data/kb_docs.csv")
      qs = pd.read_csv("data/kb_questions.csv")
      import numpy as np
      from sklearn.feature_extraction.text import TfidfVectorizer
      from sklearn.metrics.pairwise import cosine_similarity

      # ต่อทุกเอกสารเป็น "คู่มือ" เล่มเดียว แล้วจดว่าแต่ละเอกสารอยู่ที่คำลำดับไหนถึงไหน
      words = []
      spans = {}
      for doc_id, text in zip(docs['doc_id'], docs['text']):
          w = text.split()
          spans[doc_id] = (len(words), len(words) + len(w))
          words += w


      def chunk(words, size, overlap):
          """คืน list ของ (ตำแหน่งคำเริ่มต้น, ข้อความ) — หน้าต่างยาว size คำ เลื่อนทีละ size - overlap"""
          step = size - overlap
          out = []
          for start in range(0, len(words), step):
              out.append((start, ' '.join(words[start:start + size])))
              if start + size >= len(words):
                  break
          return out
      def n_split(size):
          chunks = chunk(words, size, 0)
          ranges = [(s, s + len(t.split())) for s, t in chunks]
          return sum(1 for g_start, g_end in spans.values() if sum(1 for s, e in ranges if s < g_end and e > g_start) >= 2)


      n_split_60 = n_split(60)
      n_split_100 = n_split(100)
