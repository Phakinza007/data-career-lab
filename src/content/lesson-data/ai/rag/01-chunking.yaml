                  hit1 += ok(order[0])
                  hit3 += any(ok(c) for c in order[:3])
              return len(chunks), round(hit1 / len(qs), 4), round(hit3 / len(qs), 4)
          {size: round(evaluate(size, 0)[2] / (3 * size / 100), 4) for size in (40, 200)}
    pitfall:
      text: |
        เลือก chunk ใหญ่ที่สุดเพราะ hit@k สูงที่สุด — chunk ใหญ่ครอบคลุมหลายเรื่อง (ทั้งเล่ม = 1.0 ทันที) ทำให้ต้นทุนและสิ่งรบกวนเพิ่ม ต้องวัดปริมาณข้อความที่ส่งคู่กันเสมอ
