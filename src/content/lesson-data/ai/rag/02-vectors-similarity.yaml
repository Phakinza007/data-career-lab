goals:
  - "สร้างเวกเตอร์ TF-IDF ของเอกสารและคำถาม และคำนวณ cosine similarity ทั้งด้วยมือและด้วย sklearn"
  - "จัดอันดับเอกสารด้วยความคล้ายและอ่านผล (top-k, อันดับของเฉลย, MRR)"
  - "เข้าใจว่า embeddings แก้ปัญหา paraphrase อย่างไร และเห็นข้อจำกัดของ TF-IDF จากข้อมูลจริง"
examples:
  - id: "x1"
    title: "TF-IDF และ cosine"
    lang: "python"
    prompt: |
      สร้างเวกเตอร์ของเอกสารและคำถาม แล้ววัดความคล้าย
    steps:
      - text: |
          เมทริกซ์เอกสารมี 24 แถว × 301 คำ และคำถามแรกมีค่าไม่เป็นศูนย์แค่ 2 คำ
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import numpy as np
          from sklearn.decomposition import TruncatedSVD
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.metrics.pairwise import cosine_similarity

          vec = TfidfVectorizer(stop_words='english')
          D = vec.fit_transform(docs['text'])       # เมทริกซ์เอกสาร × คำ (sparse)
          Q = vec.transform(qs['question'])         # คำถามที่แปลงด้วยคลังคำเดียวกัน
          sims = cosine_similarity(Q, D)            # คำถาม × เอกสาร
          terms = vec.get_feature_names_out()
          D.shape, [t for t, v in zip(terms, Q[0].toarray().ravel()) if v > 0]
      - text: |
          cosine ด้วยมือ a·b ÷ (‖a‖‖b‖) ระหว่างคำถามแรกกับ d01 เท่ากับ cosine_similarity: 0.1787
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import numpy as np
          from sklearn.decomposition import TruncatedSVD
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.metrics.pairwise import cosine_similarity

          vec = TfidfVectorizer(stop_words='english')
          D = vec.fit_transform(docs['text'])       # เมทริกซ์เอกสาร × คำ (sparse)
          Q = vec.transform(qs['question'])         # คำถามที่แปลงด้วยคลังคำเดียวกัน
          sims = cosine_similarity(Q, D)            # คำถาม × เอกสาร
          a = Q[0].toarray().ravel()
          b = D[0].toarray().ravel()
          round(float(a @ b / (np.linalg.norm(a) * np.linalg.norm(b))), 4), round(float(sims[0][0]), 4)
    pitfall:
      text: |
        fit_transform ทั้งคลังเอกสารและคำถามรวมกัน หรือ fit ใหม่กับคำถามแต่ละข้อ — คลังคำ/IDF จะต่างจากที่ใช้กับเอกสาร ต้อง fit ครั้งเดียวกับเอกสาร แล้ว transform คำถามด้วย vectorizer ตัวเดิม
  - id: "x2"
    title: "เมื่อคำไม่ตรงกัน"
    lang: "python"
    prompt: |
      ดูคำถามที่ใช้คำต่างจากเอกสาร
    steps:
      - text: |
          "broken" ไม่อยู่ในคลังคำ แต่ "damaged" อยู่
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import numpy as np
          from sklearn.decomposition import TruncatedSVD
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.metrics.pairwise import cosine_similarity

          vec = TfidfVectorizer(stop_words='english')
          D = vec.fit_transform(docs['text'])       # เมทริกซ์เอกสาร × คำ (sparse)
          Q = vec.transform(qs['question'])         # คำถามที่แปลงด้วยคลังคำเดียวกัน
          sims = cosine_similarity(Q, D)            # คำถาม × เอกสาร
          'broken' in vec.vocabulary_, 'damaged' in vec.vocabulary_
      - text: |
          คำถามที่ 11 ("parcel arrived broken") ได้ d13 อันดับ 1 ส่วนเฉลย d08 อยู่อันดับ 4
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import numpy as np
          from sklearn.decomposition import TruncatedSVD
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.metrics.pairwise import cosine_similarity

          vec = TfidfVectorizer(stop_words='english')
          D = vec.fit_transform(docs['text'])       # เมทริกซ์เอกสาร × คำ (sparse)
          Q = vec.transform(qs['question'])         # คำถามที่แปลงด้วยคลังคำเดียวกัน
          sims = cosine_similarity(Q, D)            # คำถาม × เอกสาร
          order = np.argsort(-sims[10], kind='stable')
          [docs['doc_id'][j] for j in order[:4]]
    pitfall:
      text: |
        คิดว่า retrieval ผิดพลาดเพราะ 'โค้ดมีบั๊ก' ทั้งที่จริงคือคำถามไม่ใช้คำเดียวกับเอกสาร (paraphrase) — TF-IDF จับไม่ได้ ต้องใช้ embeddings, ขยายคำถาม (query expansion) หรือ rerank
