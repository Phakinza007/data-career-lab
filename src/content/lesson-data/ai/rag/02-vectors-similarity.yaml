    solution: |
      import pandas as pd

      docs = pd.read_csv("data/kb_docs.csv")
      qs = pd.read_csv("data/kb_questions.csv")
      import numpy as np
      from sklearn.decomposition import TruncatedSVD
      from sklearn.feature_extraction.text import TfidfVectorizer
      from sklearn.metrics.pairwise import cosine_similarity

      vec = TfidfVectorizer(stop_words='english')
      D = vec.fit_transform(docs['text'])       # เมทริกซ์เอกสาร × คำ (sparse)
      Q = vec.transform(qs['question'])         # คำถามที่แปลงด้วยคลังคำเดียวกัน
      sims = cosine_similarity(Q, D)            # คำถาม × เอกสาร
      dd = cosine_similarity(D)
      np.fill_diagonal(dd, 0)
      i, j = np.unravel_index(dd.argmax(), dd.shape)
      most_similar_pair = docs['doc_id'][i] + '+' + docs['doc_id'][j]
      pair_score = round(float(dd[i, j]), 4)
    check: |
      check_value(most_similar_pair, _sol["most_similar_pair"], name="most_similar_pair")
      check_value(pair_score, _sol["pair_score"], name="pair_score", tol=0.001)
    hints:
      - "np.fill_diagonal(dd, 0) แล้ว np.unravel_index(dd.argmax(), dd.shape)"
