  - "Embedding model จับความหมายจึงรับมือ paraphrase ได้ (เรียกในเบราว์เซอร์ไม่ได้); LSA 10 มิติบนข้อมูล 24 เอกสารไม่ดีกว่า TF-IDF (hit@1 0.5667 vs 0.6333)"
interview:
  - id: "i1"
    q: "อธิบายว่า vector search ทำงานอย่างไรในระบบ RAG"
    a: |
      ทำเวกเตอร์ของทุก chunk ล่วงหน้าเก็บไว้ (vector store) เมื่อมีคำถามก็แปลงเป็นเวกเตอร์ด้วยโมเดลเดียวกัน แล้วคำนวณความคล้าย (มักใช้ cosine) กับทุก chunk และเลือก top-k ที่คล้ายที่สุดมาใส่ใน prompt สำหรับข้อมูลขนาดใหญ่ใช้ดัชนีแบบประมาณ (ANN) เพื่อให้ค้นหาเร็ว
  - id: "i2"
    q: "TF-IDF กับ embeddings ต่างกันอย่างไร และเมื่อไรใช้อย่างไหน"
    a: |
      TF-IDF เป็นเวกเตอร์แบบ sparse ตามคำที่ตรงกัน อธิบายง่าย เร็ว ไม่ต้องเรียกโมเดล เหมาะกับคำเฉพาะ/รหัส แต่รับมือ paraphrase ไม่ได้ ส่วน embeddings เป็นเวกเตอร์หนาแน่นที่จับความหมาย รับมือการใช้คำต่างกันได้ดีกว่า แต่ต้องมีโมเดลและต้นทุน ในทางปฏิบัติมักใช้ผสมกัน (hybrid) และวัดบนชุดคำถามของตัวเอง
