      Q = vec.transform(qs['question'])         # คำถามที่แปลงด้วยคลังคำเดียวกัน
      sims = cosine_similarity(Q, D)            # คำถาม × เอกสาร
      lsa_hit1 = ___
      lsa_hit3 = ___
      lsa_beats_tfidf = ___
    solution: |
      import pandas as pd

      docs = pd.read_csv("data/kb_docs.csv")
      qs = pd.read_csv("data/kb_questions.csv")
      import numpy as np
      from sklearn.decomposition import TruncatedSVD
      from sklearn.feature_extraction.text import TfidfVectorizer
      from sklearn.metrics.pairwise import cosine_similarity

      vec = TfidfVectorizer(stop_words='english')
      D = vec.fit_transform(docs['text'])       # เมทริกซ์เอกสาร × คำ (sparse)
      Q = vec.transform(qs['question'])         # คำถามที่แปลงด้วยคลังคำเดียวกัน
      sims = cosine_similarity(Q, D)            # คำถาม × เอกสาร
      def hit_rates(s):
          ranks = []
          for i, gold in enumerate(qs['gold_doc_id']):
              order = np.argsort(-s[i], kind='stable')
              ranks.append(list(docs['doc_id'].values[order]).index(gold) + 1)
          ranks = np.array(ranks)
          return float((ranks == 1).mean()), float((ranks <= 3).mean())


      svd = TruncatedSVD(10, random_state=42).fit(D)
      sims_lsa = cosine_similarity(svd.transform(Q), svd.transform(D))
      l1, l3 = hit_rates(sims_lsa)
      t1, t3 = hit_rates(sims)
      lsa_hit1 = round(l1, 4)
      lsa_hit3 = round(l3, 4)
      lsa_beats_tfidf = bool(l1 > t1)
    check: |
      check_value(lsa_hit1, _sol["lsa_hit1"], name="lsa_hit1", tol=0.001)
      check_value(lsa_hit3, _sol["lsa_hit3"], name="lsa_hit3", tol=0.001)
      check_value(lsa_beats_tfidf, _sol["lsa_beats_tfidf"], name="lsa_beats_tfidf")
    hints:
      - "เขียนฟังก์ชันคำนวณ hit rate จาก sims ที่ใช้ซ้ำได้"
