      import pandas as pd

      docs = pd.read_csv("data/kb_docs.csv")
      qs = pd.read_csv("data/kb_questions.csv")
      import numpy as np
      from sklearn.decomposition import TruncatedSVD
      from sklearn.feature_extraction.text import TfidfVectorizer
      from sklearn.metrics.pairwise import cosine_similarity

      vec = TfidfVectorizer(stop_words='english')
      D = vec.fit_transform(docs['text'])       # เมทริกซ์เอกสาร × คำ (sparse)
      Q = vec.transform(qs['question'])         # คำถามที่แปลงด้วยคลังคำเดียวกัน
      sims = cosine_similarity(Q, D)            # คำถาม × เอกสาร
      ranks = []
      for i, gold in enumerate(qs['gold_doc_id']):
          order = np.argsort(-sims[i], kind='stable')
          ranked = list(docs['doc_id'].values[order])
          ranks.append(ranked.index(gold) + 1)
      ranks = np.array(ranks)
      hit1 = round(float((ranks == 1).mean()), 4)
      hit3 = round(float((ranks <= 3).mean()), 4)
      mrr = round(float((1 / ranks).mean()), 4)
    check: |
      check_value(hit1, _sol["hit1"], name="hit1", tol=0.001)
      check_value(hit3, _sol["hit3"], name="hit3", tol=0.001)
      check_value(mrr, _sol["mrr"], name="mrr", tol=0.001)
    hints:
      - "หาอันดับของเฉลยในรายการที่เรียงตามความคล้าย"
