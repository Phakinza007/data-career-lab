goals:
  - "ประกอบ prompt แบบ RAG ที่ยึดบริบท อ้างอิง doc id และอนุญาตให้ตอบว่าไม่รู้"
  - "ใช้ threshold ของคะแนน retrieval แยกคำถามนอกขอบเขต และรู้ข้อจำกัดของมัน"
  - "ตรวจการอ้างอิงเบื้องต้น และเข้าใจแนวคิด MMR ที่เพิ่มความหลากหลายของบริบท"
examples:
  - id: "x1"
    title: "ประกอบ prompt จาก top-3"
    lang: "python"
    prompt: |
      ดึง 3 เอกสารแล้วประกอบบริบทพร้อม doc id
    steps:
      - text: |
          retrieve คำถามแรก ("How long does standard delivery take?") ได้ d01 อันดับหนึ่ง (0.1787)
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import math
          import re

          import numpy as np
          from sklearn.feature_extraction.text import ENGLISH_STOP_WORDS, TfidfVectorizer
          from sklearn.metrics.pairwise import cosine_similarity

          vec = TfidfVectorizer(stop_words='english')
          D = vec.fit_transform(docs['text'])
          sims = cosine_similarity(vec.transform(qs['question']), D)

          TEMPLATE_RAG = (
              "Answer the question using ONLY the context below. Cite the doc ids in square brackets. "
              "If the answer is not in the context, reply exactly: I don't know.\n\n"
              "Context:\n{context}\n\n"
              "Question: {question}\n"
              "Answer:"
          )


          def est_tokens(text):
              return math.ceil(len(text) / 4)


          def retrieve(question, k=3):
              """คืน [(doc_id, คะแนน cosine)] ของ k เอกสารที่คล้ายที่สุด"""
              s = cosine_similarity(vec.transform([question]), D)[0]
              order = np.argsort(-s, kind='stable')[:k]
              return [(docs['doc_id'][j], float(s[j])) for j in order]
          [(d, round(s, 4)) for d, s in retrieve(qs['question'][0], 3)]
      - text: |
          ประกอบบริบทรูป "[doc_id] title: text" แล้วใส่ template — วัดขนาด prompt
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import math
          import re

          import numpy as np
          from sklearn.feature_extraction.text import ENGLISH_STOP_WORDS, TfidfVectorizer
          from sklearn.metrics.pairwise import cosine_similarity

          vec = TfidfVectorizer(stop_words='english')
          D = vec.fit_transform(docs['text'])
          sims = cosine_similarity(vec.transform(qs['question']), D)

          TEMPLATE_RAG = (
              "Answer the question using ONLY the context below. Cite the doc ids in square brackets. "
              "If the answer is not in the context, reply exactly: I don't know.\n\n"
              "Context:\n{context}\n\n"
              "Question: {question}\n"
              "Answer:"
          )


          def est_tokens(text):
              return math.ceil(len(text) / 4)


          def retrieve(question, k=3):
              """คืน [(doc_id, คะแนน cosine)] ของ k เอกสารที่คล้ายที่สุด"""
              s = cosine_similarity(vec.transform([question]), D)[0]
              order = np.argsort(-s, kind='stable')[:k]
              return [(docs['doc_id'][j], float(s[j])) for j in order]
          question = qs['question'][0]
          rows = docs.set_index('doc_id')
          context = '\n'.join(f"[{d}] {rows.loc[d, 'title']}: {rows.loc[d, 'text']}" for d, _ in retrieve(question, 3))
          prompt = TEMPLATE_RAG.format(context=context, question=question)
          len(prompt), est_tokens(prompt)
    pitfall:
      text: |
        ให้โมเดลตอบโดยไม่บอกให้ยึดบริบทและไม่มีทางปฏิเสธ — เมื่อ retrieval ดึงมาผิด โมเดลมักเรียบเรียงคำตอบที่ฟังดูมั่นใจจากเอกสารที่ไม่เกี่ยว ให้กำหนดทั้งการยึดบริบท การอ้างอิง และคำตอบ 'ไม่รู้'
  - id: "x2"
    title: "threshold และคำถามนอกขอบเขต"
    lang: "python"
    prompt: |
      ดูคะแนนอันดับ 1 ของคำถามในขอบเขตเทียบกับนอกขอบเขต
    steps:
      - text: |
          คำถามในขอบเขต 30 ข้อ: คะแนนอันดับ 1 ต่ำสุดและ median
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import math
          import re

          import numpy as np
          from sklearn.feature_extraction.text import ENGLISH_STOP_WORDS, TfidfVectorizer
          from sklearn.metrics.pairwise import cosine_similarity

          vec = TfidfVectorizer(stop_words='english')
          D = vec.fit_transform(docs['text'])
          sims = cosine_similarity(vec.transform(qs['question']), D)

          TEMPLATE_RAG = (
              "Answer the question using ONLY the context below. Cite the doc ids in square brackets. "
              "If the answer is not in the context, reply exactly: I don't know.\n\n"
              "Context:\n{context}\n\n"
              "Question: {question}\n"
              "Answer:"
          )


          def est_tokens(text):
              return math.ceil(len(text) / 4)


          def retrieve(question, k=3):
              """คืน [(doc_id, คะแนน cosine)] ของ k เอกสารที่คล้ายที่สุด"""
              s = cosine_similarity(vec.transform([question]), D)[0]
              order = np.argsort(-s, kind='stable')[:k]
              return [(docs['doc_id'][j], float(s[j])) for j in order]
          top1 = sims.max(axis=1)
          round(float(top1.min()), 4), round(float(np.median(top1)), 4)
      - text: |
          ที่ threshold 0.15 ตอบคำถามในขอบเขตได้ 29 ข้อ และคำถามนอกขอบเขต 6 ข้อถูกตอบ 1 ข้อ ("Do you sell insurance?" ได้ 0.24 เพราะมีคำว่า sell)
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import math
          import re

          import numpy as np
          from sklearn.feature_extraction.text import ENGLISH_STOP_WORDS, TfidfVectorizer
          from sklearn.metrics.pairwise import cosine_similarity

          vec = TfidfVectorizer(stop_words='english')
          D = vec.fit_transform(docs['text'])
          sims = cosine_similarity(vec.transform(qs['question']), D)

          TEMPLATE_RAG = (
              "Answer the question using ONLY the context below. Cite the doc ids in square brackets. "
              "If the answer is not in the context, reply exactly: I don't know.\n\n"
              "Context:\n{context}\n\n"
              "Question: {question}\n"
              "Answer:"
          )


          def est_tokens(text):
              return math.ceil(len(text) / 4)


          def retrieve(question, k=3):
              """คืน [(doc_id, คะแนน cosine)] ของ k เอกสารที่คล้ายที่สุด"""
              s = cosine_similarity(vec.transform([question]), D)[0]
              order = np.argsort(-s, kind='stable')[:k]
              return [(docs['doc_id'][j], float(s[j])) for j in order]
          oos = ["What is the capital of France?", "Can I buy a car from you?", "Do you sell insurance?", "Who won the football match yesterday?", "Tell me a joke about cats", "How do I bake bread?"]
          top1 = sims.max(axis=1)
          oos_top1 = [retrieve(q, 1)[0][1] for q in oos]
          int((top1 >= 0.15).sum()), int((np.array(oos_top1) >= 0.15).sum())
    pitfall:
      text: |
        ตั้ง threshold ตามอารมณ์ (เช่น 0.5) โดยไม่ดูการกระจายของคะแนน — คะแนน cosine ของ TF-IDF ที่ถูกต้องมักต่ำ (median 0.327 ในข้อมูลนี้) เกณฑ์สูงเกินไปจะปฏิเสธคำถามที่ตอบได้เกือบหมด ดูการกระจายของทั้งคำถามในและนอกขอบเขตก่อนเลือก
