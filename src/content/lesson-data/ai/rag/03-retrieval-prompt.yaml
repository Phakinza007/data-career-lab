summary:
  - "Prompt ของ RAG ต้องสั่ง: ตอบจากบริบทเท่านั้น, อ้าง doc id, และตอบ \"ไม่รู้\" เมื่อไม่มีข้อมูล (mock_answer ในบทนี้เป็นตัวแทน LLM แบบสกัดประโยค ไม่ใช่โมเดลจริง)"
  - "threshold ของคะแนนอันดับ 1 กรองคำถามนอกขอบเขตได้บางส่วน (ที่ 0.15: ตอบ 29/30 ในขอบเขต, 1/6 นอกขอบเขต) แต่แยกไม่สะอาด ต้องมีชั้นป้องกันอื่น"
  - "ตรวจว่า id ที่อ้างอยู่ในบริบทจริง; MMR ไม่ช่วยในข้อมูลที่ไม่ซ้ำซ้อน (hit@3 0.8 vs 0.8333) และประโยคที่เลือกมาจากเอกสารเฉลย 0.6333 ทั้ง top-1 และ top-3"
interview:
  - id: "i1"
    q: "ออกแบบ prompt ของระบบ RAG เพื่อลดการแต่งคำตอบ (hallucination) อย่างไร"
    a: |
      สั่งให้ตอบจากบริบทที่ให้เท่านั้น ให้อ้างอิงแหล่งที่มา (doc id) ให้ปฏิเสธเมื่อบริบทไม่มีคำตอบ แล้วตรวจฝั่งโค้ดว่าการอ้างอิงอยู่ในชุดที่ดึงมาจริง ใช้ threshold คะแนน retrieval กรองคำถามนอกขอบเขต ตั้ง temperature ต่ำ และวัดผลด้วยชุดคำถามที่มีเฉลย
  - id: "i2"
    q: "MMR ใช้ทำอะไรและเมื่อไรที่ไม่ช่วย"
    a: |
      MMR เลือก chunk ทีละอันโดยถ่วงระหว่างความเกี่ยวข้องกับคำถามและความต่างจากอันที่เลือกแล้ว เพื่อลดข้อมูลซ้ำซ้อนในบริบท มีประโยชน์เมื่อฐานความรู้มีเนื้อหาซ้ำ/คล้ายกันมาก แต่ถ้าเอกสารไม่ซ้ำซ้อนอยู่แล้ว (เช่นในตัวอย่างของเรา) จะไม่ช่วยหรืออาจทำให้ hit@k ลดลงเล็กน้อย
flashcards:
  - id: "c1"
    front: "เหตุผลที่ต้องอนุญาตให้ RAG ตอบว่า \"ไม่รู้\""
    back: "เมื่อ retrieval ไม่พบข้อมูลที่เกี่ยวข้อง การบังคับให้ตอบจะทำให้โมเดลแต่งคำตอบที่ฟังดูน่าเชื่อ"
  - id: "c2"
    front: "การอ้างอิง doc id ช่วยอะไร"
    back: "ให้ผู้ใช้/ระบบตรวจสอบที่มาของคำตอบได้ และตรวจ hallucination ได้ถ้า id ไม่อยู่ในบริบทที่ส่งไป"
