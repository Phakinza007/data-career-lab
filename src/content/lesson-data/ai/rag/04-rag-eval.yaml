goals:
  - "คำนวณ hit@k, MRR และสถิติอันดับจากชุดคำถามที่มีเฉลย"
  - "แยกวิเคราะห์ตามกลุ่มและรายข้อที่พลาดเพื่อหาจุดที่ต้องแก้"
  - "ประเมินความไม่แน่นอนด้วย bootstrap และเปรียบเทียบการตั้งค่าอย่างระมัดระวัง"
examples:
  - id: "x1"
    title: "hit@k และ MRR"
    lang: "python"
    prompt: |
      คำนวณจากอันดับของเอกสารเฉลย
    steps:
      - text: |
          อันดับของเอกสารเฉลยของ 30 คำถาม (TF-IDF + stop words) — ส่วนใหญ่ 1, แย่สุด 9
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import numpy as np
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.metrics.pairwise import cosine_similarity


          def gold_ranks(vec, texts=None):
              """อันดับ (เริ่มที่ 1) ของเอกสารเฉลยของแต่ละคำถาม เมื่อค้นด้วย vectorizer ที่ให้"""
              D = vec.fit_transform(docs['text'] if texts is None else texts)
              sims = cosine_similarity(vec.transform(qs['question']), D)
              out = []
              for i, gold in enumerate(qs['gold_doc_id']):
                  order = np.argsort(-sims[i], kind='stable')
                  out.append(list(docs['doc_id'].values[order]).index(gold) + 1)
              return np.array(out)
          ranks = gold_ranks(TfidfVectorizer(stop_words='english'))
          gold = qs.merge(docs[['doc_id', 'category']], left_on='gold_doc_id', right_on='doc_id')
          ranks.tolist()
      - text: |
          hit@1 0.6333, hit@3 0.8333, MRR 0.752
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import numpy as np
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.metrics.pairwise import cosine_similarity


          def gold_ranks(vec, texts=None):
              """อันดับ (เริ่มที่ 1) ของเอกสารเฉลยของแต่ละคำถาม เมื่อค้นด้วย vectorizer ที่ให้"""
              D = vec.fit_transform(docs['text'] if texts is None else texts)
              sims = cosine_similarity(vec.transform(qs['question']), D)
              out = []
              for i, gold in enumerate(qs['gold_doc_id']):
                  order = np.argsort(-sims[i], kind='stable')
                  out.append(list(docs['doc_id'].values[order]).index(gold) + 1)
              return np.array(out)
          ranks = gold_ranks(TfidfVectorizer(stop_words='english'))
          gold = qs.merge(docs[['doc_id', 'category']], left_on='gold_doc_id', right_on='doc_id')
          round(float((ranks == 1).mean()), 4), round(float((ranks <= 3).mean()), 4), round(float((1 / ranks).mean()), 4)
    pitfall:
      text: |
        รายงานตัวเลขรวมตัวเดียวแล้วจบ — ซ่อนกลุ่มที่แย่มาก (returns hit@1 = 0.1667) และไม่บอกความไม่แน่นอนของชุดคำถามเล็ก ให้แยกดูตามกลุ่มและรายงานช่วงความไม่แน่นอนด้วย
  - id: "x2"
    title: "จุดอ่อนตามหมวดและความไม่แน่นอน"
    lang: "python"
    prompt: |
      แยกตามหมวดของเอกสารเฉลย แล้ว bootstrap
    steps:
      - text: |
          hit@1 และ hit@3 แยกตามหมวด: returns แย่สุด (0.1667 / 0.5)
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import numpy as np
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.metrics.pairwise import cosine_similarity


          def gold_ranks(vec, texts=None):
              """อันดับ (เริ่มที่ 1) ของเอกสารเฉลยของแต่ละคำถาม เมื่อค้นด้วย vectorizer ที่ให้"""
              D = vec.fit_transform(docs['text'] if texts is None else texts)
              sims = cosine_similarity(vec.transform(qs['question']), D)
              out = []
              for i, gold in enumerate(qs['gold_doc_id']):
                  order = np.argsort(-sims[i], kind='stable')
                  out.append(list(docs['doc_id'].values[order]).index(gold) + 1)
              return np.array(out)
          ranks = gold_ranks(TfidfVectorizer(stop_words='english'))
          gold = qs.merge(docs[['doc_id', 'category']], left_on='gold_doc_id', right_on='doc_id')
          df = pd.DataFrame({'category': gold['category'], 'hit1': ranks == 1, 'hit3': ranks <= 3})
          df.groupby('category').agg(n=('hit1', 'size'), hit1=('hit1', 'mean'), hit3=('hit3', 'mean')).round(4).sort_values('n', ascending=False).head(3)
      - text: |
          bootstrap 1,000 รอบ (seed 42): ช่วง 95% ของ hit@3 ≈ 0.70 – 0.9667
        code: |
          import pandas as pd

          docs = pd.read_csv("data/kb_docs.csv")
          qs = pd.read_csv("data/kb_questions.csv")
          import numpy as np
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.metrics.pairwise import cosine_similarity


          def gold_ranks(vec, texts=None):
              """อันดับ (เริ่มที่ 1) ของเอกสารเฉลยของแต่ละคำถาม เมื่อค้นด้วย vectorizer ที่ให้"""
              D = vec.fit_transform(docs['text'] if texts is None else texts)
              sims = cosine_similarity(vec.transform(qs['question']), D)
              out = []
              for i, gold in enumerate(qs['gold_doc_id']):
                  order = np.argsort(-sims[i], kind='stable')
                  out.append(list(docs['doc_id'].values[order]).index(gold) + 1)
              return np.array(out)
          ranks = gold_ranks(TfidfVectorizer(stop_words='english'))
          gold = qs.merge(docs[['doc_id', 'category']], left_on='gold_doc_id', right_on='doc_id')
          rng = np.random.RandomState(42)
          idx = rng.randint(0, len(ranks), (1000, len(ranks)))
          boot = (ranks <= 3).astype(float)[idx].mean(axis=1)
          np.percentile(boot, [2.5, 97.5]).round(4)
    pitfall:
      text: |
        เลือกการตั้งค่าที่ hit@k สูงกว่าเพียง 1–2 ข้อบนชุด 30 ข้อแล้วสรุปว่าดีกว่า — ต่างกันหนึ่งข้อ = 3.3 จุด อยู่ในช่วงความไม่แน่นอนทั้งหมด ดูรายข้อที่เปลี่ยนและใช้ชุดคำถามใหญ่ขึ้น/แยกชุดตรวจสุดท้าย
