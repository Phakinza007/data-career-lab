        why: "ไม่ใช่"
      - text: "MRR ให้น้ำหนักอันดับที่ดีกว่ามากกว่า (1 ÷ อันดับ) ขณะที่ hit@k นับแค่ว่าอยู่ใน k อันดับแรกหรือไม่"
        correct: true
        why: "ถ้าเฉลยอยู่อันดับ 2 และ 9 ต่างก็นับเป็น hit@10 เท่ากัน แต่ MRR ให้ 0.5 กับ 0.11 — จึงแยกระบบที่จัดอันดับต้นๆ ได้ดีออกจากที่แค่ \"อยู่ในรายการ\""
      - text: "hit@k วัดต้นทุน"
