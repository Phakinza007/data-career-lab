      - text: "ความเร็วของระบบ"
        why: "ไม่ใช่"
      - text: "กลุ่มที่แย่มาก เช่นหมวด returns ที่ hit@3 เพียง 0.5 จึงควรแยกดูตามกลุ่ม"
        correct: true
        why: "ค่าเฉลี่ยรวมถ่วงตามจำนวนคำถาม กลุ่ม returns (6 ข้อ) มี hit@1 เพียง 0.1667 และ hit@3 0.5 แต่ถูกกลบด้วยกลุ่มที่ได้ 1.0 — การแยกกลุ่มชี้ว่าควรแก้ตรงไหน"
