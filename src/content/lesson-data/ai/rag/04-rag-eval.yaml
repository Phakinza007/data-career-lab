      import pandas as pd

      docs = pd.read_csv("data/kb_docs.csv")
      qs = pd.read_csv("data/kb_questions.csv")
      import numpy as np
      from sklearn.feature_extraction.text import TfidfVectorizer
      from sklearn.metrics.pairwise import cosine_similarity


      def gold_ranks(vec, texts=None):
          """อันดับ (เริ่มที่ 1) ของเอกสารเฉลยของแต่ละคำถาม เมื่อค้นด้วย vectorizer ที่ให้"""
          D = vec.fit_transform(docs['text'] if texts is None else texts)
          sims = cosine_similarity(vec.transform(qs['question']), D)
          out = []
          for i, gold in enumerate(qs['gold_doc_id']):
              order = np.argsort(-sims[i], kind='stable')
              out.append(list(docs['doc_id'].values[order]).index(gold) + 1)
          return np.array(out)
      base = gold_ranks(TfidfVectorizer(stop_words='english'))
      bigram = gold_ranks(TfidfVectorizer(stop_words='english', ngram_range=(1, 2)))
      n_changed = int((base != bigram).sum())
      n_improved = int((bigram < base).sum())
      n_worse = int((bigram > base).sum())
    check: |
      check_value(n_changed, _sol["n_changed"], name="n_changed")
      check_value(n_improved, _sol["n_improved"], name="n_improved")
      check_value(n_worse, _sol["n_worse"], name="n_worse")
