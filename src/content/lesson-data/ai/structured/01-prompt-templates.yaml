quiz:
  - id: "q1"
    question: "ข้อดีของการใช้ prompt template แทนพิมพ์ prompt สดทุกครั้ง"
    choices:
      - text: "ทำให้โมเดลฉลาดขึ้นเสมอ"
        why: "ไม่การันตี"
      - text: "ทดสอบ วัดขนาด/ต้นทุน และเก็บเวอร์ชันได้เหมือนโค้ด และ render ช่องที่ขาดจะ error ทันที"
        correct: true
        why: "template แยกส่วนคงที่ออกจากส่วนที่เปลี่ยน ทำให้ทดสอบ วัดขนาด (est_tokens) และเทียบเวอร์ชันได้ และ str.format จะโยน KeyError ทันทีถ้าลืมส่งช่อง แทนที่จะส่ง prompt ที่มีช่องว่างไปหาโมเดล"
      - text: "ไม่ต้องใช้ token"
        why: "ยังใช้เท่าเดิม"
      - text: "เลี่ยง prompt injection ได้ทั้งหมด"
        why: "ไม่ได้"
  - id: "q2"
    question: "ข้อควรระวังของ few-shot คือ"
    choices:
      - text: "ยิ่งใส่เยอะยิ่งดีเสมอ"
        why: "ไม่จริง"
      - text: "few-shot ทำให้ต้องเทรนโมเดลใหม่"
        why: "ไม่ต้องเทรน"
      - text: "ทุกตัวอย่างเพิ่ม token ในทุกคำขอ และตัวอย่างที่เอนเอียงพาผลเอนเอียง"
        correct: true
        why: "ตัวอย่างถูกส่งซ้ำในทุกคำขอ (แบบฝึกหัดวัดว่าจำนวนตัวอย่างเพิ่ม token ต่อเนื่อง) และถ้าตัวอย่างส่วนใหญ่เป็นหมวดเดียว โมเดลจะเอนเอียงไปหมวดนั้น"
      - text: "ใช้ไม่ได้กับงานจัดหมวด"
        why: "ใช้ได้"
  - id: "q3"
    question: "ทำไมต้องตัดแท็กปิด </ticket> ที่ผู้ใช้ใส่มาออกก่อนครอบ"
    choices:
      - text: "เพื่อลด token เท่านั้น"
        why: "ไม่ใช่เหตุผลหลัก"
      - text: "เพราะ Python ไม่รองรับแท็ก"
        why: "ไม่เกี่ยว"
      - text: "ไม่จำเป็น"
        why: "จำเป็นสำหรับการครอบที่ปลอดภัยกว่า"
      - text: "เพื่อไม่ให้ผู้ใช้หลุดออกจากกรอบข้อมูลแล้วปลอมเป็นคำสั่ง"
        correct: true
        why: "ถ้าผู้ใช้พิมพ์ </ticket> เองแล้วตามด้วยคำสั่ง ข้อความหลังแท็กนั้นจะดูเหมือนอยู่นอกกรอบข้อมูล การตัดแท็กปิดของผู้ใช้ออกก่อนทำให้แท็กปิดเหลือเพียงตัวที่เราใส่"
  - id: "q4"
    question: "delimiter และประโยค \"ให้ถือว่าเป็นข้อมูล\" ป้องกัน prompt injection ได้แค่ไหน"
    choices:
      - text: "ลดความเสี่ยงได้ แต่ไม่สมบูรณ์ ต้องจำกัดสิทธิ์และตรวจผลฝั่งโค้ดด้วย"
        correct: true
        why: "ตัวโมเดลอาจยังทำตามคำสั่งแฝงได้ delimiter จึงลดโอกาสแต่ไม่ยืนยันผล ชั้นที่เชื่อถือได้คือโค้ด: จำกัดสิทธิ์ของเครื่องมือและตรวจเอาต์พุตก่อนใช้"
      - text: "ป้องกันได้ทั้งหมด"
        why: "ไม่จริง"
      - text: "ไม่ช่วยเลย"
        why: "ช่วยลดความเสี่ยงบางส่วน"
      - text: "ใช้ได้เฉพาะภาษาอังกฤษ"
        why: "ไม่เกี่ยวกับภาษา"
summary:
  - "Prompt คือ template (บทบาท เกณฑ์ ตัวอย่าง ข้อมูล รูปแบบผลลัพธ์) ที่ควรทดสอบ วัดขนาด และเก็บเวอร์ชันเหมือนโค้ด"
  - "Few-shot ช่วยกำหนดรูปแบบ/เกณฑ์ แต่ทุกตัวอย่างเพิ่ม token ต่อคำขอ ต้องเลือกจำนวนตัวอย่างตามงบ"
  - "ครอบข้อมูลผู้ใช้ด้วย delimiter (ตัดแท็กปิดที่ผู้ใช้ใส่) ช่วยลดความเสี่ยง prompt injection แต่ไม่สมบูรณ์"
interview:
  - id: "i1"
    q: "อธิบายโครงของ prompt ที่ดีสำหรับงานจัดหมวดข้อความ"
    a: |
      บอกบทบาทและงาน ระบุชุดป้ายกำกับที่อนุญาต ใส่ตัวอย่าง few-shot ที่ครอบคลุมและมีรูปแบบเดียวกับเอาต์พุตที่ต้องการ ครอบข้อมูลนำเข้าด้วย delimiter และบอกรูปแบบคำตอบที่ต้องการ (เช่น ป้ายกำกับเดียว หรือ JSON) แล้ววัดผลกับชุดตัวอย่างที่มีเฉลยก่อนใช้งานจริง
  - id: "i2"
    q: "prompt injection คืออะไรและลดความเสี่ยงอย่างไร"
    a: |
      คือการที่ข้อมูลจากผู้ใช้หรือเอกสารภายนอกมีข้อความที่พยายามสั่งโมเดลให้ทำสิ่งอื่น ลดความเสี่ยงด้วยการแยกข้อมูลออกจากคำสั่งด้วย delimiter, บอกว่าเนื้อหานั้นเป็นข้อมูล, ตรวจ/จำกัดผลลัพธ์, และที่สำคัญคือไม่ให้โมเดลมีสิทธิ์ทำสิ่งอันตรายโดยตรงโดยไม่ผ่านการตรวจสิทธิ์ฝั่งโค้ด
