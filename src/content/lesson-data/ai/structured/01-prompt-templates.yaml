    solution: |
      import pandas as pd

      docs = pd.read_csv("data/kb_docs.csv")
      qs = pd.read_csv("data/kb_questions.csv")
      import math

      TEMPLATE = (
          "You are a support triage assistant.\n"
          "Classify the ticket into one of: {labels}.\n\n"
          "{examples}"
          "Ticket: {ticket}\n"
          "Category:"
      )

      gold = qs.merge(docs[['doc_id', 'category']], left_on='gold_doc_id', right_on='doc_id')
      examples = list(zip(gold['question'], gold['category']))[:8]


      def est_tokens(text):
          return math.ceil(len(text) / 4)
      labels = sorted(docs['category'].unique())


      def build(k):
          block = ''.join(f'Ticket: {t}\nCategory: {c}\n\n' for t, c in examples[:k])
          return TEMPLATE.format(labels=', '.join(labels), examples=block, ticket='My card was declined')


      max_k = max(k for k in range(9) if est_tokens(build(k)) <= 150)
      tokens_at_k = est_tokens(build(max_k))
    check: |
      check_value(max_k, _sol["max_k"], name="max_k")
      check_value(tokens_at_k, _sol["tokens_at_k"], name="tokens_at_k")
    hints:
      - "เขียนฟังก์ชัน build(k) แล้วหา k สูงสุดที่ token ≤ 150"
