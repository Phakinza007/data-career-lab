    pitfall:
      text: |
        ใช้ค่าที่ parse ได้ทันทีโดยไม่ตรวจ — category ที่ไม่มีจริง ('billing') หรือ confidence 1.4 จะหลุดเข้าฐานข้อมูลและพังที่ปลายทางในภายหลัง ตรวจ enum ชนิดและช่วงค่าก่อนเสมอ
