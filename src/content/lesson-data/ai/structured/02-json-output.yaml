summary:
  - "ผลลัพธ์ของโมเดลอาจไม่ใช่ JSON ที่ถูกต้อง: strict parse ได้ 5 จาก 8 ตัวอย่างจำลอง, lenient (ดึงด้วย regex) ได้ 6"
  - "parse ได้ ≠ ใช้ได้: ตรวจฟิลด์ครบ enum ชนิด และช่วงค่า (ผ่าน 2 ตัวแบบไม่ coerce, 3 ตัวแบบ coerce)"
  - "coerce เฉพาะกรณีชัดเจน (สตริงตัวเลข) ส่วนค่าผิดความหมายให้ปฏิเสธหรือขอให้โมเดลแก้; ตัวอย่างในบทนี้เป็นผลลัพธ์จำลอง ไม่ได้เรียกโมเดลจริง"
