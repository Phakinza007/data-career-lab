goals:
  - "parse JSON จากผลลัพธ์ของโมเดลแบบ strict และดึงจากข้อความที่ปนกันด้วย regex"
  - "ตรวจ schema (ฟิลด์ที่ต้องมี enum ชนิด ช่วงค่า) และ coerce เฉพาะกรณีที่ปลอดภัย"
  - "มองผลลัพธ์ของโมเดลเป็นข้อมูลที่ต้องตรวจก่อนใช้"
examples:
  - id: "x1"
    title: "parse แบบ strict vs lenient"
    lang: "python"
    prompt: |
      ทดลองกับผลลัพธ์จำลอง 8 แบบ
    steps:
      - text: |
          parse ตรงๆ ด้วย json.loads — ได้กี่ตัว (ที่เหลือ JSONDecodeError): 5
        code: |
          import json
          import re

          import pandas as pd

          LABELS = ['shipping', 'returns', 'payment', 'orders', 'promo', 'account', 'privacy', 'warranty', 'products', 'support']

          # ผลลัพธ์ที่ "จำลอง" ว่าโมเดลตอบกลับมา (ไม่ได้เรียก API จริง) — ไม่ตรงรูปแบบทุกอัน
          RAW = [
              '{"category": "shipping", "confidence": 0.92}',
              'Sure! Here is the JSON:\n```json\n{"category": "returns", "confidence": 0.81}\n```',
              '{"category": "payment", "confidence": "0.7"}',
              "{'category': 'orders', 'confidence': 0.6}",
              '{"category": "billing", "confidence": 0.5}',
              '{"category": "promo"}',
              'The category is account.',
              '{"category": "support", "confidence": 1.4}',
          ]
          ok = 0
          for text in RAW:
              try:
                  json.loads(text)
                  ok += 1
              except json.JSONDecodeError:
                  pass
          ok
      - text: |
          lenient: ลอง strict ก่อน แล้วดึง {…} ด้วย regex — ได้ 6
        code: |
          import json
          import re

          import pandas as pd

          LABELS = ['shipping', 'returns', 'payment', 'orders', 'promo', 'account', 'privacy', 'warranty', 'products', 'support']

          # ผลลัพธ์ที่ "จำลอง" ว่าโมเดลตอบกลับมา (ไม่ได้เรียก API จริง) — ไม่ตรงรูปแบบทุกอัน
          RAW = [
              '{"category": "shipping", "confidence": 0.92}',
              'Sure! Here is the JSON:\n```json\n{"category": "returns", "confidence": 0.81}\n```',
              '{"category": "payment", "confidence": "0.7"}',
              "{'category': 'orders', 'confidence': 0.6}",
              '{"category": "billing", "confidence": 0.5}',
              '{"category": "promo"}',
              'The category is account.',
              '{"category": "support", "confidence": 1.4}',
          ]


          def parse_lenient(text):
              try:
                  return json.loads(text)
              except json.JSONDecodeError:
                  pass
              match = re.search(r"\{.*\}", text, re.S)
              if match:
                  try:
                      return json.loads(match.group(0))
                  except json.JSONDecodeError:
                      return None
              return None
          sum(parse_lenient(t) is not None for t in RAW)
    pitfall:
      text: |
        ดึง JSON ด้วย regex แบบ {.*} กับข้อความที่มีปีกกามากกว่าหนึ่งก้อน — จะจับตั้งแต่ { แรกถึง } สุดท้ายและได้ข้อความที่ parse ไม่ได้ ในงานจริงควรใช้ structured output ของผู้ให้บริการหรือ parser ที่รัดกุมกว่า
  - id: "x2"
    title: "ตรวจ schema"
    lang: "python"
    prompt: |
      parse ได้แล้วยังต้องตรวจความถูกต้อง
    steps:
      - text: |
          ผลตรวจแบบไม่ coerce ของแต่ละตัวอย่าง (None = ผ่าน)
        code: |
          import json
          import re

          import pandas as pd

          LABELS = ['shipping', 'returns', 'payment', 'orders', 'promo', 'account', 'privacy', 'warranty', 'products', 'support']

          # ผลลัพธ์ที่ "จำลอง" ว่าโมเดลตอบกลับมา (ไม่ได้เรียก API จริง) — ไม่ตรงรูปแบบทุกอัน
          RAW = [
              '{"category": "shipping", "confidence": 0.92}',
              'Sure! Here is the JSON:\n```json\n{"category": "returns", "confidence": 0.81}\n```',
              '{"category": "payment", "confidence": "0.7"}',
              "{'category': 'orders', 'confidence': 0.6}",
              '{"category": "billing", "confidence": 0.5}',
              '{"category": "promo"}',
              'The category is account.',
              '{"category": "support", "confidence": 1.4}',
          ]


          def parse_lenient(text):
              try:
                  return json.loads(text)
              except json.JSONDecodeError:
                  pass
              match = re.search(r"\{.*\}", text, re.S)
              if match:
                  try:
                      return json.loads(match.group(0))
                  except json.JSONDecodeError:
                      return None
              return None


          def first_error(obj, coerce=False):
              if obj is None:
                  return 'unparseable'
              if 'category' not in obj or 'confidence' not in obj:
                  return 'missing_' + ('confidence' if 'confidence' not in obj else 'category')
              if obj['category'] not in LABELS:
                  return 'bad_category'
              conf = obj['confidence']
              if coerce and isinstance(conf, str):
                  try:
                      conf = float(conf)
                  except ValueError:
                      return 'bad_confidence_type'
              if not isinstance(conf, (int, float)) or isinstance(conf, bool):
                  return 'bad_confidence_type'
              if not 0 <= conf <= 1:
                  return 'confidence_range'
              return None
          [first_error(parse_lenient(t)) for t in RAW]
      - text: |
          เปิด coerce สตริงตัวเลข → float: ตัวที่ 3 ("0.7") ผ่านเพิ่ม เหลือผ่าน 3 ตัว
