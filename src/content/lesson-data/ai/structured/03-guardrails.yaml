    pitfall:
      text: |
        retry โดยส่งคำขอเดิมซ้ำโดยไม่บอกว่าผิดตรงไหน (และไม่จำกัดรอบ) — โมเดลมีแนวโน้มตอบผิดซ้ำและเสียเงินทุกรอบ ให้แนบคำตอบที่ถูกปฏิเสธพร้อมเหตุผลที่ชัดเจน และจำกัดจำนวนรอบ
