      - text: "เพิ่ม temperature ทันที"
        why: "ไม่ใช่วิธีหลัก"
  - id: "q2"
    question: "ทำไมควรปกปิด PII ก่อนบันทึก log หรือส่งให้ผู้ให้บริการภายนอก"
    choices:
      - text: "เพื่อให้โมเดลเร็วขึ้น"
        why: "ไม่ใช่เหตุผลหลัก"
      - text: "เพราะ regex ทำงานได้เร็ว"
        why: "ไม่ใช่"
      - text: "เพื่อลดความเสี่ยงข้อมูลส่วนบุคคลรั่วไหลและส่งเฉพาะข้อมูลที่จำเป็น"
        correct: true
        why: "ถูกต้อง"
      - text: "ไม่จำเป็น ถ้าใช้ HTTPS"
        why: "HTTPS ไม่ได้ปกปิดข้อมูลจากปลายทาง"
  - id: "q3"
    question: "ตัวตรวจ injection แบบคำสำคัญในบทนี้ได้ precision 0.75 และ recall 0.75 บอกอะไร"
    choices:
      - text: "ตัวตรวจสมบูรณ์แบบ"
        why: "ไม่จริง"
      - text: "ควรลบ guardrail ทั้งหมด"
        why: "ยังมีประโยชน์เป็นตาข่ายชั้นแรก"
      - text: "ตัวเลขนี้เกิดจากโมเดลผิดพลาด"
        why: "มาจากกฎคำสำคัญ"
      - text: "มีทั้งพลาดบางข้อ (ประโยคเรียบเรียงใหม่) และแจ้งเตือนผิดบางข้อ จึงใช้เป็นชั้นแรกที่ถูกและเร็ว ไม่ใช่เกราะหลัก"
        correct: true
        why: "ถูกต้อง"
  - id: "q4"
    question: "ถ้าเรียกโมเดลครบจำนวนรอบแล้วเอาต์พุตยังไม่ผ่านการตรวจ ควรทำอย่างไร"
    choices:
      - text: "ใช้ fallback ที่ปลอดภัย (เช่น ส่งต่อให้คน/ค่าเริ่มต้น) และบันทึก log"
        correct: true
        why: "ถูกต้อง"
      - text: "ใช้เอาต์พุตล่าสุดต่อไปเลย"
        why: "ไม่ผ่านการตรวจ"
      - text: "เรียกต่อไปเรื่อยๆ"
        why: "ไม่จบและแพง"
      - text: "ปล่อยให้โปรแกรมล้ม"
        why: "ควรจัดการอย่างนุ่มนวล"
summary:
  - "Guardrail คือโค้ดตรวจก่อน/หลังโมเดล: retry พร้อมส่ง error ให้โมเดลแก้ (จำกัดรอบ) แล้วมี fallback ที่ปลอดภัย"
  - "ปกปิด PII (อีเมล เบอร์โทร) ก่อนส่งออกหรือ log แต่ regex ครอบคลุมเฉพาะรูปแบบที่คาดเดาได้"
  - "ตัวตรวจ injection แบบคำสำคัญได้ precision/recall 0.75/0.75 ในตัวอย่าง จึงเป็นเพียงชั้นแรก — ชั้นหลักคือจำกัดสิทธิ์และตรวจผลฝั่งโค้ด (MockLLM ในบทนี้ตอบตามสคริปต์ ไม่ใช่โมเดลจริง)"
interview:
  - id: "i1"
    q: "ออกแบบ guardrail สำหรับแชตบอตลูกค้าอย่างไร"
    a: |
      ก่อนส่งเข้า: จำกัดความยาว ปกปิด PII ตรวจ injection เบื้องต้น และแยกข้อมูลออกจากคำสั่ง หลังโมเดลตอบ: ตรวจ schema/ค่าที่อนุญาต ตรวจเนื้อหาที่ห้าม จำกัดความยาว และถ้าไม่ผ่านให้ retry พร้อม feedback จำกัดรอบ แล้ว fallback (ส่งต่อคน) พร้อม log และวัดอัตราการทำงานของแต่ละ guardrail
  - id: "i2"
    q: "ทำไมเราจึงไม่ควรพึ่ง regex อย่างเดียวในการป้องกัน prompt injection"
    a: |
      ผู้โจมตีเรียบเรียงประโยคได้หลากหลายจนกฎคำสำคัญตามไม่ทัน (recall ต่ำ) และกฎอาจแจ้งเตือนผิดกับข้อความปกติ (precision ต่ำ) จึงควรใช้เป็นตาข่ายชั้นแรก และป้องกันจริงด้วยการจำกัดสิทธิ์ของระบบ ตรวจผลลัพธ์ และให้มนุษย์อนุมัติการกระทำที่มีผลข้างเคียง
flashcards:
  - id: "c1"
    front: "precision กับ recall ของตัวตรวจต่างกันอย่างไร"
    back: "precision = ที่แจ้งเตือนแล้วจริงกี่ส่วน (TP ÷ (TP + FP)), recall = ของจริงทั้งหมดที่จับได้กี่ส่วน (TP ÷ (TP + FN))"
  - id: "c2"
    front: "fallback ในระบบที่ใช้ LLM คืออะไร"
    back: "ทางเลือกที่ปลอดภัยเมื่อคำตอบของโมเดลใช้ไม่ได้ เช่น ค่าเริ่มต้น ส่งต่อให้คน หรือข้อความมาตรฐาน"
