goals:
  - "เขียน retry ที่ส่งเหตุผลที่ถูกปฏิเสธกลับให้โมเดลแก้ พร้อมจำกัดรอบและ fallback"
  - "ปกปิด PII ด้วย regex และรู้ข้อจำกัดของมัน"
  - "ประเมินตัวตรวจ prompt injection แบบ heuristic ด้วย precision/recall และเข้าใจว่าเป็นเพียงชั้นแรก"
examples:
  - id: "x1"
    title: "retry พร้อม feedback ด้วย MockLLM"
    lang: "python"
    prompt: |
      โมเดลจำลองตอบผิด 2 ครั้งแล้วค่อยตอบถูก
    steps:
      - text: |
          ask_with_retry ได้คำตอบสำเร็จที่ครั้งที่ 3 (ตัวแรกไม่ใช่ JSON ตัวที่สองเป็นหมวดที่ไม่มีจริง)
        code: |
          import json
          import re

          LABELS = ['shipping', 'returns', 'payment', 'orders', 'promo', 'account', 'privacy', 'warranty', 'products', 'support']
          EMAIL = r"[\w.+-]+@[\w-]+\.[\w.]+"
          PHONE = r"\b0\d{1,2}-?\d{3}-?\d{4}\b"
          INJECTION = [r"ignore (all )?(previous|prior) instructions", r"system prompt", r"you are now"]
          TEXT = "Contact me at customer00001@example.com or 081-234-5678 about order 1234."


          class MockLLM:
              """จำลองโมเดล: ตอบตามลำดับที่กำหนดไว้ล่วงหน้า (ไม่ได้เรียก API จริง)"""

              def __init__(self, replies):
                  self.replies = list(replies)
                  self.calls = []

              def __call__(self, messages):
                  self.calls.append(list(messages))
                  return self.replies[min(len(self.calls) - 1, len(self.replies) - 1)]


          def validate(reply):
              try:
                  obj = json.loads(reply)
              except json.JSONDecodeError:
                  return 'not valid JSON'
              if obj.get('category') not in LABELS:
                  return 'category must be one of ' + ', '.join(LABELS)
              return None


          def ask_with_retry(llm, prompt, max_retries=3):
              messages = [{'role': 'user', 'content': prompt}]
              for attempt in range(1, max_retries + 2):
                  reply = llm(messages)
                  error = validate(reply)
                  if error is None:
                      return json.loads(reply), attempt
                  messages.append({'role': 'assistant', 'content': reply})
                  messages.append({'role': 'user', 'content': 'Your reply was rejected: ' + error + '. Return only valid JSON.'})
              return None, max_retries + 1
          replies = ['not json', '{"category": "billing"}', '{"category": "payment"}']
          llm = MockLLM(replies)
          ask_with_retry(llm, 'Classify: My card was declined')
      - text: |
          ในการเรียกครั้งสุดท้ายประวัติที่ส่งไปมี 5 ข้อความ (user, assistant, user, assistant, user)
        code: |
