exercises:
  - id: e1
    level: basic
    lang: sql
    prompt: |
      รายได้รวมปี 2025 (เฉพาะ `completed`) ใช้เป็นตัวเลขอ้างอิงของการกระทบยอด
      แสดงคอลัมน์เดียวชื่อ total_revenue
    starter: |
      -- เขียน SQL ตรงนี้
      SELECT ___
    solution: |
      SELECT SUM(li.quantity * li.unit_price) AS total_revenue
      FROM orders o
      JOIN order_items li ON li.order_id = o.order_id
      WHERE o.status = 'completed'
        AND EXTRACT(year FROM o.order_date) = 2025
    hints:
      - คำนวณตรงๆ โดยไม่ join อะไรเพิ่มเพื่อให้เป็นตัวอ้างอิงที่เชื่อได้
  - id: e2
    level: basic
    lang: sql
    prompt: |
      กระทบยอดรายเดือนกับรายปี — แสดง sum_of_months (ผลรวมของรายได้รายเดือนปี 2025)
      และ total_revenue (รายได้รวมปี 2025) เฉพาะ `completed` ทั้งคู่ต้องเท่ากัน
    starter: |
      -- เขียน SQL ตรงนี้
      SELECT ___
    solution: |
      WITH monthly AS (
        SELECT DATE_TRUNC('month', o.order_date) AS month,
               SUM(li.quantity * li.unit_price) AS revenue
        FROM orders o
        JOIN order_items li ON li.order_id = o.order_id
        WHERE o.status = 'completed' AND EXTRACT(year FROM o.order_date) = 2025
        GROUP BY 1
      )
      SELECT SUM(revenue) AS sum_of_months,
             (SELECT SUM(li.quantity * li.unit_price)
              FROM orders o
              JOIN order_items li ON li.order_id = o.order_id
              WHERE o.status = 'completed' AND EXTRACT(year FROM o.order_date) = 2025) AS total_revenue
      FROM monthly
    hints:
      - รวมยอดรายเดือนจาก CTE แล้วเทียบกับยอดรวมที่คำนวณตรงๆ
  - id: e3
    level: basic
    lang: python
    prompt: |
      คำนวณรายได้ปี 2025 (เฉพาะ `completed`) ด้วย pandas เพื่อตรวจไขว้กับผลจาก SQL
      เก็บไว้ในตัวแปร revenue_2025
    starter: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      items = pd.read_csv("data/order_items.csv")
      revenue_2025 = ___
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      items = pd.read_csv("data/order_items.csv")
      items['line'] = items['quantity'] * items['unit_price']
      sales = items.merge(orders, on='order_id')
      sales = sales[sales['status'] == 'completed']
      revenue_2025 = sales[sales['order_date'].dt.year == 2025]['line'].sum()
    check: |
      check_value(revenue_2025, _sol["revenue_2025"], name="revenue_2025")
    hints:
      - merge ก่อน กรองสถานะและปี แล้วค่อยรวมยอด
  - id: e4
    level: basic
    lang: sql
    prompt: |
      ทดสอบความไวต่อนิยาม — รายได้ปี 2025 แยกใหม่/เดิมโดยใช้ **ปีที่สมัครสมาชิก** เป็นเกณฑ์
      แสดง customer_type, revenue, revenue_pct (ปัด 1 ตำแหน่ง) เรียงตาม revenue จากมากไปน้อย
    starter: |
      -- เขียน SQL ตรงนี้
      SELECT ___
    solution: |
      SELECT CASE WHEN EXTRACT(year FROM c.signup_date) = 2025 THEN 'new' ELSE 'existing' END AS customer_type,
             SUM(li.quantity * li.unit_price) AS revenue,
             ROUND(SUM(li.quantity * li.unit_price) * 100.0
                   / SUM(SUM(li.quantity * li.unit_price)) OVER (), 1) AS revenue_pct
      FROM orders o
      JOIN order_items li ON li.order_id = o.order_id
      JOIN customers c ON c.customer_id = o.customer_id
      WHERE o.status = 'completed' AND EXTRACT(year FROM o.order_date) = 2025
      GROUP BY 1
      ORDER BY revenue DESC
    ordered: true
    hints:
      - คราวนี้ใช้ signup_date ของตาราง customers แทนวันที่ซื้อครั้งแรก
  - id: e5
    level: applied
    lang: python
    prompt: |
      คำนวณ z_stat ของ two-proportion z-test เทียบ retention เดือนที่ 1 ระหว่าง organic (1240 คน กลับมา 278)
      กับ promo (219 คน กลับมา 16) เก็บไว้ในตัวแปร z_stat
    starter: |
      import numpy as np

      n_organic, r_organic = 1240, 278
      n_promo, r_promo = 219, 16
      z_stat = ___
    solution: |
      import numpy as np

      n_organic, r_organic = 1240, 278
      n_promo, r_promo = 219, 16
      p_pool = (r_organic + r_promo) / (n_organic + n_promo)
      se = np.sqrt(p_pool * (1 - p_pool) * (1 / n_organic + 1 / n_promo))
      z_stat = (r_organic / n_organic - r_promo / n_promo) / se
    check: |
      check_value(z_stat, _sol["z_stat"], name="z_stat")
    hints:
      - "หา pooled proportion ก่อน แล้วค่อยหา standard error"
