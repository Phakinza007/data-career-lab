goals:
  - ตรวจกระทบยอด (reconciliation) เพื่อจับแถวที่หายหรือซ้ำจากการ join
  - ทดสอบความไวของข้อสรุปต่อการเปลี่ยนนิยามและต่อ outlier
  - ยืนยันว่าความต่างที่เห็นมีนัยสำคัญทางสถิติ และรู้ว่าสถิติบอกอะไรไม่ได้

examples:
  - id: x1
    title: กระทบยอด — ตัวเลขย่อยต้องบวกกลับเป็นตัวเลขรวม
    lang: sql
    prompt: |
      ก่อนเชื่อตารางที่แบ่งรายได้เป็นกลุ่ม ต้องพิสูจน์ก่อนว่าไม่มีแถวหายหรือซ้ำระหว่างทาง
    steps:
      - text: |
          หาตัวเลขอ้างอิงก่อน — รายได้รวมปี 2025 ที่คำนวณตรงๆ โดยไม่ผ่านการ join อะไรเพิ่ม
        code: |
          SELECT SUM(li.quantity * li.unit_price) AS total_revenue
          FROM orders o
          JOIN order_items li ON li.order_id = o.order_id
          WHERE o.status = 'completed'
            AND EXTRACT(year FROM o.order_date) = 2025
      - text: |
          คำนวณผลรวมจากตารางที่แบ่งกลุ่มแล้ว (ผ่าน CTE และ join เพิ่ม) — สองค่านี้ต้องเท่ากันเป๊ะ
          ถ้าไม่เท่าต้องหยุดหาสาเหตุก่อน ห้ามเดินต่อ
        code: |
          WITH first_order AS (
            SELECT customer_id, MIN(order_date) AS first_day
            FROM orders WHERE status = 'completed' GROUP BY 1
          ), sales_2025 AS (
            SELECT CASE WHEN EXTRACT(year FROM f.first_day) = 2025 THEN 'new' ELSE 'existing' END AS customer_type,
                   li.quantity * li.unit_price AS line
            FROM orders o
            JOIN order_items li ON li.order_id = o.order_id
            JOIN first_order f ON f.customer_id = o.customer_id
            WHERE o.status = 'completed' AND EXTRACT(year FROM o.order_date) = 2025
          )
          SELECT SUM(line) AS sum_of_parts,
                 (SELECT SUM(li.quantity * li.unit_price)
                  FROM orders o
                  JOIN order_items li ON li.order_id = o.order_id
                  WHERE o.status = 'completed' AND EXTRACT(year FROM o.order_date) = 2025) AS total_revenue
          FROM sales_2025
    pitfall:
      text: |
        การ join กับตารางสรุปที่สร้างจาก "เงื่อนไขคนละชุด" ทำให้แถวหายเงียบๆ — ตัวอย่างนี้นับรายได้
        **ทุกสถานะ** ของปี 2025 (19,905,276) แต่ join กับ `first_order` ที่สร้างจากออเดอร์ `completed` เท่านั้น
        ลูกค้าที่มีแต่ออเดอร์ยกเลิก/คืนของจึงหลุดออกไป เหลือ 19,479,401 — หายไป 425,875 โดยไม่มี error
        การกระทบยอดคือสิ่งเดียวที่จับความผิดพลาดแบบนี้ได้
      code: |
        WITH first_order AS (
          SELECT customer_id, MIN(order_date) AS first_day
          FROM orders WHERE status = 'completed' GROUP BY 1
        )
        SELECT (SELECT SUM(li.quantity * li.unit_price)
                FROM orders o
                JOIN order_items li ON li.order_id = o.order_id
                WHERE EXTRACT(year FROM o.order_date) = 2025) AS total_all_status,
               (SELECT SUM(li.quantity * li.unit_price)
                FROM orders o
                JOIN order_items li ON li.order_id = o.order_id
                JOIN first_order f ON f.customer_id = o.customer_id
                WHERE EXTRACT(year FROM o.order_date) = 2025) AS after_inner_join
  - id: x2
    title: ความต่างของ retention ระหว่างช่องทาง ใช่ความบังเอิญไหม
    lang: python
    prompt: |
      ช่องทาง promo มี retention 7.3% เทียบกับ organic 22.4% แต่ promo มีลูกค้าแค่ 219 คน
      — กลุ่มเล็กผันผวนได้มาก ต้องทดสอบก่อนเชื่อ
    steps:
      - text: |
          ทดสอบด้วย two-proportion z-test — สมมติฐานว่างคือสองช่องทางมี retention เท่ากัน
        code: |
          import numpy as np
          import scipy.stats as stats

          n_organic, r_organic = 1240, 278
          n_promo, r_promo = 219, 16

          p_pool = (r_organic + r_promo) / (n_organic + n_promo)
          se = np.sqrt(p_pool * (1 - p_pool) * (1 / n_organic + 1 / n_promo))
          z_stat = (r_organic / n_organic - r_promo / n_promo) / se
          p_value = stats.norm.sf(abs(z_stat)) * 2
          print(round(z_stat, 2), p_value)
      - text: |
          ตรวจไขว้ด้วย chi-square test ซึ่งคิดคนละมุมแต่ทดสอบสมมติฐานเดียวกัน — ได้ข้อสรุปตรงกัน
        code: |
          import scipy.stats as stats

          n_organic, r_organic = 1240, 278
          n_promo, r_promo = 219, 16
          table = [[n_organic - r_organic, r_organic], [n_promo - r_promo, r_promo]]

          chi2_stat, p_chi, dof, expected = stats.chi2_contingency(table)
          print(round(chi2_stat, 2), p_chi)
    pitfall:
      text: |
        ตัวเลขเปอร์เซ็นต์จากกลุ่มเล็กขยับง่ายมากจนตีความผิดได้ — cohort ที่เล็กที่สุดในชุดข้อมูลนี้มีลูกค้า 65 คน
        ลูกค้าเปลี่ยนใจกลับมาซื้อเพิ่มแค่คนเดียว retention ก็ขยับ 1.5 จุดแล้ว ก่อนจะเทียบเปอร์เซ็นต์
        ของสองกลุ่มจึงต้องดูขนาดกลุ่มเสมอ และถ้ากลุ่มเล็กต้องทดสอบนัยสำคัญก่อนสรุป
      code: |
        cohort_size = 65
        returned = 10
        print(round(returned / cohort_size * 100, 1))
        print(round((returned + 1) / cohort_size * 100, 1))

