  - id: e5
    level: applied
    lang: python
    prompt: |
      ตารางประกอบรายงาน — รายได้และ margin แยกตามหมวดสินค้า (เฉพาะ `completed`)
      คอลัมน์ revenue และ margin_pct (ปัด 1 ตำแหน่ง) เรียงตามรายได้จากมากไปน้อย
      เก็บ DataFrame ไว้ในตัวแปร result
    starter: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      items = pd.read_csv("data/order_items.csv")
      products = pd.read_csv("data/products.csv")
      result = ___
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      items = pd.read_csv("data/order_items.csv")
      products = pd.read_csv("data/products.csv")
      sales = items.merge(orders, on='order_id').merge(products, on='product_id')
      sales = sales[sales['status'] == 'completed']
      sales['line'] = sales['quantity'] * sales['unit_price']
      sales['profit'] = sales['quantity'] * (sales['unit_price'] - sales['cost'])
      result = sales.groupby('category').agg(revenue=('line', 'sum'), profit=('profit', 'sum'))
      result['margin_pct'] = (result['profit'] / result['revenue'] * 100).round(1)
      result = result[['revenue', 'margin_pct']].sort_values('revenue', ascending=False)
    check: |
      check_df(result, _sol["result"], ordered=True)
    hints:
      - กำไรต่อรายการ = (ราคาขาย − ต้นทุน) × จำนวน
      - margin คิดจากผลรวมหารผลรวม ไม่ใช่ค่าเฉลี่ยของอัตราส่วนรายแถว
  - id: e6
    level: applied
    lang: python
    prompt: |
      เตรียมข้อมูลกราฟแท่ง retention — สัดส่วนลูกค้าที่กลับมาซื้อในเดือนถัดจากเดือนที่ซื้อครั้งแรก
      แยกตามช่องทาง (เปอร์เซ็นต์ปัด 1 ตำแหน่ง) เรียงจากมากไปน้อย เก็บ Series ไว้ในตัวแปร result
    starter: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      customers = pd.read_csv("data/customers.csv")
      result = ___
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      customers = pd.read_csv("data/customers.csv")
      completed = orders[orders['status'] == 'completed'].copy()
      completed['month'] = completed['order_date'].dt.to_period('M')
      cohort = completed.groupby('customer_id')['month'].min().rename('cohort_month')
      joined = completed.merge(cohort, on='customer_id')
      joined['month_no'] = (joined['month'] - joined['cohort_month']).apply(lambda x: x.n)
      returned = joined[joined['month_no'] == 1]['customer_id'].unique()

      base = cohort.to_frame().merge(customers.set_index('customer_id')[['channel']], on='customer_id')
      base['returned'] = base.index.isin(returned)
      result = (base.groupby('channel')['returned'].mean() * 100).round(1).sort_values(ascending=False)
    check: |
      check_series(result, _sol["result"], ordered=True)
    hints:
      - "หาเดือนที่ซื้อครั้งแรกด้วย groupby('customer_id')['month'].min()"
      - "ผลต่างของ Period สองตัวมี .n บอกจำนวนเดือน"
      - "ค่าเฉลี่ยของคอลัมน์ True/False คือสัดส่วนของ True"
  - id: e7
    level: applied
    lang: python
    prompt: |
      เตรียมข้อมูลกราฟแท่งซ้อน — รายได้รายเดือนของปี 2025 แยกลูกค้าใหม่/เดิม (ตามปีที่ซื้อครั้งแรก)
      เป็น DataFrame ที่ index เป็นเดือนแบบ `2025-01` และมีคอลัมน์ existing, new
      เก็บไว้ในตัวแปร result
    starter: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      items = pd.read_csv("data/order_items.csv")
      result = ___
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      items = pd.read_csv("data/order_items.csv")
      items['line'] = items['quantity'] * items['unit_price']
      sales = items.merge(orders, on='order_id')
      sales = sales[sales['status'] == 'completed'].copy()
      first_year = sales.groupby('customer_id')['order_date'].min().dt.year.rename('first_year')
      sales = sales.merge(first_year, on='customer_id')
      sales = sales[sales['order_date'].dt.year == 2025]
      sales['customer_type'] = sales['first_year'].apply(lambda y: 'new' if y == 2025 else 'existing')
      sales['month'] = sales['order_date'].dt.to_period('M').astype(str)
      result = sales.pivot_table(index='month', columns='customer_type', values='line', aggfunc='sum')
    check: |
      check_df(result, _sol["result"], ordered=True)
    hints:
      - "หาปีที่ซื้อครั้งแรกของแต่ละคนก่อน แล้ว merge กลับเข้าตารางยอดขาย"
      - "pivot_table(index=..., columns=..., values=..., aggfunc='sum') สร้างตารางสองมิติให้พร้อมวาด"
