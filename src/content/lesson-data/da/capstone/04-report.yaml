      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      items = pd.read_csv("data/order_items.csv")
      products = pd.read_csv("data/products.csv")
      sales = items.merge(orders, on='order_id').merge(products, on='product_id')
      sales = sales[sales['status'] == 'completed'].copy()
      sales['line'] = sales['quantity'] * sales['unit_price']
      sales['profit'] = sales['quantity'] * (sales['unit_price'] - sales['cost'])
      result = sales.groupby(sales['order_date'].dt.year).agg(
          revenue=('line', 'sum'),
          orders=('order_id', 'nunique'),
          customers=('customer_id', 'nunique'),
          gross_profit=('profit', 'sum'),
      )
      result['aov'] = (result['revenue'] / result['orders']).round(2)
      result['margin_pct'] = (result['gross_profit'] / result['revenue'] * 100).round(1)
      result = result[['revenue', 'orders', 'customers', 'aov', 'gross_profit', 'margin_pct']]
    check: |
      check_df(result, _sol["result"], ordered=True)
    hints:
      - รวมทุกตัวเลขใน agg เดียวก่อน แล้วค่อยคำนวณคอลัมน์ที่เป็นอัตราส่วน
      - จัดลำดับคอลัมน์ตามที่โจทย์ระบุก่อนเก็บผลลัพธ์
  - id: e10
    level: challenge
    lang: python
    prompt: |
      ตารางการเปลี่ยนแปลงสำหรับรายงาน — จากตัวเลขหลักระดับปี (revenue, orders, customers, aov,
      gross_profit) คำนวณเปอร์เซ็นต์การเปลี่ยนแปลงจากปี 2024 เป็นปี 2025 (ปัด 2 ตำแหน่ง)
      เก็บเป็น Series ที่ index เป็นชื่อตัวชี้วัด ไว้ในตัวแปร result
    starter: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      items = pd.read_csv("data/order_items.csv")
      products = pd.read_csv("data/products.csv")
      result = ___
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      items = pd.read_csv("data/order_items.csv")
      products = pd.read_csv("data/products.csv")
      sales = items.merge(orders, on='order_id').merge(products, on='product_id')
      sales = sales[sales['status'] == 'completed'].copy()
      sales['line'] = sales['quantity'] * sales['unit_price']
      sales['profit'] = sales['quantity'] * (sales['unit_price'] - sales['cost'])
      yearly = sales.groupby(sales['order_date'].dt.year).agg(
          revenue=('line', 'sum'),
          orders=('order_id', 'nunique'),
          customers=('customer_id', 'nunique'),
          gross_profit=('profit', 'sum'),
      )
      yearly['aov'] = yearly['revenue'] / yearly['orders']
      yearly = yearly[['revenue', 'orders', 'customers', 'aov', 'gross_profit']]
      result = ((yearly.loc[2025] / yearly.loc[2024] - 1) * 100).round(2)
    check: |
      check_series(result, _sol["result"], ordered=True)
    hints:
      - "`.loc[2025] / .loc[2024] - 1` ให้อัตราการเปลี่ยนแปลงของทุกคอลัมน์ในครั้งเดียว"
      - AOV ต้องคำนวณจาก revenue ÷ orders ก่อน ไม่ใช่เอา % ของสองตัวมาลบกัน

quiz:
  - id: q1
    question: ทำไมรายงานต้องเอาข้อสรุปขึ้นก่อน แทนที่จะเล่าตามลำดับที่ทำงาน
    choices:
      - text: เพราะคนอ่านที่มีเวลาน้อยต้องได้สิ่งสำคัญที่สุดจากสามบรรทัดแรก
        correct: true
        why: ผู้บริหารส่วนใหญ่อ่านแค่ส่วนแรก รายละเอียดวิธีทำไว้ท้ายสำหรับคนที่อยากตรวจสอบ
      - text: เพราะวิธีการทำงานไม่สำคัญ
        why: วิธีการสำคัญมากต่อความน่าเชื่อถือ แค่ไม่ควรอยู่ต้นรายงาน
      - text: เพราะรายงานต้องสั้นที่สุดเท่าที่เป็นไปได้
        why: ความสั้นไม่ใช่เป้าหมาย การเรียงลำดับให้คนอ่านได้สิ่งที่ต้องการก่อนต่างหากที่สำคัญ
      - text: เพราะเครื่องมือทำรายงานบังคับให้เขียนแบบนั้น
        why: เป็นเรื่องของการสื่อสาร ไม่ใช่ข้อจำกัดของเครื่องมือ
  - id: q2
    question: margin ลดจาก 28.9% เหลือ 28.7% ควรเขียนในรายงานว่าอย่างไร
    choices:
      - text: ลดลง 0.2 จุดเปอร์เซ็นต์
        correct: true
        why: ผลต่างของค่าที่เป็นเปอร์เซ็นต์อยู่แล้วต้องเรียกว่า "จุดเปอร์เซ็นต์" (percentage point)
      - text: ลดลง 0.2%
        why: การลดลงเชิงสัมพัทธ์คือ 0.69% ไม่ใช่ 0.2% — การเขียนแบบนี้ทำให้คนอ่านเข้าใจผิด
      - text: ลดลง 2%
        why: ไม่ตรงกับตัวเลขใดเลย
      - text: ลดลงประมาณ 1 ใน 3
        why: ห่างจากความจริงมาก margin แทบไม่เปลี่ยน
  - id: q3
    question: ข้อใดคือ insight ที่ครบสี่ส่วน
    choices:
      - text: "\"84% ของรายได้ปี 2025 มาจากลูกค้าใหม่ ขณะที่ลูกค้าปี 2024 กลับมาเพียง 17.5% — รายได้ปีหน้าจะตกทันทีถ้าช่องทางหาลูกค้าสะดุด จึงควรลงทุนกับการรักษาลูกค้าเดิม\""
        correct: true
        why: มีสิ่งที่พบ ตัวเลข จุดเทียบ และ "แล้วไง" ครบทั้งสี่ส่วน
      - text: '"ลูกค้าใหม่เยอะขึ้นมากในปี 2025"'
        why: ไม่มีตัวเลข ไม่มีจุดเทียบ และไม่บอกว่าควรทำอะไรต่อ
      - text: '"รายได้ปี 2025 เท่ากับ 17,829,346 บาท"'
        why: เป็นข้อเท็จจริงที่ถูกต้อง แต่ไม่มีจุดเทียบและไม่มีข้อเสนอ
      - text: '"ควรลงทุนกับการรักษาลูกค้าเดิม"'
        why: เป็นข้อเสนอที่ไม่มีหลักฐานประกอบ คนอ่านไม่มีทางรู้ว่าทำไม
  - id: q4
    question: กราฟแบบไหนควรตัดออกจากรายงาน
    choices:
      - text: กราฟที่ไม่ได้ตอบคำถามไหนของรายงานโดยเฉพาะ
        correct: true
        why: กราฟทุกอันควรมีหน้าที่ ถ้าไม่มีก็ทำให้รายงานยาวขึ้นโดยไม่ช่วยตัดสินใจ
      - text: กราฟที่มีข้อมูลเยอะเกิน 12 จุด
        why: จำนวนจุดไม่ใช่เกณฑ์ กราฟเส้น 24 เดือนอ่านง่ายกว่าตาราง 24 แถวด้วยซ้ำ
      - text: กราฟที่เป็นขาวดำ
        why: สีไม่ใช่เกณฑ์ตัดสินว่ากราฟมีประโยชน์หรือไม่
      - text: กราฟที่ใช้ matplotlib แทน seaborn
        why: เครื่องมือที่ใช้วาดไม่เกี่ยวกับคุณค่าของกราฟ
  - id: q5
    question: สิ่งใดทำให้ portfolio ของ DA ดูน่าเชื่อถือที่สุดในสายตาคนสัมภาษณ์
    choices:
      - text: การเห็นว่าผู้เขียนตั้งคำถามเป็น เลือกวิธีเป็น ตรวจงานตัวเองเป็น และรู้ข้อจำกัดของข้อมูล
        correct: true
        why: ทักษะการคิดคือสิ่งที่ทำซ้ำได้กับข้อมูลชุดอื่น ต่างจากผลลัพธ์ของชุดข้อมูลเดียว
      - text: จำนวนกราฟที่เยอะที่สุด
        why: กราฟเยอะโดยไม่มีหน้าที่ทำให้รายงานอ่านยากขึ้น
      - text: การใช้โมเดล machine learning ที่ซับซ้อน
        why: ความซับซ้อนไม่ใช่เป้าหมาย งาน DA ส่วนใหญ่ตัดสินด้วยคำถามที่ดีและการวัดที่ถูก
      - text: ความยาวของ notebook
        why: ความยาวไม่ได้บอกคุณภาพ

summary:
  - รายงานต้องเอาข้อสรุปขึ้นก่อน แล้วค่อยตามด้วยตัวเลขหลัก insight ข้อเสนอ ข้อจำกัด และภาคผนวก
  - เตรียมข้อมูลกราฟให้พร้อมก่อนวาดเสมอ และใส่เฉพาะกราฟที่ตอบคำถามของรายงานจริงๆ
  - portfolio ที่ดีแสดงวิธีคิด — ตั้งคำถาม เลือกวิธี ตรวจงานตัวเอง และบอกข้อจำกัดได้

interview:
  - id: i1
    q: มีเวลา 2 นาที เล่าโปรเจกต์นี้ให้ฟัง
    a: |
      "คำถามคือรายได้ปี 2025 โต 21% แล้วยั่งยืนไหม ผมแตกเป็นคำถามย่อย 6 ข้อ ใช้ metric tree
      หาว่าการเติบโตมาจากกิ่งไหน ใช้ cohort retention ดูคุณภาพลูกค้าที่ได้มา และดูกำไรขั้นต้นแยกหมวดสินค้า
      สิ่งที่พบคือ 84% ของรายได้มาจากลูกค้าใหม่ ลูกค้าปี 2024 กลับมาแค่ 17.5% และช่องทาง promo
      มี retention 7.3% เทียบกับ organic 22.4% ซึ่งทดสอบแล้วมีนัยสำคัญ (p < 0.001)
      ข้อเสนอคือปล่อย checkout เวอร์ชัน B ที่ชนะ A/B test ย้ายงบออกจากแคมเปญแบบ promo
      และทำแคมเปญดึงลูกค้ากลุ่ม at_risk กลับมา ข้อจำกัดคือไม่มีข้อมูลต้นทุนการตลาด จึงคำนวณ ROI ไม่ได้"
  - id: i2
    q: ผู้สัมภาษณ์ถามว่า "รู้ได้ยังไงว่าตัวเลขในรายงานถูก" จะตอบยังไง
    a: |
      ตอบด้วยขั้นตอนที่ทำจริง: กระทบยอดทุกตารางสรุป (ผลรวมของกลุ่มย่อยต้องเท่ากับผลรวมทั้งหมด),
      คำนวณตัวเลขหลักซ้ำด้วยเครื่องมืออีกตัว (SQL แล้วทวนด้วย pandas), ทดสอบความไวต่อการเปลี่ยนนิยาม
      (ลูกค้าใหม่นับจากวันซื้อครั้งแรกหรือวันสมัคร ได้ 84% กับ 82% — เรื่องเดียวกัน),
      ตัด outlier ส่วนบน 1% ออกแล้วผลแทบไม่เปลี่ยน และทดสอบนัยสำคัญของความต่างที่เป็นหัวใจของข้อสรุป
      การตอบแบบนี้แสดงว่าเราไม่ได้เชื่อผลลัพธ์แรกที่ได้มาโดยไม่ตรวจอะไรเลย

