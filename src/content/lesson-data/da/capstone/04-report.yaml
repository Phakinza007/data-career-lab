goals:
  - เรียบเรียงผลวิเคราะห์เป็นรายงานที่เอาข้อสรุปขึ้นก่อน และมี insight ครบสี่ส่วน
  - เตรียมข้อมูลสำหรับกราฟที่จำเป็นจริงๆ ด้วย pandas แล้วค่อยวาด
  - จัดโครง portfolio และเล่างานให้จบใน 2 นาที

examples:
  - id: x1
    title: เตรียมข้อมูลและวาดกราฟรายได้รายเดือน 2024–2025
    lang: python
    prompt: |
      กราฟแรกของรายงาน — ให้คนอ่านเห็นแนวโน้มและฤดูกาลของรายได้ในภาพเดียว
    steps:
      - text: |
          เตรียมข้อมูลก่อนเสมอ — `dt.to_period('M').astype(str)` ให้ป้ายเดือนแบบ `2024-01`
          ที่เรียงตามเวลาได้ถูกต้องและอ่านรู้เรื่อง
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
          items = pd.read_csv("data/order_items.csv")
          items['line'] = items['quantity'] * items['unit_price']
          sales = items.merge(orders, on='order_id')
          sales = sales[sales['status'] == 'completed']
          monthly = sales.groupby(sales['order_date'].dt.to_period('M').astype(str))['line'].sum()
          monthly
      - text: |
          วาดแล้วใส่ title กับชื่อแกนให้ครบ — กราฟในรายงานต้องอ่านเข้าใจได้เองโดยไม่ต้องมีคนอธิบาย
        code: |
          import pandas as pd
          import matplotlib.pyplot as plt

          orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
          items = pd.read_csv("data/order_items.csv")
          items['line'] = items['quantity'] * items['unit_price']
          sales = items.merge(orders, on='order_id')
          sales = sales[sales['status'] == 'completed']
          monthly = sales.groupby(sales['order_date'].dt.to_period('M').astype(str))['line'].sum()

          plt.plot(monthly.index, monthly.values)
          plt.title('รายได้รวมรายเดือน 2024–2025')
          plt.xlabel('เดือน')
          plt.ylabel('รายได้ (บาท)')
          plt.xticks(rotation=90)
    pitfall:
      text: |
        ถ้าจัดกลุ่มด้วย `dt.month` (เลขเดือน 1–12) แทน `dt.to_period('M')` โค้ดจะรันผ่านและได้กราฟ 12 จุดสวยงาม
        แต่เดือนเดียวกันของสองปีถูกบวกรวมกันหมด — กราฟที่ได้ไม่ใช่แนวโน้มตามเวลาอีกต่อไป
        แต่เป็นผลรวมสองปีต่อเดือนปฏิทิน ซึ่งตอบคนละคำถามกับที่รายงานต้องการ
      code: |
        import pandas as pd

        orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
        items = pd.read_csv("data/order_items.csv")
        items['line'] = items['quantity'] * items['unit_price']
        sales = items.merge(orders, on='order_id')
        sales = sales[sales['status'] == 'completed']
        wrong = sales.groupby(sales['order_date'].dt.month)['line'].sum()
        wrong
  - id: x2
    title: ตารางตัวเลขหลักสำหรับ executive summary
    lang: python
    prompt: |
      ผู้บริหารอ่านตารางเดียวแล้วต้องเห็นภาพทั้งปี — รายได้ ออเดอร์ AOV ลูกค้า เทียบสองปี
    steps:
      - text: |
          สรุปตัวเลขระดับปีก่อน โดยนับออเดอร์และลูกค้าแบบไม่ซ้ำ (กับดักเดิมจาก module ที่แล้ว)
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
          items = pd.read_csv("data/order_items.csv")
          items['line'] = items['quantity'] * items['unit_price']
          sales = items.merge(orders, on='order_id')
          sales = sales[sales['status'] == 'completed']
          yearly = sales.groupby(sales['order_date'].dt.year).agg(
              revenue=('line', 'sum'),
              orders=('order_id', 'nunique'),
              customers=('customer_id', 'nunique'),
          )
          yearly['aov'] = (yearly['revenue'] / yearly['orders']).round(2)
          yearly
      - text: |
          เพิ่มคอลัมน์การเปลี่ยนแปลงเป็นเปอร์เซ็นต์ด้วย `.pct_change()` เพื่อให้คนอ่านไม่ต้องคิดเลขเอง
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
          items = pd.read_csv("data/order_items.csv")
          items['line'] = items['quantity'] * items['unit_price']
          sales = items.merge(orders, on='order_id')
          sales = sales[sales['status'] == 'completed']
          yearly = sales.groupby(sales['order_date'].dt.year).agg(
              revenue=('line', 'sum'),
              orders=('order_id', 'nunique'),
              customers=('customer_id', 'nunique'),
          )
          yearly['aov'] = yearly['revenue'] / yearly['orders']
          change = (yearly.pct_change() * 100).round(2)
          change
    pitfall:
      text: |
        margin ปี 2024 คือ 28.9% และปี 2025 คือ 28.7% — พูดว่า "ลดลง 0.2 **จุดเปอร์เซ็นต์**" ถูกต้อง
        แต่ถ้าพูดว่า "ลดลง 0.2%" จะผิด เพราะการลดลงเชิงสัมพัทธ์คือ 0.69% คนละตัวเลขกัน
        ความสับสนระหว่าง "จุดเปอร์เซ็นต์" กับ "เปอร์เซ็นต์" เป็นข้อผิดพลาดที่เจอบ่อยมากในรายงาน
        และทำให้ความน่าเชื่อถือหายไปทันทีเมื่อมีคนจับได้
      code: |
        margin_2024 = 28.9
        margin_2025 = 28.7
        print(round(margin_2025 - margin_2024, 2))
        print(round((margin_2025 - margin_2024) / margin_2024 * 100, 2))

