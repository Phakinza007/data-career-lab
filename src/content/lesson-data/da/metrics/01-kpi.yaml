quiz:
  - id: q1
    question: leading indicator กับ lagging indicator ต่างกันยังไง
    choices:
      - text: leading คือสัญญาณล่วงหน้าที่เปลี่ยนก่อนผลลัพธ์สุดท้าย ส่วน lagging คือผลลัพธ์สุดท้ายที่รู้ทีหลัง
        correct: true
        why: ถูกต้อง — leading ให้เวลาทีมแก้ไขก่อนผลลัพธ์สุดท้ายจะออกมา
      - text: ทั้งสองแบบวัดสิ่งเดียวกัน แค่เรียกชื่อต่างกัน
        why: ไม่ใช่ ทั้งสองวัดคนละช่วงเวลาของ funnel/กระบวนการ
      - text: leading indicator วัดได้แค่ในอดีต
        why: กลับกัน leading indicator คือสัญญาณล่วงหน้า ไม่ใช่ข้อมูลอดีต
      - text: lagging indicator เปลี่ยนแปลงเร็วกว่า leading เสมอ
        why: ตรงข้าม lagging indicator คือผลลัพธ์สุดท้ายที่รู้ช้ากว่า
  - id: q2
    question: "\"รายได้เดือนนี้สูงสุดของปี\" อันตรายตรงไหนถ้าดูตัวเลขนี้ตัวเดียว"
    choices:
      - text: ไม่รู้ว่าสูงเพราะฐานลูกค้าโตขึ้นจริง หรือแค่คนกลุ่มเดิมใช้จ่ายมากขึ้น (vanity metric)
        correct: true
        why: ถูกต้อง — ต้องเช็คจำนวนลูกค้า active ประกอบเพื่อรู้ที่มาของรายได้ที่แท้จริง
      - text: ไม่มีอันตรายเลย ตัวเลขรายได้บอกทุกอย่างที่ต้องรู้
        why: ไม่จริง รายได้อย่างเดียวไม่บอกว่าฐานลูกค้าโตขึ้นหรือไม่
      - text: อันตรายเฉพาะตอนรายได้ต่ำเท่านั้น
        why: อันตรายเกิดได้ทั้งตอนรายได้สูงและต่ำถ้าดูตัวเดียวโดดๆ
      - text: ควรดูแค่ % การเติบโตแทน ไม่ต้องดูรายได้จริง
        why: "% การเติบโตก็เป็น KPI ตัวเดียวเหมือนกัน ยังต้องดูควบคู่กับตัวอื่น"
  - id: q3
    question: North Star Metric ควรมีลักษณะแบบไหน
    choices:
      - text: สะท้อนคุณค่าที่ลูกค้าได้รับจริง และเชื่อมโยงกับรายได้ในระยะยาว ไม่ใช่แค่วัดง่าย
        correct: true
        why: ถูกต้อง — เป้าหมายคือ metric ที่ทั้งบริษัทใช้ร่วมกันเป็นทิศทางหลัก
      - text: ต้องเป็นตัวเลขที่คำนวณง่ายที่สุดในระบบ
        why: ความง่ายในการคำนวณไม่ใช่เกณฑ์หลักในการเลือก North Star Metric
      - text: ควรเปลี่ยนทุกเดือนตามที่ทีมสนใจ
        why: North Star Metric ควรคงที่พอสมควรเพื่อเป็นทิศทางระยะยาวของทั้งบริษัท
      - text: ต้องเป็นตัวเลขทางการเงินเท่านั้น
        why: ไม่จำเป็น หลายบริษัทเลือก North Star Metric ที่ไม่ใช่ตัวเงินโดยตรง เช่น จำนวนลูกค้า active
  - id: q4
    question: ทำไมควรดู KPI มากกว่า 1 ตัวพร้อมกันเสมอ
    choices:
      - text: KPI ตัวเดียวบอกภาพได้ไม่ครบ อาจถูกตีความผิดถ้าขาดบริบทจากตัวอื่น
        correct: true
        why: ถูกต้อง — ตัวอย่างเดือน ธ.ค. ในบทนี้แสดงให้เห็นชัดว่าดูรายได้อย่างเดียวพลาดประเด็นสำคัญไปเลย
      - text: เพราะ KPI แต่ละตัวมักผิดพลาดบ่อย ต้องมีตัวสำรอง
        why: ไม่ใช่ประเด็นเรื่องความผิดพลาดของการคำนวณ แต่เป็นเรื่องบริบทที่ขาดหายไป
      - text: เพื่อให้รายงานดูน่าเชื่อถือมากขึ้นเท่านั้น
        why: เหตุผลหลักคือป้องกันการเข้าใจผิด ไม่ใช่เรื่องความน่าเชื่อถือของรายงาน
      - text: ไม่จำเป็นต้องดูหลายตัว ถ้าเลือก KPI ตัวเดียวที่ดีพอ
        why: แม้ KPI ตัวเดียวจะดี ก็ยังเสี่ยงเป็น vanity metric ได้ถ้าไม่มีตัวอื่นประกอบ

summary:
  - leading indicator ให้สัญญาณล่วงหน้า ส่วน lagging indicator คือผลลัพธ์สุดท้ายที่รู้ทีหลัง
  - KPI ตัวเดียวโดดๆ อาจทำให้เข้าใจผิด (vanity metric) — ต้องดูควบคู่กับตัวชี้วัดอื่นเสมอ
  - "ตัวอย่างจริงจากข้อมูล: ธ.ค. 2025 รายได้สูงสุดของปีแต่ลูกค้า active ต่ำสุด — รายได้มาจากการใช้จ่ายต่อคนที่สูงขึ้น ไม่ใช่ฐานลูกค้าที่โตขึ้น"

interview:
  - id: i1
    q: ผู้บริหารบอกว่า "ยอดขายเดือนนี้สูงสุดในรอบปี ดีมากเลย" จะถามอะไรต่อก่อนเห็นด้วยเต็มที่
    a: |
      ควรถามต่อว่ารายได้ที่สูงขึ้นมาจากอะไร — ลูกค้าใหม่เพิ่มขึ้นจริง หรือลูกค้าเดิมกลุ่มเล็กใช้จ่ายมากขึ้น
      (เช็คจำนวนลูกค้า active ประกอบเสมอ) และเทียบกับช่วงเวลาเดียวกันของปีก่อนหรือฤดูกาลปกติด้วย
      เพราะยอดขายสูงในเดือนที่มีฤดูกาล/แคมเปญพิเศษอาจไม่ยั่งยืนในเดือนถัดไป
  - id: i2
    q: ถ้าให้เลือก North Star Metric ตัวเดียวสำหรับร้านค้าออนไลน์นี้ จะเลือกอะไรและทำไม
    a: |
      ตัวเลือกที่สมเหตุสมผลคือ "รายได้จากลูกค้าที่ซื้อซ้ำ" หรือ "จำนวนลูกค้า active ต่อเดือน" มากกว่ารายได้รวมเฉยๆ
      เพราะสะท้อนทั้งคุณค่าที่ลูกค้าได้รับ (กลับมาซื้อซ้ำ) และการเติบโตของฐานลูกค้าไปพร้อมกัน
      ไม่ใช่แค่ตัวเลขที่ถูกดันขึ้นได้ง่ายจากลูกค้ากลุ่มเล็กกลุ่มเดียว

flashcards:
  - id: c1
    front: leading indicator ต่างจาก lagging indicator ยังไง
    back: leading คือสัญญาณล่วงหน้าที่เปลี่ยนก่อนผลลัพธ์ (เช่น conversion rate) ส่วน lagging คือผลลัพธ์สุดท้ายที่รู้ทีหลัง (เช่น รายได้)
  - id: c2
    front: "ทำไม \"รายได้เดือนนี้สูงสุดของปี\" อาจเป็น vanity metric"
    back: ถ้าไม่เช็คจำนวนลูกค้า active ประกอบ อาจไม่รู้ว่ารายได้สูงเพราะฐานลูกค้าโตจริง หรือแค่ลูกค้ากลุ่มเดิมใช้จ่ายมากขึ้น
