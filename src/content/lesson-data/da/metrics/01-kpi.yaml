goals:
  - แยกความต่างระหว่าง leading indicator กับ lagging indicator
  - รู้ว่า KPI ตัวเดียวโดดๆ อาจทำให้เข้าใจสถานการณ์ผิด (vanity metric)
  - เลือก KPI ให้ตรงกับคำถามธุรกิจจริงๆ ไม่ใช่แค่ตัวที่วัดง่าย

examples:
  - id: x1
    title: อัตราการเปลี่ยนเป็นลูกค้า (conversion rate) เป็น KPI แบบ leading
    lang: python
    prompt: |
      ทีมอยากรู้ภาพรวมว่าจาก session ที่เข้ามาดูเว็บ มีกี่ % ที่ซื้อสำเร็จ
    steps:
      - text: |
          นับจำนวน session ที่ไปถึงขั้น visit และขั้น purchase จาก events
        code: |
          import pandas as pd

          events = pd.read_csv("data/events.csv")
          counts = events.groupby('event_type')['session_id'].nunique()
          n_visit = counts['visit']
          n_purchase = counts['purchase']
          n_visit, n_purchase
      - text: |
          คำนวณ % conversion — นี่คือ leading indicator (สัญญาณล่วงหน้า) ต่างจากรายได้ที่เป็น lagging indicator (ผลลัพธ์สุดท้าย)
        code: |
          import pandas as pd

          events = pd.read_csv("data/events.csv")
          counts = events.groupby('event_type')['session_id'].nunique()
          n_visit = counts['visit']
          n_purchase = counts['purchase']
          overall_conversion_pct = round(n_purchase / n_visit * 100, 2)
          overall_conversion_pct
    pitfall:
      text: |
        ถ้าติดตามแค่รายได้ (lagging indicator) อย่างเดียว จะรู้ปัญหาก็ต่อเมื่อผลลัพธ์สุดท้ายออกมาแย่แล้ว
        ซึ่งอาจสายเกินไปที่จะแก้ทัน — leading indicator อย่าง conversion rate ให้สัญญาณเตือนได้เร็วกว่า
  - id: x2
    title: "ระวัง vanity metric: รายได้สูงไม่ได้แปลว่าฐานลูกค้าโตขึ้นเสมอไป"
    lang: python
    prompt: |
      เดือน ธ.ค. 2025 มีรายได้สูงสุดของปี — ทีมอยากรู้ว่านี่คือสัญญาณที่ดีจริงไหม
    steps:
      - text: |
          หารายได้และจำนวนลูกค้า active (มีออเดอร์ completed อย่างน้อย 1 ครั้ง) ของเดือน ธ.ค. และ ม.ค. 2025 เทียบกัน
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")
          o25 = orders[(orders['status'] == 'completed') & (orders['order_date'].str.startswith('2025'))]
          r25 = order_items.merge(o25, on='order_id').assign(line=lambda d: d.quantity * d.unit_price)
          r25 = r25.assign(month=lambda d: d.order_date.str[:7])
          monthly_rev = r25.groupby('month')['line'].sum()
          monthly_mac = o25.assign(month=lambda d: d.order_date.str[:7]).groupby('month')['customer_id'].nunique()
          dec_revenue, dec_mac = monthly_rev['2025-12'], monthly_mac['2025-12']
          jan_revenue, jan_mac = monthly_rev['2025-01'], monthly_mac['2025-01']
          dec_revenue, dec_mac, jan_revenue, jan_mac
      - text: |
          คำนวณรายได้เฉลี่ยต่อลูกค้า active — ธ.ค. มีรายได้เฉลี่ยต่อคนเกือบสองเท่าของ ม.ค. ทั้งที่จำนวนลูกค้า active ต่ำสุดของปี
          แปลว่ารายได้ที่สูงมาจากลูกค้าเดิม/กลุ่มเดิมใช้จ่ายมากขึ้น ไม่ใช่ฐานลูกค้าโตขึ้น
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")
          o25 = orders[(orders['status'] == 'completed') & (orders['order_date'].str.startswith('2025'))]
          r25 = order_items.merge(o25, on='order_id').assign(line=lambda d: d.quantity * d.unit_price)
          r25 = r25.assign(month=lambda d: d.order_date.str[:7])
          monthly_rev = r25.groupby('month')['line'].sum()
          monthly_mac = o25.assign(month=lambda d: d.order_date.str[:7]).groupby('month')['customer_id'].nunique()
          dec_avg = monthly_rev['2025-12'] / monthly_mac['2025-12']
          jan_avg = monthly_rev['2025-01'] / monthly_mac['2025-01']
          round(dec_avg, 2), round(jan_avg, 2)
    pitfall:
      text: |
        การรายงาน "รายได้เดือน ธ.ค. สูงสุดของปี!" เฉยๆ โดยไม่เช็คจำนวนลูกค้า active ประกอบ
        เป็นตัวอย่างคลาสสิกของ vanity metric — ตัวเลขดูดีแต่ไม่ได้บอกว่าธุรกิจกำลังเติบโตแบบยั่งยืนจริงหรือเปล่า

