    lang: python
    prompt: |
      คำนวณ step-conversion (%) จาก view_product ไป add_to_cart เก็บไว้ในตัวแปร step_conv_pct เติม `___` ให้ครบ
    starter: |
      import pandas as pd

      events = pd.read_csv("data/events.csv")
      counts = events.groupby('event_type')['session_id'].nunique()
      step_conv_pct = round(counts['add_to_cart'] / counts[___] * 100, 2)
    solution: |
      import pandas as pd

      events = pd.read_csv("data/events.csv")
      counts = events.groupby('event_type')['session_id'].nunique()
      step_conv_pct = round(counts['add_to_cart'] / counts['view_product'] * 100, 2)
    check: |
      check_value(step_conv_pct, _sol["step_conv_pct"], name="step_conv_pct")
    hints:
      - step-conversion หารด้วยจำนวนคนของ "ขั้นก่อนหน้า" เสมอ

exercises:
