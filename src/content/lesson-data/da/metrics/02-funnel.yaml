    level: basic
    lang: python
    prompt: |
      จำนวน session ต่อขั้นของ funnel ทั้งหมด (Series, index ตามลำดับ visit, view_product, add_to_cart, checkout, purchase)
      เก็บไว้ในตัวแปร result
    starter: |
      import pandas as pd

      events = pd.read_csv("data/events.csv")
      result = ___
    solution: |
      import pandas as pd

      events = pd.read_csv("data/events.csv")
      FUNNEL = ["visit", "view_product", "add_to_cart", "checkout", "purchase"]
      counts = events.groupby('event_type')['session_id'].nunique()
      result = counts.reindex(FUNNEL)
    check: |
      check_series(result, _sol["result"])
    hints:
      - "`.reindex(FUNNEL)` เรียง Series ตามลำดับ list ที่กำหนด"
  - id: e2
    level: basic
    lang: python
    prompt: |
      อัตราการเปลี่ยนเป็นลูกค้ารวม (%) จาก visit ไปถึง purchase เก็บไว้ในตัวแปร overall_conversion_pct
    starter: |
      import pandas as pd

      events = pd.read_csv("data/events.csv")
      overall_conversion_pct = ___
    solution: |
      import pandas as pd

      events = pd.read_csv("data/events.csv")
      counts = events.groupby('event_type')['session_id'].nunique()
      overall_conversion_pct = round(counts['purchase'] / counts['visit'] * 100, 2)
    check: |
      check_value(overall_conversion_pct, _sol["overall_conversion_pct"], name="overall_conversion_pct", tol=0.01)
    hints:
      - เหมือนบทที่แล้ว
  - id: e3
    level: basic
    lang: python
    prompt: |
      step conversion (%) จาก view_product ไป add_to_cart เก็บไว้ในตัวแปร step_conv_pct
    starter: |
      import pandas as pd

      events = pd.read_csv("data/events.csv")
