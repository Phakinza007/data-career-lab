  - id: e4
    level: basic
    lang: python
    prompt: |
      ขั้นไหนของ funnel (ไม่นับ visit) มี step-conversion ต่ำที่สุด (string เช่น 'add_to_cart') เก็บไว้ในตัวแปร worst_step
    starter: |
      import pandas as pd

      events = pd.read_csv("data/events.csv")
      worst_step = ___
    solution: |
      import pandas as pd

      events = pd.read_csv("data/events.csv")
      FUNNEL = ["visit", "view_product", "add_to_cart", "checkout", "purchase"]
      counts = events.groupby('event_type')['session_id'].nunique()
      steps_n = [counts[f] for f in FUNNEL]
      step_conv = pd.Series(
          [steps_n[i] / steps_n[i - 1] * 100 for i in range(1, len(steps_n))],
          index=FUNNEL[1:],
      )
      worst_step = step_conv.idxmin()
    check: |
      check_value(worst_step, _sol["worst_step"], name="worst_step")
    hints:
      - หา step conversion ของทุกขั้น (ไม่นับ visit) แล้ว idxmin()
  - id: e5
    level: applied
    lang: python
    prompt: |
      จำนวนคนที่หายไป (absolute drop-off) ในแต่ละคู่ขั้นของ funnel เก็บไว้ในตัวแปร result
      (Series, index เป็น 'visit_to_view_product', 'view_product_to_add_to_cart', 'add_to_cart_to_checkout', 'checkout_to_purchase')
    starter: |
      import pandas as pd

      events = pd.read_csv("data/events.csv")
      result = ___
    solution: |
      import pandas as pd

      events = pd.read_csv("data/events.csv")
      FUNNEL = ["visit", "view_product", "add_to_cart", "checkout", "purchase"]
      counts = events.groupby('event_type')['session_id'].nunique()
      steps_n = [counts[f] for f in FUNNEL]
      idx = [f"{FUNNEL[i]}_to_{FUNNEL[i+1]}" for i in range(len(FUNNEL) - 1)]
      result = pd.Series([steps_n[i] - steps_n[i + 1] for i in range(len(steps_n) - 1)], index=idx)
    check: |
      check_series(result, _sol["result"])
    hints:
      - drop-off ของแต่ละคู่ขั้น = จำนวนขั้นก่อนหน้า - จำนวนขั้นถัดไป ตั้งชื่อ index ให้ตรงกับที่โจทย์กำหนด
