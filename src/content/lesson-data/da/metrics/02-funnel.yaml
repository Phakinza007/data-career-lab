quiz:
  - id: q1
    question: step-conversion กับ absolute drop-off ต่างกันยังไง
    choices:
      - text: step-conversion คือสัดส่วน (%) ของคนที่ผ่านขั้นนั้นได้ ส่วน absolute drop-off คือจำนวนคนที่หายไปตรงๆ
        correct: true
        why: ถูกต้อง — สองตัวนี้ตอบคำถามคนละแบบ
      - text: ทั้งสองคำนวณจากสูตรเดียวกัน แค่หน่วยต่างกัน
        why: ไม่ใช่ สูตรต่างกันจริงๆ (สัดส่วน vs จำนวนคน)
      - text: step-conversion ใช้ได้แค่กับขั้นแรกของ funnel เท่านั้น
        why: ใช้ได้กับทุกคู่ขั้นที่ติดกัน ไม่ใช่แค่ขั้นแรก
      - text: absolute drop-off คำนวณจาก % เสมอ
        why: absolute drop-off คือจำนวนคน ไม่ใช่ %
  - id: q2
    question: ทำไมขั้นที่มี absolute drop-off เยอะที่สุดไม่จำเป็นต้องเป็นขั้นที่แย่ที่สุด
    choices:
      - text: ขั้นต้นๆ ของ funnel มักมีคนเยอะอยู่แล้ว ดรอปเป็นตัวเลขเยอะเป็นธรรมดา ต้องดู % เทียบกับฐานของขั้นนั้นด้วย
        correct: true
        why: ถูกต้อง — ต้องดู step-conversion (%) ประกอบเสมอ ไม่ใช่แค่จำนวนคนที่หายไป
      - text: absolute drop-off ไม่เกี่ยวกับคุณภาพของขั้นนั้นเลย
        why: เกี่ยวข้องอยู่ แต่ต้องตีความร่วมกับ % ไม่ใช่ดูตัวเดียว
      - text: เพราะ absolute drop-off คำนวณผิดพลาดบ่อย
        why: ไม่ใช่เรื่องความผิดพลาดในการคำนวณ แต่เป็นเรื่องการตีความ
      - text: ขั้นท้ายๆ ของ funnel มักมี drop-off เยอะกว่าขั้นต้นเสมอ
        why: ตรงข้าม ขั้นต้นๆ มักมีจำนวนคนเยอะกว่าจึงดรอปเป็นตัวเลขเยอะกว่าธรรมดา
  - id: q3
    question: เทียบ funnel ระหว่าง mobile กับ desktop มีประโยชน์ยังไง
    choices:
      - text: เจอได้ว่าปัญหาของ funnel อาจกระจุกอยู่ที่ device ใด device หนึ่ง ทำให้แก้ปัญหาได้ตรงจุดกว่า
        correct: true
        why: ถูกต้อง — การแบ่ง segment ช่วยเห็นปัญหาที่ภาพรวมอาจกลบไว้
      - text: ไม่มีประโยชน์ เพราะ funnel ควรเหมือนกันทุก device
        why: ในทางปฏิบัติ funnel มักต่างกันตาม device จริง มีประโยชน์ที่จะเทียบ
      - text: ใช้ได้แค่ตอนอยากรู้ว่า device ไหนมีคนใช้เยอะกว่าเท่านั้น
        why: ประโยชน์หลักคือเจอปัญหาเฉพาะจุด ไม่ใช่แค่นับจำนวนผู้ใช้
      - text: เทียบ funnel ตาม device ทำได้เฉพาะกับเว็บที่มี native app เท่านั้น
        why: ไม่จำเป็น ใช้ได้กับข้อมูล session ทั่วไปที่มีคอลัมน์ device
  - id: q4
    question: ถ้าอยากเพิ่ม purchase โดยงบจำกัด ควรโฟกัสขั้นไหนของ funnel นี้ก่อน
    choices:
      - text: add_to_cart เพราะเป็นขั้นที่มี step-conversion ต่ำที่สุด
        correct: true
        why: ถูกต้อง — แก้ขั้นที่มี step-conversion ต่ำสุดมักให้ผลตอบแทนสูงสุดต่อความพยายามที่ใส่ลงไป
      - text: visit เพราะมีคนหายไปเยอะที่สุดในแง่จำนวนคน
        why: จำนวนคนที่หายไปเยอะเป็นเรื่องปกติของขั้นต้น ไม่ได้แปลว่าขั้นนั้นมีปัญหาที่สุด
      - text: purchase เพราะเป็นขั้นสุดท้ายที่ใกล้เป้าหมายที่สุด
        why: การแก้ที่ขั้นสุดท้ายช่วยได้น้อยกว่าถ้าคนหลุดไปตั้งแต่ขั้นก่อนหน้ามากแล้ว
      - text: ขั้นไหนก็ได้ เพราะทุกขั้นสำคัญเท่ากันหมด
        why: ขั้นที่มี step-conversion ต่ำสุดมักคุ้มค่าที่จะแก้ก่อนขั้นอื่น

summary:
  - อ่าน funnel ทีละขั้นด้วย step-conversion (%) ไม่ใช่แค่ดูจำนวนคนที่หายไป
  - absolute drop-off เยอะไม่ได้แปลว่าขั้นนั้นแย่ที่สุด ต้องดู % เทียบกับฐานของขั้นนั้นเสมอ
  - แบ่ง funnel ตาม segment (เช่น device) ช่วยเจอปัญหาที่ภาพรวมอาจกลบไว้

interview:
  - id: i1
    q: เจอ funnel ที่ conversion ตกฮวบขั้นหนึ่ง จะสืบสาเหตุต่อยังไง (ไม่ใช่แค่รายงานตัวเลข)
    a: |
      ควรแยกดูว่าปัญหากระจุกอยู่ที่ segment ไหน (device, channel, ช่วงเวลา) แล้วดูข้อมูลเชิงคุณภาพประกอบ เช่น
      รีวิวผู้ใช้ หรือทดลองใช้งานจริงในขั้นนั้นด้วยตัวเอง ก่อนจะสรุปว่าสาเหตุคืออะไร ตัวเลขบอกแค่ "ตรงไหน" ที่มีปัญหา
      แต่ไม่บอก "ทำไม" — ต้องหาข้อมูลเพิ่มเพื่อตอบ "ทำไม"
  - id: i2
    q: ทำไมการแบ่ง funnel ตาม segment (เช่น device, channel) ถึงสำคัญกว่าดู funnel รวมอย่างเดียว
    a: |
      เพราะตัวเลขรวมอาจกลบปัญหาของ segment หนึ่งไว้ด้วยผลงานที่ดีของอีก segment เช่น ถ้า mobile กับ desktop
      มี conversion รวมใกล้เคียงกัน อาจดูเหมือนไม่มีปัญหา ทั้งที่จริงขั้นใดขั้นหนึ่งของ device หนึ่งแย่กว่าอีก device
      มากอย่างมีนัยสำคัญ การแบ่ง segment ช่วยให้เจอจุดที่ควรแก้ไขได้ตรงกว่า

flashcards:
  - id: c1
    front: step-conversion คำนวณยังไง
    back: จำนวนคนในขั้นปัจจุบัน หารด้วยจำนวนคนในขั้นก่อนหน้า คูณ 100
  - id: c2
    front: absolute drop-off กับ relative step-conversion ต่างกันยังไงในหนึ่งประโยค
    back: absolute drop-off คือจำนวนคนที่หายไปตรงๆ ส่วน step-conversion คือสัดส่วน (%) เทียบกับฐานของขั้นก่อนหน้า
