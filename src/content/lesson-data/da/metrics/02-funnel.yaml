goals:
  - อ่าน funnel ทีละขั้นด้วย step-over-step conversion
  - แยกความต่างระหว่าง absolute drop-off กับ relative step-conversion
  - เปรียบเทียบ funnel ระหว่างกลุ่มย่อย เช่น device

examples:
  - id: x1
    title: อ่าน funnel ทีละขั้น
    lang: python
    prompt: |
      อยากรู้ว่าขั้นไหนของ funnel (visit → view_product → add_to_cart → checkout → purchase) ที่คนหลุดออกเยอะที่สุด
    steps:
      - text: |
          นับจำนวน session ต่อขั้นของ funnel ทั้งหมด
        code: |
          import pandas as pd

          events = pd.read_csv("data/events.csv")
          FUNNEL = ["visit", "view_product", "add_to_cart", "checkout", "purchase"]
          counts = events.groupby('event_type')['session_id'].nunique()
          steps_n = [int(counts.get(f, 0)) for f in FUNNEL]
          steps_n
      - text: |
          คำนวณ step-conversion (%) ของแต่ละขั้นเทียบกับขั้นก่อนหน้า — พบว่าขั้น add_to_cart มี step-conversion ต่ำสุด (34.56%)
          ทั้งที่ขั้น visit→view_product มีคนหายไปเยอะกว่าในแง่จำนวนคน (absolute drop-off)
        code: |
          import pandas as pd

          events = pd.read_csv("data/events.csv")
          FUNNEL = ["visit", "view_product", "add_to_cart", "checkout", "purchase"]
          counts = events.groupby('event_type')['session_id'].nunique()
          steps_n = [int(counts.get(f, 0)) for f in FUNNEL]
          step_conv = [round(steps_n[i] / steps_n[i-1] * 100, 2) for i in range(1, len(steps_n))]
          list(zip(FUNNEL[1:], step_conv))
    pitfall:
      text: |
        ขั้น visit→view_product มีคนหายไปมากที่สุดในแง่จำนวนคน (11,217 คน) แต่นั่นเป็นเรื่องปกติเพราะขั้นต้นๆ
        ของ funnel มีคนเยอะอยู่แล้ว การสรุปว่า "ขั้นนี้แย่ที่สุด" จากจำนวนคนที่หายไปเฉยๆ โดยไม่ดู % เทียบกับฐาน
        ของขั้นนั้น อาจทำให้โฟกัสผิดจุด — ขั้น add_to_cart ที่มี step-conversion ต่ำสุด (34.56%) ต่างหากที่ควรแก้ก่อน
  - id: x2
    title: เทียบ funnel ระหว่าง device
    lang: python
    prompt: |
      อยากรู้ว่า funnel ของคนที่ใช้มือถือกับคอมพิวเตอร์ต่างกันไหม
    steps:
      - text: |
          นับจำนวน session ต่อขั้นของ funnel แยกตาม device
        code: |
          import pandas as pd

          events = pd.read_csv("data/events.csv")
          FUNNEL = ["visit", "view_product", "add_to_cart", "checkout", "purchase"]
          mobile = events[events['device'] == 'mobile']
          desktop = events[events['device'] == 'desktop']
          c_mobile = mobile.groupby('event_type')['session_id'].nunique()
          c_desktop = desktop.groupby('event_type')['session_id'].nunique()
          [int(c_mobile.get(f, 0)) for f in FUNNEL], [int(c_desktop.get(f, 0)) for f in FUNNEL]
      - text: |
          เทียบ overall conversion ของทั้งสอง device — ใกล้เคียงกันแต่ mobile สูงกว่าเล็กน้อย
        code: |
          import pandas as pd

          events = pd.read_csv("data/events.csv")
          FUNNEL = ["visit", "view_product", "add_to_cart", "checkout", "purchase"]
          mobile = events[events['device'] == 'mobile']
          desktop = events[events['device'] == 'desktop']
          c_mobile = mobile.groupby('event_type')['session_id'].nunique()
          c_desktop = desktop.groupby('event_type')['session_id'].nunique()
          conv_mobile = round(c_mobile['purchase'] / c_mobile['visit'] * 100, 2)
          conv_desktop = round(c_desktop['purchase'] / c_desktop['visit'] * 100, 2)
          conv_mobile, conv_desktop
    pitfall:
      text: |
        ถ้าดูแค่ overall conversion รวมของทั้งเว็บ จะไม่เห็นว่าปัญหาอาจกระจุกอยู่ที่ device ใด device หนึ่ง
        การแบ่ง funnel ตาม segment (device, channel, ฯลฯ) ช่วยให้แก้ปัญหาได้ตรงจุดกว่าดูภาพรวมอย่างเดียว

faded:
