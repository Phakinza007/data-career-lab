goals:
  - สร้างตาราง funnel จากตาราง events โดยนับหน่วยเดียวกันทุกขั้น (session) และเรียงตามลำดับขั้นจริง
  - แยกให้ออกระหว่าง conversion "เทียบขั้นก่อนหน้า" กับ "เทียบขั้นแรก" และรู้ว่าจะใช้ตัวไหนตอนไหน
  - หาขั้นที่คนหายไปมากที่สุด แล้วเจาะต่อด้วยการแบ่งกลุ่ม (segment)

examples:
  - id: x1
    title: สร้างตาราง funnel ที่เรียงตามลำดับขั้นจริง
    lang: sql
    prompt: |
      ทีม product อยากเห็นภาพรวมว่าจาก session ที่เข้าเว็บทั้งหมด เหลือกี่ session ในแต่ละขั้นของ funnel
    steps:
      - text: |
          นับ session แบบไม่ซ้ำของแต่ละขั้นก่อน — หนึ่ง session อาจยิง event เดิมซ้ำได้ในงานจริง
          จึงต้อง `COUNT(DISTINCT session_id)` ไม่ใช่ `COUNT(*)`
        code: |
          SELECT event_type, COUNT(DISTINCT session_id) AS sessions
          FROM events
          GROUP BY 1
          ORDER BY sessions DESC
      - text: |
          ใส่หมายเลขขั้นด้วย `CASE` เพื่อบังคับลำดับให้ตรงกับ funnel จริง แล้วคำนวณสัดส่วนเทียบขั้นแรก
          ด้วย `MAX(sessions) OVER ()` (ค่าสูงสุดของทั้งตาราง = จำนวน session ขั้น visit)
        code: |
          WITH funnel AS (
            SELECT CASE event_type
                     WHEN 'visit' THEN 1 WHEN 'view_product' THEN 2 WHEN 'add_to_cart' THEN 3
                     WHEN 'checkout' THEN 4 WHEN 'purchase' THEN 5
                   END AS step_no,
                   event_type,
                   COUNT(DISTINCT session_id) AS sessions
            FROM events
            GROUP BY 1, 2
          )
          SELECT step_no, event_type, sessions,
                 ROUND(sessions * 100.0 / MAX(sessions) OVER (), 2) AS pct_of_visit
          FROM funnel
          ORDER BY step_no
    pitfall:
      text: |
        ถ้าปล่อยให้ `GROUP BY event_type` เรียงเองตามค่าเริ่มต้น จะได้ลำดับตามตัวอักษร
        (`add_to_cart`, `checkout`, `purchase`, `view_product`, `visit`) ซึ่งไม่ใช่ลำดับของ funnel
        ตัวเลขทุกตัวถูกต้อง แต่ตารางอ่านแล้วสับสนทันทีเพราะ "กรวย" ไม่ได้แคบลงตามลำดับ
        — ข้อมูลถูกแต่สื่อสารผิด ก็ยังนับเป็นรายงานที่ใช้ไม่ได้
      code: |
        SELECT event_type, COUNT(DISTINCT session_id) AS sessions
        FROM events
        GROUP BY 1
        ORDER BY event_type
  - id: x2
    title: หาขั้นที่คนหายไปมากที่สุดด้วย LAG
    lang: sql
    prompt: |
      ทีมมีงบพอแก้ได้จุดเดียว — ต้องรู้ว่าขั้นไหนของ funnel ที่คนหายไปมากที่สุด
    steps:
      - text: |
          ดึงจำนวน session ของขั้นก่อนหน้ามาวางข้างกันด้วย `LAG(sessions) OVER (ORDER BY step_no)`
        code: |
          WITH funnel AS (
            SELECT CASE event_type
                     WHEN 'visit' THEN 1 WHEN 'view_product' THEN 2 WHEN 'add_to_cart' THEN 3
                     WHEN 'checkout' THEN 4 WHEN 'purchase' THEN 5
                   END AS step_no,
                   event_type,
                   COUNT(DISTINCT session_id) AS sessions
            FROM events
            GROUP BY 1, 2
          )
          SELECT step_no, event_type, sessions,
                 LAG(sessions) OVER (ORDER BY step_no) AS prev_sessions
          FROM funnel
          ORDER BY step_no
      - text: |
          เปลี่ยนเป็นเปอร์เซ็นต์ผ่านต่อ และเปอร์เซ็นต์ที่หายไป (100 ลบด้วยเปอร์เซ็นต์ผ่านต่อ)
          — ขั้น `add_to_cart` หายไป 65.44% มากที่สุดในทุกขั้น
        code: |
          WITH funnel AS (
            SELECT CASE event_type
                     WHEN 'visit' THEN 1 WHEN 'view_product' THEN 2 WHEN 'add_to_cart' THEN 3
                     WHEN 'checkout' THEN 4 WHEN 'purchase' THEN 5
                   END AS step_no,
                   event_type,
                   COUNT(DISTINCT session_id) AS sessions
            FROM events
            GROUP BY 1, 2
          )
          SELECT step_no, event_type, sessions,
                 ROUND(sessions * 100.0 / LAG(sessions) OVER (ORDER BY step_no), 2) AS pct_of_prev,
                 ROUND(100 - sessions * 100.0 / LAG(sessions) OVER (ORDER BY step_no), 2) AS drop_pct
          FROM funnel
          ORDER BY step_no
    pitfall:
      text: |
        ถ้าเปลี่ยนหน่วยนับจาก `session_id` เป็น `customer_id` ตัวเลขจะเล็กลงมากทุกขั้นและสัดส่วนเพี้ยนไปหมด
        เพราะ event ส่วนใหญ่มาจากผู้ใช้ที่ยังไม่ล็อกอิน (`customer_id` เป็น NULL) และ `COUNT(DISTINCT)`
        ไม่นับ NULL ให้ — funnel ที่ได้จะเป็นของ "เฉพาะคนที่ล็อกอินแล้ว" ซึ่งเป็นคนละคำถามกับที่ตั้งใจถาม
      code: |
        SELECT event_type,
               COUNT(DISTINCT session_id) AS sessions,
               COUNT(DISTINCT customer_id) AS customers
        FROM events
        GROUP BY 1
        ORDER BY sessions DESC

