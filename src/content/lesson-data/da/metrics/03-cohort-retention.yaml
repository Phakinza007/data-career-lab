    front: cohort คืออะไร
    back: กลุ่มลูกค้าที่สมัครหรือเข้าร่วมในช่วงเวลาเดียวกัน ใช้เปรียบเทียบพฤติกรรมข้ามช่วงเวลา
  - id: c2
    front: retention ในบทนี้นิยามยังไง
    back: ลูกค้าที่สั่งซื้อตั้งแต่ 2 ครั้งขึ้นไป นับทุกสถานะออเดอร์ (ไม่ใช่แค่ completed)
  - id: c3
    front: "ทำไม cohort เดือน มิ.ย. 2025 ถึง retention ต่ำ"
    back: เพราะ 70.59% ของคนที่สมัครเดือนนั้นมาจากช่องทาง promo ซึ่งมี retention ต่ำสุดในทุกช่องทาง (10.33%)
