quiz:
  - id: q1
    question: cohort ในบริบทนี้หมายถึงอะไร
    choices:
      - text: กลุ่มลูกค้าที่สมัครในช่วงเวลาเดียวกัน (เช่น เดือนเดียวกัน)
        correct: true
        why: ถูกต้อง — cohort แบ่งตามช่วงเวลาที่เข้าร่วม/สมัครสมาชิก
      - text: กลุ่มลูกค้าที่ซื้อสินค้าหมวดเดียวกัน
        why: นั่นคือการแบ่งกลุ่มตามพฤติกรรมซื้อ ไม่ใช่ cohort ตามเวลาสมัคร
      - text: กลุ่มลูกค้าที่อยู่จังหวัดเดียวกัน
        why: cohort ในบทนี้แบ่งตามเวลาสมัคร ไม่ใช่ตามพื้นที่
      - text: ลูกค้าทั้งหมดในระบบโดยไม่แบ่งกลุ่ม
        why: ตรงข้าม cohort คือการแบ่งกลุ่มย่อย ไม่ใช่มองรวมทั้งหมด
  - id: q2
    question: retention ในบทนี้นิยามว่าอะไร
    choices:
      - text: ลูกค้าที่สั่งซื้อตั้งแต่ 2 ครั้งขึ้นไป (นับทุกสถานะออเดอร์)
        correct: true
        why: ถูกต้อง — นิยามนี้ใช้ตลอดทั้งบท ต่างจากบทที่แล้วที่นับเฉพาะออเดอร์ completed
      - text: ลูกค้าที่ล็อกอินเข้าเว็บซ้ำ
        why: บทนี้วัดจากการสั่งซื้อ ไม่ใช่การล็อกอิน
      - text: ลูกค้าที่ไม่เคยยกเลิกออเดอร์เลย
        why: ไม่เกี่ยวกับการยกเลิก retention วัดจากจำนวนครั้งที่สั่งซื้อ
      - text: ลูกค้าที่ใช้จ่ายเกินค่าเฉลี่ย
        why: retention วัดความถี่ในการกลับมาซื้อ ไม่ใช่มูลค่าที่ใช้จ่าย
  - id: q3
    question: เจอ cohort หนึ่งมี retention ต่ำผิดปกติ ขั้นแรกที่ควรทำคืออะไร
    choices:
      - text: ตรวจดูองค์ประกอบของ cohort นั้น (เช่น ช่องทางสมัคร) ก่อนสรุปว่าเป็นปัญหาของช่วงเวลานั้นเอง
        correct: true
        why: ถูกต้อง — ตัวอย่างในบทนี้แสดงให้เห็นว่าปัญหาจริงอยู่ที่องค์ประกอบของ cohort ไม่ใช่ตัวเดือนเอง
      - text: ลบข้อมูล cohort นั้นออกเพราะน่าจะเป็นข้อมูลผิดพลาด
        why: ไม่ควรลบข้อมูลโดยไม่ตรวจสอบสาเหตุก่อน
      - text: สรุปทันทีว่าเดือนนั้นเป็นเดือนที่ลูกค้าไม่ดี
        why: การรีบสรุปแบบนี้คือ pitfall ที่บทนี้เตือนไว้โดยตรง
      - text: ไม่ต้องทำอะไร เพราะ retention ผันผวนเป็นปกติอยู่แล้ว
        why: ความต่างขนาดนี้ (21% เทียบ ~50%) ควรค่าแก่การสืบสาเหตุ ไม่ใช่มองข้าม
  - id: q4
    question: แคมเปญที่ดึงคนเข้ามาเยอะแต่ retention ต่ำ บอกอะไรเกี่ยวกับคุณภาพของแคมเปญนั้น
    choices:
      - text: อาจได้ลูกค้าปริมาณเยอะแต่คุณภาพต่ำ (ขาจรที่ไม่กลับมาซื้อซ้ำ) ต้องชั่งน้ำหนักระหว่างปริมาณกับคุณภาพ
        correct: true
        why: ถูกต้อง — ตรงกับ pattern ของช่องทาง promo ในตัวอย่างบทนี้
      - text: แคมเปญนั้นล้มเหลวโดยสิ้นเชิง ไม่มีประโยชน์เลย
        why: อาจยังมีประโยชน์ด้านอื่น (เช่น brand awareness) แค่ต้องประเมินให้ครบมิติ ไม่ใช่ตัดสินจาก retention อย่างเดียว
      - text: จำนวนลูกค้าใหม่สำคัญกว่า retention เสมอ
        why: ทั้งสองสำคัญคู่กัน ไม่ควรมองข้ามด้านใดด้านหนึ่ง
      - text: retention ต่ำเกิดจากปัญหาสินค้า ไม่เกี่ยวกับแคมเปญ
        why: ในกรณีนี้ retention ต่ำสัมพันธ์ชัดเจนกับช่องทางที่มา ไม่ใช่ตัวสินค้า
  - id: q5
    question: ทำไมควรดู retention แยกตามช่องทางสมัคร ไม่ใช่แค่ดูรวม
    choices:
      - text: ตัวเลขรวมอาจกลบปัญหาของช่องทางที่แย่ไว้ด้วยช่องทางที่ดี ทำให้มองไม่เห็นจุดที่ควรแก้
        correct: true
        why: ถูกต้อง — เหมือนหลักการเดียวกับการแบ่ง funnel ตาม segment ในบทก่อน
      - text: เพราะแต่ละช่องทางมีจำนวนลูกค้าเท่ากันเสมอ
        why: ไม่จริง จำนวนลูกค้าต่อช่องทางต่างกันมาก (organic เยอะสุด, promo น้อยสุด)
      - text: การแยกตามช่องทางไม่มีผลต่อการตัดสินใจใดๆ
        why: มีผลโดยตรงต่อการตัดสินใจจัดสรรงบการตลาด
      - text: retention รวมมักแม่นยำกว่าแยกตามช่องทางเสมอ
        why: ตรงข้าม การแยกตามช่องทางให้ข้อมูลที่ละเอียดและนำไปใช้ได้มากกว่า

summary:
  - cohort คือกลุ่มลูกค้าที่สมัครในช่วงเวลาเดียวกัน ใช้เปรียบเทียบพฤติกรรมข้ามช่วงเวลาได้
  - retention ต่ำผิดปกติของ cohort หนึ่ง มักมีสาเหตุจากองค์ประกอบของ cohort นั้น (เช่น ช่องทางสมัคร) ไม่ใช่ตัวช่วงเวลาเอง
  - "cohort มิ.ย. 2025 retention ต่ำเพราะ 70.59% มาจากช่องทาง promo (เทียบกับ 9.09% โดยรวม) — promo channel มี retention ต่ำสุดในทุกช่องทาง (10.33%)"

interview:
  - id: i1
    q: เจอ cohort หนึ่งมี retention ต่ำกว่าปกติมาก จะสืบสาเหตุยังไง
    a: |
      เริ่มจากตรวจสอบองค์ประกอบของ cohort นั้นก่อน เช่น ช่องทางสมัคร กลุ่มอายุ พื้นที่ หรือแคมเปญที่พาเข้ามา
      แล้วเทียบสัดส่วนกับภาพรวมทั้งหมดว่าต่างกันชัดเจนไหม ถ้าพบว่า cohort นั้นมีองค์ประกอบเฉพาะที่ต่างจากปกติ
      (เช่น ส่วนใหญ่มาจากแคมเปญเดียว) ให้ตรวจ retention ของแต่ละองค์ประกอบแยกกันเพื่อยืนยันว่าปัญหาจริงๆ อยู่ตรงไหน
  - id: i2
    q: ทีมการตลาดอยากรู้ว่าแคมเปญ promo คุ้มไหม จะตอบยังไงโดยใช้ทั้งจำนวนลูกค้าใหม่และ retention ประกอบกัน
    a: |
      ต้องดูสองด้านคู่กัน: (1) แคมเปญพาลูกค้าใหม่เข้ามาได้เท่าไร (ในกรณีนี้ 300 คน เป็นสัดส่วนใหญ่ของ cohort มิ.ย.)
      (2) ลูกค้ากลุ่มนั้นกลับมาซื้อซ้ำมากแค่ไหน (promo channel มี retention แค่ 10.33% ต่ำที่สุดในทุกช่องทาง) แล้วเทียบ
      ต้นทุนแคมเปญกับมูลค่าที่ได้จากลูกค้ากลุ่มนี้ในระยะยาว — ถ้าต้นทุนสูงแต่ลูกค้าส่วนใหญ่ไม่กลับมาซื้อซ้ำเลย
      แคมเปญนี้อาจไม่คุ้มในระยะยาวแม้จะได้ลูกค้าใหม่เยอะในระยะสั้น

flashcards:
