goals:
  - นิยาม cohort (กลุ่มลูกค้าตามเดือนที่สมัคร) และ retention
  - อ่านค่า retention ที่ต่ำผิดปกติแล้วสืบสาเหตุถึงต้นตอ
  - เชื่อมโยง cohort กับคุณภาพของช่องทางที่พาลูกค้าเข้ามา

examples:
  - id: x1
    title: cohort ตามเดือนสมัคร มี retention ต่างกันแค่ไหน
    lang: python
    prompt: |
      อยากรู้ว่าลูกค้าที่สมัครในแต่ละเดือนของปี 2025 กลับมาซื้อซ้ำมากน้อยแค่ไหน
    steps:
      - text: |
          แบ่งลูกค้าเป็น cohort ตามเดือนที่สมัคร (signup_date) แล้วหา retention (สั่งซื้อตั้งแต่ 2 ครั้งขึ้นไป นับทุกสถานะ)
        code: |
          import pandas as pd

          customers = pd.read_csv("data/customers.csv")
          orders = pd.read_csv("data/orders.csv")
          c = customers.assign(cohort=lambda d: d.signup_date.str[:7])
          k = orders.groupby('customer_id').size().rename('n_orders')
          merged = c.merge(k, on='customer_id', how='left').fillna({'n_orders': 0})
          cohort_repeat = merged.assign(repeat=lambda d: (d.n_orders >= 2).astype(int)).groupby('cohort')['repeat'].mean()
          round(cohort_repeat.loc[['2025-05', '2025-06', '2025-07']] * 100, 2)
      - text: |
          เห็นชัดว่า cohort เดือน มิ.ย. 2025 มี retention ต่ำกว่าเดือนข้างเคียงมาก (21.41% เทียบกับ ~50%)
        code: |
          import pandas as pd

          customers = pd.read_csv("data/customers.csv")
          orders = pd.read_csv("data/orders.csv")
          c = customers.assign(cohort=lambda d: d.signup_date.str[:7])
          k = orders.groupby('customer_id').size().rename('n_orders')
          merged = c.merge(k, on='customer_id', how='left').fillna({'n_orders': 0})
          cohort_repeat = merged.assign(repeat=lambda d: (d.n_orders >= 2).astype(int)).groupby('cohort')['repeat'].mean()
          round(cohort_repeat.loc['2025-06'] * 100, 2)
    pitfall:
      text: |
        เจอ cohort หนึ่งมี retention ต่ำผิดปกติแล้วสรุปทันทีว่า "เดือนนั้นเป็นเดือนที่แย่" โดยไม่ตรวจสอบองค์ประกอบของ
        cohort นั้นก่อน — ในตัวอย่างนี้ปัญหาไม่ได้อยู่ที่ตัวเดือน มิ.ย. เอง แต่อยู่ที่องค์ประกอบของคนที่สมัครเดือนนั้น
        (ดูตัวอย่างถัดไป)
  - id: x2
    title: สืบสาเหตุ — cohort มิ.ย. มีองค์ประกอบต่างจากปกติ
    lang: python
    prompt: |
      ทำไม cohort มิ.ย. 2025 ถึง retention ต่ำผิดปกติ
    steps:
      - text: |
          เช็คสัดส่วนช่องทางสมัคร (channel) ของคนที่สมัครเดือน มิ.ย. 2025 เทียบกับภาพรวมทั้งหมด
        code: |
          import pandas as pd

          customers = pd.read_csv("data/customers.csv")
          c = customers.assign(cohort=lambda d: d.signup_date.str[:7])
          june = c[c['cohort'] == '2025-06']
          pct_promo_june = round((june['channel'] == 'promo').mean() * 100, 2)
          pct_promo_overall = round((customers['channel'] == 'promo').mean() * 100, 2)
          pct_promo_june, pct_promo_overall
      - text: |
          70.59% ของคนที่สมัครเดือน มิ.ย. มาจากช่องทาง promo (เทียบกับแค่ 9.09% โดยรวม) — cohort นี้ retention ต่ำ
          เพราะองค์ประกอบเป็นลูกค้าจากแคมเปญ promo เป็นส่วนใหญ่ ไม่ใช่เพราะเป็นเดือน มิ.ย. โดยตัวมันเอง
        code: |
          import pandas as pd

          customers = pd.read_csv("data/customers.csv")
          orders = pd.read_csv("data/orders.csv")
          k = orders.groupby('customer_id').size().rename('n_orders')
          merged = customers.merge(k, on='customer_id', how='left').fillna({'n_orders': 0})
          by_channel = merged.assign(repeat=lambda d: (d.n_orders >= 2).astype(int)).groupby('channel')['repeat'].mean()
          round(by_channel.loc['promo'] * 100, 2)
    pitfall:
      text: |
        การรีบสรุปว่า "เดือน มิ.ย. เป็นเดือนที่ลูกค้าไม่ค่อยกลับมาซื้อซ้ำ" โดยไม่เช็คว่าคนที่สมัครเดือนนั้นมาจากไหน
        อาจทำให้ทีมพลาดประเด็นจริง (คุณภาพของแคมเปญ promo) ไปเลย

