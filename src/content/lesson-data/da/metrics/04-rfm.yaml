  - id: e5
    level: applied
    lang: python
    prompt: |
      สร้างตาราง RFM แบบเต็ม (คอลัมน์ recency, frequency, monetary, r_score, f_score, m_score, rfm_score)
      เก็บไว้ในตัวแปร result — ใช้ pipeline เดียวกับตัวอย่าง x1/x2 เป๊ะ
    starter: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      result = ___
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      snapshot = pd.Timestamp('2026-01-01')
      orders_dt = orders.copy()
      orders_dt['order_date'] = pd.to_datetime(orders_dt['order_date'])
      comp = orders_dt[orders_dt['status'] == 'completed']
      rev = order_items.merge(orders, on='order_id')
      rev = rev[rev['status'] == 'completed'].assign(line=lambda d: d.quantity * d.unit_price)
      rfm_r = (snapshot - comp.groupby('customer_id')['order_date'].max()).dt.days.rename('recency')
      rfm_f = comp.groupby('customer_id').size().rename('frequency')
      rfm_m = rev.groupby('customer_id')['line'].sum().rename('monetary')
      result = pd.concat([rfm_r, rfm_f, rfm_m], axis=1).dropna()
      result['r_score'] = pd.qcut(result['recency'], 4, labels=[4, 3, 2, 1]).astype(int)
      result['f_score'] = pd.qcut(result['frequency'].rank(method='first'), 4, labels=[1, 2, 3, 4]).astype(int)
      result['m_score'] = pd.qcut(result['monetary'], 4, labels=[1, 2, 3, 4]).astype(int)
      result['rfm_score'] = result['r_score'] + result['f_score'] + result['m_score']
    check: |
      check_df(result, _sol["result"])
    hints:
      - ทำตามขั้นตอนในตัวอย่าง x1 แล้ว x2 ต่อกันให้ครบ
