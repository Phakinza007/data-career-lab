goals:
  - เข้าใจ Recency, Frequency, Monetary และทำไมสามตัวนี้บอกอะไรที่ยอดขายรวมบอกไม่ได้
  - ให้คะแนนลูกค้าแต่ละมิติด้วย quartile (qcut)
  - นิยาม segment (Champions, At Risk, Lost) และแนวทางทำกับแต่ละกลุ่ม

examples:
  - id: x1
    title: สร้างตาราง RFM
    lang: python
    prompt: |
      อยากจัดกลุ่มลูกค้าตามพฤติกรรมการซื้อ ไม่ใช่แค่ดูยอดขายรวมของแต่ละคน
    steps:
      - text: |
          คำนวณ recency (จำนวนวันตั้งแต่ซื้อครั้งล่าสุด), frequency (จำนวนออเดอร์ completed), monetary (รายได้รวม)
          ของลูกค้าแต่ละคน — กำหนด snapshot วันที่คงที่ (2026-01-01) เพื่อให้ผลลัพธ์เหมือนเดิมทุกครั้งที่รัน
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")
          snapshot = pd.Timestamp('2026-01-01')
          orders_dt = orders.copy()
          orders_dt['order_date'] = pd.to_datetime(orders_dt['order_date'])
          comp = orders_dt[orders_dt['status'] == 'completed']
          rev = order_items.merge(orders, on='order_id')
          rev = rev[rev['status'] == 'completed'].assign(line=lambda d: d.quantity * d.unit_price)
          rfm_r = (snapshot - comp.groupby('customer_id')['order_date'].max()).dt.days.rename('recency')
          rfm_f = comp.groupby('customer_id').size().rename('frequency')
          rfm_m = rev.groupby('customer_id')['line'].sum().rename('monetary')
          rfm = pd.concat([rfm_r, rfm_f, rfm_m], axis=1).dropna()
          rfm[['recency', 'frequency', 'monetary']].mean().round(2)
      - text: |
          ดูภาพรวมของตาราง RFM ที่ได้ — มีลูกค้า 2707 คน ที่เคยซื้อสำเร็จอย่างน้อย 1 ครั้ง
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")
          snapshot = pd.Timestamp('2026-01-01')
          orders_dt = orders.copy()
          orders_dt['order_date'] = pd.to_datetime(orders_dt['order_date'])
          comp = orders_dt[orders_dt['status'] == 'completed']
          rev = order_items.merge(orders, on='order_id')
          rev = rev[rev['status'] == 'completed'].assign(line=lambda d: d.quantity * d.unit_price)
          rfm_r = (snapshot - comp.groupby('customer_id')['order_date'].max()).dt.days.rename('recency')
          rfm_f = comp.groupby('customer_id').size().rename('frequency')
          rfm_m = rev.groupby('customer_id')['line'].sum().rename('monetary')
          rfm = pd.concat([rfm_r, rfm_f, rfm_m], axis=1).dropna()
          len(rfm)
    pitfall:
      text: |
        ใช้ `pd.Timestamp.now()` เป็น snapshot date แทนที่จะกำหนดวันที่คงที่ — ทำให้ค่า recency (และคะแนนทุกอย่างที่
        คำนวณต่อจากนั้น) เปลี่ยนไปทุกครั้งที่รันโค้ด ทำให้ผลลัพธ์ไม่ reproducible และตรวจคำตอบไม่ได้เลย
  - id: x2
    title: ให้คะแนนด้วย quartile แล้วรวมเป็น RFM score
    lang: python
    prompt: |
      อยากแปลง recency/frequency/monetary ให้เป็นคะแนนเทียบกันได้ (1-4) แล้วรวมเป็นคะแนนเดียว
    steps:
      - text: |
          แบ่งแต่ละมิติเป็น 4 กลุ่มเท่าๆ กันด้วย qcut — recency ยิ่งน้อยยิ่งดี (labels กลับด้าน) ส่วน frequency/monetary
          ยิ่งมากยิ่งดี
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")
          snapshot = pd.Timestamp('2026-01-01')
          orders_dt = orders.copy()
          orders_dt['order_date'] = pd.to_datetime(orders_dt['order_date'])
          comp = orders_dt[orders_dt['status'] == 'completed']
          rev = order_items.merge(orders, on='order_id')
          rev = rev[rev['status'] == 'completed'].assign(line=lambda d: d.quantity * d.unit_price)
          rfm_r = (snapshot - comp.groupby('customer_id')['order_date'].max()).dt.days.rename('recency')
          rfm_f = comp.groupby('customer_id').size().rename('frequency')
          rfm_m = rev.groupby('customer_id')['line'].sum().rename('monetary')
          rfm = pd.concat([rfm_r, rfm_f, rfm_m], axis=1).dropna()
          rfm['r_score'] = pd.qcut(rfm['recency'], 4, labels=[4, 3, 2, 1]).astype(int)
          rfm['f_score'] = pd.qcut(rfm['frequency'].rank(method='first'), 4, labels=[1, 2, 3, 4]).astype(int)
          rfm['m_score'] = pd.qcut(rfm['monetary'], 4, labels=[1, 2, 3, 4]).astype(int)
          rfm[['r_score', 'f_score', 'm_score']].head()
      - text: |
          รวมสามคะแนนเป็น rfm_score (ตั้งแต่ 3 ถึง 12) — ค่าเฉลี่ยของทั้งร้านอยู่ที่ 7.5
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")
          snapshot = pd.Timestamp('2026-01-01')
          orders_dt = orders.copy()
          orders_dt['order_date'] = pd.to_datetime(orders_dt['order_date'])
          comp = orders_dt[orders_dt['status'] == 'completed']
          rev = order_items.merge(orders, on='order_id')
          rev = rev[rev['status'] == 'completed'].assign(line=lambda d: d.quantity * d.unit_price)
          rfm_r = (snapshot - comp.groupby('customer_id')['order_date'].max()).dt.days.rename('recency')
          rfm_f = comp.groupby('customer_id').size().rename('frequency')
          rfm_m = rev.groupby('customer_id')['line'].sum().rename('monetary')
          rfm = pd.concat([rfm_r, rfm_f, rfm_m], axis=1).dropna()
          rfm['r_score'] = pd.qcut(rfm['recency'], 4, labels=[4, 3, 2, 1]).astype(int)
          rfm['f_score'] = pd.qcut(rfm['frequency'].rank(method='first'), 4, labels=[1, 2, 3, 4]).astype(int)
          rfm['m_score'] = pd.qcut(rfm['monetary'], 4, labels=[1, 2, 3, 4]).astype(int)
          rfm['rfm_score'] = rfm['r_score'] + rfm['f_score'] + rfm['m_score']
          round(rfm['rfm_score'].mean(), 2)
    pitfall:
      text: |
        ใช้ `pd.qcut(rfm['frequency'], 4, ...)` ตรงๆ โดยไม่ผ่าน `.rank(method='first')` ก่อน — จะได้ error
        `ValueError: Bin edges must be unique` เพราะ frequency มีแค่ 12 ค่าที่ต่างกันและซ้ำกันเยอะมาก
        (เช่นลูกค้าหลายร้อยคนซื้อแค่ 1 ครั้งเท่ากันหมด) ทำให้แบ่ง 4 กลุ่มเท่าๆ กันตรงๆ ไม่ได้ ต้อง rank ก่อนเพื่อ
        กระจายค่าที่ซ้ำกันให้ตัดกลุ่มได้

