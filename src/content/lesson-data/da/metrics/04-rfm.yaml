goals:
  - สร้างตาราง RFM ระดับลูกค้า (recency, frequency, monetary) จากตารางออเดอร์
  - ให้คะแนน 1–4 ด้วย pd.qcut และรู้ว่าเมื่อไหร่ที่ qcut ใช้ไม่ได้ ต้องกำหนดเกณฑ์เอง
  - แปลงคะแนนเป็นกลุ่มลูกค้าที่เสนอ action ต่อได้ และอ่านตารางกลุ่มให้เป็นข้อเสนอเชิงธุรกิจ

examples:
  - id: x1
    title: สร้างตาราง RFM ระดับลูกค้า
    lang: python
    prompt: |
      ทีมการตลาดมีงบทำแคมเปญจำกัด อยากรู้ว่าควรคุยกับลูกค้ากลุ่มไหนก่อน
      เริ่มจากสร้างตารางพฤติกรรมการซื้อของลูกค้าแต่ละคนก่อน
    steps:
      - text: |
          เตรียมตารางยอดขายระดับรายการสินค้า (merge order_items กับ orders แล้วกรองเฉพาะ completed
          ตามนิยามรายได้ของเว็บนี้)
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
          items = pd.read_csv("data/order_items.csv")
          items['line'] = items['quantity'] * items['unit_price']
          sales = items.merge(orders, on='order_id')
          sales = sales[sales['status'] == 'completed']
          sales.head()
      - text: |
          สรุปเป็นระดับลูกค้า — recency นับจากวันที่ล่าสุดในระบบ (31 ธ.ค. 2025) เพราะข้อมูลชุดนี้ไม่มี "วันนี้" จริง
          ส่วน frequency ต้องใช้ `'nunique'` กับ order_id เพราะหลัง merge หนึ่งแถวคือหนึ่งรายการสินค้า
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
          items = pd.read_csv("data/order_items.csv")
          items['line'] = items['quantity'] * items['unit_price']
          sales = items.merge(orders, on='order_id')
          sales = sales[sales['status'] == 'completed']

          asof = pd.Timestamp('2025-12-31')
          rfm = sales.groupby('customer_id').agg(
              recency=('order_date', lambda s: (asof - s.max()).days),
              frequency=('order_id', 'nunique'),
              monetary=('line', 'sum'),
          )
          rfm.describe()
    pitfall:
      text: |
        ถ้าใช้ `'size'` แทน `'nunique'` ในการนับ frequency จะได้จำนวน **รายการสินค้า** ไม่ใช่จำนวนออเดอร์
        (ลูกค้าที่ซื้อออเดอร์เดียวแต่มี 3 ชิ้นจะกลายเป็น frequency = 3) โค้ดรันผ่านปกติ
        แต่คะแนน F ของทุกคนเพี้ยนไปหมด — เป็นกับดักเดียวกับ `COUNT(*)` หลัง JOIN ในบทที่ 1
      code: |
        import pandas as pd

        orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
        items = pd.read_csv("data/order_items.csv")
        sales = items.merge(orders, on='order_id')
        sales = sales[sales['status'] == 'completed']

        wrong = sales.groupby('customer_id').agg(frequency_wrong=('order_id', 'size'))
        right = sales.groupby('customer_id').agg(frequency=('order_id', 'nunique'))
        wrong.join(right).head(10)
  - id: x2
    title: ให้คะแนน R และเจอทางตันของ qcut ที่ F
    lang: python
    prompt: |
      ต่อจากตาราง RFM — แปลงค่าดิบเป็นคะแนน 1–4 เพื่อให้เทียบข้ามมิติกันได้
    steps:
      - text: |
          `pd.qcut(x, 4, labels=[4, 3, 2, 1])` แบ่งเป็น 4 กลุ่มเท่าๆ กันตามควอไทล์
          — สังเกตว่า labels ของ R กลับหัว เพราะ recency น้อย (เพิ่งซื้อ) ต้องได้คะแนนสูง
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
          items = pd.read_csv("data/order_items.csv")
          items['line'] = items['quantity'] * items['unit_price']
          sales = items.merge(orders, on='order_id')
          sales = sales[sales['status'] == 'completed']
          asof = pd.Timestamp('2025-12-31')
          rfm = sales.groupby('customer_id').agg(
              recency=('order_date', lambda s: (asof - s.max()).days),
              frequency=('order_id', 'nunique'),
              monetary=('line', 'sum'),
          )

          rfm['R'] = pd.qcut(rfm['recency'], 4, labels=[4, 3, 2, 1]).astype(int)
          rfm['M'] = pd.qcut(rfm['monetary'], 4, labels=[1, 2, 3, 4]).astype(int)
          rfm[['R', 'M']].apply(pd.Series.value_counts)
      - text: |
          `frequency` ใช้ qcut ไม่ได้เพราะค่าซ้ำกันเยอะเกินไป (ลูกค้า 1,181 คนจาก 2,707 คนซื้อครั้งเดียว)
          ทางออกที่อธิบายให้ทีมธุรกิจฟังได้คือกำหนดเกณฑ์เองตามจำนวนครั้ง
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
          items = pd.read_csv("data/order_items.csv")
          items['line'] = items['quantity'] * items['unit_price']
          sales = items.merge(orders, on='order_id')
          sales = sales[sales['status'] == 'completed']
          asof = pd.Timestamp('2025-12-31')
          rfm = sales.groupby('customer_id').agg(
              recency=('order_date', lambda s: (asof - s.max()).days),
              frequency=('order_id', 'nunique'),
              monetary=('line', 'sum'),
          )

          def score_frequency(n):
              if n == 1:
                  return 1
              if n == 2:
                  return 2
              if n == 3:
                  return 3
              return 4

          rfm['F'] = rfm['frequency'].apply(score_frequency)
          rfm['F'].value_counts().sort_index()
    pitfall:
      text: |
        ทางลัดที่เห็นบ่อยเวลา qcut ฟ้อง "Bin edges must be unique" คือใส่ `.rank(method='first')` ก่อน
        โค้ดด้านล่างรันผ่านและได้ 4 กลุ่มขนาดเท่ากันเป๊ะจริง แต่ลูกค้าที่ซื้อ 1 ครั้งเท่ากันทุกประการ
        กลับได้คะแนนต่างกัน (บางคน 1 บางคน 2) เพราะถูกแบ่งตามลำดับแถวในตาราง
        เวลาทีมการตลาดถามว่าทำไมสองคนนี้คะแนนไม่เท่ากันจะตอบไม่ได้เลย
      code: |
        import pandas as pd

        orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
        items = pd.read_csv("data/order_items.csv")
        sales = items.merge(orders, on='order_id')
        sales = sales[sales['status'] == 'completed']
        rfm = sales.groupby('customer_id').agg(frequency=('order_id', 'nunique'))

        rfm['F_rank'] = pd.qcut(rfm['frequency'].rank(method='first'), 4, labels=[1, 2, 3, 4]).astype(int)
        rfm[rfm['frequency'] == 1]['F_rank'].value_counts().sort_index()

