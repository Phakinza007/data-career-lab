  - id: e6
    level: applied
    lang: python
    prompt: |
      ตาราง RFM ที่มีคอลัมน์คะแนน R, F, M ครบ (R จาก qcut labels กลับหัว, F ตามเกณฑ์ของบทนี้,
      M จาก qcut ปกติ) แล้วนับจำนวนลูกค้าในแต่ละคะแนนรวม (R+F+M) เรียงตามคะแนนรวม
      เก็บ Series ไว้ในตัวแปร result
    starter: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      items = pd.read_csv("data/order_items.csv")
      result = ___
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      items = pd.read_csv("data/order_items.csv")
      items['line'] = items['quantity'] * items['unit_price']
      sales = items.merge(orders, on='order_id')
      sales = sales[sales['status'] == 'completed']
      asof = pd.Timestamp('2025-12-31')
      rfm = sales.groupby('customer_id').agg(
          recency=('order_date', lambda s: (asof - s.max()).days),
          frequency=('order_id', 'nunique'),
          monetary=('line', 'sum'),
      )
      rfm['R'] = pd.qcut(rfm['recency'], 4, labels=[4, 3, 2, 1]).astype(int)
      rfm['F'] = rfm['frequency'].apply(lambda n: n if n <= 3 else 4)
      rfm['M'] = pd.qcut(rfm['monetary'], 4, labels=[1, 2, 3, 4]).astype(int)
      result = (rfm['R'] + rfm['F'] + rfm['M']).value_counts().sort_index()
    check: |
      check_series(result, _sol["result"], ordered=True)
    hints:
      - ต่อยอดจากตาราง RFM ของข้อ e4
      - คะแนนรวมคือผลบวกของสามคอลัมน์ บวกกันตรงๆ ได้เลย
  - id: e7
    level: applied
    lang: python
    prompt: |
      จำนวนลูกค้าและรายได้รวมของแต่ละ segment (ใช้กติกาแบ่งกลุ่มของบทนี้)
      แสดงคอลัมน์ customers, revenue โดย index เป็นชื่อ segment เรียงตามรายได้จากมากไปน้อย
      เก็บ DataFrame ไว้ในตัวแปร result
    starter: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      items = pd.read_csv("data/order_items.csv")
      result = ___
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      items = pd.read_csv("data/order_items.csv")
      items['line'] = items['quantity'] * items['unit_price']
      sales = items.merge(orders, on='order_id')
      sales = sales[sales['status'] == 'completed']
      asof = pd.Timestamp('2025-12-31')
      rfm = sales.groupby('customer_id').agg(
          recency=('order_date', lambda s: (asof - s.max()).days),
          frequency=('order_id', 'nunique'),
          monetary=('line', 'sum'),
      )
      rfm['R'] = pd.qcut(rfm['recency'], 4, labels=[4, 3, 2, 1]).astype(int)
      rfm['F'] = rfm['frequency'].apply(lambda n: n if n <= 3 else 4)

      def segment(row):
          if row['R'] >= 4 and row['F'] >= 3:
              return 'champions'
          if row['R'] <= 2 and row['F'] >= 3:
              return 'at_risk'
          if row['R'] >= 3 and row['F'] == 1:
              return 'new_one_time'
          if row['R'] == 1 and row['F'] <= 2:
              return 'lost'
          return 'others'

      rfm['segment'] = rfm.apply(segment, axis=1)
      result = rfm.groupby('segment').agg(customers=('monetary', 'size'), revenue=('monetary', 'sum'))
      result = result.sort_values('revenue', ascending=False)
    check: |
      check_df(result, _sol["result"], ordered=True)
    hints:
      - "`.apply(ฟังก์ชัน, axis=1)` เรียกฟังก์ชันทีละแถว โดยรับแถวนั้นเป็น Series"
      - เงื่อนไขของกลุ่มต้องเรียงจากเฉพาะเจาะจงไปกว้าง เพราะ return ตัวแรกที่เข้าเงื่อนไขชนะ
  - id: e8
    level: applied
    lang: sql
    prompt: |
      ตาราง RFM ระดับลูกค้าด้วย SQL — แสดง customer_id, recency (จำนวนวันถึง 2025-12-31),
      frequency, monetary เฉพาะ 10 อันดับแรกที่ monetary สูงสุด เรียงจากมากไปน้อย
    starter: |
      -- เขียน SQL ตรงนี้
      SELECT ___
    solution: |
      SELECT o.customer_id,
             DATEDIFF('day', MAX(o.order_date), DATE '2025-12-31') AS recency,
             COUNT(DISTINCT o.order_id) AS frequency,
             SUM(li.quantity * li.unit_price) AS monetary
      FROM orders o
      JOIN order_items li ON li.order_id = o.order_id
      WHERE o.status = 'completed'
      GROUP BY 1
      ORDER BY monetary DESC
      LIMIT 10
    ordered: true
    hints:
      - "DATEDIFF('day', a, b) นับจำนวนวันจาก a ไป b"
      - อย่าลืมนับ frequency แบบไม่ซ้ำเพราะ join แล้วหนึ่งแถวคือหนึ่งรายการสินค้า
  - id: e9
    level: challenge
    lang: sql
    prompt: |
      ให้คะแนน R ด้วย `NTILE(4)` ใน SQL โดยเรียงจากลูกค้าที่เพิ่งซื้อล่าสุดไปหาเก่าสุด
      (ใช้ `ORDER BY last_order DESC, customer_id` เพื่อให้ผลคงที่เมื่อวันที่ซ้ำกัน)
      แล้วสรุปเป็น r_score, customers, revenue เรียงตาม r_score จาก 1 ถึง 4
      หมายเหตุ: `NTILE(4)` ให้กลุ่มที่ 1 กับแถวแรกสุดตามลำดับที่กำหนด ดังนั้นกลุ่ม 1 คือคนที่เพิ่งซื้อล่าสุด
    starter: |
      -- เขียน SQL ตรงนี้
      SELECT ___
    solution: |
      WITH per_customer AS (
        SELECT o.customer_id,
               MAX(o.order_date) AS last_order,
               SUM(li.quantity * li.unit_price) AS monetary
        FROM orders o
        JOIN order_items li ON li.order_id = o.order_id
        WHERE o.status = 'completed'
        GROUP BY 1
      ), scored AS (
        SELECT customer_id, monetary,
               NTILE(4) OVER (ORDER BY last_order DESC, customer_id) AS r_score
        FROM per_customer
      )
      SELECT r_score, COUNT(*) AS customers, SUM(monetary) AS revenue
      FROM scored
      GROUP BY 1
      ORDER BY r_score
    ordered: true
    hints:
      - สรุปข้อมูลระดับลูกค้าใน CTE ก่อน แล้วค่อยใช้ NTILE ใน CTE ถัดไป
      - "NTILE ต้องมี ORDER BY ที่ไม่กำกวม ไม่งั้นลูกค้าที่ค่าเท่ากันอาจตกคนละกลุ่มในแต่ละครั้งที่รัน"
  - id: e10
    level: challenge
    lang: python
    prompt: |
      ตารางสรุป segment แบบเต็ม — คอลัมน์ customers, revenue, rev_pct (สัดส่วนรายได้เป็นเปอร์เซ็นต์
      ปัด 1 ตำแหน่ง) และ avg_monetary (ปัดเป็นจำนวนเต็ม) เรียงตาม rev_pct จากมากไปน้อย
      เก็บ DataFrame ไว้ในตัวแปร result
    starter: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      items = pd.read_csv("data/order_items.csv")
      result = ___
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      items = pd.read_csv("data/order_items.csv")
      items['line'] = items['quantity'] * items['unit_price']
      sales = items.merge(orders, on='order_id')
      sales = sales[sales['status'] == 'completed']
      asof = pd.Timestamp('2025-12-31')
      rfm = sales.groupby('customer_id').agg(
          recency=('order_date', lambda s: (asof - s.max()).days),
          frequency=('order_id', 'nunique'),
          monetary=('line', 'sum'),
      )
      rfm['R'] = pd.qcut(rfm['recency'], 4, labels=[4, 3, 2, 1]).astype(int)
      rfm['F'] = rfm['frequency'].apply(lambda n: n if n <= 3 else 4)

      def segment(row):
          if row['R'] >= 4 and row['F'] >= 3:
              return 'champions'
          if row['R'] <= 2 and row['F'] >= 3:
              return 'at_risk'
          if row['R'] >= 3 and row['F'] == 1:
              return 'new_one_time'
          if row['R'] == 1 and row['F'] <= 2:
              return 'lost'
          return 'others'

      rfm['segment'] = rfm.apply(segment, axis=1)
      result = rfm.groupby('segment').agg(
          customers=('monetary', 'size'),
          revenue=('monetary', 'sum'),
          avg_monetary=('monetary', 'mean'),
      )
      result['rev_pct'] = (result['revenue'] / rfm['monetary'].sum() * 100).round(1)
      result['avg_monetary'] = result['avg_monetary'].round(0)
      result = result[['customers', 'revenue', 'rev_pct', 'avg_monetary']].sort_values('rev_pct', ascending=False)
    check: |
      check_df(result, _sol["result"], ordered=True)
    hints:
      - ต่อยอดจากข้อ e7 แล้วเพิ่มคอลัมน์ที่คำนวณจากผลรวมทั้งตาราง
      - สัดส่วนรายได้หารด้วยรายได้รวมของลูกค้าทุกคน ไม่ใช่รายได้ของ segment เอง

quiz:
  - id: q1
    question: ทำไม labels ของ pd.qcut สำหรับคะแนน R ต้องเป็น [4, 3, 2, 1]
    choices:
      - text: เพราะ recency น้อย (เพิ่งซื้อ) ต้องได้คะแนนสูง แต่ qcut เรียงกลุ่มจากค่าน้อยไปมาก
        correct: true
        why: ถ้าใส่ [1,2,3,4] ลูกค้าที่หายไปนานที่สุดจะได้คะแนนสูงสุด ซึ่งกลับหัวกับความหมายที่ต้องการ
      - text: เพราะ pandas ต้องการ labels เรียงจากมากไปน้อยเสมอ
        why: pandas รับได้ทั้งสองแบบ ขึ้นกับความหมายที่เราต้องการ
      - text: เพราะ recency เป็นค่าติดลบ
        why: recency เป็นจำนวนวันซึ่งเป็นค่าบวก
      - text: ไม่จำเป็น ใส่แบบไหนก็ได้ผลเหมือนกัน
        why: ใส่กลับด้านแล้วคะแนนทุกคนพลิกทันที และไม่มี error ให้เห็น จึงเป็นบั๊กที่จับยาก
  - id: q2
    question: qcut กับ frequency แล้วเจอ "Bin edges must be unique" เพราะอะไร
    choices:
      - text: เพราะลูกค้าซื้อครั้งเดียวมีมากถึง 43.6% ขอบควอไทล์สองขอบจึงตกที่ค่าเดียวกัน
        correct: true
        why: qcut ต้องการขอบที่แตกต่างกันเพื่อแบ่ง 4 กลุ่ม แต่ค่าซ้ำเยอะทำให้ขอบชนกัน
      - text: เพราะ frequency มีค่า NULL
        why: frequency ที่นับจาก groupby ไม่มี NULL
      - text: เพราะ frequency เป็นจำนวนเต็ม ใช้ qcut ไม่ได้
        why: qcut ใช้กับจำนวนเต็มได้ปกติ ถ้าค่ากระจายพอ ปัญหาอยู่ที่ค่าซ้ำเยอะเกินไป
      - text: เพราะข้อมูลมีน้อยเกินไป
        why: มีลูกค้า 2,707 คนซึ่งมากพอ ปัญหาคือการกระจายตัวของค่า ไม่ใช่จำนวนแถว
  - id: q3
    question: ทำไมการใช้ rank(method='first') ก่อน qcut ถึงไม่ใช่ทางแก้ที่ดีสำหรับ F
    choices:
      - text: เพราะลูกค้าที่ซื้อจำนวนครั้งเท่ากันจะได้คะแนนต่างกันตามลำดับแถว ซึ่งอธิบายให้ทีมธุรกิจฟังไม่ได้
        correct: true
        why: เกณฑ์ที่อธิบายไม่ได้ทำให้ทีมไม่เชื่อถือ segment และเอาไปใช้ตัดสินใจไม่ได้
      - text: เพราะ rank ทำให้โค้ดช้ามาก
        why: ความเร็วไม่ใช่ประเด็น
      - text: เพราะ rank ใช้กับจำนวนเต็มไม่ได้
        why: ใช้ได้ปกติ ปัญหาอยู่ที่ความหมายของผลลัพธ์
      - text: เพราะผลลัพธ์จะมีกลุ่มไม่เท่ากัน
        why: กลับกัน — rank ทำให้กลุ่มเท่ากันเป๊ะ แต่แลกมาด้วยเกณฑ์ที่อธิบายไม่ได้
  - id: q4
    question: จากตาราง segment ของบทนี้ ถ้ามีงบทำแคมเปญก้อนเดียว ควรเริ่มที่กลุ่มไหน
    choices:
      - text: at_risk เพราะมีแค่ 383 คนแต่เคยสร้างรายได้ 24.3% และเฉลี่ยต่อคนสูงเป็นอันดับสอง
        correct: true
        why: กลุ่มนี้รู้จักร้านดีและเคยพิสูจน์แล้วว่ายอมจ่าย การดึงกลับจึงคุ้มกว่าการหาลูกค้าใหม่
      - text: champions เพราะเป็นลูกค้าที่ดีที่สุด
        why: champions ซื้ออยู่แล้ว ส่วนลดที่ให้ไปมักเป็นกำไรที่หายไปเปล่าๆ (cannibalization)
      - text: new_one_time เพราะมีคนเยอะที่สุดรองจาก others
        why: กลุ่มนี้ใหญ่แต่มูลค่าต่อคนต่ำสุด เหมาะกับวิธีถูกๆ อย่างอีเมลอัตโนมัติมากกว่างบก้อนใหญ่
      - text: lost เพราะต้องรีบดึงกลับก่อนหายไปถาวร
        why: กลุ่มนี้หายไปนานและแทบไม่เคยซื้อซ้ำ โอกาสดึงกลับต่ำที่สุดเมื่อเทียบกับงบที่ใช้
  - id: q5
    question: ข้อใดคือข้อจำกัดสำคัญของคะแนน RFM
    choices:
      - text: เป็นภาพ ณ วันที่อ้างอิงเท่านั้น และคะแนนเป็นอันดับ ไม่ใช่ปริมาณที่เอามาคูณหารกันได้
        correct: true
        why: เปลี่ยนวันอ้างอิงคะแนนก็เปลี่ยนหมด และ R=4 ไม่ได้แปลว่าดีเป็นสองเท่าของ R=2
      - text: ต้องใช้ machine learning ถึงจะคำนวณได้
        why: RFM ใช้แค่ตารางออเดอร์กับการจัดกลุ่มพื้นฐาน ไม่ต้องมีโมเดล
      - text: ใช้ได้เฉพาะกับธุรกิจออนไลน์
        why: ใช้ได้กับธุรกิจไหนก็ได้ที่มีประวัติการซื้อ เพียงแต่ต้องปรับกรอบเวลาให้เข้ากับรอบการซื้อของธุรกิจนั้น
      - text: ต้องมีลูกค้าอย่างน้อยหนึ่งล้านคน
        why: ใช้กับฐานลูกค้าขนาดไหนก็ได้ ยิ่งเล็กยิ่งต้องระวังการแบ่งควอไทล์ที่กลุ่มเล็กเกินไป

summary:
  - RFM สรุปพฤติกรรมลูกค้าด้วย 3 มิติจากตารางออเดอร์ที่มีอยู่แล้ว ไม่ต้องใช้โมเดลอะไรซับซ้อน
  - qcut แบ่งควอไทล์ได้เฉพาะตอนค่ากระจายพอ ถ้าค่าซ้ำเยอะ (เช่น frequency) ให้กำหนดเกณฑ์เองที่อธิบายได้
  - คะแนนรวมใช้จัดอันดับ แต่กลุ่มที่เสนอ action ได้ต้องมาจากการรวม R กับ F ตามความหมาย

interview:
  - id: i1
    q: อธิบาย RFM และวิธีเอาไปใช้จริงกับทีมการตลาด
    a: |
      RFM แบ่งลูกค้าด้วยสามมิติจากประวัติการซื้อ — ซื้อล่าสุดเมื่อไหร่ (R) ซื้อมาแล้วกี่ครั้ง (F)
      และจ่ายไปเท่าไหร่ (M) — แล้วให้คะแนนแต่ละมิติเพื่อจัดกลุ่ม สิ่งที่ทำให้ RFM ใช้ได้จริงคือมันตอบคำถาม
      "ควรคุยกับใครก่อน" ด้วยภาษาที่ทีมการตลาดเข้าใจ เช่น กลุ่มที่เคยซื้อบ่อยแต่หายไปนาน (at_risk)
      คุ้มที่จะใช้งบดึงกลับ ส่วนกลุ่มที่ซื้ออยู่แล้วไม่ต้องให้ส่วนลด ข้อควรระวังคือคะแนนเป็นภาพ ณ วันอ้างอิง
      และต้องปรับกรอบเวลาให้เข้ากับรอบการซื้อของธุรกิจนั้นๆ
  - id: i2
    q: ทำไมถึงไม่ใช้คะแนนรวม RFM ตัวเดียวจัดอันดับลูกค้าแล้วจบ
    a: |
      เพราะคะแนนรวมที่เท่ากันมาจากพฤติกรรมคนละแบบได้ เช่น 8 คะแนนอาจเป็น R=4,F=2,M=2
      (เพิ่งซื้อครั้งแรก ยังไม่รู้ว่าจะอยู่ต่อไหม) หรือ R=1,F=4,M=3 (เคยเป็นลูกค้าชั้นดีที่หายไปแล้ว)
      สองคนนี้ต้องทำคนละอย่างกันคนละขั้ว คะแนนรวมจึงใช้เรียงลำดับความสำคัญได้ แต่ไม่พอสำหรับตัดสินใจว่าทำอะไร
      ต้องดูองค์ประกอบของคะแนนด้วยเสมอ

flashcards:
  - id: c1
    front: R, F, M ย่อมาจากอะไร
    back: Recency (ซื้อล่าสุดเมื่อไหร่) Frequency (ซื้อกี่ครั้ง) Monetary (จ่ายรวมเท่าไหร่)
  - id: c2
    front: ทำไม labels ของคะแนน R ต้องกลับหัว
    back: เพราะ recency น้อยแปลว่าเพิ่งซื้อ ต้องได้คะแนนสูง แต่ qcut เรียงกลุ่มจากค่าน้อยไปมาก
  - id: c3
    front: กลุ่ม at_risk คือใคร และควรทำอะไร
    back: ลูกค้าที่เคยซื้อบ่อยแต่หายไปนาน — คุ้มที่สุดที่จะใช้งบดึงกลับ เพราะเคยพิสูจน์แล้วว่ายอมจ่าย
