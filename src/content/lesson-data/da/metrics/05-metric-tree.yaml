goals:
  - แตกตัวชี้วัดใหญ่เป็นตัวคูณย่อย (metric tree) เพื่อบอกว่าการเปลี่ยนแปลงมาจากกิ่งไหน
  - ตรวจว่าค่าเฉลี่ยรวมที่เปลี่ยนไปเกิดจากกลุ่มย่อยเปลี่ยน หรือจากส่วนผสมของกลุ่มเปลี่ยน (mix shift)
  - แยก vanity metric ออกจากตัวชี้วัดที่ใช้ตัดสินใจได้ และรู้จัก north star / guardrail metric

examples:
  - id: x1
    title: รายได้โต 21% — มาจากกิ่งไหนของ metric tree
    lang: sql
    prompt: |
      ผู้บริหารเห็นว่ารายได้ปี 2025 โตขึ้นจากปี 2024 แล้วถามว่า "โตเพราะอะไร"
    steps:
      - text: |
          เริ่มจากวางตัวเลขของทั้งสองปีไว้ข้างกันก่อน — รายได้ ออเดอร์ AOV และจำนวนลูกค้าที่ซื้อ
        code: |
          SELECT EXTRACT(year FROM o.order_date) AS y,
                 SUM(li.quantity * li.unit_price) AS revenue,
                 COUNT(DISTINCT o.order_id) AS orders,
                 ROUND(SUM(li.quantity * li.unit_price) / COUNT(DISTINCT o.order_id), 2) AS aov,
                 COUNT(DISTINCT o.customer_id) AS customers
          FROM orders o
          JOIN order_items li ON li.order_id = o.order_id
          WHERE o.status = 'completed'
          GROUP BY 1
          ORDER BY 1
      - text: |
          เปลี่ยนเป็นอัตราการเติบโตของทุกกิ่งพร้อมกันด้วย `LAG()` — กิ่งที่โตผิดปกติคือคำตอบ
          ผลที่ได้: รายได้ +21.3% ออเดอร์ +21.2% แต่ AOV แทบไม่ขยับ (+0.03%)
        code: |
          WITH yearly AS (
            SELECT EXTRACT(year FROM o.order_date) AS y,
                   SUM(li.quantity * li.unit_price) AS revenue,
                   COUNT(DISTINCT o.order_id) AS orders,
                   SUM(li.quantity * li.unit_price) / COUNT(DISTINCT o.order_id) AS aov
            FROM orders o
            JOIN order_items li ON li.order_id = o.order_id
            WHERE o.status = 'completed'
            GROUP BY 1
          )
          SELECT y,
                 ROUND((revenue / LAG(revenue) OVER (ORDER BY y) - 1) * 100, 2) AS revenue_growth,
                 ROUND((orders / LAG(orders) OVER (ORDER BY y) - 1) * 100, 2) AS orders_growth,
                 ROUND((aov / LAG(aov) OVER (ORDER BY y) - 1) * 100, 2) AS aov_growth
          FROM yearly
          ORDER BY y
    pitfall:
      text: |
        ถ้าดูแค่ตัวเลขรายได้รวมแล้วสรุปว่า "ธุรกิจโต 21%" จะพลาดสิ่งที่สำคัญกว่า — ในข้อมูลชุดนี้
        จำนวนลูกค้าโตเร็วกว่าจำนวนออเดอร์ (31.5% เทียบกับ 21.2%) แปลว่าออเดอร์ต่อลูกค้าลดลงจาก 2.23
        เหลือ 2.05 การโตครั้งนี้จึงมาจากลูกค้าใหม่ล้วนๆ ไม่ใช่จากลูกค้าเดิมที่ซื้อมากขึ้น
        ซึ่งเป็นการเติบโตที่แพงกว่าและเปราะบางกว่ามาก
      code: |
        SELECT EXTRACT(year FROM o.order_date) AS y,
               COUNT(DISTINCT o.order_id) AS orders,
               COUNT(DISTINCT o.customer_id) AS customers,
               ROUND(COUNT(DISTINCT o.order_id) * 1.0 / COUNT(DISTINCT o.customer_id), 2) AS orders_per_customer
        FROM orders o
        WHERE o.status = 'completed'
        GROUP BY 1
        ORDER BY 1
  - id: x2
    title: retention รวมลดลง เพราะกลุ่มเดิมแย่ลงหรือเพราะส่วนผสมเปลี่ยน
    lang: sql
    prompt: |
      retention เดือนที่ 1 ของลูกค้าที่เริ่มซื้อปี 2025 ต่ำกว่าปี 2024 (20.2% เทียบกับ 24.4%)
      — ต้องตอบให้ได้ว่าเกิดจากอะไรก่อนจะเสนอให้ทีมไปแก้อะไร
    steps:
      - text: |
          ดูค่ารวมของแต่ละปีก่อน เพื่อยืนยันว่าตัวเลขที่ผู้บริหารเห็นถูกต้องจริง
        code: |
          WITH first_order AS (
            SELECT customer_id, DATE_TRUNC('month', MIN(order_date)) AS cohort_month
            FROM orders WHERE status = 'completed' GROUP BY 1
          ), activity AS (
            SELECT f.customer_id,
                   DATEDIFF('month', f.cohort_month, DATE_TRUNC('month', o.order_date)) AS month_no
            FROM orders o
            JOIN first_order f ON f.customer_id = o.customer_id
            WHERE o.status = 'completed'
          )
          SELECT EXTRACT(year FROM f.cohort_month) AS cohort_year,
                 COUNT(DISTINCT f.customer_id) AS customers,
                 ROUND(COUNT(DISTINCT CASE WHEN a.month_no = 1 THEN a.customer_id END) * 100.0
                       / COUNT(DISTINCT f.customer_id), 1) AS m1_pct
          FROM first_order f
          LEFT JOIN activity a ON a.customer_id = f.customer_id
          GROUP BY 1
          ORDER BY 1
      - text: |
          แยกตามช่องทางที่ลูกค้าเข้ามา จะเห็นว่าช่องทาง `ads` ดีขึ้นด้วยซ้ำ (22.4% → 22.6%)
          และตัวที่ดึงค่ารวมลงคือช่องทาง `promo` ที่เพิ่งมีในปี 2025 และ retention แค่ 7.3%
        code: |
          WITH first_order AS (
            SELECT customer_id, DATE_TRUNC('month', MIN(order_date)) AS cohort_month
            FROM orders WHERE status = 'completed' GROUP BY 1
          ), activity AS (
            SELECT f.customer_id,
                   DATEDIFF('month', f.cohort_month, DATE_TRUNC('month', o.order_date)) AS month_no
            FROM orders o
            JOIN first_order f ON f.customer_id = o.customer_id
            WHERE o.status = 'completed'
          )
          SELECT EXTRACT(year FROM f.cohort_month) AS cohort_year, c.channel,
                 COUNT(DISTINCT f.customer_id) AS customers,
                 ROUND(COUNT(DISTINCT CASE WHEN a.month_no = 1 THEN a.customer_id END) * 100.0
                       / COUNT(DISTINCT f.customer_id), 1) AS m1_pct
          FROM first_order f
          JOIN customers c ON c.customer_id = f.customer_id
          LEFT JOIN activity a ON a.customer_id = f.customer_id
          GROUP BY 1, 2
          ORDER BY c.channel, cohort_year
    pitfall:
      text: |
        ถ้าสรุปจากค่ารวมว่า "คุณภาพลูกค้าแย่ลง 4.2 จุด" แล้วส่งทีมไปไล่ปรับปรุงช่องทาง organic
        จะเป็นการแก้ปัญหาที่ไม่มีอยู่จริง — ตัดลูกค้า `promo` ออกแล้วค่ารวมปี 2025 เป็น 22.5%
        (ลดลงจากปี 2024 แค่ราว 1.9 จุด) มากกว่าครึ่งของการลดลงมาจากส่วนผสมที่เปลี่ยน ไม่ใช่กลุ่มเดิมแย่ลง
      code: |
        WITH first_order AS (
          SELECT customer_id, DATE_TRUNC('month', MIN(order_date)) AS cohort_month
          FROM orders WHERE status = 'completed' GROUP BY 1
        ), activity AS (
          SELECT f.customer_id,
                 DATEDIFF('month', f.cohort_month, DATE_TRUNC('month', o.order_date)) AS month_no
          FROM orders o
          JOIN first_order f ON f.customer_id = o.customer_id
          WHERE o.status = 'completed'
        )
        SELECT COUNT(DISTINCT f.customer_id) AS customers,
               ROUND(COUNT(DISTINCT CASE WHEN a.month_no = 1 THEN a.customer_id END) * 100.0
                     / COUNT(DISTINCT f.customer_id), 1) AS m1_excl_promo
        FROM first_order f
        JOIN customers c ON c.customer_id = f.customer_id
        LEFT JOIN activity a ON a.customer_id = f.customer_id
        WHERE EXTRACT(year FROM f.cohort_month) = 2025 AND c.channel <> 'promo'

