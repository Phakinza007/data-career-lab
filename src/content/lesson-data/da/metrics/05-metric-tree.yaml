      FROM first_order f
      JOIN customers c ON c.customer_id = f.customer_id
      GROUP BY 1, 2
      ORDER BY 1, 2
    ordered: true
    hints:
      - หาวันที่ซื้อครั้งแรกของแต่ละคนก่อน แล้วค่อย join ข้อมูลช่องทาง
  - id: e5
    level: applied
    lang: sql
    prompt: |
      อัตราการเติบโตของทุกกิ่งใน metric tree แสดง y, revenue_growth, orders_growth, aov_growth
      (เปอร์เซ็นต์เทียบปีก่อนหน้า ปัด 2 ตำแหน่ง ปีแรกเป็น NULL) เรียงตามปี
    starter: |
      -- เขียน SQL ตรงนี้
      SELECT ___
    solution: |
      WITH yearly AS (
        SELECT EXTRACT(year FROM o.order_date) AS y,
               SUM(li.quantity * li.unit_price) AS revenue,
               COUNT(DISTINCT o.order_id) AS orders,
               SUM(li.quantity * li.unit_price) / COUNT(DISTINCT o.order_id) AS aov
        FROM orders o
        JOIN order_items li ON li.order_id = o.order_id
        WHERE o.status = 'completed'
        GROUP BY 1
      )
      SELECT y,
             ROUND((revenue / LAG(revenue) OVER (ORDER BY y) - 1) * 100, 2) AS revenue_growth,
             ROUND((orders / LAG(orders) OVER (ORDER BY y) - 1) * 100, 2) AS orders_growth,
             ROUND((aov / LAG(aov) OVER (ORDER BY y) - 1) * 100, 2) AS aov_growth
      FROM yearly
      ORDER BY y
    ordered: true
    hints:
      - สรุปตัวเลขระดับปีใน CTE ก่อน แล้วค่อยเทียบกับปีก่อนหน้าด้วย LAG
      - "(ค่าใหม่ / ค่าเก่า - 1) * 100 ให้ผลเดียวกับ (ใหม่ - เก่า) / เก่า * 100"
