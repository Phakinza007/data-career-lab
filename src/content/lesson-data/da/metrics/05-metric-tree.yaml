      แสดงคอลัมน์ customers, m1_pct (ปัด 1 ตำแหน่ง) แถวเดียว — เพื่อดูว่าถ้าไม่มีแคมเปญนั้นตัวเลขจะเป็นเท่าไหร่
    starter: |
      -- เขียน SQL ตรงนี้
      SELECT ___
    solution: |
      WITH first_order AS (
        SELECT customer_id, DATE_TRUNC('month', MIN(order_date)) AS cohort_month
