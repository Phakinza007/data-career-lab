  - id: e4
    level: basic
    lang: sql
    prompt: |
      จำนวนลูกค้าที่เริ่มซื้อในแต่ละปี แยกตามช่องทางที่สมัคร แสดง cohort_year, channel, customers
      เรียงตามปีแล้วตามช่องทาง
    starter: |
      -- เขียน SQL ตรงนี้
      SELECT ___
    solution: |
      WITH first_order AS (
        SELECT customer_id, MIN(order_date) AS first_day
        FROM orders WHERE status = 'completed' GROUP BY 1
      )
