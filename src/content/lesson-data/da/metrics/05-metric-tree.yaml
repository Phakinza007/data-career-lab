    hints:
      - กรองทั้งปีที่เริ่มซื้อและช่องทางใน WHERE เดียวกัน
      - ต่อยอดจากข้อ e6 ได้เลย
  - id: e9
    level: challenge
    lang: sql
    prompt: |
      รายได้ปี 2025 แยกว่ามาจากลูกค้าที่เริ่มซื้อปี 2025 (ลูกค้าใหม่) หรือลูกค้าที่เริ่มซื้อก่อนหน้านั้น
      แสดง customer_type ('new' / 'existing'), customers, revenue, revenue_pct (ปัด 1 ตำแหน่ง)
      เรียงตาม revenue จากมากไปน้อย
    starter: |
      -- เขียน SQL ตรงนี้
      SELECT ___
    solution: |
      WITH first_order AS (
        SELECT customer_id, MIN(order_date) AS first_day
        FROM orders WHERE status = 'completed' GROUP BY 1
      ), sales_2025 AS (
        SELECT o.customer_id,
               CASE WHEN EXTRACT(year FROM f.first_day) = 2025 THEN 'new' ELSE 'existing' END AS customer_type,
               li.quantity * li.unit_price AS line
        FROM orders o
        JOIN order_items li ON li.order_id = o.order_id
        JOIN first_order f ON f.customer_id = o.customer_id
        WHERE o.status = 'completed' AND EXTRACT(year FROM o.order_date) = 2025
      )
      SELECT customer_type,
             COUNT(DISTINCT customer_id) AS customers,
             SUM(line) AS revenue,
             ROUND(SUM(line) * 100.0 / SUM(SUM(line)) OVER (), 1) AS revenue_pct
      FROM sales_2025
      GROUP BY 1
      ORDER BY revenue DESC
    ordered: true
    hints:
      - ติดป้ายลูกค้าว่าใหม่หรือเก่าจากปีที่ซื้อครั้งแรก แล้วค่อยรวมยอดของปี 2025
      - "SUM(SUM(line)) OVER () คือผลรวมของทุกกลุ่ม ใช้เป็นตัวหารของสัดส่วนได้"

quiz:
  - id: q1
    question: metric tree มีประโยชน์ยังไงเวลาตัวเลขเปลี่ยน
    choices:
      - text: บอกว่าการเปลี่ยนแปลงมาจากกิ่งไหน (เช่น ออเดอร์หรือ AOV) แทนที่จะต้องเดาสุ่ม
        correct: true
        why: แตกตามสูตรก่อนเป็นขั้นแรกที่เร็วที่สุดในการหาสาเหตุ
      - text: ทำให้ตัวเลขแม่นยำขึ้น
        why: ความแม่นยำมาจากนิยามและข้อมูล ไม่ใช่จากการแตกกิ่ง
      - text: ใช้แทนการทำ A/B test ได้
        why: metric tree บอกว่าอะไรเปลี่ยน แต่ไม่ได้พิสูจน์ว่าอะไรเป็นสาเหตุ — การพิสูจน์เหตุผลยังต้องใช้การทดลอง
      - text: ทำให้ query เร็วขึ้น
        why: ไม่เกี่ยวกับประสิทธิภาพของ query
  - id: q2
    question: รายได้โต 21.3% ออเดอร์โต 21.2% แต่ AOV โต 0.03% ควรสรุปว่าอย่างไร
    choices:
      - text: การเติบโตมาจากจำนวนออเดอร์เกือบทั้งหมด ไม่ได้มาจากยอดต่อบิลที่สูงขึ้น
        correct: true
        why: เมื่อกิ่งหนึ่งนิ่งสนิท การเปลี่ยนแปลงทั้งหมดจึงมาจากอีกกิ่ง
      - text: ทั้งสองอย่างช่วยกันคนละครึ่ง
        why: AOV ขยับแค่ 0.03% ซึ่งแทบไม่มีผลต่อรายได้เลย
      - text: ข้อมูลผิด เพราะรายได้ต้องโตเท่ากับ AOV
        why: รายได้ = ออเดอร์ × AOV ดังนั้นรายได้โตได้จากกิ่งใดกิ่งหนึ่งหรือทั้งสองก็ได้
      - text: แปลว่าลูกค้าเดิมซื้อมากขึ้น
        why: ต้องดูจำนวนลูกค้าก่อน — ในข้อมูลนี้ลูกค้าโต 31.5% เร็วกว่าออเดอร์ แปลว่าออเดอร์ต่อลูกค้าลดลงด้วยซ้ำ
  - id: q3
    question: mix shift คืออะไร
    choices:
      - text: ค่าเฉลี่ยรวมเปลี่ยนเพราะสัดส่วนของกลุ่มย่อยเปลี่ยน แม้แต่ละกลุ่มแทบไม่เปลี่ยนเลย
        correct: true
        why: เช่นการมีลูกค้ากลุ่มใหม่ที่ retention ต่ำเข้ามา ทำให้ค่ารวมลดลงทั้งที่กลุ่มเดิมยังเหมือนเดิม
      - text: การที่ข้อมูลของสองตารางปนกันตอน JOIN
        why: นั่นเป็นปัญหาการ join ไม่ใช่ mix shift
      - text: การที่ตัวชี้วัดเปลี่ยนนิยามระหว่างทาง
        why: นั่นคือปัญหานิยามของตัวชี้วัด คนละเรื่องกับสัดส่วนของกลุ่ม
      - text: การที่ข้อมูลบางเดือนหายไป
        why: ข้อมูลขาดเป็นอีกปัญหาหนึ่ง ไม่ใช่ mix shift
  - id: q4
    question: ข้อใดเป็น vanity metric
    choices:
      - text: จำนวนผู้ใช้สะสมทั้งหมดตั้งแต่เปิดบริษัท
        correct: true
        why: มีแต่เพิ่มขึ้น ไม่มีวันลด ต่อให้ทุกคนเลิกใช้ไปแล้วก็ยังดูดีอยู่
      - text: retention เดือนที่ 1 ของแต่ละ cohort
        why: ลดลงได้ เทียบข้ามกลุ่มได้ และชี้ทางให้ทำอะไรต่อได้
      - text: conversion rate ของ funnel
        why: เป็นอัตราส่วนที่ลดลงได้และบอกจุดที่ต้องแก้
      - text: รายได้ต่อลูกค้า
        why: สะท้อนคุณภาพของลูกค้าจริงและลดลงได้เมื่อสถานการณ์แย่ลง
  - id: q5
    question: guardrail metric มีไว้ทำอะไร
    choices:
      - text: กันไม่ให้ทีมไล่ตัวชี้วัดหลักจนไปทำลายเรื่องอื่น เช่น ลดราคาหนักจนกำไรหาย
        correct: true
        why: guardrail คือสิ่งที่ต้องไม่แย่ลง แม้ตัวชี้วัดหลักจะดีขึ้นก็ตาม
      - text: ใช้แทน north star metric เมื่อคำนวณตัวหลักไม่ได้
        why: guardrail ใช้ควบคู่กับตัวหลัก ไม่ได้ใช้แทนกัน
      - text: ใช้วัดผลงานของทีม data โดยเฉพาะ
        why: guardrail วัดสุขภาพของธุรกิจ ไม่ใช่ผลงานของทีมใดทีมหนึ่ง
      - text: ใช้ตรวจว่าข้อมูลใน warehouse ถูกต้อง
        why: นั่นคือ data quality check ซึ่งเป็นคนละเรื่อง

summary:
  - metric tree แตกตัวชี้วัดใหญ่เป็นตัวคูณย่อย ทำให้บอกได้ว่าการเปลี่ยนแปลงมาจากกิ่งไหนและใครรับผิดชอบ
  - ค่าเฉลี่ยรวมที่เปลี่ยนอาจมาจาก mix shift (สัดส่วนกลุ่มเปลี่ยน) ไม่ใช่กลุ่มเดิมแย่ลง ต้องแยกดูเสมอ
  - vanity metric ขึ้นได้เรื่อยๆ โดยไม่บอกอะไร ส่วน north star ต้องมี guardrail กำกับไม่ให้ไล่ตัวเลขจนพังเรื่องอื่น

interview:
  - id: i1
    q: ผู้บริหารถามว่า "ทำไมรายได้เดือนนี้ตก" มีวิธีไล่หาคำตอบยังไง
    a: |
      ไล่สี่ชั้นตามลำดับ: (1) แตกตามสูตร — รายได้ = ออเดอร์ × AOV ดูว่ากิ่งไหนเปลี่ยน แล้วแตกต่อ
      (ออเดอร์ = ลูกค้า × ออเดอร์ต่อลูกค้า หรือ = session × conversion) (2) แตกตามกลุ่ม — ตกทุกกลุ่ม
      หรือเฉพาะบางช่องทาง/สินค้า/พื้นที่ (3) เช็คส่วนผสม — สัดส่วนของกลุ่มเปลี่ยนไปไหม เพราะค่ารวมอาจตก
      ทั้งที่ทุกกลุ่มย่อยเท่าเดิม (4) เช็คนิยามและข้อมูล — มีการเปลี่ยน tracking ระบบล่ม หรือข้อมูลบางส่วนยังไม่เข้าไหม
      ส่วนใหญ่คำตอบอยู่ในสามข้อแรก และข้อสี่คือสิ่งที่ต้องตัดออกให้ได้ก่อนจะเชื่อตัวเลขใดๆ
  - id: i2
    q: ทีมตั้ง north star metric เป็น "จำนวนออเดอร์ต่อเดือน" คิดว่ามีความเสี่ยงอะไร
    a: |
      เสี่ยงตรงที่จำนวนออเดอร์เพิ่มได้ด้วยวิธีที่ทำลายธุรกิจ เช่น ลดราคาหนักจนกำไรต่อออเดอร์หาย
      แจกส่วนลดให้ลูกค้าที่จะซื้ออยู่แล้ว หรือกระตุ้นให้แยกออเดอร์เป็นหลายใบ จึงควรมี guardrail กำกับ
      เช่น กำไรขั้นต้นต่อออเดอร์ อัตราคืนสินค้า และ retention ของลูกค้าใหม่ และถ้าเลือกได้
      ตัวชี้วัดหลักที่ดีกว่าคือตัวที่สะท้อนคุณค่าที่ลูกค้าได้รับจริง เช่น จำนวนลูกค้าที่ซื้อซ้ำต่อเดือน

flashcards:
  - id: c1
    front: metric tree คืออะไร
    back: การแตกตัวชี้วัดใหญ่เป็นตัวคูณย่อย เช่น รายได้ = ออเดอร์ × AOV เพื่อบอกว่าการเปลี่ยนแปลงมาจากกิ่งไหน
  - id: c2
    front: mix shift ทำให้เกิดอะไร
    back: ค่าเฉลี่ยรวมเปลี่ยนเพราะสัดส่วนกลุ่มเปลี่ยน แม้แต่ละกลุ่มแทบไม่เปลี่ยน — กรณีสุดขั้วคือ Simpson's paradox
  - id: c3
    front: north star metric กับ guardrail metric ต่างกันยังไง
    back: north star คือตัวชี้วัดหลักที่ทีมไล่ให้ขึ้น ส่วน guardrail คือตัวที่ต้องไม่แย่ลงระหว่างทาง
