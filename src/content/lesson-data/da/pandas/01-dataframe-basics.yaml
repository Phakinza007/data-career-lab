    front: sort_values ค่าเริ่มต้นเรียงแบบไหน
    back: น้อยไปมาก (ascending=True) ถ้าอยากได้มากไปน้อยต้องใส่ ascending=False
  - id: c2
    front: value_counts() ต่างจาก unique() ยังไง
    back: value_counts() นับจำนวนของแต่ละค่าด้วย unique() ให้แค่รายชื่อค่าที่ไม่ซ้ำ ไม่มีตัวเลข
