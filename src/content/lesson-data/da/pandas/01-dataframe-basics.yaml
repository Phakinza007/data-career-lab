goals:
  - อ่านข้อมูลด้วย read_csv และดูโครงสร้างเบื้องต้น (shape/columns/dtypes/head/describe)
  - เลือกคอลัมน์เดียวหรือหลายคอลัมน์ และเรียงด้วย sort_values
  - สำรวจคอลัมน์ข้อความด้วย value_counts/unique

examples:
  - id: x1
    title: 5 สินค้าราคาแพงที่สุด เรียงจากแพงไปถูก
    lang: python
    prompt: |
      ร้านอยากรู้ว่าสินค้าตัวไหนแพงที่สุด 5 อันดับแรก
    steps:
      - text: |
          อ่านไฟล์ด้วย `read_csv` แล้วดูตัวอย่างข้อมูลด้วย `.head()`
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          products.head()
      - text: |
          เรียงด้วย `sort_values('price', ascending=False)` แล้วตัดเอา 5 แถวแรกด้วย `.head(5)`
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          products.sort_values('price', ascending=False).head(5)[['product_name', 'price']]
    pitfall:
      text: |
        ถ้าลืมใส่ `ascending=False` ค่าเริ่มต้นของ `sort_values` คือเรียงจากน้อยไปมาก
        ผลที่ได้จะกลายเป็น 5 สินค้าที่**ถูกที่สุด** แทน — โค้ดรันได้ปกติไม่มี error แต่ตอบผิดคำถามไปเลย
      code: |
        import pandas as pd

        products = pd.read_csv("data/products.csv")
        products.sort_values('price').head(5)[['product_name', 'price']]
  - id: x2
    title: หมวดสินค้าไหนมีสินค้าเยอะที่สุด
    lang: python
    prompt: |
      ทีมสินค้าอยากรู้ว่าหมวดไหนมีสินค้าในสต็อกเยอะที่สุด
    steps:
      - text: |
          `.value_counts()` นับจำนวนแถวของแต่ละค่าที่ไม่ซ้ำในคอลัมน์ และเรียงจากมากไปน้อยให้อัตโนมัติ
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          products['category'].value_counts()
      - text: |
          ตัดเอาแค่ 3 อันดับแรกด้วย `.head(3)` (สังเกตว่า Electronics, Home, Fashion เท่ากันที่ 25 พอดี)
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          products['category'].value_counts().head(3)
    pitfall:
      text: |
        ถ้าใช้ `.unique()` แทน `.value_counts()` โดยคิดว่าจะบอกได้ว่าหมวดไหนเยอะที่สุด จะได้แค่รายชื่อหมวดที่มีอยู่
        เท่านั้น ไม่มีตัวเลขจำนวนติดมาด้วยเลย ตอบคำถามนี้ไม่ได้
      code: |
        import pandas as pd

        products = pd.read_csv("data/products.csv")
        products['category'].unique()

