goals:
  - เข้าใจความต่างของ .loc (อ้างอิงด้วย label) กับ .iloc (อ้างอิงด้วยตำแหน่ง)
  - เลือกทั้งแถวและคอลัมน์พร้อมกันด้วย .loc/.iloc
  - รู้ว่าช่วงท้ายของ .loc รวมด้วย (inclusive) ต่างจาก .iloc/slice ปกติของ Python ที่ไม่รวม (exclusive)

examples:
  - id: x1
    title: ดึงแถวและคอลัมน์ด้วยตำแหน่ง (.iloc)
    lang: python
    prompt: |
      อยากดึงข้อมูลบางส่วนของตาราง products โดยอ้างอิงด้วย "ตำแหน่ง" ไม่ใช่ชื่อคอลัมน์หรือเงื่อนไข
    steps:
      - text: |
          `.iloc[0]` ดึงแถวแรก (ตำแหน่ง 0) ทั้งแถว ได้ผลเป็น Series
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          products.iloc[0]
      - text: |
          ระบุทั้งแถวและคอลัมน์พร้อมกันได้ด้วย `.iloc[ช่วงแถว, ช่วงคอลัมน์]`
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          products.iloc[0:3, 0:2]
    pitfall:
      text: |
        หลายคนเข้าใจผิดว่า `.iloc[0:3]` จะได้ถึงแถวตำแหน่ง 3 ด้วย (รวม 4 แถว) เหมือน `.loc`
        แต่ `.iloc` ใช้กติกา slice แบบ Python ทั่วไปที่**ไม่รวม**ขอบท้าย ผลคือได้แค่ตำแหน่ง 0, 1, 2 (3 แถว) เท่านั้น
      code: |
        import pandas as pd

        products = pd.read_csv("data/products.csv")
        len(products.iloc[0:3])
  - id: x2
    title: ดึงข้อมูลด้วยเงื่อนไข พร้อมเลือกคอลัมน์ (.loc)
    lang: python
    prompt: |
      อยากดูเฉพาะสินค้าหมวด Books และแสดงแค่บางคอลัมน์
    steps:
      - text: |
          `.loc[เงื่อนไข]` กรองแถวด้วยเงื่อนไข boolean เหมือน `df[เงื่อนไข]` ทั่วไป
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          products.loc[products['category'] == 'Books']
      - text: |
          ใส่รายชื่อคอลัมน์ต่อจากเงื่อนไข เพื่อเลือกทั้งแถวและคอลัมน์ในคำสั่งเดียว
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          products.loc[products['category'] == 'Books', ['product_name', 'price']]
    pitfall:
      text: |
        `.loc` รวมขอบท้ายของช่วง (inclusive) ต่างจาก `.iloc`/slice ปกติของ Python ที่ไม่รวม
        ลองดูตัวอย่างนี้: หลังเรียงและ reset index แล้ว `.loc[0:2]` ได้ 3 แถว (ตำแหน่ง 0, 1, 2)
        ไม่ใช่ 2 แถวแบบที่ `.iloc[0:2]` จะให้
      code: |
        import pandas as pd

        products = pd.read_csv("data/products.csv")
        len(products.sort_values('price').reset_index(drop=True).loc[0:2])

faded:
