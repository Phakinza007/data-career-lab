    starter: |
      import pandas as pd

      products = pd.read_csv("data/products.csv")
      result = ___
    solution: |
      import pandas as pd

      products = pd.read_csv("data/products.csv")
      result = products.loc[products['price'] > 10000, 'category']
    check: |
      check_series(result, _sol["result"])
    hints:
      - ระบุชื่อคอลัมน์เดียว (ไม่ใช่ list) หลังเครื่องหมายจุลภาคใน .loc จะได้ Series
  - id: e8
    level: challenge
    lang: python
    prompt: |
      เรียงสินค้าตามราคาจากถูกไปแพง รีเซ็ต index ก่อน แล้วใช้ .loc[0:2] ดึง 3 แถวแรก
      (สังเกตว่า .loc รวมขอบท้าย) แสดง product_name, price เก็บไว้ในตัวแปร result
    starter: |
      import pandas as pd

      products = pd.read_csv("data/products.csv")
      result = ___
    solution: |
      import pandas as pd

      products = pd.read_csv("data/products.csv")
      result = products.sort_values('price').reset_index(drop=True).loc[0:2][['product_name', 'price']]
    check: |
      check_df(result, _sol["result"], ordered=True)
    hints:
      - ต้อง reset_index(drop=True) ก่อน ไม่งั้น label เดิมจะไม่ใช่ 0,1,2 เรียงกัน
      - .loc[0:2] ได้ 3 แถว (รวม label 2 ด้วย)

quiz:
  - id: q1
    question: .loc กับ .iloc ต่างกันยังไง
    choices:
      - text: .loc อ้างอิงด้วย label (ชื่อ/ค่าดัชนี) ส่วน .iloc อ้างอิงด้วยตำแหน่ง (เลขลำดับ เริ่มจาก 0)
        correct: true
        why: นี่คือความต่างหลัก ถ้า index ไม่ใช่ตัวเลขเรียงต่อกัน .loc[5] กับ .iloc[5] อาจได้คนละแถวกันเลย
      - text: .loc ใช้กับตัวเลขเท่านั้น .iloc ใช้กับข้อความเท่านั้น
        why: ทั้งสองใช้ได้กับ index ชนิดไหนก็ได้ ความต่างอยู่ที่ label vs position
      - text: ทั้งสองแบบให้ผลเหมือนกันทุกกรณี
        why: ต่างกันชัดเจนเมื่อ index ไม่ใช่เลขเรียงต่อกันตั้งแต่ 0 หรือเมื่อใช้ช่วง (slice)
      - text: .iloc เร็วกว่า .loc เสมอ
        why: ความเร็วไม่ใช่ประเด็นหลักของบทนี้ ความต่างสำคัญคือวิธีอ้างอิง
  - id: q2
    question: .loc[0:2] กับ .iloc[0:2] ต่างกันยังไง
    choices:
      - text: ".loc[0:2] รวมขอบท้าย (ได้ 3 แถว: 0,1,2) ส่วน .iloc[0:2] ไม่รวม (ได้ 2 แถว: 0,1)"
        correct: true
        why: .loc ใช้กติกา label แบบรวมขอบท้าย ส่วน .iloc ใช้กติกา slice ของ Python ที่ไม่รวมขอบท้าย
      - text: ทั้งสองแบบให้ 2 แถวเท่ากัน
        why: .loc[0:2] ให้ 3 แถวเพราะรวมขอบท้าย ต่างจาก .iloc[0:2]
      - text: ทั้งสองแบบให้ 3 แถวเท่ากัน
        why: .iloc[0:2] ให้แค่ 2 แถว เพราะไม่รวมขอบท้ายแบบ .loc
      - text: ขึ้นอยู่กับว่า DataFrame มีกี่แถว
        why: ผลต่างนี้เกิดจากกติกาของ .loc/.iloc เอง ไม่ขึ้นกับขนาดของ DataFrame
  - id: q3
    question: จะเลือกทั้งแถวและคอลัมน์พร้อมกันต้องเขียนยังไง
    choices:
      - text: ".loc[เงื่อนไขแถว, รายชื่อคอลัมน์] หรือ .iloc[ช่วงแถว, ช่วงคอลัมน์]"
        correct: true
        why: ใส่ทั้งสองแกนในวงเล็บเดียวกัน คั่นด้วยจุลภาค
      - text: "df[เงื่อนไข][คอลัมน์] เขียนต่อกันสองที"
        why: วิธีนี้เป็น chained indexing ซึ่งอาจมีปัญหาตอนจะแก้ไขข้อมูล (อธิบายเต็มในบทที่ 7)
      - text: ต้องเขียนแยกเป็นสองบรรทัดเสมอ
        why: เขียนในบรรทัดเดียวด้วย .loc/.iloc ได้เลย
      - text: ใช้ได้แค่กับ .iloc เท่านั้น
        why: ทั้ง .loc และ .iloc รับสองแกนพร้อมกันได้เหมือนกัน

summary:
  - .loc อ้างอิงด้วย label ส่วน .iloc อ้างอิงด้วยตำแหน่ง (เลขลำดับ)
  - .loc[a:b] รวมขอบท้าย (inclusive) ต่างจาก .iloc[a:b]/slice ปกติที่ไม่รวม (exclusive)
  - เลือกทั้งแถวและคอลัมน์พร้อมกันด้วย .loc[แถว, คอลัมน์] หรือ .iloc[แถว, คอลัมน์] ในคำสั่งเดียว

interview:
  - id: i1
    q: ทำไมควรใช้ .loc[เงื่อนไข, คอลัมน์] = ค่า แทนการเขียน df[เงื่อนไข][คอลัมน์] = ค่า เวลาจะแก้ไขข้อมูล
    a: |
      คำตอบสั้นๆ ในบทนี้ (อธิบายเต็มในบทที่ 7 เรื่อง cleaning): `df[เงื่อนไข]` อาจได้ DataFrame ใหม่ที่เป็นแค่สำเนา
      ไม่ใช่ตัวข้อมูลจริง การแก้ไขต่อจากนั้น (`[คอลัมน์] = ค่า`) จึงอาจไม่มีผลอะไรเลยกับตารางต้นฉบับ
      โดยไม่มี error หรือ warning เตือนด้วย ทางที่ปลอดภัยเสมอคือใช้ `.loc[เงื่อนไข, คอลัมน์] = ค่า` ในคำสั่งเดียว

flashcards:
  - id: c1
    front: .loc ต่างจาก .iloc ยังไง
    back: .loc อ้างอิงด้วย label (ชื่อ/ค่าดัชนี) .iloc อ้างอิงด้วยตำแหน่ง (เลขลำดับ)
  - id: c2
    front: .loc[0:2] ให้กี่แถว
    back: 3 แถว (0,1,2) เพราะ .loc รวมขอบท้าย ต่างจาก .iloc ที่ไม่รวม
