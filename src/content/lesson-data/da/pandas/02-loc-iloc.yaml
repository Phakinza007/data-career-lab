  - id: e6
    level: applied
    lang: python
    prompt: |
      ตั้ง order_id เป็น index แล้วดึงข้อมูลออเดอร์หมายเลข 1 แสดง customer_id กับ status
      เก็บไว้ในตัวแปร result
    starter: |
