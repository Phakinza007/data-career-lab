    lang: python
    prompt: |
      ดึงเฉพาะลูกค้าจากเมือง Phuket แสดงคอลัมน์ customer_id กับ signup_date เก็บไว้ในตัวแปร result
      เติม `___` ให้ครบ
    starter: |
      import pandas as pd

      customers = pd.read_csv("data/customers.csv")
