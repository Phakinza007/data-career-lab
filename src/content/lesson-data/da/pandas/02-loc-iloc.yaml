exercises:
  - id: e1
    level: basic
    lang: python
    prompt: |
      แถวสุดท้ายของตาราง products (ใช้ .iloc) แสดง product_name กับ price เก็บไว้ในตัวแปร result
    starter: |
      import pandas as pd

      products = pd.read_csv("data/products.csv")
      result = ___
    solution: |
      import pandas as pd

      products = pd.read_csv("data/products.csv")
      result = products.iloc[-1][['product_name', 'price']]
    check: |
      check_series(result, _sol["result"])
    hints:
      - "ตำแหน่ง -1 หมายถึงแถวสุดท้าย"
  - id: e2
    level: basic
    lang: python
    prompt: |
      ตำแหน่งที่ 5 ถึง 9 (นับจาก 0) ของ customers แสดง customer_id กับ city เก็บไว้ในตัวแปร result
    starter: |
      import pandas as pd

      customers = pd.read_csv("data/customers.csv")
      result = ___
    solution: |
      import pandas as pd

      customers = pd.read_csv("data/customers.csv")
      result = customers.iloc[5:10][['customer_id', 'city']]
    check: |
      check_df(result, _sol["result"], ordered=True)
    hints:
      - "`.iloc[5:10]` ไม่รวมตำแหน่ง 10"
  - id: e3
    level: basic
    lang: python
    prompt: |
      จำนวนลูกค้าที่อยู่เมือง Bangkok (ใช้ .loc) เก็บไว้ในตัวแปร n_bangkok
    starter: |
      import pandas as pd

      customers = pd.read_csv("data/customers.csv")
      n_bangkok = ___
    solution: |
      import pandas as pd

      customers = pd.read_csv("data/customers.csv")
      n_bangkok = len(customers.loc[customers['city'] == 'Bangkok'])
    check: |
      check_value(n_bangkok, _sol["n_bangkok"], name="n_bangkok")
    hints:
      - ".loc[เงื่อนไข] กรองแถวได้เหมือน df[เงื่อนไข]"
  - id: e4
    level: basic
    lang: python
    prompt: |
      ต้นทุน (cost) ของสินค้าชิ้นแรกในตาราง (ใช้ .iloc ดึงค่าเดียว จากคอลัมน์สุดท้าย) เก็บไว้ในตัวแปร first_cost
    starter: |
      import pandas as pd

      products = pd.read_csv("data/products.csv")
      first_cost = ___
    solution: |
      import pandas as pd

      products = pd.read_csv("data/products.csv")
      first_cost = float(products.iloc[0, -1])
    check: |
      check_value(first_cost, _sol["first_cost"], name="first_cost")
    hints:
      - "`.iloc[แถว, คอลัมน์]` ระบุตำแหน่งทั้งสองแกนพร้อมกัน คอลัมน์สุดท้ายคือตำแหน่ง -1"
  - id: e5
    level: applied
    lang: python
    prompt: |
      ลูกค้าจากช่องทาง promo (ใช้ .loc) แสดง customer_id กับ signup_date เอาแค่ 5 แถวแรกตามที่ปรากฏในตาราง
