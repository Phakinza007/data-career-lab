goals:
  - กรองแถวด้วยเงื่อนไขเปรียบเทียบและ &/|/~
  - ใช้ isin() และ between() แทนเงื่อนไขยาวๆ
  - กรองข้อความด้วย .str.contains()

examples:
  - id: x1
    title: สินค้าหมวด Home ราคาไม่เกิน 1000 บาท (รวมสองเงื่อนไขด้วย &)
    lang: python
    prompt: |
      อยากดูสินค้าหมวด Home ที่ราคาไม่แพงเกินไป (ไม่เกิน 1000 บาท)
    steps:
      - text: |
          ลองกรองเงื่อนไขเดียวก่อน (แค่หมวด)
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          products[products['category'] == 'Home']
      - text: |
          รวมสองเงื่อนไขด้วย `&` — **ต้องใส่วงเล็บรอบแต่ละเงื่อนไข** เสมอ
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          products[(products['category'] == 'Home') & (products['price'] <= 1000)]
    pitfall:
      text: |
        ถ้าลืมใส่วงเล็บรอบแต่ละเงื่อนไข เช่น `products[products['category'] == 'Home' & products['price'] <= 1000]`
        จะ error (`TypeError`) เพราะ Python ให้ `&` มีความสำคัญสูงกว่า `==`/`<=` การเขียนแบบไม่มีวงเล็บ
        ทำให้ Python พยายามตีความ `'Home' & products['price']` ก่อน ซึ่งไม่สมเหตุสมผล ต้องใส่วงเล็บรอบเงื่อนไขย่อย
        แต่ละอันเสมอเมื่อใช้ `&`/`|`/`~`
  - id: x2
    title: ลูกค้าจากเมือง Phuket หรือ Hat Yai (ใช้ isin แทน | ยาวๆ)
    lang: python
    prompt: |
      อยากดูลูกค้าจากสองเมืองนี้พร้อมกัน
    steps:
      - text: |
          เขียนแบบยาวด้วย `|` (OR) ก่อน
        code: |
          import pandas as pd

          customers = pd.read_csv("data/customers.csv")
          customers[(customers['city'] == 'Phuket') | (customers['city'] == 'Hat Yai')]
      - text: |
          เขียนสั้นและอ่านง่ายกว่าด้วย `.isin([...])` ได้ผลเท่ากัน
        code: |
          import pandas as pd

          customers = pd.read_csv("data/customers.csv")
          customers[customers['city'].isin(['Phuket', 'Hat Yai'])]
    pitfall:
      text: |
        ถ้าเผลอเขียน `customers['city'] == ['Phuket', 'Hat Yai']` (เทียบคอลัมน์กับ list ตรงๆ ด้วย `==`)
        โดยคิดว่าจะได้ผลแบบ "หรือ" เหมือน `isin` จะไม่ได้ผลตามที่ตั้งใจเลย ต้องใช้ `.isin([...])` เท่านั้น
        เมื่อต้องการเทียบกับหลายค่าพร้อมกัน

