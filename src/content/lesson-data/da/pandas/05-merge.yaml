goals:
  - เชื่อมตารางด้วย pd.merge()/.merge() ทั้งแบบ inner/left/right/outer
  - หา "แถวที่ไม่มีคู่" ด้วย how='left' แล้วกรอง .isna()
  - เชื่อมได้มากกว่า 2 ตาราง และระวังปัญหาแถวเบิ้ล (fan-out) — แนวคิดเดียวกับ SQL JOIN ทุกประการ

examples:
  - id: x1
    title: ลูกค้าคนไหนที่ยังไม่เคยสั่งซื้อเลย
    lang: python
    prompt: |
      ทีมการตลาดอยากส่งโปรโมชันไปกระตุ้นลูกค้าที่สมัครแล้วแต่ยังไม่เคยสั่งซื้อเลย
    steps:
      - text: |
          ลอง merge แบบ inner (ค่าเริ่มต้น) ก่อน — สังเกตว่าจำนวนแถวคือจำนวน**ออเดอร์** ไม่ใช่จำนวนลูกค้า
          เพราะลูกค้าคนเดียวมีได้หลายออเดอร์
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          customers = pd.read_csv("data/customers.csv")
          len(orders.merge(customers, on='customer_id'))
      - text: |
          เปลี่ยนเป็น `how='left'` แล้วกรองแถวที่ `order_id` เป็นค่าว่าง (`.isna()`) — นี่คือลูกค้าที่ "จับคู่ไม่ได้"
          กับออเดอร์ไหนเลย
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          customers = pd.read_csv("data/customers.csv")
          no_orders = customers.merge(orders, on='customer_id', how='left')
          no_orders[no_orders['order_id'].isna()][['customer_id', 'city']]
    pitfall:
      text: |
        ถ้าใช้ `how='inner'` (ค่าเริ่มต้น) แทน `how='left'` ตอนหาลูกค้าที่ไม่เคยสั่งซื้อ จะไม่มีทางเจอใครเลย
        (นับได้ 0 แถวเสมอ) เพราะ inner merge ตัดแถวที่จับคู่ไม่ได้ทิ้งไปตั้งแต่ต้น ไม่มีทางที่ `order_id`
        จะเป็นค่าว่างให้เจอ
      code: |
        import pandas as pd

        orders = pd.read_csv("data/orders.csv")
        customers = pd.read_csv("data/customers.csv")
        merged = customers.merge(orders, on='customer_id')
        len(merged[merged['order_id'].isna()])
  - id: x2
    title: รายได้รวมแต่ละหมวดสินค้า (เฉพาะออเดอร์ completed)
    lang: python
    prompt: |
      อยากรู้ว่าหมวดไหนทำรายได้ให้ร้านมากที่สุด นับเฉพาะออเดอร์ที่จบสมบูรณ์ (completed)
    steps:
      - text: |
          เชื่อม `order_items` กับ `orders` แล้วกับ `products` (merge ได้มากกว่า 2 ตารางต่อกันเรื่อยๆ)
        code: |
          import pandas as pd

          order_items = pd.read_csv("data/order_items.csv")
          orders = pd.read_csv("data/orders.csv")
          products = pd.read_csv("data/products.csv")
          merged = order_items.merge(orders, on='order_id').merge(products, on='product_id')
          merged.head()
      - text: |
          กรองเฉพาะ completed, สร้างคอลัมน์ revenue ด้วย `.assign()`, แล้ว groupby ตามหมวด
        code: |
          import pandas as pd

          order_items = pd.read_csv("data/order_items.csv")
          orders = pd.read_csv("data/orders.csv")
          products = pd.read_csv("data/products.csv")
          merged = order_items.merge(orders, on='order_id').merge(products, on='product_id')
          rev = merged[merged['status'] == 'completed'].assign(revenue=lambda d: d.quantity * d.unit_price)
          rev.groupby('category')['revenue'].sum()
    pitfall:
      text: |
        ถ้านับ "จำนวนออเดอร์ที่ซื้อสินค้าหมวด Electronics" ด้วย `len(...)` ตรงๆ หลัง merge กับ `order_items`
        จะได้ 2534 (นับรายการสินค้า ไม่ใช่ออเดอร์ เพราะออเดอร์เดียวอาจมีสินค้าหมวด Electronics หลายชิ้น)
        ค่าที่ถูกต้องคือนับ `.nunique()` ของ `order_id` ซึ่งได้ 2249 — ปัญหานี้เรียกว่า fan-out เหมือนที่เจอใน SQL JOIN

