      products = pd.read_csv("data/products.csv")
      result = ___
    solution: |
      import pandas as pd

      products = pd.read_csv("data/products.csv")
      result = products.pivot_table(values='price', index='category', aggfunc='mean').round(0)
    check: |
      check_df(result, _sol["result"])
