goals:
  - สร้างตารางสรุปแบบ "กว้าง" ด้วย pivot_table (values/index/columns/aggfunc/fill_value)
  - แปลงข้อมูลจาก "กว้าง" เป็น "ยาว" ด้วย melt
  - รู้ว่า pivot_table ที่ใส่ aggfunc เป็น list จะได้คอลัมน์ซ้อนกัน (MultiIndex) ที่ดึงค่ายากกว่าปกติ

examples:
  - id: x1
    title: จำนวนออเดอร์แต่ละคู่ (สถานะ, วิธีจ่ายเงิน) แบบตารางกว้าง
    lang: python
    prompt: |
      อยากเห็นจำนวนออเดอร์แยกตามสถานะและวิธีจ่ายเงินพร้อมกันในตารางเดียว
    steps:
      - text: |
          `pivot_table` จัดวางค่าหนึ่งคอลัมน์เป็น `index` (แถว) อีกคอลัมน์เป็น `columns` (คอลัมน์)
          ถ้าบางคู่ไม่มีข้อมูลเลย ช่องนั้นจะเป็นค่าว่าง
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          orders.pivot_table(values='order_id', index='status', columns='payment_method', aggfunc='count')
      - text: |
          เติมช่องว่างด้วย `fill_value=0`
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          orders.pivot_table(values='order_id', index='status', columns='payment_method', aggfunc='count', fill_value=0)
    pitfall:
      text: |
        ถ้าใส่ `aggfunc=['min', 'max']` (มากกว่า 1 ฟังก์ชันพร้อมกัน) จะได้คอลัมน์ซ้อนกัน (MultiIndex)
        เช่น `('min', 'price')` แทนที่จะเป็นชื่อคอลัมน์ธรรมดา ทำให้เรียกใช้ค่าต่อยากขึ้นมาก
        ถ้าต้องการหลายฟังก์ชันพร้อมกัน ควรใช้ `.agg()` แบบตั้งชื่อเอง (บทที่แล้ว) แทน
      code: |
        import pandas as pd

        products = pd.read_csv("data/products.csv")
        result = products.pivot_table(values='price', index='category', aggfunc=['min', 'max'])
        list(result.columns)
  - id: x2
    title: แปลงคอลัมน์ price/cost ให้เป็นแถว (long format) ด้วย melt
    lang: python
    prompt: |
      บางครั้งอยากได้ข้อมูลแบบ "ยาว" (แต่ละแถวคือ 1 ค่า) แทนที่จะเป็น "กว้าง" (แต่ละคอลัมน์คือ 1 ตัวชี้วัด)
    steps:
      - text: |
          ดูตารางแบบกว้างก่อน (product_id, price, cost อยู่คนละคอลัมน์)
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          products[['product_id', 'price', 'cost']].head(2)
      - text: |
          `melt(id_vars='product_id')` แปลงคอลัมน์ price/cost ให้กลายเป็นแถว
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          products[['product_id', 'price', 'cost']].head(2).melt(id_vars='product_id')
    pitfall:
      text: |
        ถ้าลืมใส่ `id_vars` เลย `melt()` จะเอาทุกคอลัมน์ (รวม `product_id`) ไปแปลงเป็นแถวหมด
        ทำให้ไม่เหลือคอลัมน์ไว้บอกว่าแต่ละแถวเดิมเป็นของสินค้าไหน

