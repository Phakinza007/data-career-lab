goals:
  - หาค่าที่ขาดหายด้วย isna()/notna() และจัดการด้วย dropna()/fillna()
  - หาและลบแถวที่ซ้ำกันด้วย duplicated()/drop_duplicates()
  - ทำความสะอาดข้อความ (.str.strip()/.str.title()) ให้ค่าที่ควรเหมือนกันไม่ถูกนับแยก
  - แปลงคอลัมน์วันที่ที่มีหลายรูปแบบปนกันในคอลัมน์เดียวให้ถูกต้องทั้งหมด
  - รู้ทันพฤติกรรม chained assignment ในปัจจุบันที่ไม่มี warning เตือนเลย

examples:
  - id: x1
    title: หา missing values ในข้อมูลลูกค้าดิบ
    lang: python
    prompt: |
      ข้อมูลลูกค้าดิบ (customers_raw) มีค่าว่างปนอยู่ อยากรู้ว่าคอลัมน์ไหนมีปัญหาบ้าง
    steps:
      - text: |
          `.isna()` ให้ True/False ทีละช่อง `.sum()` ต่อจะนับจำนวน True ในแต่ละคอลัมน์
        code: |
          import pandas as pd

          raw = pd.read_csv("data/raw/customers_raw.csv")
          raw.isna().sum()
      - text: |
          ดูตัวอย่างแถวที่ไม่มีอีเมลจริงๆ
        code: |
          import pandas as pd

          raw = pd.read_csv("data/raw/customers_raw.csv")
          raw[raw['email'].isna()].head()
    pitfall:
      text: |
        ถ้าใช้ `raw['email'] == ''` (เทียบกับสตริงว่าง) แทน `.isna()` โดยคิดว่าช่องว่างในไฟล์ CSV
        ถูกอ่านเป็นสตริงว่าง จะได้ 0 แถวเสมอ เพราะ pandas อ่านช่อง CSV ที่ว่างเป็นค่า missing (NaN)
        ไม่ใช่สตริงว่าง ต้องใช้ `isna()` เท่านั้นถึงจะเจอ (ยืนยันแล้วว่า isna() เจอ 165 แถว)
      code: |
        import pandas as pd

        raw = pd.read_csv("data/raw/customers_raw.csv")
        len(raw[raw['email'] == ''])
  - id: x2
    title: ทำความสะอาดชื่อเมืองที่เขียนไม่ตรงกัน
    lang: python
    prompt: |
      คอลัมน์ city ในข้อมูลดิบเขียนไม่ตรงกัน (ตัวพิมพ์ใหญ่-เล็ก ช่องว่างเกิน) ทั้งที่จริงมีแค่ 8 เมือง
    steps:
      - text: |
          นับจำนวนค่าที่ไม่ซ้ำก่อน (ไม่รวมค่าว่าง)
        code: |
          import pandas as pd

          raw = pd.read_csv("data/raw/customers_raw.csv")
          raw['city'].dropna().nunique()
      - text: |
          ตัดช่องว่างหน้า-หลังด้วย `.str.strip()` แล้วทำเป็น Title Case ด้วย `.str.title()` แล้วนับใหม่
        code: |
          import pandas as pd

          raw = pd.read_csv("data/raw/customers_raw.csv")
          raw['city'].dropna().str.strip().str.title().nunique()
    pitfall:
      text: |
        ถ้าทำความสะอาดด้วย `.str.upper()` อย่างเดียว (ไม่ `.strip()` ก่อน) จะยังเหลือปัญหาซ้ำเป็นสองเท่า
        (16 แทนที่จะเป็น 8) เพราะช่องว่างหน้า-หลังยังทำให้ `"BANGKOK"` กับ `" BANGKOK "` ถูกนับแยกกันอยู่
        ต้องตัดช่องว่างก่อนเสมอ (.strip()) แล้วค่อยจัดการตัวพิมพ์
      code: |
        import pandas as pd

        raw = pd.read_csv("data/raw/customers_raw.csv")
        raw['city'].dropna().str.upper().nunique()
  - id: x3
    title: แปลงคอลัมน์วันที่ที่เขียนหลายรูปแบบปนกัน
    lang: python
    prompt: |
      คอลัมน์ signup_date เขียนได้ 3 แบบปนกัน (ISO, DD/MM/YYYY, YYYY/MM/DD) ต้องแปลงให้ถูกต้องทั้งหมด
    steps:
      - text: |
          ลองแบบง่ายสุดก่อน `format='mixed'` ให้ pandas เดารูปแบบทีละค่าเอง — **ใช้งานได้ ไม่ error**
          แต่ผลลัพธ์ผิดสำหรับแถวรูปแบบ DD/MM/YYYY (เช่น `'03/01/2024'` กลายเป็น 1 มี.ค. แทนที่จะเป็น 3 ม.ค.)
          เพราะไม่รู้ว่าต้องอ่านวันก่อนเดือน
        code: |
          import pandas as pd

          pd.to_datetime(pd.Series(['03/01/2024']), format='mixed').dt.strftime('%Y-%m-%d')[0]
      - text: |
          ลองแก้ด้วย `dayfirst=True` — **ยังผิดอยู่** เพราะตอนนี้กลับไปทำให้สตริงแบบ ISO ที่ไม่กำกวมอยู่แล้ว
          (เช่น `'2024-01-03'`) ผิดไปด้วย
        code: |
          import pandas as pd

          pd.to_datetime(pd.Series(['2024-01-03']), format='mixed', dayfirst=True).dt.strftime('%Y-%m-%d')[0]
      - text: |
          วิธีที่ถูกต้อง — parse ทีละรูปแบบแยกกันด้วย `format=` ที่ตรงเป๊ะ (ใช้ `errors='coerce'` ให้ค่าที่ไม่ตรง
          รูปแบบกลายเป็น NaT แทนที่จะ error) แล้วรวมด้วย `.combine_first()`
        code: |
          import pandas as pd

          raw = pd.read_csv("data/raw/customers_raw.csv")
          d1 = pd.to_datetime(raw['signup_date'], format='%Y-%m-%d', errors='coerce')
          d2 = pd.to_datetime(raw['signup_date'], format='%d/%m/%Y', errors='coerce')
          d3 = pd.to_datetime(raw['signup_date'], format='%Y/%m/%d', errors='coerce')
          parsed = d1.combine_first(d2).combine_first(d3)
          int(parsed.isna().sum())
    pitfall:
      text: |
        ยืนยันความเสียหายแบบเจาะจง: `dayfirst=True` ทำให้สตริง ISO ที่ไม่กำกวมอยู่แล้ว (`'2024-01-03'`)
        ถูกแปลงเป็น `'2024-03-01'` ซึ่งผิด — เพราะ `dayfirst` มีผลกับ**ทุก**สตริงที่ parse แบบ `format='mixed'`
        ไม่ใช่แค่สตริงที่กำกวมจริงๆ
      code: |
        import pandas as pd

        pd.to_datetime(pd.Series(['2024-01-03']), format='mixed', dayfirst=True).dt.strftime('%Y-%m-%d')[0]

