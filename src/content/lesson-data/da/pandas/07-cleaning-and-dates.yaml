exercises:
  - id: e1
    level: basic
    lang: python
    prompt: |
      จำนวนค่าว่าง (NaN) ในแต่ละคอลัมน์ของข้อมูลลูกค้าดิบ เก็บไว้ในตัวแปร result
    starter: |
      import pandas as pd

      raw = pd.read_csv("data/raw/customers_raw.csv")
      result = ___
    solution: |
      import pandas as pd

      raw = pd.read_csv("data/raw/customers_raw.csv")
      result = raw.isna().sum()
    check: |
      check_series(result, _sol["result"])
    hints:
      - "`.isna().sum()` นับจำนวนค่าว่างทีละคอลัมน์"
  - id: e2
    level: basic
    lang: python
    prompt: |
      จำนวนแถวที่ไม่มีเมือง (city เป็นค่าว่าง) เก็บไว้ในตัวแปร n_missing_city
