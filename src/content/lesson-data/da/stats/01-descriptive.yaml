goals:
  - เข้าใจ mean/median/mode และรู้ว่าเมื่อไหร่ควรใช้ตัวไหน
  - คำนวณ variance/std เพื่อบอกว่าข้อมูลกระจายมากหรือน้อย
  - หา quartiles (Q1/Q3) และ IQR
  - ใช้ IQR หา outlier ด้วย fence

examples:
  - id: x1
    title: ราคาสินค้าเฉลี่ย vs ค่ากลาง ต่างกันแค่ไหน
    lang: python
    prompt: |
      ทีมสินค้าอยากรู้ว่าราคาสินค้า "โดยทั่วไป" อยู่ที่เท่าไหร่ ลองดูทั้ง mean และ median เทียบกัน
    steps:
      - text: |
          หาค่าเฉลี่ย (mean) ของราคาสินค้าด้วย `.mean()`
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          mean_price = products['price'].mean()
          mean_price
      - text: |
          หาค่ากลาง (median) ด้วย `.median()` แล้วเทียบกับ mean — สังเกตว่าต่างกันเยอะมาก
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          mean_price = products['price'].mean()
          median_price = products['price'].median()
          mean_price, median_price
    pitfall:
      text: |
        หลายคนคิดว่า mean กับ median ควรใกล้เคียงกันเสมอ แต่ข้อมูลราคาสินค้าชุดนี้เบ้ขวา (มีสินค้าราคาแพงมากอยู่ไม่กี่ชิ้น
        ที่ดึงค่าเฉลี่ยขึ้นไปสูง) mean (2296.0) กับ median (1014.0) จึงต่างกันเกินเท่าตัว — ถ้ารายงานแค่ mean ตัวเดียว
        ผู้บริหารอาจเข้าใจผิดว่าสินค้า "ทั่วไป" ราคาแพงกว่าความเป็นจริงมาก
        โค้ดข้างล่างแสดงให้เห็นชัดๆ ว่าค่าที่ปัดเป็นจำนวนเต็มของทั้งคู่ไม่เท่ากันเลย
      code: |
        import pandas as pd

        products = pd.read_csv("data/products.csv")
        mean_price = products['price'].mean()
        median_price = products['price'].median()
        round(mean_price) == round(median_price)
  - id: x2
    title: หา outlier ของราคาสินค้าด้วย IQR fence
    lang: python
    prompt: |
      ทีมสินค้าสงสัยว่ามีสินค้าราคา "ผิดปกติ" (แพงเกินไป) ปนอยู่ในร้านหรือไม่ ลองใช้กฎ IQR มาเช็ค
    steps:
      - text: |
          หา Q1 (เปอร์เซ็นไทล์ที่ 25) และ Q3 (เปอร์เซ็นไทล์ที่ 75) ด้วย `.quantile()` แล้วคำนวณ IQR = Q3 - Q1
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          q1_price = products['price'].quantile(0.25)
          q3_price = products['price'].quantile(0.75)
          iqr_price = q3_price - q1_price
          q1_price, q3_price, iqr_price
      - text: |
          fence ด้านบนสำหรับหา outlier คือ `Q3 + 1.5 * IQR` — ราคาไหนเกินเส้นนี้ถือว่าผิดปกติ
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          q1_price = products['price'].quantile(0.25)
          q3_price = products['price'].quantile(0.75)
          iqr_price = q3_price - q1_price
          upper_fence = q3_price + 1.5 * iqr_price
          n_outliers = (products['price'] > upper_fence).sum()
          upper_fence, n_outliers
    pitfall:
      text: |
        ถ้าลืมคูณ 1.5 แล้วใช้ Q3 เฉยๆ เป็น fence จะได้เส้นแบ่งที่ต่ำเกินไป ทำให้สินค้าที่ราคาแค่ "แพงกว่าค่ามัธยฐานหน่อย"
        (ไม่ได้ผิดปกติจริง) ถูกนับเป็น outlier ไปด้วยเยอะเกินจำเป็น — ตัวคูณ 1.5 คือส่วนสำคัญของสูตร ไม่ใช่ตัวเลือก
      code: |
        import pandas as pd

        products = pd.read_csv("data/products.csv")
        q1_price = products['price'].quantile(0.25)
        q3_price = products['price'].quantile(0.75)
        wrong_fence = q3_price
        n_flagged_wrong = (products['price'] > wrong_fence).sum()
        n_flagged_wrong

