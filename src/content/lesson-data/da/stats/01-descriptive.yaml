quiz:
  - id: q1
    question: ทำไม median ถึงทนทานต่อ outlier มากกว่า mean
    choices:
      - text: เพราะ median ดูแค่ตำแหน่งกลางของข้อมูลที่เรียงแล้ว ไม่สนขนาดของค่าที่อยู่ปลายสุด
        correct: true
        why: median ขึ้นอยู่กับตำแหน่ง (ranking) เท่านั้น ต่อให้ค่าที่มากที่สุดจะมากขึ้นอีกแค่ไหน median ก็ไม่เปลี่ยน
      - text: เพราะ median คำนวณจากผลรวมของทุกค่าเหมือน mean แต่หารด้วยตัวเลขที่ต่างกัน
        why: median ไม่ได้คำนวณจากผลรวมเลย มันคือค่ากลางของข้อมูลที่เรียงแล้ว
      - text: เพราะ median จะตัดค่า outlier ทิ้งก่อนคำนวณเสมอ
        why: median ไม่ได้ตัดข้อมูลใดๆ ทิ้ง แค่ไม่ได้รับผลกระทบจากขนาดของค่าปลายๆ
      - text: เพราะ mean กับ median ทนทานต่อ outlier เท่ากันอยู่แล้ว
        why: ทั้งสองไม่เท่ากัน mean ไวต่อ outlier กว่า median มาก
  - id: q2
    question: IQR คำนวณยังไง
    choices:
      - text: "Q3 - Q1"
        correct: true
        why: IQR (interquartile range) คือช่วงระหว่างเปอร์เซ็นไทล์ที่ 75 กับ 25
      - text: "Q3 + Q1"
        why: เป็นการบวก ไม่ใช่การลบ ผลลัพธ์ไม่ใช่ IQR
      - text: max - min
        why: นั่นคือ range ไม่ใช่ IQR — range ไวต่อ outlier มากกว่า IQR
      - text: mean - median
        why: นั่นวัดความเบ้ (skew) คร่าวๆ ไม่ใช่ IQR
  - id: q3
    question: ข้อมูลที่เบ้ขวา (right-skewed) ค่า mean เทียบกับ median จะเป็นแบบไหน
    choices:
      - text: mean มากกว่า median
        correct: true
        why: หางยาวไปทางขวา (ค่าสูงผิดปกติบางค่า) ดึงค่าเฉลี่ยขึ้นไปสูงกว่า median
      - text: mean น้อยกว่า median
        why: นั่นคือลักษณะของข้อมูลเบ้ซ้าย (left-skewed) ไม่ใช่เบ้ขวา
      - text: mean เท่ากับ median เสมอ
        why: mean กับ median เท่ากันพอดีเกิดขึ้นเฉพาะข้อมูลที่สมมาตร ไม่ใช่ข้อมูลเบ้
      - text: บอกไม่ได้ ขึ้นอยู่กับจำนวนข้อมูล
        why: ทิศทางของความเบ้กำหนดความสัมพันธ์ระหว่าง mean กับ median ได้ ไม่เกี่ยวกับจำนวนข้อมูล
  - id: q4
    question: fence สำหรับหา outlier ด้านบนด้วยกฎ IQR คำนวณจากอะไร
    choices:
      - text: "Q3 + 1.5 × IQR"
        correct: true
        why: นี่คือสูตรมาตรฐานของ upper fence ในกฎ IQR
      - text: "Q3 เฉยๆ"
        why: ใช้ Q3 ตรงๆ โดยไม่คูณ 1.5 จะทำให้เส้นแบ่งต่ำเกินไป นับ outlier เกินจริง
      - text: "mean + 3 × std"
        why: นั่นคือกฎ z-score ไม่ใช่กฎ IQR
      - text: "Q3 × 1.5"
        why: สูตรที่ถูกต้องคือ Q3 บวกด้วย 1.5 เท่าของ IQR ไม่ใช่ Q3 คูณ 1.5

summary:
  - mean ไวต่อ outlier แต่ median ทนทานกว่า เพราะดูแค่ตำแหน่งกลาง — ข้อมูลเบ้ขวาจะมี mean > median เสมอ
  - variance/std บอกว่าข้อมูลกระจายมากหรือน้อยรอบค่าเฉลี่ย
  - IQR (Q3 - Q1) วัดการกระจายของข้อมูล 50% ตรงกลาง ทนทานต่อ outlier มากกว่า range (max - min)
  - ใช้ IQR fence (Q3 + 1.5*IQR) หา outlier ด้านบนได้ โดยไม่ต้องสมมติว่าข้อมูลเป็นการแจกแจงปกติ

interview:
  - id: i1
    q: ทำไมนักวิเคราะห์มักดู median ควบคู่กับ mean เสมอเวลารายงานตัวเลข
    a: |
      เพราะ mean เพียงตัวเดียวอาจทำให้เข้าใจผิดได้ถ้าข้อมูลเบ้ (skewed) หรือมี outlier — เช่นรายได้เฉลี่ยต่อออเดอร์
      อาจถูกดึงสูงขึ้นไปมากจากออเดอร์ขนาดใหญ่ไม่กี่ออเดอร์ ทำให้ตัวเลข mean ดูดีเกินความเป็นจริงของ "ออเดอร์ทั่วไป"

      การดู median ควบคู่กันช่วยให้เห็นภาพที่สมดุลขึ้น: ถ้า mean กับ median ใกล้กัน ข้อมูลค่อนข้างสมมาตร แต่ถ้าต่างกันมาก
      (แบบราคาสินค้าหรือยอดขายในร้านนี้) ก็เป็นสัญญาณว่าต้องระวังการตีความ และอาจต้องดู distribution ทั้งหมดเพิ่มเติม
  - id: i2
    q: เจอ outlier ในข้อมูลควรทำยังไง
    a: |
      ไม่ควรลบทิ้งทันทีโดยไม่ตรวจสอบ — ขั้นแรกต้องหาที่มาก่อนเสมอว่า outlier นี้เกิดจากอะไร อาจเป็นข้อผิดพลาดในการ
      บันทึกข้อมูล (เช่น ใส่จำนวนผิดหลัก) หรืออาจเป็นเหตุการณ์จริงที่มีความหมายทางธุรกิจ (เช่น ลูกค้าองค์กรสั่งซื้อจำนวนมาก)

      ถ้าเป็นข้อผิดพลาดจริง ค่อยแก้ไขหรือตัดออก แต่ถ้าเป็นค่าจริงที่มีความหมาย ควรเก็บไว้วิเคราะห์แยกต่างหาก หรือใช้สถิติ
      ที่ทนทานต่อ outlier (เช่น median แทน mean) แทนการลบข้อมูลทิ้งไปเฉยๆ

flashcards:
  - id: c1
    front: mean กับ median ต่างกันยังไงเรื่องความทนทานต่อ outlier
    back: mean ไวต่อ outlier เพราะคำนวณจากผลรวมของทุกค่า ส่วน median ทนทานกว่าเพราะดูแค่ตำแหน่งกลางของข้อมูลที่เรียงแล้ว
  - id: c2
    front: สูตร upper fence สำหรับหา outlier ด้วยกฎ IQR
    back: "Q3 + 1.5 × IQR (ถ้าอยากได้ fence ด้านล่างใช้ Q1 - 1.5 × IQR แทน)"
