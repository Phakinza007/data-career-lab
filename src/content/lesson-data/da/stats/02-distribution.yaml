  - id: e7
    level: applied
    lang: python
    prompt: |
      เทียบวิธีหา outlier สองแบบบนยอดรายได้ต่อออเดอร์เดียวกัน: วิธี IQR (fence = `Q3 + 1.5*IQR`)
      กับวิธี z-score (`\|z\| > 3`) — วิธี IQR เจอ outlier มากกว่าวิธี z-score ไหม เก็บผลบูลีนไว้ในตัวแปร iqr_flags_more
    starter: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      completed = orders[orders['status'] == 'completed']
      merged = order_items.merge(completed, on='order_id')
      merged['line'] = merged['quantity'] * merged['unit_price']
      order_rev = merged.groupby('order_id')['line'].sum()

      iqr_flags_more = ___
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      completed = orders[orders['status'] == 'completed']
      merged = order_items.merge(completed, on='order_id')
      merged['line'] = merged['quantity'] * merged['unit_price']
      order_rev = merged.groupby('order_id')['line'].sum()

      q1 = order_rev.quantile(0.25)
      q3 = order_rev.quantile(0.75)
      iqr = q3 - q1
      upper_fence = q3 + 1.5 * iqr
      n_outliers_iqr = int((order_rev > upper_fence).sum())

      z = (order_rev - order_rev.mean()) / order_rev.std()
      n_outliers_z = int((z.abs() > 3).sum())

      iqr_flags_more = n_outliers_iqr > n_outliers_z
    check: |
      check_value(iqr_flags_more, _sol["iqr_flags_more"], name="iqr_flags_more")
    hints:
      - "หา n_outliers_iqr (จำนวนออเดอร์เกิน upper fence) กับ n_outliers_z (จำนวนออเดอร์ที่ |z|>3) แล้วเทียบกัน"
