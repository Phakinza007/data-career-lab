  - id: e10
    level: challenge
    lang: python
    prompt: |
      เทียบ % ของออเดอร์จริงที่ `\|z\| > 3` (ปัด 2 ตำแหน่ง เก็บไว้ในตัวแปร actual_pct) กับ % ทางทฤษฎีที่ควรเจอ
      ถ้าข้อมูลเป็น normal distribution จริง (`scipy.stats.norm.sf(3)*2*100` ปัด 2 ตำแหน่ง เก็บไว้ในตัวแปร theoretical_pct)
    starter: |
      import pandas as pd
      import scipy.stats as stats

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      completed = orders[orders['status'] == 'completed']
      merged = order_items.merge(completed, on='order_id')
      merged['line'] = merged['quantity'] * merged['unit_price']
      order_rev = merged.groupby('order_id')['line'].sum()

      z = (order_rev - order_rev.mean()) / order_rev.std()
      actual_pct = ___
      theoretical_pct = ___
    solution: |
      import pandas as pd
      import scipy.stats as stats

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      completed = orders[orders['status'] == 'completed']
      merged = order_items.merge(completed, on='order_id')
      merged['line'] = merged['quantity'] * merged['unit_price']
      order_rev = merged.groupby('order_id')['line'].sum()

      z = (order_rev - order_rev.mean()) / order_rev.std()
      actual_pct = round((z.abs() > 3).sum() / len(order_rev) * 100, 2)
      theoretical_pct = round(stats.norm.sf(3) * 2 * 100, 2)
    check: |
      check_value(actual_pct, _sol["actual_pct"], name="actual_pct")
      check_value(theoretical_pct, _sol["theoretical_pct"], name="theoretical_pct")
    hints:
      - "actual_pct = (จำนวนออเดอร์ที่ |z|>3) / (จำนวนออเดอร์ทั้งหมด) * 100"
      - "theoretical_pct ใช้ scipy.stats.norm.sf(3) คูณ 2 (สองด้าน) คูณ 100"

quiz:
  - id: q1
    question: "skew เป็นบวก แปลว่าอะไร"
    choices:
      - text: หางของการแจกแจงยาวไปทางขวา มีค่าที่สูงผิดปกติอยู่บ้าง มักทำให้ mean > median
        correct: true
        why: นี่คือความหมายของ right-skewed — ค่าส่วนใหญ่กระจุกอยู่ค่าต่ำ แต่มีบางค่าสูงมากดึงหางไปทางขวา
      - text: หางของการแจกแจงยาวไปทางซ้าย มักทำให้ mean < median
        why: นั่นคือ skew เป็นลบ (left-skewed) ไม่ใช่ skew เป็นบวก
      - text: ข้อมูลสมมาตรสมบูรณ์แบบ ไม่มีความเบ้เลย
        why: ข้อมูลสมมาตรจะมี skew ใกล้ 0 ไม่ใช่เป็นบวก
      - text: ข้อมูลมีแต่ค่าติดลบเท่านั้น
        why: skew ไม่เกี่ยวกับเครื่องหมายของค่าข้อมูล แต่บอกทิศทางของหางการกระจาย
  - id: q2
    question: "z-score คำนวณจากสูตรไหน"
    choices:
      - text: "(x - mean) / std"
        correct: true
        why: z-score บอกว่าค่า x ห่างจากค่าเฉลี่ยกี่เท่าของ standard deviation
      - text: "(x - median) / IQR"
        why: สูตรนี้ไม่ใช่ z-score เป็นการผสมแนวคิดสองอย่างที่ไม่ตรงนิยาม
      - text: "(x - min) / (max - min)"
        why: นี่คือสูตร min-max normalization ไม่ใช่ z-score
      - text: "x / mean"
        why: สูตรนี้ไม่ได้หักลบค่าเฉลี่ยออกก่อน ไม่ใช่ z-score
  - id: q3
    question: "กฎ `\\|z\\| > 3` = ผิดปกติ ตั้งอยู่บนสมมติฐานอะไร"
    choices:
      - text: ข้อมูลใกล้เคียงการแจกแจงปกติ (normal distribution)
        correct: true
        why: ตัวเลข "0.27% ของข้อมูลที่ |z|>3" มาจากคุณสมบัติของ normal distribution โดยเฉพาะ
      - text: ข้อมูลต้องมีขนาดตัวอย่างมากกว่า 1000 แถวเสมอ
        why: กฎนี้ไม่ได้ผูกกับขนาดตัวอย่าง แต่ผูกกับรูปร่างการแจกแจง
      - text: ข้อมูลต้องไม่มีค่าซ้ำกันเลยสักค่า
        why: ค่าซ้ำกันไม่มีผลต่อกฎนี้ ประเด็นอยู่ที่รูปร่างการแจกแจง
      - text: ข้อมูลต้องเรียงจากน้อยไปมากก่อนถึงจะคำนวณได้
        why: z-score คำนวณได้โดยไม่ต้องเรียงลำดับข้อมูลก่อน
  - id: q4
    question: ทำไมข้อมูลเบ้ขวาถึงมี z-score เกิน 3 บ่อยกว่าที่ทฤษฎีทำนายไว้มาก
    choices:
      - text: เพราะการแจกแจงจริงมีหางยาวกว่า normal distribution ค่าที่สูงผิดปกติจึงเกิดบ่อยกว่าที่ทฤษฎีคาดไว้
        correct: true
        why: ตัวเลข 0.27% (ทฤษฎี) เทียบกับ 2.29% (ข้อมูลจริง) มาจากข้อเท็จจริงนี้พอดี
      - text: เพราะขนาดตัวอย่างน้อยเกินไปจนคำนวณผิดพลาด
        why: ขนาดตัวอย่างในกรณีนี้มีหลักพันแถว ไม่ใช่สาเหตุ ประเด็นอยู่ที่รูปร่างการแจกแจงไม่ใช่ normal
      - text: เพราะสูตรคำนวณ std ผิดพลาดกับข้อมูลเบ้
        why: สูตร std คำนวณถูกต้องเสมอ ปัญหาอยู่ที่สมมติฐานความเป็น normal ของกฎ |z|>3 ต่างหาก
      - text: เพราะ skewness ทำให้คำนวณ mean ไม่ได้
        why: mean คำนวณได้ปกติแม้ข้อมูลจะเบ้ เพียงแต่ mean จะถูกดึงไปทางหางมากกว่า median

summary:
  - "skewness (`.skew()`) บอกทิศทางและขนาดของความเบ้: `skew > 0` เบ้ขวา (มักทำให้ mean > median), `skew < 0` เบ้ซ้าย"
  - "z-score = (x - mean) / std บอกว่าค่าห่างจากค่าเฉลี่ยกี่เท่าของ std กฎที่ใช้บ่อยคือ `\\|z\\| > 3` = ผิดปกติ"
  - กฎ z-score ตั้งอยู่บนสมมติฐานว่าข้อมูลใกล้เคียง normal distribution — ข้อมูลยอดขาย/รายได้ที่เบ้ขวารุนแรงมักมีค่า |z|>3 บ่อยกว่าที่ทฤษฎีทำนายไว้มาก ควรใช้ร่วมกับวิธีอื่น (เช่น IQR) เสมอ

interview:
  - id: i1
    q: ทำไมกฎ `\|z\| > 3` อาจใช้ไม่ได้ดีกับข้อมูลยอดขาย/รายได้ที่มักเบ้ขวา
    a: |
      กฎนี้อ้างอิงคุณสมบัติของ normal distribution ที่บอกว่าค่าซึ่งห่างจากค่าเฉลี่ยเกิน 3 std จะเจอได้แค่ประมาณ 0.27%
      แต่ข้อมูลยอดขาย/รายได้จริงมักเบ้ขวารุนแรง (ลูกค้าส่วนใหญ่ซื้อของราคาปกติ แต่มีบางออเดอร์ใหญ่ผิดปกติดึงหางออกไป)
      พอเอากฎนี้ไปใช้จริง จะเจอสัดส่วนที่ `\|z\|>3` สูงกว่าทฤษฎีทำนายไว้มาก (ในข้อมูลชุดนี้สูงกว่าเกือบ 8.5 เท่า)
      เพราะฉะนั้นควรใช้ z-score เป็นสัญญาณเบื้องต้น ไม่ใช่กฎตายตัว และควรเทียบกับวิธีอื่นประกอบเสมอ
  - id: i2
    q: นอกจาก z-score แล้ว มีวิธีอื่นหา outlier อะไรอีกบ้าง
    a: |
      วิธีที่ใช้บ่อยที่สุดอีกแบบคือ IQR method จาก Lesson ที่แล้ว (ค่าที่อยู่นอก `Q1 - 1.5*IQR` ถึง `Q3 + 1.5*IQR`)
      ซึ่งทนทานต่อความเบ้ของข้อมูลมากกว่า z-score เพราะอิงตำแหน่ง (percentile) ไม่ใช่ค่าเฉลี่ย/std ที่ถูกดึงง่ายโดยค่าสุดขั้ว
      นอกจากนี้ยังมีวิธีดูจาก domain knowledge ตรงๆ (เช่น รู้ว่าราคาสินค้าติดลบเป็นไปไม่ได้อยู่แล้ว)
      หรือดูกราฟ (histogram/boxplot) ประกอบ ไม่พึ่งตัวเลขสรุปตัวเดียว

flashcards:
  - id: c1
    front: skew เป็นบวก (right-skewed) หมายความว่าอะไร
    back: หางของข้อมูลยาวไปทางขวา มีค่าที่สูงผิดปกติอยู่บ้าง มักทำให้ mean > median
  - id: c2
    front: z-score คำนวณยังไง และตั้งอยู่บนสมมติฐานอะไร
    back: "z = (x - mean) / std ตั้งอยู่บนสมมติฐานว่าข้อมูลใกล้เคียง normal distribution ถ้าข้อมูลเบ้มากอาจตีความผิดได้"
