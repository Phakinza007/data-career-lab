goals:
  - อ่านรูปร่างการกระจายของข้อมูล (สมมาตร vs เบ้ซ้าย/เบ้ขวา) ด้วยตา และวัดด้วย skewness
  - คำนวณ z-score และใช้หา outlier ด้วยกฎ `\|z\| > 3`
  - เข้าใจว่ากฎ z-score ตั้งอยู่บนสมมติฐานว่าข้อมูลใกล้เคียงการแจกแจงปกติ ถ้าข้อมูลเบ้มากอาจตีความผิดได้

examples:
  - id: x1
    title: เทียบความเบ้ของราคาสินค้า กับยอดรายได้ต่อออเดอร์
    lang: python
    prompt: |
      อยากรู้ว่าราคาสินค้ากับยอดรายได้ต่อออเดอร์ (เฉพาะออเดอร์ที่สำเร็จ) มีรูปร่างการกระจายแบบไหน สมมาตรหรือเบ้
    steps:
      - text: |
          หา skew ของราคาสินค้าก่อน (เหมือนที่เคยดู mean/median ใน Lesson 1 ที่ต่างกันมาก)
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          products['price'].skew()
      - text: |
          สร้างยอดรายได้ต่อออเดอร์ (เฉพาะออเดอร์ที่ `status == 'completed'`) แล้วดู skew เทียบกัน
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")
          completed = orders[orders['status'] == 'completed']
          merged = order_items.merge(completed, on='order_id')
          merged['line'] = merged['quantity'] * merged['unit_price']
          order_rev = merged.groupby('order_id')['line'].sum()

          order_rev.skew()
    pitfall:
      text: |
        skew ใกล้ 0 ไม่ได้แปลว่าข้อมูล "สมมาตรสมบูรณ์แบบ" หรือ "ไม่มีอะไรน่าสนใจ" เสมอไป
        ข้อมูลบางแบบมีรูปร่างซับซ้อนกว่านั้น (เช่นมีสองยอดแยกกัน หรือ bimodal) ที่ตัวเลข skew ตัวเดียวจับไม่ได้
        ควรดูกราฟ histogram ประกอบเสมอ ไม่เชื่อตัวเลขสรุปตัวเดียวแบบไม่ดูรูปร่างจริง
  - id: x2
    title: z-score ของออเดอร์ที่ยอดรายได้สูงที่สุด
    lang: python
    prompt: |
      อยากรู้ว่าออเดอร์ที่มียอดรายได้สูงที่สุด "ผิดปกติ" แค่ไหนเมื่อเทียบกับค่าเฉลี่ยของออเดอร์ทั้งหมด
    steps:
      - text: |
          สร้างยอดรายได้ต่อออเดอร์เหมือนตัวอย่างที่แล้ว แล้วหาค่าเฉลี่ยกับ std
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")
          completed = orders[orders['status'] == 'completed']
          merged = order_items.merge(completed, on='order_id')
          merged['line'] = merged['quantity'] * merged['unit_price']
          order_rev = merged.groupby('order_id')['line'].sum()

          mean_rev = order_rev.mean()
          std_rev = order_rev.std()
          mean_rev, std_rev
      - text: |
          หา z-score ของออเดอร์ที่ยอดสูงสุด ด้วยสูตร `(x - mean) / std`
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")
          completed = orders[orders['status'] == 'completed']
          merged = order_items.merge(completed, on='order_id')
          merged['line'] = merged['quantity'] * merged['unit_price']
          order_rev = merged.groupby('order_id')['line'].sum()

          max_rev = order_rev.max()
          z_max = (max_rev - order_rev.mean()) / order_rev.std()
          z_max
    pitfall:
      text: |
        เอากฎ `\|z\| > 3` ไปใช้กับข้อมูลเบ้ขวาแบบยอดรายได้นี้แบบไม่คิดอะไรเลยอันตราย —
        ถ้าข้อมูลเป็น normal distribution จริง ทฤษฎีบอกว่าจะมีค่าที่ `\|z\| > 3` แค่ประมาณ 0.27% เท่านั้น
        แต่พอวัดจากข้อมูลรายได้จริงชุดนี้ กลับเจอสัดส่วนสูงถึงประมาณ 2.29% (มากกว่าทฤษฎีเกือบ 8.5 เท่า)
        เพราะข้อมูลเบ้ขวารุนแรง ไม่ใช่ normal — กฎนี้จึงต้องใช้อย่างระมัดระวัง ไม่ใช่เชื่อทื่อๆ

