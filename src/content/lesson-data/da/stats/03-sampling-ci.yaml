      ถ้าสุ่มตัวอย่างมา 800 ออเดอร์แทน 200 ออเดอร์ (ใช้ seed เดิม 42 แต่เปลี่ยน size เป็น 800) standard error
      ของตัวอย่างใหม่นี้ (เก็บไว้ในตัวแปร se_800) จะเล็กกว่า standard error ของตัวอย่างขนาด 200 เดิม (se) หรือไม่
      เก็บผลลัพธ์ true/false ไว้ในตัวแปร is_smaller
    starter: |
