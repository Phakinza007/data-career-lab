      is_smaller = ___
    solution: |
      import pandas as pd
      import numpy as np

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      merged = order_items.merge(orders, on='order_id')
      completed = merged[merged['status'] == 'completed'].copy()
      completed['line'] = completed['quantity'] * completed['unit_price']
      order_rev = completed.groupby('order_id')['line'].sum()

      rng = np.random.default_rng(42)
      sample = rng.choice(order_rev.values, size=200, replace=False)
      se = sample.std(ddof=1) / np.sqrt(200)

      rng_800 = np.random.default_rng(42)
      sample_800 = rng_800.choice(order_rev.values, size=800, replace=False)
      se_800 = sample_800.std(ddof=1) / np.sqrt(800)
      is_smaller = bool(se_800 < se)
    check: |
      check_value(se_800, _sol["se_800"], name="se_800", tol=1.0)
      check_value(is_smaller, _sol["is_smaller"], name="is_smaller")
    hints:
      - "ต้องสร้าง rng ใหม่ด้วย seed 42 อีกครั้งก่อนสุ่มขนาด 800 (ไม่ใช้ rng ตัวเดิมที่สุ่มไปแล้ว)"
      - "ขนาดตัวอย่างใหญ่ขึ้น หารด้วย sqrt(n) ที่ใหญ่ขึ้น → SE เล็กลงเสมอ"

quiz:
  - id: q1
    question: standard error ของค่าเฉลี่ยตัวอย่างคำนวณจากอะไร
    choices:
      - text: ส่วนเบี่ยงเบนมาตรฐานของตัวอย่าง หารด้วยรากที่สองของขนาดตัวอย่าง (sample_std / sqrt(n))
        correct: true
        why: นี่คือสูตร standard error มาตรฐาน — ยิ่งตัวอย่างใหญ่ ยิ่งหารด้วยตัวเลขที่มากขึ้น ทำให้ SE เล็กลง
      - text: ส่วนเบี่ยงเบนมาตรฐานของตัวอย่างเฉยๆ ไม่ต้องหารอะไร
        why: นั่นคือ sample std ไม่ใช่ standard error — standard error ต้องหารด้วย sqrt(n) เพิ่มด้วย
      - text: ค่าเฉลี่ยของตัวอย่าง หารด้วยขนาดตัวอย่าง
        why: standard error ไม่เกี่ยวกับค่าเฉลี่ย เกี่ยวกับความแปรปรวน (std) ของตัวอย่าง
      - text: ผลต่างระหว่างค่ามากสุดกับค่าน้อยสุดของตัวอย่าง
        why: นั่นคือ range ไม่ใช่ standard error
  - id: q2
    question: ถ้าขนาดตัวอย่างใหญ่ขึ้น (n มากขึ้น) standard error จะเป็นแบบไหน
    choices:
      - text: เล็กลง เพราะหารด้วย sqrt(n) ที่ใหญ่ขึ้น
        correct: true
        why: ตัวอย่างใหญ่ขึ้นทำให้ค่าเฉลี่ยตัวอย่างนิ่งขึ้น (แกว่งน้อยลง) SE จึงเล็กลงตามสูตร sample_std/sqrt(n)
      - text: ใหญ่ขึ้น เพราะมีข้อมูลให้คำนวณมากขึ้น
        why: ตรงข้ามกับความจริง — ตัวอย่างใหญ่ขึ้นทำให้ SE เล็กลง ไม่ใช่ใหญ่ขึ้น
      - text: ไม่เปลี่ยนแปลง ขนาดตัวอย่างไม่มีผลต่อ SE
        why: ขนาดตัวอย่างอยู่ในสูตร SE โดยตรง (หารด้วย sqrt(n)) จึงมีผลแน่นอน
      - text: เปลี่ยนแปลงแบบสุ่ม ไม่มีทิศทางแน่นอน
        why: มีทิศทางแน่นอนตามสูตรคณิตศาสตร์ — ยิ่ง n มาก SE ยิ่งน้อยเสมอ
  - id: q3
    question: การตีความ 95% confidence interval ที่ถูกต้องคือแบบไหน
    choices:
      - text: ถ้าสุ่มตัวอย่างและคำนวณ CI แบบนี้ซ้ำหลายครั้ง ประมาณ 95% ของช่วงที่ได้จะครอบคลุมค่าเฉลี่ยจริง
        correct: true
        why: ความเชื่อมั่น 95% อยู่ที่กระบวนการสุ่มตัวอย่างและคำนวณซ้ำๆ ไม่ใช่การพนันของช่วงใดช่วงหนึ่งเจาะจง
      - text: มีโอกาส 95% ที่ค่าเฉลี่ยจริงของประชากรจะอยู่ในช่วงที่คำนวณได้ช่วงนี้
        why: ค่าเฉลี่ยจริงของประชากรเป็นค่าคงที่ ไม่ใช่ตัวแปรสุ่ม จึงพูดถึง "โอกาส" ของมันแบบนี้ไม่ได้ทางสถิติ
      - text: 95% ของข้อมูลทั้งหมดอยู่ในช่วงนี้
        why: CI ไม่ได้บอกว่าข้อมูลกี่ % อยู่ในช่วง แต่บอกความเชื่อมั่นต่อค่าเฉลี่ยประชากร
      - text: ค่าเฉลี่ยตัวอย่างถูกต้อง 95% ของเวลา
        why: ไม่ใช่ความถูกต้องของค่าเฉลี่ยตัวอย่าง แต่เป็นเรื่องช่วงที่คำนวณได้ครอบคลุมค่าจริงหรือไม่
  - id: q4
    question: ทำไมต้องใช้ t-distribution แทน normal distribution ตอนคำนวณ CI จากตัวอย่าง
    choices:
      - text: เพราะไม่รู้ค่า population std ที่แท้จริง ต้องประมาณจากตัวอย่างเอง ซึ่งเพิ่มความไม่แน่นอนอีกชั้นหนึ่ง
        correct: true
        why: t-distribution มีหางที่กว้างกว่า normal เพื่อชดเชยความไม่แน่นอนจากการประมาณ std ด้วยตัวอย่าง
      - text: เพราะ t-distribution คำนวณง่ายกว่า normal distribution
        why: ไม่เกี่ยวกับความง่าย — เหตุผลคือการชดเชยความไม่แน่นอนจากการประมาณ std ด้วยตัวอย่าง
      - text: เพราะข้อมูลยอดขายเป็นข้อมูลเชิงหมวดหมู่ (categorical)
        why: ยอดขายเป็นข้อมูลตัวเลขต่อเนื่อง ไม่เกี่ยวกับชนิดข้อมูลเลย
      - text: t-distribution ใช้ได้เฉพาะตอนขนาดตัวอย่างใหญ่มากเท่านั้น
        why: ตรงข้ามกับความจริง — t-distribution ยิ่งสำคัญตอนตัวอย่างเล็ก ตอนตัวอย่างใหญ่มันใกล้เคียง normal อยู่แล้ว

summary:
  - เราสุ่มตัวอย่างแทนการดูข้อมูลทั้งประชากร แล้วใช้สถิติจากตัวอย่างมาประมาณค่าจริง
  - standard error (sample_std / sqrt(n)) บอกว่าค่าเฉลี่ยตัวอย่างแกว่งได้มากแค่ไหน ยิ่ง n มาก SE ยิ่งเล็ก
  - confidence interval สร้างจาก sample_mean ± t-critical × SE โดยใช้ t-distribution (ไม่ใช่ normal) เพราะไม่รู้ population std ที่แท้จริง
  - การตีความ CI ที่ถูกต้องคือ "ถ้าสุ่มซ้ำหลายครั้ง ~95% ของช่วงจะครอบคลุมค่าเฉลี่ยจริง" ไม่ใช่ "มีโอกาส 95% ที่ค่าเฉลี่ยจริงอยู่ในช่วงนี้ช่วงเดียว"

interview:
  - id: i1
    q: อธิบายว่า 95% confidence interval หมายความว่าอะไรให้คนที่ไม่ใช่สายสถิติฟัง
    a: |
      พูดง่ายๆ ว่า: "ถ้าเราสุ่มตัวอย่างขนาดเท่านี้มาคำนวณช่วงแบบนี้ซ้ำๆ กัน 100 ครั้ง จะมีประมาณ 95 ครั้ง
      ที่ช่วงตัวเลขที่ได้ครอบคลุมค่าเฉลี่ยจริงของทั้งประชากรพอดี" — มันไม่ใช่การบอกว่า "มีโอกาส 95%
      ที่ค่าเฉลี่ยจริงอยู่ในช่วงนี้ช่วงเดียว" เพราะค่าเฉลี่ยจริงเป็นตัวเลขคงที่ค่าหนึ่งอยู่แล้ว (แค่เราไม่รู้ค่ามัน)
      สิ่งที่ไม่แน่นอนคือช่วงตัวเลขที่เราคำนวณได้จากตัวอย่างต่างหาก ไม่ใช่ค่าเฉลี่ยจริง
  - id: i2
    q: ทำไมขนาดตัวอย่างยิ่งใหญ่ ยิ่งมั่นใจในค่าประมาณมากขึ้น
    a: |
      เพราะ standard error (ความไม่แน่นอนของค่าเฉลี่ยตัวอย่าง) คำนวณจาก sample_std หารด้วยรากที่สองของขนาด
      ตัวอย่าง (sqrt(n)) — ยิ่ง n ใหญ่ขึ้น ตัวหารก็ใหญ่ขึ้นตาม ทำให้ SE เล็กลง ค่าเฉลี่ยตัวอย่างจึงแกว่งน้อยลง
      รอบๆ ค่าจริง และ confidence interval ที่ได้ก็จะแคบลง (แม่นยำกว่า) แต่ก็มีจุดคุ้มทุน เพราะ SE ลดลงตาม
      sqrt(n) ไม่ใช่ตาม n ตรงๆ เพิ่มตัวอย่างจาก 100 เป็น 400 (4 เท่า) SE ลดลงแค่ครึ่งเดียว ไม่ใช่ 4 เท่า

