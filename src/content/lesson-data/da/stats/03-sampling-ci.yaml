goals:
  - เข้าใจว่าทำไมต้องสุ่มตัวอย่างแทนการดูข้อมูลทั้งประชากร
  - คำนวณ standard error ของค่าเฉลี่ยตัวอย่าง
  - สร้างช่วงความเชื่อมั่น (confidence interval) ด้วย t-distribution
  - ตีความ confidence interval ให้ถูกต้อง ไม่ใช่แบบ "มีโอกาส 95% ที่ค่าเฉลี่ยจริงอยู่ในช่วงนี้"

examples:
  - id: x1
    title: สุ่มตัวอย่างยอดขาย 200 ออเดอร์ แล้วดู standard error
    lang: python
    prompt: |
      อยากรู้ยอดขายเฉลี่ยต่อออเดอร์ แต่แทนที่จะดูข้อมูลทั้งหมด (6232 ออเดอร์) ลองสุ่มมาดูแค่ 200 ออเดอร์ก่อน
    steps:
      - text: |
          สร้างยอดขายต่อออเดอร์ (เฉพาะออเดอร์ที่ completed) แล้วสุ่มตัวอย่างมา 200 ออเดอร์ด้วย seed คงที่
          (`np.random.default_rng(42)`) เพื่อให้สุ่มซ้ำได้ผลเดิมทุกครั้ง
        code: |
          import pandas as pd
          import numpy as np

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")
          merged = order_items.merge(orders, on='order_id')
          completed = merged[merged['status'] == 'completed'].copy()
          completed['line'] = completed['quantity'] * completed['unit_price']
          order_rev = completed.groupby('order_id')['line'].sum()

          rng = np.random.default_rng(42)
          sample = rng.choice(order_rev.values, size=200, replace=False)
          sample[:5]
      - text: |
          หาค่าเฉลี่ยและส่วนเบี่ยงเบนมาตรฐานของตัวอย่าง แล้วคำนวณ standard error (`sample_std / sqrt(n)`)
        code: |
          import pandas as pd
          import numpy as np

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")
          merged = order_items.merge(orders, on='order_id')
          completed = merged[merged['status'] == 'completed'].copy()
          completed['line'] = completed['quantity'] * completed['unit_price']
          order_rev = completed.groupby('order_id')['line'].sum()

          rng = np.random.default_rng(42)
          sample = rng.choice(order_rev.values, size=200, replace=False)

          sample_mean = sample.mean()
          sample_std = sample.std(ddof=1)
          se = sample_std / np.sqrt(200)
          sample_mean, sample_std, se
    pitfall:
      text: |
        สังเกตว่า `sample_mean` ที่ได้ (≈ 6233) สูงกว่าค่าเฉลี่ยจริงของประชากรทั้งหมด (`order_rev.mean()` ≈ 5220)
        อยู่พอสมควร — ถ้ารายงานแค่ `sample_mean` ตัวเดียวโดยไม่บอก standard error หรือช่วงความเชื่อมั่นกำกับไว้เลย
        จะทำให้คนอ่านเข้าใจผิดว่านี่คือค่าที่แม่นยำ ทั้งที่จริงมันแกว่งได้ตามตัวอย่างที่สุ่มมา
      code: |
        import pandas as pd
        import numpy as np

        orders = pd.read_csv("data/orders.csv")
        order_items = pd.read_csv("data/order_items.csv")
        merged = order_items.merge(orders, on='order_id')
        completed = merged[merged['status'] == 'completed'].copy()
        completed['line'] = completed['quantity'] * completed['unit_price']
        order_rev = completed.groupby('order_id')['line'].sum()

        rng = np.random.default_rng(42)
        sample = rng.choice(order_rev.values, size=200, replace=False)
        sample.mean() - order_rev.mean()
  - id: x2
    title: คำนวณ 95% confidence interval ด้วย t-distribution
    lang: python
    prompt: |
      ต่อจากตัวอย่างที่แล้ว อยากรายงานเป็นช่วงที่น่าจะครอบคลุมยอดขายเฉลี่ยจริง แทนที่จะรายงานแค่ตัวเลขเดียว
    steps:
      - text: |
          หาค่าวิกฤต (critical value) จาก t-distribution ที่ `df = n - 1 = 199` สำหรับความเชื่อมั่น 95%
        code: |
          import pandas as pd
          import numpy as np
          from scipy import stats

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")
          merged = order_items.merge(orders, on='order_id')
          completed = merged[merged['status'] == 'completed'].copy()
          completed['line'] = completed['quantity'] * completed['unit_price']
          order_rev = completed.groupby('order_id')['line'].sum()

          rng = np.random.default_rng(42)
          sample = rng.choice(order_rev.values, size=200, replace=False)

          tcrit = stats.t.ppf(0.975, df=199)
          tcrit
      - text: |
          สร้างช่วง CI = `sample_mean ± tcrit * se` แล้วเช็คว่าค่าเฉลี่ยประชากรจริงอยู่ในช่วงนี้ไหม
        code: |
          import pandas as pd
          import numpy as np
          from scipy import stats

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")
          merged = order_items.merge(orders, on='order_id')
          completed = merged[merged['status'] == 'completed'].copy()
          completed['line'] = completed['quantity'] * completed['unit_price']
          order_rev = completed.groupby('order_id')['line'].sum()

          rng = np.random.default_rng(42)
          sample = rng.choice(order_rev.values, size=200, replace=False)

          sample_mean = sample.mean()
          se = sample.std(ddof=1) / np.sqrt(200)
          tcrit = stats.t.ppf(0.975, df=199)
          ci_low = sample_mean - tcrit * se
          ci_high = sample_mean + tcrit * se
          ci_low, ci_high, order_rev.mean()
    pitfall:
      text: |
        บางคนใช้ค่าวิกฤตจาก normal distribution (`1.96`) แทนค่าจาก t-distribution เพราะจำได้ขึ้นใจ
        กับตัวอย่างขนาด 200 (`df=199`) ตัวเลขทั้งสองใกล้กันมาก (`1.972` vs `1.96`) เลยดูเหมือนไม่มีปัญหา
        แต่ถ้าขนาดตัวอย่างเล็ก (เช่น `n=10`) ค่าวิกฤตจาก t-distribution กับ normal distribution จะต่างกันมาก
        การใช้ `1.96` ผิดๆ ตอนตัวอย่างเล็กจะทำให้ CI แคบเกินจริง (มั่นใจเกินความเป็นจริง)

