quiz:
  - id: q1
    question: "null hypothesis (H0) คืออะไรโดยหลักการ"
    choices:
      - text: สมมติฐานที่บอกว่า "ไม่มีความแตกต่าง/ไม่มีผล" ซึ่งเราพยายามหาหลักฐานมาหักล้าง
        correct: true
        why: การทดสอบสมมติฐานเริ่มจากตั้ง H0 แบบนี้เสมอ แล้วดูว่าข้อมูลมีหลักฐานมากพอจะหักล้างมันไหม
      - text: สมมติฐานที่นักวิเคราะห์เชื่อว่าเป็นจริงและอยากพิสูจน์
        why: อันนั้นคือ alternative hypothesis (H1) ต่างหาก H0 คือสมมติฐาน "ไม่มีอะไรเกิดขึ้น" ที่เราพยายามหักล้าง
      - text: ค่า p-value ที่ใช้ตัดสินใจ
        why: p-value เป็นผลลัพธ์จากการทดสอบ ไม่ใช่ตัวสมมติฐานเอง
      - text: ข้อสรุปสุดท้ายของการวิเคราะห์
        why: H0 เป็นสมมติฐานตั้งต้นก่อนทดสอบ ไม่ใช่ข้อสรุป
  - id: q2
    question: "p-value คือความน่าจะเป็นของอะไร"
    choices:
      - text: ความน่าจะเป็นที่จะเห็นผลลัพธ์สุดขั้วเท่านี้หรือมากกว่า ถ้า H0 เป็นจริง
        correct: true
        why: นี่คือนิยามที่ถูกต้อง p-value เป็นความน่าจะเป็นแบบมีเงื่อนไข "ถ้า H0 จริง" เท่านั้น
      - text: ความน่าจะเป็นที่ H0 เป็นจริง
        why: เป็นการตีความที่ผิดที่พบบ่อยที่สุด p-value ไม่ได้บอกความน่าจะเป็นที่ H0 เป็นจริงเลย
      - text: ความน่าจะเป็นที่ผลลัพธ์เกิดจากความบังเอิญล้วนๆ
        why: ใกล้เคียงแต่ไม่ตรงนิยาม — p-value คำนวณภายใต้สมมติฐานว่า H0 เป็นจริง ไม่ใช่ความน่าจะเป็นของ "ความบังเอิญ" เฉยๆ
      - text: ระดับความมั่นใจว่าผลการทดลองถูกต้อง
        why: p-value ไม่ได้วัดความน่าเชื่อถือของการทดลองโดยรวม แต่วัดความสุดขั้วของผลลัพธ์ภายใต้ H0
  - id: q3
    question: "p < 0.05 แปลว่าอะไร"
    choices:
      - text: มีหลักฐานเพียงพอที่จะปฏิเสธ H0 ที่ระดับนัยสำคัญ 0.05
        correct: true
        why: นี่คือความหมายตรงตัวของเกณฑ์ α=0.05 ที่ตกลงกันไว้ล่วงหน้า
      - text: ผลต่างที่พบมีขนาดใหญ่มากเสมอ
        why: p-value เล็กบอกแค่ว่าผลต่างไม่น่าเกิดจากสุ่มเฉยๆ ไม่ได้บอกขนาด (effect size) ของผลต่างนั้น
      - text: H0 เป็นเท็จแน่นอน 100%
        why: การทดสอบสถิติไม่เคยให้ความแน่นอน 100% เสมอมีโอกาสตัดสินใจผิดพลาดอยู่บ้าง
      - text: สามารถหยุดเก็บข้อมูลได้เลยเพราะได้คำตอบสุดท้ายแล้ว
        why: p<0.05 เป็นแค่หลักฐานทางสถิติ ณ ตัวอย่างที่มี ไม่ได้แปลว่าไม่ต้องพิจารณาปัจจัยอื่นอีก
  - id: q4
    question: "two-sample t-test แบบ `equal_var=False` (Welch's) ต่างจาก `equal_var=True` ยังไง"
    choices:
      - text: ไม่สมมติว่าความแปรปรวนของสองกลุ่มเท่ากัน ปลอดภัยกว่าเมื่อไม่แน่ใจ
        correct: true
        why: Welch's t-test ปรับสูตรให้ใช้ได้แม้สองกลุ่มมีความแปรปรวนต่างกัน จึงเป็นตัวเลือกที่ปลอดภัยกว่าเป็นค่าเริ่มต้น
      - text: ใช้ได้เฉพาะกับตัวอย่างขนาดเล็กเท่านั้น
        why: ใช้ได้กับตัวอย่างทุกขนาด ไม่ได้จำกัดแค่ตัวอย่างเล็ก
      - text: คำนวณ p-value แบบทางเดียว (one-sided) เสมอ
        why: ทั้ง equal_var=True และ False ให้ผลแบบ two-sided โดยค่าเริ่มต้นเหมือนกัน ต่างกันแค่สมมติฐานเรื่องความแปรปรวน
      - text: ให้ผลเหมือนกันทุกกรณีไม่ว่าความแปรปรวนจะต่างกันแค่ไหน
        why: ถ้าความแปรปรวนสองกลุ่มต่างกันมาก ผลลัพธ์จากสองวิธีนี้อาจต่างกันได้ชัดเจน
  - id: q5
    question: "การไม่ปฏิเสธ H0 (fail to reject) แปลว่า H0 เป็นจริงแน่นอนไหม"
    choices:
      - text: ไม่ใช่ แค่แปลว่าข้อมูลที่มีไม่พอจะหักล้าง H0 ได้
        correct: true
        why: "\"fail to reject\" ไม่เท่ากับ \"พิสูจน์ว่าจริง\" อาจเป็นเพราะตัวอย่างเล็กเกินไป หรือ H0 ผิดจริงแต่ผลต่างเล็กเกินจะตรวจจับได้"
      - text: ใช่ แปลว่า H0 ถูกพิสูจน์แล้วว่าเป็นจริง
        why: การทดสอบสถิติไม่เคย "พิสูจน์" ว่า H0 เป็นจริง ทำได้แค่บอกว่าข้อมูลที่มีไม่พอจะหักล้างมัน
      - text: ใช่ เพราะ p-value จะต้องมากกว่า 0.5 เสมอ
        why: ไม่จำเป็นต้องมากกว่า 0.5 แค่มากกว่า α ที่ตั้งไว้ (เช่น 0.05) ก็ถือว่า fail to reject แล้ว
      - text: ไม่ใช่ แปลว่าการทดลองมีข้อผิดพลาด ต้องทำใหม่
        why: fail to reject เป็นผลลัพธ์ที่สมเหตุสมผลปกติของการทดสอบ ไม่ได้แปลว่าการทดลองผิดพลาด

summary:
  - null hypothesis (H0) คือสมมติฐาน "ไม่มีผล/ไม่มีความแตกต่าง" ที่เราพยายามหาหลักฐานมาหักล้าง ไม่ใช่สิ่งที่อยากพิสูจน์
  - one-sample t-test (`ttest_1samp`) เทียบค่าเฉลี่ยตัวอย่างกับค่าที่อ้าง ส่วน two-sample t-test (`ttest_ind`, แนะนำ `equal_var=False`) เทียบค่าเฉลี่ยระหว่างสองกลุ่ม
  - p-value คือความน่าจะเป็นที่จะเห็นผลสุดขั้วเท่านี้หรือมากกว่า **ถ้า H0 เป็นจริง** ไม่ใช่ความน่าจะเป็นที่ H0 เป็นจริง และ fail to reject H0 ไม่ได้แปลว่า H0 ถูกพิสูจน์แล้ว

interview:
  - id: i1
    q: อธิบาย p-value ให้ผู้บริหารที่ไม่ได้เรียนสถิติฟัง โดยไม่ใช้คำว่า "null hypothesis"
    a: |
      อาจอธิบายแบบนี้: "สมมติว่าตัวเลขที่เราอยากตรวจสอบนั้นถูกต้องจริงๆ (เช่น ยอดเฉลี่ยคือ 5000 บาทจริง) ถ้าเราสุ่มตัวอย่างมาดูซ้ำๆ
      หลายๆ ครั้ง มีโอกาสกี่เปอร์เซ็นต์ที่จะได้ตัวอย่างที่ผลต่างจากตัวเลขนั้นมากเท่ากับหรือมากกว่าที่เราเห็นในครั้งนี้"
      ถ้าตัวเลขนี้ (p-value) ต่ำมาก แปลว่าสิ่งที่เราสังเกตเห็นไม่น่าจะเกิดจากความบังเอิญเฉยๆ ถ้าตัวเลขไม่ถูกต้องจริง —
      จุดสำคัญคือ p-value ไม่ได้บอกว่า "ตัวเลขที่อ้างมีโอกาสถูกกี่เปอร์เซ็นต์" มันตอบคำถามกลับด้านกัน
  - id: i2
    q: ทำไมการทดสอบทางสถิติที่ไม่ปฏิเสธ H0 ไม่ได้แปลว่าไม่มีความแตกต่างจริง
    a: |
      เพราะ "fail to reject H0" แปลว่าข้อมูลที่มีอยู่ไม่มากพอจะให้หลักฐานที่แข็งแรงพอจะหักล้าง H0 ได้ ไม่ได้แปลว่า H0 ถูกพิสูจน์
      ว่าเป็นจริง — สาเหตุที่พบบ่อยคือขนาดตัวอย่างเล็กเกินไป (statistical power ไม่พอ) หรือผลต่างที่แท้จริงมีขนาดเล็กจนตรวจจับ
      ไม่ได้ด้วยตัวอย่างขนาดนี้ ความแตกต่างจริงอาจยังมีอยู่ แค่ข้อมูลที่เก็บมายังไม่พอจะเห็นมันชัดเจน
  - id: i3
    q: ถ้า p-value = 0.049 กับ 0.051 ควรตีความต่างกันมากไหม
    a: |
      ไม่ควรตีความต่างกันมาก — เส้นแบ่ง α=0.05 เป็นธรรมเนียมที่ตกลงกันไว้ล่วงหน้า ไม่ใช่กำแพงที่มีความหมายพิเศษทางสถิติจริงๆ
      ผลลัพธ์ทั้งสองแทบไม่ต่างกันเลยในแง่ความแข็งแรงของหลักฐาน การตัดสินใจทางธุรกิจที่เปลี่ยนขั้วสุดโต่ง (ทำ/ไม่ทำ) แค่เพราะ
      p-value ต่างกัน 0.002 จึงเป็นความเสี่ยงที่ควรระวัง ควรดูขนาดของผลต่าง (effect size) และบริบทประกอบด้วยเสมอ ไม่ใช่ยึด
      เกณฑ์ 0.05 แบบทื่อๆ

flashcards:
