goals:
  - เข้าใจ null hypothesis (H0) กับ alternative hypothesis (H1) และตรรกะของการ "ทดสอบเพื่อหักล้าง H0"
  - ทำ one-sample t-test เพื่อเทียบค่าเฉลี่ยตัวอย่างกับค่าที่มีคนอ้าง
  - ทำ two-sample t-test (Welch's) เพื่อเทียบค่าเฉลี่ยระหว่างสองกลุ่ม
  - อ่านและตีความ p-value ให้ถูกต้อง (ไม่ใช่ "ความน่าจะเป็นที่ H0 เป็นจริง")

examples:
  - id: x1
    title: "ผู้บริหารอ้างว่ายอดออเดอร์เฉลี่ยคือ 5000 บาท — จริงไหม"
    lang: python
    prompt: |
      ผู้บริหารอ้างว่ายอดออเดอร์เฉลี่ยของร้านอยู่ที่ 5000 บาท ทีมอยากตรวจสอบคำกล่าวนี้ด้วยตัวอย่าง 200 ออเดอร์
      (สุ่มแบบเดียวกับบทที่แล้ว) ว่าข้อมูลตัวอย่างขัดแย้งกับคำกล่าวนี้อย่างมีนัยสำคัญหรือไม่
    steps:
      - text: |
          ตั้งสมมติฐาน: H0 คือ "ค่าเฉลี่ยจริงของยอดออเดอร์ = 5000 บาท" (สมมติฐานว่าง ที่เราพยายามหาหลักฐานมาหักล้าง)
          ส่วน H1 คือ "ค่าเฉลี่ยจริง ≠ 5000 บาท" จากนั้นสร้างตัวอย่างเดียวกับบทที่แล้วเป๊ะๆ (seed 42, ขนาด 200, ไม่คืนที่)
        code: |
          import pandas as pd
          import numpy as np

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")

          merged = order_items.merge(orders, on='order_id')
          completed = merged[merged['status'] == 'completed'].copy()
          completed['line'] = completed['quantity'] * completed['unit_price']
          order_rev = completed.groupby('order_id')['line'].sum()

          rng = np.random.default_rng(42)
          sample = rng.choice(order_rev.values, size=200, replace=False)
          sample.mean()
      - text: |
          รัน one-sample t-test ด้วย `scipy.stats.ttest_1samp(sample, 5000)` เทียบค่าเฉลี่ยตัวอย่างกับค่าที่อ้าง (5000)
        code: |
          import pandas as pd
          import numpy as np
          from scipy import stats

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")

          merged = order_items.merge(orders, on='order_id')
          completed = merged[merged['status'] == 'completed'].copy()
          completed['line'] = completed['quantity'] * completed['unit_price']
          order_rev = completed.groupby('order_id')['line'].sum()

          rng = np.random.default_rng(42)
          sample = rng.choice(order_rev.values, size=200, replace=False)

          t_stat, p_value = stats.ttest_1samp(sample, 5000)
          t_stat, p_value    # ≈ 1.908, ≈ 0.0578
    pitfall:
      text: |
        ได้ `p_value ≈ 0.0578` แล้วอ่านว่า "มีโอกาส 94.2% ที่คำกล่าวของผู้บริหารเป็นจริง" — นี่คือการตีความ p-value ที่ผิดที่พบบ่อยที่สุด
        p-value **ไม่ใช่** ความน่าจะเป็นที่ H0 เป็นจริง แต่คือ "ถ้าค่าเฉลี่ยจริงเท่ากับ 5000 บาทจริงๆ (H0 เป็นจริง) โอกาสที่จะสุ่มตัวอย่าง
        มาแล้วได้ค่าเฉลี่ยที่ต่างจาก 5000 มากเท่านี้หรือมากกว่า คือ 5.78%" — ในที่นี้ `p=0.0578 > 0.05` จึงยัง **ไม่มีหลักฐานเพียงพอ**
        ที่จะปฏิเสธคำกล่าวของผู้บริหาร (แต่ก็ไม่ได้แปลว่าคำกล่าวนั้น "ถูกพิสูจน์ว่าจริง" เช่นกัน)
  - id: x2
    title: "ลูกค้าช่องทาง organic กับ ads ใครสั่งของแพงกว่ากันจริงไหม"
    lang: python
    prompt: |
      ทีมการตลาดสงสัยว่าลูกค้าที่มาจากช่องทาง organic กับ ads มียอดสั่งซื้อเฉลี่ยต่อออเดอร์ต่างกันหรือไม่
      เทียบด้วย two-sample t-test ระหว่างสองกลุ่ม
    steps:
      - text: |
          เตรียมยอดขายต่อออเดอร์ (เฉพาะออเดอร์ที่เสร็จสมบูรณ์) พร้อมช่องทางของลูกค้าแต่ละออเดอร์ แล้วแยกเป็นสองกลุ่มตาม channel
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")
          customers = pd.read_csv("data/customers.csv")

          completed = orders[orders['status'] == 'completed']
          oc = completed.merge(customers[['customer_id', 'channel']], on='customer_id')
          items = order_items.merge(oc[['order_id', 'channel']], on='order_id')
          items['line'] = items['quantity'] * items['unit_price']
          rev_by_order = items.groupby(['order_id', 'channel'])['line'].sum().reset_index()

          organic = rev_by_order[rev_by_order['channel'] == 'organic']['line']
          ads = rev_by_order[rev_by_order['channel'] == 'ads']['line']
          len(organic), organic.mean(), len(ads), ads.mean()   # ≈ 3010, 5405.2, 2034, 5015.77
      - text: |
          รัน two-sample t-test แบบ **Welch's t-test** (`equal_var=False`) ซึ่งไม่สมมติว่าความแปรปรวนของสองกลุ่มเท่ากัน
        code: |
          import pandas as pd
          from scipy import stats

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")
          customers = pd.read_csv("data/customers.csv")

          completed = orders[orders['status'] == 'completed']
          oc = completed.merge(customers[['customer_id', 'channel']], on='customer_id')
          items = order_items.merge(oc[['order_id', 'channel']], on='order_id')
          items['line'] = items['quantity'] * items['unit_price']
          rev_by_order = items.groupby(['order_id', 'channel'])['line'].sum().reset_index()

          organic = rev_by_order[rev_by_order['channel'] == 'organic']['line']
          ads = rev_by_order[rev_by_order['channel'] == 'ads']['line']

          t2, p2 = stats.ttest_ind(organic, ads, equal_var=False)
          t2, p2    # ≈ 1.8537, ≈ 0.0639
    pitfall:
      text: |
        ใช้ `stats.ttest_ind(organic, ads, equal_var=True)` (Student's t-test แบบดั้งเดิม) โดยไม่ตรวจสอบก่อนว่าสองกลุ่มมี
        ความแปรปรวนใกล้เคียงกันจริงไหม — ถ้าความแปรปรวนต่างกันมาก (ซึ่งพบได้บ่อยกับข้อมูลยอดขายที่เบ้ขวา) ผลลัพธ์จาก
        `equal_var=True` อาจคลาดเคลื่อนได้ ทางที่ปลอดภัยกว่าเมื่อไม่แน่ใจคือใช้ **Welch's t-test** (`equal_var=False`)
        เป็นค่าเริ่มต้นเสมอ อย่างที่ตัวอย่างนี้ทำ

