  - id: c2
    front: "\"fail to reject H0\" แปลว่าอะไร"
    back: ข้อมูลที่มีไม่พอจะหักล้าง H0 ได้ ไม่ได้แปลว่า H0 ถูกพิสูจน์ว่าเป็นจริง
