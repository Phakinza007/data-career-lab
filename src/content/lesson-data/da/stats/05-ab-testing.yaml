goals:
  - ทดสอบความต่างของ purchase rate สองกลุ่มด้วย two-proportion z-test (และ chi-square เป็นทางเลือก)
  - เช็ค sample ratio mismatch (SRM) ก่อนเชื่อผลการทดลองใดๆ
  - อ่าน funnel ทีละขั้นแทนที่จะดูแค่ metric สุดท้าย
  - รู้จักกับดักการหยุดทดลองเร็วเกินไป (ตัวอย่างไม่พอ)

examples:
  - id: x1
    title: ทดสอบ purchase rate ระหว่าง variant A กับ B ด้วย two-proportion z-test (ทำมือ)
    lang: python
    prompt: |
      ทีมโปรดักต์ทดลองหน้า checkout เวอร์ชันใหม่ (variant B) เทียบกับของเดิม (variant A)
      อยากรู้ว่า purchase rate ของ B ที่สูงกว่า A เป็นความต่างจริง หรือแค่ความบังเอิญจากการสุ่มตัวอย่าง
    steps:
      - text: |
          สร้างตารางระดับ session ก่อนเสมอ: กรองเฉพาะ event ที่มี variant (คือผู้เข้าทดลองจริง) จัดกลุ่มตาม
          session_id + variant แล้วเช็คว่า session นั้นมี event `purchase` เกิดขึ้นหรือไม่ ได้ nA/bA ของ A
          และ nB/bB ของ B (n = จำนวน session ทั้งหมด, b = จำนวนที่ซื้อ) แล้วคำนวณ purchase rate pA, pB
        code: |
          import pandas as pd

          events = pd.read_csv("data/events.csv")
          ev = events[events['variant'].notna()]
          sessions = (
              ev.groupby(['session_id', 'variant'])['event_type']
              .apply(lambda s: (s == 'purchase').any())
              .rename('purchased')
              .reset_index()
          )

          nA = (sessions['variant'] == 'A').sum()
          bA = sessions.loc[sessions['variant'] == 'A', 'purchased'].sum()
          nB = (sessions['variant'] == 'B').sum()
          bB = sessions.loc[sessions['variant'] == 'B', 'purchased'].sum()
          pA = bA / nA
          pB = bB / nB
          pA, pB
      - text: |
          คำนวณ two-proportion z-test มือ: หา p_pool (สัดส่วนรวมสมมติว่าสองกลุ่มไม่ต่างกันจริง),
          standard error (se) แล้วหา z = (pB - pA) / se — ยิ่ง |z| มากกว่าประมาณ 1.96 (ที่ α=0.05)
          ยิ่งมั่นใจว่าต่างกันจริง ไม่ใช่บังเอิญ ต่อด้วย p-value สองด้านจาก scipy.stats.norm
        code: |
          import pandas as pd
          import numpy as np
          import scipy.stats as stats

          events = pd.read_csv("data/events.csv")
          ev = events[events['variant'].notna()]
          sessions = (
              ev.groupby(['session_id', 'variant'])['event_type']
              .apply(lambda s: (s == 'purchase').any())
              .rename('purchased')
              .reset_index()
          )

          nA = (sessions['variant'] == 'A').sum()
          bA = sessions.loc[sessions['variant'] == 'A', 'purchased'].sum()
          nB = (sessions['variant'] == 'B').sum()
          bB = sessions.loc[sessions['variant'] == 'B', 'purchased'].sum()
          pA = bA / nA
          pB = bB / nB

          p_pool = (bA + bB) / (nA + nB)
          se = np.sqrt(p_pool * (1 - p_pool) * (1 / nA + 1 / nB))
          z_stat = (pB - pA) / se
          p_value = stats.norm.sf(abs(z_stat)) * 2
          uplift_pct = (pB - pA) / pA * 100
          z_stat, p_value, uplift_pct
    pitfall:
      text: |
        เห็น pB (8.76%) มากกว่า pA (7.15%) แล้วรีบสรุปว่า B ชนะเลยโดยไม่ทดสอบนัยสำคัญ — สัดส่วนสองกลุ่ม
        ที่มาจากการสุ่มตัวอย่าง แทบไม่มีทางเท่ากันเป๊ะอยู่แล้วแม้ของจริงจะไม่ต่างกันเลย เช่น โยนเหรียญสองกอง
        กองละ 20 ครั้ง ได้หัว 9 กับ 11 ครั้ง (45% vs 55%) ก็ไม่ได้แปลว่าเหรียญกองหนึ่ง "ดีกว่า" อีกกอง —
        ต้องเทียบว่าความต่างนั้นใหญ่กว่าที่สุ่มมาบังเอิญได้แค่ไหน (หน้าที่ของ z-test/p-value) ก่อนสรุปผู้ชนะ
  - id: x2
    title: ยืนยันด้วยวิธีอื่น — chi-square test บนตาราง 2×2
    lang: python
    prompt: |
      ผลจาก two-proportion z-test บอกว่าต่างกันอย่างมีนัยสำคัญ ลองตรวจสอบด้วยวิธีอื่นคือ chi-square test
      บนตาราง contingency 2×2 (แถว = variant, คอลัมน์ = ไม่ซื้อ/ซื้อ) ดูว่าได้ข้อสรุปตรงกันไหม
    steps:
      - text: |
          สร้างตาราง contingency 2×2 จากจำนวน session ที่ไม่ซื้อ/ซื้อของแต่ละ variant
        code: |
          import pandas as pd

          events = pd.read_csv("data/events.csv")
          ev = events[events['variant'].notna()]
          sessions = (
              ev.groupby(['session_id', 'variant'])['event_type']
              .apply(lambda s: (s == 'purchase').any())
              .rename('purchased')
              .reset_index()
          )

          nA = (sessions['variant'] == 'A').sum()
          bA = sessions.loc[sessions['variant'] == 'A', 'purchased'].sum()
          nB = (sessions['variant'] == 'B').sum()
          bB = sessions.loc[sessions['variant'] == 'B', 'purchased'].sum()

          table = [[nA - bA, bA], [nB - bB, bB]]
          table
      - text: |
          รัน scipy.stats.chi2_contingency บนตาราง แล้วเทียบ chi2 กับ z² จาก two-proportion z-test —
          ทั้งสองวิธีทดสอบสมมติฐานเดียวกันด้วยคณิตศาสตร์คนละมุม ควรให้ข้อสรุปตรงกัน (ใกล้เคียงกันมาก
          แต่ไม่เท่ากันเป๊ะเพราะ chi-square มี continuity correction)
        code: |
          import pandas as pd
          import numpy as np
          import scipy.stats as stats

          events = pd.read_csv("data/events.csv")
          ev = events[events['variant'].notna()]
          sessions = (
              ev.groupby(['session_id', 'variant'])['event_type']
              .apply(lambda s: (s == 'purchase').any())
              .rename('purchased')
              .reset_index()
          )

          nA = (sessions['variant'] == 'A').sum()
          bA = sessions.loc[sessions['variant'] == 'A', 'purchased'].sum()
          nB = (sessions['variant'] == 'B').sum()
          bB = sessions.loc[sessions['variant'] == 'B', 'purchased'].sum()
          pA = bA / nA
          pB = bB / nB

          p_pool = (bA + bB) / (nA + nB)
          se = np.sqrt(p_pool * (1 - p_pool) * (1 / nA + 1 / nB))
          z_stat = (pB - pA) / se

          table = [[nA - bA, bA], [nB - bB, bB]]
          chi2_stat, p_chi, dof, expected = stats.chi2_contingency(table)
          z_stat ** 2, chi2_stat, p_chi
  - id: x3
    title: เช็ค sample ratio mismatch (SRM) ก่อนเชื่อผล
    lang: python
    prompt: |
      ก่อนเชื่อผลข้างบน ควรเช็คก่อนว่าการสุ่มแบ่งผู้เข้าทดลองสอง variant ได้สัดส่วนตามที่ตั้งใจไหม (ปกติควร
      ใกล้ 50/50) ถ้าเบี้ยวไปมาก (เช่น 46/54) แปลว่าการสุ่มเข้ากลุ่มอาจมีบั๊ก และผลการทดลองทั้งหมดเชื่อไม่ได้
      เลยไม่ว่า p-value จะสวยแค่ไหน
    steps:
      - text: |
          นับจำนวน session ของแต่ละ variant แล้วหาสัดส่วนของ A ต่อทั้งหมด (sample ratio)
        code: |
          import pandas as pd

          events = pd.read_csv("data/events.csv")
          ev = events[events['variant'].notna()]
          sessions = (
              ev.groupby(['session_id', 'variant'])['event_type']
              .apply(lambda s: (s == 'purchase').any())
              .rename('purchased')
              .reset_index()
          )

          nA = (sessions['variant'] == 'A').sum()
          nB = (sessions['variant'] == 'B').sum()
          sample_ratio = nA / (nA + nB)
          sample_ratio
      - text: |
          เทียบกับเกณฑ์คร่าวๆ ว่าใกล้ 50/50 พอไหม (เช่น อยู่นอกช่วงประมาณ 0.47–0.53 ควรเริ่มสงสัยว่ามี SRM)
          — ในเคสนี้ sample_ratio ≈ 0.5001 ใกล้ 50/50 มาก แปลว่าไม่มี SRM การสุ่มทำงานตามที่ตั้งใจ
        code: |
          import pandas as pd

          events = pd.read_csv("data/events.csv")
          ev = events[events['variant'].notna()]
          sessions = (
              ev.groupby(['session_id', 'variant'])['event_type']
              .apply(lambda s: (s == 'purchase').any())
              .rename('purchased')
              .reset_index()
          )

          nA = (sessions['variant'] == 'A').sum()
          nB = (sessions['variant'] == 'B').sum()
          sample_ratio = nA / (nA + nB)
          has_srm = not (0.47 <= sample_ratio <= 0.53)
          sample_ratio, has_srm
    pitfall:
      text: |
        ข้ามการเช็คนี้ไปเลยแล้วเชื่อ p-value ตรงๆ — ถ้าระบบสุ่มเข้ากลุ่มมีบั๊ก (เช่น cache, redirect,
        หรือ bot บาง segment ตกไปกลุ่มใดกลุ่มหนึ่งมากผิดปกติ) กลุ่มสองกลุ่มอาจมีองค์ประกอบผู้ใช้ต่างกัน
        ไปตั้งแต่แรก แล้วผลต่างที่วัดได้ก็ไม่ได้สะท้อนผลของตัวแปรที่ทดลองล้วนๆ อีกต่อไป SRM คือสัญญาณเตือน
        ที่ต้องเช็คก่อนดู p-value เสมอ ไม่ใช่แค่ตอนผลออกมาดูแปลกๆ เท่านั้น

