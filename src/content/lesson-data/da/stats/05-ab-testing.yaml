    solution: |
      import pandas as pd
      import numpy as np
      import scipy.stats as stats

      events = pd.read_csv("data/events.csv")
      ev = events[events['variant'].notna()]
      sessions = (
          ev.groupby(['session_id', 'variant'])['event_type']
          .apply(lambda s: (s == 'purchase').any())
          .rename('purchased')
          .reset_index()
      )
      first_time = ev.groupby('session_id')['event_time'].min().rename('first_time').reset_index()
      sessions_sorted = (
          sessions.merge(first_time, on='session_id')
          .sort_values('first_time', kind='mergesort')
          .reset_index(drop=True)
      )

      n_checkpoint = int(len(sessions_sorted) * 0.4)
      sub = sessions_sorted.iloc[:n_checkpoint]

      nA = (sub['variant'] == 'A').sum()
      bA = sub.loc[sub['variant'] == 'A', 'purchased'].sum()
      nB = (sub['variant'] == 'B').sum()
      bB = sub.loc[sub['variant'] == 'B', 'purchased'].sum()
      pA = bA / nA
      pB = bB / nB
      p_pool = (bA + bB) / (nA + nB)
      se = np.sqrt(p_pool * (1 - p_pool) * (1 / nA + 1 / nB))
      z = (pB - pA) / se
      p_at_40pct = stats.norm.sf(abs(z)) * 2
    check: |
      check_value(p_at_40pct, _sol["p_at_40pct"], tol=0.001)
