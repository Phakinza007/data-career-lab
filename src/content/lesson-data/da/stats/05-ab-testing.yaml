quiz:
  - id: q1
    question: two-proportion z-test ใช้เปรียบเทียบอะไรระหว่างสองกลุ่ม
    choices:
      - text: สัดส่วน (proportion) สองกลุ่ม เช่น purchase rate ของ variant A กับ B
        correct: true
        why: two-proportion z-test ออกแบบมาสำหรับเทียบสัดส่วน/อัตรา (เช่น อัตราการซื้อ) ระหว่างสองกลุ่มโดยเฉพาะ
      - text: ค่าเฉลี่ย (mean) สองกลุ่ม เช่น ยอดใช้จ่ายเฉลี่ย
        why: เทียบค่าเฉลี่ยใช้ two-sample t-test แทน ไม่ใช่ two-proportion z-test
      - text: ความแปรปรวน (variance) สองกลุ่ม
        why: การเทียบความแปรปรวนมีวิธีเฉพาะ (เช่น F-test) ไม่ใช่สิ่งที่ two-proportion z-test ทดสอบ
      - text: จำนวนแถวทั้งหมดของสองกลุ่ม
        why: จำนวนแถว (n) เป็นแค่ส่วนหนึ่งของสูตร ไม่ใช่สิ่งที่ทดสอบโดยตรง
  - id: q2
    question: sample ratio mismatch (SRM) คืออะไร
    choices:
      - text: สัดส่วนผู้เข้าทดลองสองกลุ่มเบี้ยวไปจากที่ตั้งใจ (เช่น ควรเป็น 50/50 แต่ได้ 46/54) บ่งชี้ว่าการสุ่มเข้ากลุ่มมีปัญหา
        correct: true
        why: SRM คือสัญญาณว่า randomization อาจมีบั๊ก ทำให้สองกลุ่มมีองค์ประกอบต่างกันไปตั้งแต่แรก
      - text: ผลต่างของ purchase rate ระหว่างสองกลุ่มที่มากเกินไป
        why: นั่นคือผลของการทดลอง (effect size) ไม่ใช่ SRM ซึ่งเป็นเรื่องสัดส่วนขนาดกลุ่ม ไม่ใช่ผลลัพธ์
      - text: การที่ p-value ออกมาน้อยกว่า 0.05 โดยไม่คาดคิด
        why: นั่นคือผลของ significance test ไม่เกี่ยวกับสัดส่วนขนาดของสองกลุ่มที่เข้าทดลอง
      - text: การที่ตัวอย่างมีขนาดเล็กเกินไปจนวัดผลไม่ได้
        why: นั่นคือปัญหาเรื่อง statistical power/sample size ไม่ใช่ SRM ซึ่งเป็นเรื่องสัดส่วนระหว่างกลุ่ม
  - id: q3
    question: ทำไมควรดู funnel ทีละขั้นแทนที่จะดูแค่ purchase rate รวม
    choices:
      - text: อาจเจอว่าขั้นไหนของ funnel ที่ variant ทำได้ดี/แย่กว่าจริงๆ เช่น เข้าถึง checkout น้อยกว่าแต่ปิดการขายได้ดีกว่า
        correct: true
        why: การดูแค่ metric สุดท้ายอาจซ่อน insight ที่เกิดขึ้นระหว่างทาง เช่นในเคสนี้ B เข้าถึง checkout น้อยกว่าแต่ปิดการขายดีกว่ามาก
      - text: purchase rate รวมคำนวณผิดพลาดได้ง่ายกว่า funnel ทีละขั้น
        why: ทั้งสองแบบคำนวณได้แม่นยำพอกัน ประเด็นอยู่ที่ข้อมูลเชิงลึกที่เห็นได้มากกว่า ไม่ใช่ความแม่นยำ
      - text: funnel ทีละขั้นใช้ได้กับ A/B test ที่มี variant เดียวเท่านั้น
        why: ใช้ได้กับกี่ variant ก็ได้ ไม่ได้จำกัดแค่กรณีเดียว
      - text: purchase rate รวมไม่จำเป็นต้องดูเลยถ้าดู funnel แล้ว
        why: ทั้งสองมุมมองเสริมกัน purchase rate รวมยังเป็นตัวชี้วัดหลักที่ใช้สรุปผลได้
  - id: q4
    question: การหยุดทดลองก่อนกำหนดเพราะเห็นว่ายังไม่มีนัยสำคัญ มีความเสี่ยงอะไร
    choices:
      - text: อาจพลาดผลจริงที่ยังไม่ทันแสดงตัวเพราะตัวอย่างยังน้อยไป (statistical power ไม่พอ)
        correct: true
        why: ตัวอย่างในบทเรียนนี้แสดงชัดว่า p-value ที่ 40% ของ session (0.0692) ยังไม่มีนัยสำคัญ แต่พอครบ 100% กลับมีนัยสำคัญชัดเจน
      - text: ไม่มีความเสี่ยงใดๆ เพราะ p-value ที่ได้ยังถูกต้องเสมอ
        why: p-value ที่คำนวณ ณ ตัวอย่างที่ยังไม่ครบ อาจยังไม่สะท้อนผลจริงเพราะ statistical power ยังไม่พอ
      - text: ทำให้ได้ผลบวกลวง (false positive) เสมอ
        why: ในกรณีนี้ความเสี่ยงคือได้ผลลบลวง/สรุปว่าไม่มีผล (miss a real effect) ไม่ใช่ false positive
      - text: ทำให้ต้องเก็บข้อมูลเพิ่มโดยไม่จำเป็น
        why: ตรงข้าม ปัญหาคือเก็บข้อมูล "น้อยเกินไป" ไม่ใช่มากเกินไป
  - id: q5
    question: chi-square test กับ two-proportion z-test บนข้อมูลเดียวกัน ควรให้ข้อสรุปแบบไหน
    choices:
      - text: ควรสอดคล้องกัน เพราะทั้งคู่ทดสอบสมมติฐานเดียวกันด้วยวิธีต่างกัน
        correct: true
        why: ในตัวอย่างนี้ z²≈14.24 ใกล้เคียงกับ chi2≈14.018 มาก และทั้งสอง p-value ก็สรุปไปทางเดียวกัน
      - text: ควรให้ผลตรงข้ามกันเสมอ เพื่อใช้เช็คไขว้
        why: ถ้าให้ผลตรงข้ามกันแปลว่ามีข้อผิดพลาดในการคำนวณ ไม่ใช่พฤติกรรมปกติที่ควรเกิดขึ้น
      - text: ใช้เทียบกันไม่ได้เลยเพราะเป็นสถิติคนละตัว
        why: แม้สูตรจะต่างกัน แต่ทั้งคู่ทดสอบสมมติฐานเดียวกัน (สัดส่วนสองกลุ่มต่างกันหรือไม่) เทียบผลสรุปกันได้
      - text: chi-square เชื่อถือได้มากกว่า z-test เสมอ
        why: ทั้งสองวิธีมีความน่าเชื่อถือใกล้เคียงกันสำหรับข้อมูลแบบนี้ ไม่มีวิธีไหนดีกว่าเสมอไป

summary:
  - two-proportion z-test เทียบสัดส่วนสองกลุ่ม (เช่น purchase rate) ด้วย p_pool, standard error และ z-statistic
  - chi-square test บนตาราง 2×2 คืออีกวิธีที่ทดสอบสมมติฐานเดียวกัน ควรให้ข้อสรุปสอดคล้องกับ z-test
  - ก่อนเชื่อผล A/B test ต้องเช็ค sample ratio mismatch (SRM) ก่อนเสมอ ไม่ว่า p-value จะสวยแค่ไหน
  - ดู funnel ทีละขั้นแทนที่จะดูแค่ metric สุดท้าย อาจเจอ insight ที่ metric รวมซ่อนไว้
  - หยุดทดลองก่อนกำหนดเพราะตัวอย่างยังไม่พอ เสี่ยงพลาดผลจริงที่ยังไม่ทันแสดงตัว ควรกำหนดขนาดตัวอย่างล่วงหน้า

interview:
  - id: i1
    q: ก่อนเชื่อผล A/B test ควรเช็คอะไรก่อนดูที่ p-value
    a: |
      ควรเช็ค sample ratio mismatch (SRM) ก่อนเสมอ คือดูว่าสัดส่วนผู้เข้าทดลองสองกลุ่มใกล้เคียงกับที่ตั้งใจไหม
      (ปกติควรใกล้ 50/50 ถ้าออกแบบมาแบบนั้น) ถ้าสัดส่วนเบี้ยวไปมาก (เช่น 46/54) แปลว่าระบบสุ่มเข้ากลุ่มอาจมีบั๊ก
      ทำให้สองกลุ่มมีองค์ประกอบผู้ใช้ต่างกันไปตั้งแต่แรก ซึ่งจะทำให้ผลการทดสอบทั้งหมด (ไม่ว่า p-value จะสวย
      แค่ไหน) เชื่อถือไม่ได้ นอกจากนี้ควรดู funnel ทีละขั้นด้วย ไม่ใช่แค่ metric สุดท้าย เพื่อให้เข้าใจว่าความ
      ต่างเกิดขึ้นตรงไหนจริงๆ
  - id: i2
    q: อธิบาย sample ratio mismatch และทำไมมันอันตราย
    a: |
      SRM คือสถานการณ์ที่สัดส่วนผู้เข้าทดลองสองกลุ่มไม่ตรงกับที่ออกแบบไว้ เช่น ตั้งใจแบ่ง 50/50 แต่ข้อมูลจริง
      ออกมา 46/54 มันอันตรายเพราะมักเป็นสัญญาณว่ากระบวนการสุ่มเข้ากลุ่ม (randomization) มีบั๊ก เช่น cache,
      redirect, หรือ bot บาง segment ตกไปกลุ่มใดกลุ่มหนึ่งมากผิดปกติ — ถ้าเป็นแบบนั้น สองกลุ่มอาจมีองค์ประกอบ
      ผู้ใช้ต่างกันไปตั้งแต่แรก (ไม่ใช่สุ่มจริง) ทำให้ผลต่างที่วัดได้อาจไม่ได้มาจากตัวแปรที่ทดลองเลย แม้ p-value
      จะดูมีนัยสำคัญก็ตาม จึงต้องเช็คก่อนเชื่อผลทุกครั้ง
  - id: i3
    q: ทีมอยากหยุดทดลองเร็วเพราะเห็นตัวเลขดีขึ้นแล้ว ควรแนะนำยังไง
    a: |
      ควรแนะนำให้กำหนดขนาดตัวอย่าง (sample size) ที่ต้องการล่วงหน้าก่อนเริ่มทดลอง (power analysis) แล้วรอ
      จนเก็บข้อมูลครบตามแผน เพราะ p-value ที่เห็นระหว่างทางอาจยังไม่สะท้อนผลจริง (ตัวอย่างยังน้อยไป สถิติยัง
      ไม่นิ่ง) — ถ้าจำเป็นต้องดูผลระหว่างทางจริงๆ ควรใช้วิธี sequential testing ที่ออกแบบมาสำหรับกรณีนี้
      โดยเฉพาะ แทนที่จะหยุดทันทีที่เห็นตัวเลขดูดีหรือ p < 0.05 ครั้งแรก ซึ่งเพิ่มความเสี่ยงทั้งพลาดผลจริง
      (ถ้าหยุดเร็วไป) และได้ผลบวกลวง (ถ้า peek บ่อยเกินไป)

flashcards:
  - id: c1
    front: sample ratio mismatch (SRM) คืออะไร
    back: สัดส่วนผู้เข้าทดลองสองกลุ่มเบี้ยวไปจากที่ตั้งใจ (เช่น ควรเป็น 50/50 แต่ได้ 46/54) บ่งชี้ว่าการสุ่มเข้ากลุ่มมีปัญหา ต้องเช็คก่อนเชื่อ p-value เสมอ
  - id: c2
    front: สูตร two-proportion z-test มีหน้าตาประมาณไหน
    back: "z = (pB - pA) / se โดย se = sqrt(p_pool*(1-p_pool)*(1/nA+1/nB)) และ p_pool = (bA+bB)/(nA+nB)"
  - id: c3
    front: ทำไมการหยุดทดลองก่อนกำหนดถึงเสี่ยงพลาดผลจริง
    back: ตัวอย่างที่ยังน้อยทำให้ statistical power ไม่พอ p-value ระหว่างทางอาจยังไม่มีนัยสำคัญ ทั้งที่ผลจริงมีอยู่แล้วแค่ยังไม่ทันแสดงตัวให้เห็น
