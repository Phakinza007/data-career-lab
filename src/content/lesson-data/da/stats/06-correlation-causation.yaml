goals:
  - เข้าใจ Pearson correlation coefficient และวิธีตีความค่า r
  - เข้าใจว่า correlation ไม่ได้แปลว่ามีความสัมพันธ์เชิงเหตุ-ผล (causation) เสมอไป
  - รู้จัก confounding variable (ตัวแปรกวน) ที่ทำให้สองตัวแปรดูสัมพันธ์กันทั้งที่ไม่ได้เป็นเหตุเป็นผลกันโดยตรง

examples:
  - id: x1
    title: ราคาสินค้ากับต้นทุนสัมพันธ์กันแค่ไหน
    lang: python
    prompt: |
      ทีมการเงินสังเกตว่าสินค้าที่ต้นทุนสูงมักขายแพง เลยอยากรู้ว่าราคาขาย (price) กับต้นทุน (cost) ของสินค้า
      สัมพันธ์กันแรงแค่ไหน แล้วสรุปได้เลยไหมว่าต้นทุนเป็นตัว "ทำให้" ราคาสูงขึ้นโดยตรง
    steps:
      - text: |
          หา Pearson correlation ระหว่าง `price` กับ `cost` ด้วย `.corr()`
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          r_price_cost = products['price'].corr(products['cost'])
          r_price_cost
      - text: |
          `r` ใกล้ 1 มาก แต่ก่อนสรุปว่าต้นทุนเป็นเหตุของราคา ลองดูราคาเฉลี่ยแยกตามหมวดสินค้า (category) ก่อน —
          ถ้าแต่ละหมวดมีช่วงราคา/ต้นทุนของตัวเองชัดเจน แสดงว่า category อาจเป็นตัวแปรกวนที่กำหนดทั้งคู่พร้อมกัน
        code: |
          import pandas as pd

          products = pd.read_csv("data/products.csv")
          mean_price_by_cat = products.groupby('category')['price'].mean()
          mean_cost_by_cat = products.groupby('category')['cost'].mean()
          mean_price_by_cat, mean_cost_by_cat
    pitfall:
      text: |
        กับดักคือการสรุปตรงๆ ว่า "ต้นทุนสูงทำให้ราคาสูง" (หรือกลับกัน) จากค่า r ตัวเดียวโดยไม่เช็คอะไรเพิ่ม —
        ในความเป็นจริง สินค้าแต่ละหมวด (category) มีทั้งช่วงราคาและอัตราส่วนต้นทุนต่อราคาเป็นของตัวเองอยู่แล้ว
        ตั้งแต่ตอนออกแบบข้อมูล นั่นแปลว่า category คือตัวแปรกวนที่ขับเคลื่อนทั้ง price และ cost พร้อมกัน ไม่ใช่ว่า
        cost ไปกำหนด price โดยตรงเพียงอย่างเดียว (การสรุปเหตุ-ผลจากค่า correlation อย่างเดียวโดยไม่ดูกลไกเบื้องหลัง
        คือสิ่งที่ควรเลี่ยง)

  - id: x2
    title: ส่วนลดกับยอดต่อออเดอร์สัมพันธ์กันจริงไหม
    lang: python
    prompt: |
      ทีมการตลาดเชื่อว่าส่วนลด (discount_pct) น่าจะทำให้ลูกค้าซื้อของมากขึ้น (ยอดต่อออเดอร์สูงขึ้น) ลองเช็คด้วย
      correlation ว่าข้อมูลจริงสนับสนุนความเชื่อนี้ไหม
    steps:
      - text: |
          หายอดต่อออเดอร์ (เฉพาะ completed orders) แล้วดึง discount_pct ต่อออเดอร์มาเทียบ โดยเติมค่าว่าง (ไม่มีส่วนลด)
          ด้วย 0 ก่อน
        code: |
          import pandas as pd

          order_items = pd.read_csv("data/order_items.csv")
          orders = pd.read_csv("data/orders.csv")
          merged = order_items.merge(orders, on="order_id")
          completed = merged[merged["status"] == "completed"].copy()
          completed["line"] = completed["quantity"] * completed["unit_price"]
          order_rev = completed.groupby("order_id")["line"].sum()

          orders_completed = orders[orders["status"] == "completed"].copy()
          orders_completed["discount_pct"] = orders_completed["discount_pct"].fillna(0)
          discount = orders_completed.set_index("order_id")["discount_pct"]
          discount, order_rev
      - text: |
          หา Pearson correlation ระหว่างส่วนลดกับยอดต่อออเดอร์ — pandas จะจับคู่ค่าตาม order_id ให้อัตโนมัติ
        code: |
          import pandas as pd

          order_items = pd.read_csv("data/order_items.csv")
          orders = pd.read_csv("data/orders.csv")
          merged = order_items.merge(orders, on="order_id")
          completed = merged[merged["status"] == "completed"].copy()
          completed["line"] = completed["quantity"] * completed["unit_price"]
          order_rev = completed.groupby("order_id")["line"].sum()

          orders_completed = orders[orders["status"] == "completed"].copy()
          orders_completed["discount_pct"] = orders_completed["discount_pct"].fillna(0)
          discount = orders_completed.set_index("order_id")["discount_pct"]
          r_discount_rev = discount.corr(order_rev)
          r_discount_rev
    pitfall:
      text: |
        กับดักคือการเห็น r ใกล้ 0 แล้วรีบสรุปว่า "ส่วนลดไม่มีผลต่อยอดขายแน่นอน" — ทั้งที่ Pearson correlation
        จับได้แค่ความสัมพันธ์**เชิงเส้น**เท่านั้น ถ้าผลของส่วนลดเป็นรูปแบบไม่เป็นเส้นตรง (เช่น ได้ผลดีเฉพาะบางช่วง)
        หรือถูกปัจจัยอื่นกลบไว้ ค่า r ก็อาจใกล้ 0 ได้ทั้งที่ยังมีความสัมพันธ์เชิงเหตุ-ผลอยู่จริง การไม่เจอ correlation
        ไม่เท่ากับการพิสูจน์ว่าไม่มีผลเชิงเหตุ-ผล

