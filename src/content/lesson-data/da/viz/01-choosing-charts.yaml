exercises:
  - id: e1
    level: basic
    lang: python
    prompt: |
      อยากดูสัดส่วนช่องทางสมัครของลูกค้า (เหมาะกับกราฟแท่งหรือวงกลม) เตรียมจำนวนลูกค้าต่อช่องทางสมัคร
      (channel) เพื่อจะเอาไปวาดกราฟ เก็บไว้ในตัวแปร result
    starter: |
      import pandas as pd

      customers = pd.read_csv("data/customers.csv")
      result = ___
    solution: |
      import pandas as pd

      customers = pd.read_csv("data/customers.csv")
      result = customers["channel"].value_counts()
    check: |
      check_series(result, _sol["result"])
    hints:
      - "`.value_counts()` นับจำนวนลูกค้าของแต่ละช่องทางให้อัตโนมัติ"
  - id: e2
    level: basic
    lang: python
    prompt: |
      การกระจายของราคาสินค้าเป็นยังไง (เหมาะกับ histogram) แบ่งราคาสินค้าเป็นช่วง [0,500], (500,1000],
      (1000,5000], (5000,10000], (10000,30000] แล้วนับจำนวนสินค้าต่อช่วง เพื่อจะเอาไปวาดกราฟ histogram
      เก็บไว้ในตัวแปร result
    starter: |
      import pandas as pd

      products = pd.read_csv("data/products.csv")
      result = ___
    solution: |
      import pandas as pd

      products = pd.read_csv("data/products.csv")
      bins = pd.cut(products["price"], bins=[0, 500, 1000, 5000, 10000, 30000])
      result = bins.value_counts()
    check: |
      check_series(result, _sol["result"])
    hints:
      - "`pd.cut(series, bins=[...])` แบ่งค่าตัวเลขเป็นช่วง แล้ว `.value_counts()` นับจำนวนต่อช่วง"
