goals:
  - จับคู่คำถามกับชนิดกราฟที่ตอบได้ตรงที่สุด (เทรนด์ตามเวลา → เส้น, เทียบหมวดหมู่ → แท่ง, การกระจายของตัวแปรเดียว → histogram/box plot, ความสัมพันธ์ระหว่างตัวแปรตัวเลขสองตัว → scatter, สัดส่วนของทั้งหมด → แท่งซ้อน/วงกลม)
  - รู้ข้อควรระวังของกราฟวงกลม (pie chart) เมื่อมีหลายส่วน และรู้ทางเลือกที่อ่านง่ายกว่า
  - เตรียมข้อมูล (groupby/sort/pivot) ให้อยู่ในรูปที่พร้อมป้อนให้กราฟแต่ละชนิดวาดได้ทันที

examples:
  - id: x1
    title: ยอดขายรายเดือนปี 2025 เปลี่ยนแปลงยังไง (เตรียมข้อมูลสำหรับกราฟเส้น)
    lang: python
    prompt: |
      ผู้บริหารอยากเห็นว่ายอดขายรวมในปี 2025 มีทิศทางขึ้นหรือลงยังไงในแต่ละเดือน — คำถามแบบนี้เกี่ยวกับ
      **เทรนด์ตามเวลา** จึงเหมาะกับกราฟเส้น ซึ่งกราฟเส้นต้องการข้อมูลที่เรียงตามแกนเวลาจากซ้ายไปขวา
    steps:
      - text: |
          หายอดขายต่อออเดอร์ก่อน (เฉพาะออเดอร์ที่ `status == 'completed'`) ด้วยการ merge `order_items`
          กับ `orders` แล้วคำนวณ `quantity * unit_price` ต่อแถว รวมต่อ `order_id`
        code: |
          import pandas as pd

          order_items = pd.read_csv("data/order_items.csv")
          orders = pd.read_csv("data/orders.csv")

          merged = order_items.merge(orders, on="order_id")
          completed = merged[merged["status"] == "completed"].copy()
          completed["line"] = completed["quantity"] * completed["unit_price"]
          completed["month"] = pd.to_datetime(completed["order_date"]).dt.strftime("%Y-%m")
          completed.head()
      - text: |
          ดึงเฉพาะปี 2025 แล้ว `groupby('month')` รวมยอดขาย — ได้ Series ที่ index เรียงตามเวลาอัตโนมัติ
          (ตัวเลขนี้คือสิ่งที่จะเอาไปวาดกราฟเส้น ไม่ใช่ตัวกราฟเอง)
        code: |
          import pandas as pd

          order_items = pd.read_csv("data/order_items.csv")
          orders = pd.read_csv("data/orders.csv")

          merged = order_items.merge(orders, on="order_id")
          completed = merged[merged["status"] == "completed"].copy()
          completed["line"] = completed["quantity"] * completed["unit_price"]
          completed["month"] = pd.to_datetime(completed["order_date"]).dt.strftime("%Y-%m")

          monthly = completed[completed["month"].str.startswith("2025")].groupby("month")["line"].sum()
          monthly   # 2025-01: 1362455 ... 2025-12: 2110990
    pitfall:
      text: |
        ถ้าเผลอเรียง `monthly` ใหม่ตามยอดขาย (`sort_values(ascending=False)`) เหมือนที่จะทำกับกราฟแท่ง
        โค้ดจะรันผ่านและตัวเลขยังถูกทุกตัว แต่ลำดับเดือนจะสลับไม่ตามเวลาแล้ว — เอาไปวาดกราฟเส้นจะได้เส้น
        ที่กระโดดไปมาไม่มีความหมาย เพราะกราฟเส้นต้องพึ่งลำดับแกน x (เวลา) เป็นตัวเล่าเรื่อง ไม่ใช่แค่ค่าที่ถูก
      code: |
        import pandas as pd

        order_items = pd.read_csv("data/order_items.csv")
        orders = pd.read_csv("data/orders.csv")

        merged = order_items.merge(orders, on="order_id")
        completed = merged[merged["status"] == "completed"].copy()
        completed["line"] = completed["quantity"] * completed["unit_price"]
        completed["month"] = pd.to_datetime(completed["order_date"]).dt.strftime("%Y-%m")

        monthly_wrong_order = completed[completed["month"].str.startswith("2025")].groupby("month")["line"].sum()
        monthly_wrong_order = monthly_wrong_order.sort_values(ascending=False)
        monthly_wrong_order
  - id: x2
    title: หมวดสินค้าไหนทำรายได้เยอะที่สุด (เตรียมข้อมูลสำหรับกราฟแท่ง)
    lang: python
    prompt: |
      ทีมสินค้าอยากเทียบว่าหมวดไหนทำรายได้เยอะที่สุด — คำถามแบบนี้คือ**เทียบหมวดหมู่**ที่ไม่ต่อเนื่องกัน จึง
      เหมาะกับกราฟแท่งมากกว่าวงกลม (มี 6 หมวด ขนาดต่างกันมาก วงกลมจะแยกเสี้ยวเล็กๆ ได้ยาก)
    steps:
      - text: |
          หายอดขายต่อออเดอร์ (เฉพาะ completed) แล้ว merge กับ `products` เพื่อดึงคอลัมน์ `category` มาด้วย
        code: |
          import pandas as pd

          order_items = pd.read_csv("data/order_items.csv")
          orders = pd.read_csv("data/orders.csv")
          products = pd.read_csv("data/products.csv")

          completed_orders = orders[orders["status"] == "completed"][["order_id"]]
          merged = order_items.merge(completed_orders, on="order_id")
          merged["line"] = merged["quantity"] * merged["unit_price"]
          merged = merged.merge(products[["product_id", "category"]], on="product_id")
          merged.head()
      - text: |
          `groupby('category')` รวมยอด แล้ว `.sort_values(ascending=False)` เพื่อให้แท่งเรียงจากมากไปน้อย
          (อ่านง่ายกว่าเรียงตามตัวอักษร)
        code: |
          import pandas as pd

          order_items = pd.read_csv("data/order_items.csv")
          orders = pd.read_csv("data/orders.csv")
          products = pd.read_csv("data/products.csv")

          completed_orders = orders[orders["status"] == "completed"][["order_id"]]
          merged = order_items.merge(completed_orders, on="order_id")
          merged["line"] = merged["quantity"] * merged["unit_price"]
          merged = merged.merge(products[["product_id", "category"]], on="product_id")

          cat_rev = merged.groupby("category")["line"].sum().sort_values(ascending=False)
          cat_rev   # Electronics: 19200143 ... Books: 619888
    pitfall:
      text: |
        ถ้าลืมใส่ `.sort_values(ascending=False)` ผลจาก `groupby('category')` จะเรียงตามตัวอักษร (Beauty,
        Books, Electronics, ...) โดยอัตโนมัติ — โค้ดรันได้ปกติและตัวเลขถูกทุกตัว แต่เอาไปวาดกราฟแท่งจะทำให้
        คนอ่านต้องกวาดสายตาหาแท่งที่สูงสุดเอง แทนที่จะเห็นคำตอบทันทีจากแท่งซ้ายสุด
      code: |
        import pandas as pd

        order_items = pd.read_csv("data/order_items.csv")
        orders = pd.read_csv("data/orders.csv")
        products = pd.read_csv("data/products.csv")

        completed_orders = orders[orders["status"] == "completed"][["order_id"]]
        merged = order_items.merge(completed_orders, on="order_id")
        merged["line"] = merged["quantity"] * merged["unit_price"]
        merged = merged.merge(products[["product_id", "category"]], on="product_id")

        cat_rev_alphabetical = merged.groupby("category")["line"].sum()
        cat_rev_alphabetical

