  - id: e7
    level: applied
    lang: python
    prompt: |
      ถ้าอยากรู้ว่าลูกค้าที่สมัครผ่านช่องทางไหนใช้จ่ายเฉลี่ยต่อออเดอร์เยอะที่สุด กราฟชนิดไหนเหมาะที่สุด
      (เทียบหมวดหมู่ → กราฟแท่ง) เตรียมยอดขายเฉลี่ยต่อออเดอร์ (เฉพาะ completed) ต่อช่องทางสมัคร (channel)
      เรียงจากมากไปน้อย เพื่อจะเอาไปวาดกราฟแท่ง เก็บไว้ในตัวแปร result
    starter: |
      import pandas as pd

      order_items = pd.read_csv("data/order_items.csv")
      orders = pd.read_csv("data/orders.csv")
      customers = pd.read_csv("data/customers.csv")
      result = ___
    solution: |
      import pandas as pd

      order_items = pd.read_csv("data/order_items.csv")
      orders = pd.read_csv("data/orders.csv")
      customers = pd.read_csv("data/customers.csv")

      merged = order_items.merge(orders, on="order_id")
      completed = merged[merged["status"] == "completed"].copy()
      completed["line"] = completed["quantity"] * completed["unit_price"]
      order_rev = completed.groupby("order_id")["line"].sum().reset_index()

      order_channel = completed[["order_id", "customer_id"]].drop_duplicates().merge(
          customers[["customer_id", "channel"]], on="customer_id"
      )
      rev_channel = order_rev.merge(order_channel, on="order_id")

      result = rev_channel.groupby("channel")["line"].mean().sort_values(ascending=False)
    check: |
      check_series(result, _sol["result"], ordered=True)
    hints:
      - "หายอดขายรวมต่อออเดอร์ก่อน (groupby order_id) แล้ว merge กับ channel ของลูกค้าที่สั่งออเดอร์นั้น จากนั้น groupby('channel') หาค่าเฉลี่ย"
  - id: e8
    level: challenge
    lang: python
    prompt: |
      เดือนไหนใน 2025 ทำรายได้สูงสุด 3 อันดับแรก (ยอดขายเฉพาะออเดอร์ completed) เพื่อจะเอาไปวาดจุดเน้นบนกราฟ
      เส้น เก็บไว้ในตัวแปร result เรียงจากมากไปน้อย
    starter: |
      import pandas as pd

      order_items = pd.read_csv("data/order_items.csv")
      orders = pd.read_csv("data/orders.csv")
      result = ___
    solution: |
      import pandas as pd

      order_items = pd.read_csv("data/order_items.csv")
      orders = pd.read_csv("data/orders.csv")

      merged = order_items.merge(orders, on="order_id")
      completed = merged[merged["status"] == "completed"].copy()
      completed["line"] = completed["quantity"] * completed["unit_price"]
      completed["month"] = pd.to_datetime(completed["order_date"]).dt.strftime("%Y-%m")

      monthly = completed[completed["month"].str.startswith("2025")].groupby("month")["line"].sum()
      result = monthly.sort_values(ascending=False).head(3)
    check: |
      check_series(result, _sol["result"], ordered=True)
    hints:
      - เหมือนโจทย์ e4 แต่ต่อด้วย sort_values(ascending=False).head(3)

quiz:
  - id: q1
    question: "อยากดูเทรนด์ยอดขายตามเวลา ควรใช้กราฟแบบไหน"
    choices:
      - text: กราฟเส้น (line chart)
        correct: true
        why: กราฟเส้นออกแบบมาให้สายตาไล่ตามทิศทางขึ้น/ลงตามแกนเวลาได้ง่ายที่สุด
      - text: กราฟวงกลม (pie chart)
        why: กราฟวงกลมบอกสัดส่วนของทั้งหมด ไม่ได้สื่อทิศทางการเปลี่ยนแปลงตามเวลา
      - text: Scatter plot
        why: scatter เหมาะกับดูความสัมพันธ์ระหว่างตัวเลขสองตัว ไม่ใช่เทรนด์ตามเวลาต่อเนื่อง
      - text: Box plot
        why: box plot เหมาะกับดูการกระจาย/outlier ของกลุ่ม ไม่ได้เน้นทิศทางตามเวลา
  - id: q2
    question: "อยากเทียบยอดขายระหว่างหมวดสินค้า ควรใช้กราฟแบบไหน"
    choices:
      - text: กราฟแท่ง (bar chart)
        correct: true
        why: การเทียบความยาวแท่งระหว่างหมวดหมู่ที่ไม่ต่อเนื่องกัน สายตาคนอ่านทำได้แม่นยำที่สุด
      - text: กราฟเส้น (line chart)
        why: กราฟเส้นสื่อความต่อเนื่องตามแกน x (มักเป็นเวลา) ไม่เหมาะกับหมวดหมู่ที่ไม่มีลำดับต่อเนื่อง
      - text: Histogram
        why: histogram ใช้ดูการกระจายของตัวแปรตัวเลขตัวเดียว ไม่ใช่เทียบหมวดหมู่
      - text: Scatter plot
        why: scatter ใช้ดูความสัมพันธ์ระหว่างตัวเลขสองตัว ไม่ใช่เทียบยอดรวมของหมวดหมู่
  - id: q3
    question: "ทำไมกราฟวงกลม (pie chart) ที่มีมากกว่า 5-6 ส่วนถึงมักอ่านยาก"
    choices:
      - text: เพราะคนเปรียบเทียบขนาดมุม/พื้นที่โค้งได้แม่นยำน้อยกว่าเปรียบเทียบความยาวแท่ง
        correct: true
        why: นี่คือเหตุผลหลักที่กราฟแท่งเรียงลำดับมักอ่านง่ายกว่าวงกลมเมื่อมีหลายส่วน
      - text: เพราะโปรแกรมส่วนใหญ่วาดวงกลมได้ไม่เกิน 5-6 สี
        why: ข้อจำกัดเรื่องสีไม่ใช่เหตุผลหลัก ปัญหาอยู่ที่การรับรู้ขนาดเสี้ยววงกลมของสายตาคน
      - text: เพราะวงกลมไม่รองรับตัวเลขทศนิยม
        why: วงกลมแสดงสัดส่วนที่เป็นทศนิยมได้ตามปกติ ไม่ใช่ข้อจำกัดจริง
      - text: เพราะวงกลมใช้ได้กับข้อมูลตามเวลาเท่านั้น
        why: วงกลมไม่ได้จำกัดเฉพาะข้อมูลตามเวลา และจริงๆ ไม่เหมาะกับข้อมูลตามเวลาด้วยซ้ำ
  - id: q4
    question: "อยากดูความสัมพันธ์ระหว่างตัวแปรตัวเลขสองตัว ควรใช้กราฟแบบไหน"
    choices:
      - text: Scatter plot
        correct: true
        why: จุดแต่ละจุดแทน 1 แถว ทำให้เห็นรูปแบบความสัมพันธ์ระหว่างตัวเลขสองแกนได้ตรงที่สุด
      - text: กราฟแท่ง (bar chart)
        why: กราฟแท่งเหมาะกับเทียบหมวดหมู่ ไม่ได้ออกแบบมาสำหรับตัวเลขต่อเนื่องสองตัว
      - text: กราฟวงกลม (pie chart)
        why: วงกลมบอกสัดส่วนของทั้งหมด ไม่ได้สื่อความสัมพันธ์ระหว่างตัวเลขสองตัว
      - text: Histogram
        why: histogram ดูการกระจายของตัวแปรตัวเดียว ไม่ใช่ความสัมพันธ์ระหว่างสองตัวแปร

summary:
  - เริ่มจากคำถามที่อยากตอบก่อนเสมอ แล้วค่อยเลือกชนิดกราฟที่ตอบคำถามนั้นได้ตรงที่สุด ไม่ใช่เลือกกราฟที่ถนัดก่อน
  - "เทรนด์ตามเวลา → เส้น, เทียบหมวดหมู่ → แท่ง, การกระจายตัวแปรเดียว → histogram/box plot, ความสัมพันธ์ระหว่างตัวเลขสองตัว → scatter, สัดส่วนของทั้งหมด → แท่งซ้อน/วงกลม (ระวังวงกลมเมื่อมีหลายส่วน)"
  - ก่อนวาดกราฟต้องเตรียมข้อมูลให้อยู่ในรูปที่กราฟนั้นต้องการก่อนเสมอ (groupby/sort/pivot) — เป็นทักษะที่ตรวจสอบได้จริง ส่วนไวยากรณ์การวาดจะเรียนในบทถัดไป

interview:
  - id: i1
    q: ได้โจทย์ "อยากรู้ว่าลูกค้ากลุ่มไหนน่าสนใจที่สุด" แบบกว้างๆ จะเลือกกราฟและเตรียมข้อมูลยังไง
    a: |
      เริ่มจากถามกลับให้คำถามแคบลงก่อนว่า "น่าสนใจ" หมายถึงอะไร — จำนวนคนเยอะ, ใช้จ่ายเยอะ, หรือแนวโน้ม
      เติบโตเร็ว เพราะแต่ละแบบตอบด้วยกราฟคนละชนิด

      ถ้าหมายถึง "กลุ่มไหนใช้จ่ายรวมเยอะที่สุด" (เทียบหมวดหมู่) จะเตรียมข้อมูลแบบ groupby ตามกลุ่มลูกค้า
      (เช่น channel หรือ city) แล้วรวมยอดใช้จ่าย เรียงจากมากไปน้อย ใช้กราฟแท่ง

      ถ้าหมายถึง "แต่ละกลุ่มใช้จ่ายกระจายกว้างแค่ไหน มีลูกค้า VIP โผล่ในกลุ่มไหนบ้าง" จะเปลี่ยนไปใช้ box plot
      แทน เพราะต้องการเห็นการกระจายและ outlier ไม่ใช่แค่ผลรวม

      สรุปคือต้องตีความคำถามกำกวมให้ชัดเจนก่อนเสมอ แล้วค่อยเลือกกราฟ ไม่ใช่เดาชนิดกราฟจากคำถามที่ยังกว้างอยู่
  - id: i2
    q: เจอ dataset ใหม่ ขั้นตอนแรกก่อนเลือกชนิดกราฟควรทำอะไร
    a: |
      ขั้นตอนแรกคือทำความเข้าใจ**คำถามที่จะตอบ**ให้ชัดก่อนเสมอ ไม่ใช่เปิดโปรแกรมแล้วเลือกชนิดกราฟที่ถนัด
      หรือดูสวยที่สุดก่อนแล้วค่อยหาคำถามมาใส่ทีหลัง เพราะลำดับที่กลับกันมักจบด้วยกราฟที่ดูดีแต่ตอบผิดคำถาม

      หลังจากรู้คำถามชัดแล้ว ค่อยดูว่าตัวแปรที่เกี่ยวข้องเป็นชนิดไหน (ตามเวลา, หมวดหมู่, ตัวเลขต่อเนื่อง)
      แล้วจับคู่กับตารางตัดสินใจ (เทรนด์→เส้น, เทียบหมวด→แท่ง, การกระจาย→histogram/box, ความสัมพันธ์→scatter)
      สุดท้ายค่อยเตรียมข้อมูลด้วย groupby/sort/pivot ให้อยู่ในรูปที่กราฟชนิดนั้นต้องการ

flashcards:
  - id: c1
    front: หลักเลือกชนิดกราฟแบบคร่าวๆ มีอะไรบ้าง
    back: เทรนด์ตามเวลา → เส้น, เทียบหมวดหมู่ → แท่ง, การกระจายตัวแปรเดียว → histogram/box plot, ความสัมพันธ์ระหว่างตัวเลขสองตัว → scatter
  - id: c2
    front: ทำไมกราฟแท่งเรียงลำดับมักดีกว่ากราฟวงกลมเมื่อมีหลายส่วน
    back: สายตาคนเทียบความยาวแท่งได้แม่นยำกว่าเทียบมุม/พื้นที่โค้งของวงกลม ยิ่งมีหลายส่วน (>5-6) วงกลมยิ่งแยกเสี้ยวเล็กๆ ได้ยาก
