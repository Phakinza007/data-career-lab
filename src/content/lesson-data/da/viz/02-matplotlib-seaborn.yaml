goals:
  - ใช้ matplotlib วาดกราฟพื้นฐาน (plt.plot, plt.bar, plt.hist, plt.scatter)
  - ใช้ seaborn วาดกราฟสถิติทั่วไปด้วย syntax ที่สั้นกว่าและ default styling ที่อ่านง่ายกว่า (sns.lineplot, sns.barplot, sns.histplot, sns.scatterplot, sns.boxplot)
  - ใส่ title และ axis label ให้กราฟสื่อความหมายได้ด้วยตัวเอง ไม่ต้องให้คนอ่านเดาเอง

examples:
  - id: x1
    title: กราฟเส้นรายได้รายเดือน ปี 2025 (matplotlib)
    lang: python
    prompt: |
      อยากดูว่ารายได้รวมในแต่ละเดือนของปี 2025 เปลี่ยนแปลงยังไง (เฉพาะออเดอร์ที่ completed)
    steps:
      - text: |
          เตรียมข้อมูล `monthly` ก่อน — merge order_items กับ orders เพื่อคำนวณยอดต่อออเดอร์ กรองเฉพาะ
          completed แล้ว groupby ตามเดือน
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          items = pd.read_csv("data/order_items.csv")
          items['line'] = items['quantity'] * items['unit_price']
          merged = items.merge(orders, on='order_id')
          completed = merged[merged['status'] == 'completed'].copy()
          completed['month'] = pd.to_datetime(completed['order_date']).dt.to_period('M').astype(str)
          monthly = completed[completed['month'].str.startswith('2025')].groupby('month')['line'].sum()
          monthly
      - text: |
          วาดกราฟเส้นด้วย `plt.plot()` แล้วใส่ title/xlabel/ylabel ให้ครบ พร้อมหมุนป้ายแกน x
          (`plt.xticks(rotation=45)`) เพราะป้ายเดือนยาว เขียนตรงๆ จะทับกัน
        code: |
          import pandas as pd
          import matplotlib.pyplot as plt

          orders = pd.read_csv("data/orders.csv")
          items = pd.read_csv("data/order_items.csv")
          items['line'] = items['quantity'] * items['unit_price']
          merged = items.merge(orders, on='order_id')
          completed = merged[merged['status'] == 'completed'].copy()
          completed['month'] = pd.to_datetime(completed['order_date']).dt.to_period('M').astype(str)
          monthly = completed[completed['month'].str.startswith('2025')].groupby('month')['line'].sum()

          plt.plot(monthly.index, monthly.values)
          plt.title('รายได้รวมรายเดือน ปี 2025')
          plt.xlabel('เดือน')
          plt.ylabel('รายได้ (บาท)')
          plt.xticks(rotation=45)
    pitfall:
      text: |
        pandas มีเมธอด `.plot()` ในตัวที่วาดกราฟให้เร็วๆ ได้เลยโดยไม่ต้องเรียก matplotlib ตรงๆ
        เช่น `monthly.plot()` — โค้ดนี้รันผ่านไม่มี error แต่ได้กราฟที่ไม่มี title ไม่มีชื่อแกน y ที่สื่อความหมาย
        (แกน x จะใช้ชื่อ index เดิมๆ) คนอ่านที่ไม่รู้บริบทจะไม่เข้าใจว่ากราฟนี้บอกอะไร ทั้งที่โค้ดเพิ่มอีกแค่ 3 บรรทัด
        ก็ได้กราฟที่อ่านเข้าใจได้เองแล้ว (ดูขั้นตอนที่ 2 ด้านบน)
      code: |
        import pandas as pd

        orders = pd.read_csv("data/orders.csv")
        items = pd.read_csv("data/order_items.csv")
        items['line'] = items['quantity'] * items['unit_price']
        merged = items.merge(orders, on='order_id')
        completed = merged[merged['status'] == 'completed'].copy()
        completed['month'] = pd.to_datetime(completed['order_date']).dt.to_period('M').astype(str)
        monthly = completed[completed['month'].str.startswith('2025')].groupby('month')['line'].sum()

        monthly.plot()
  - id: x2
    title: กราฟแท่งรายได้แยกตามหมวดสินค้า (matplotlib)
    lang: python
    prompt: |
      อยากเทียบว่าหมวดสินค้าไหนทำรายได้เยอะที่สุด (ทุกปี เฉพาะออเดอร์ completed)
    steps:
      - text: |
          เตรียมข้อมูล `cat_rev` — merge ให้ถึงตาราง products เพื่อได้คอลัมน์ category แล้ว groupby รวมรายได้
          เรียงจากมากไปน้อยก่อนวาด (เหตุผลว่าทำไมต้องเรียง ดูในขั้นตอน pitfall)
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          items = pd.read_csv("data/order_items.csv")
          products = pd.read_csv("data/products.csv")
          items['line'] = items['quantity'] * items['unit_price']
          merged = items.merge(orders, on='order_id').merge(products, on='product_id')
          completed = merged[merged['status'] == 'completed']
          cat_rev = completed.groupby('category')['line'].sum().sort_values(ascending=False)
          cat_rev
      - text: |
          วาดด้วย `plt.bar()` — ส่ง index (ชื่อหมวด) เป็นแกน x และค่า (รายได้) เป็นแกน y
        code: |
          import pandas as pd
          import matplotlib.pyplot as plt

          orders = pd.read_csv("data/orders.csv")
          items = pd.read_csv("data/order_items.csv")
          products = pd.read_csv("data/products.csv")
          items['line'] = items['quantity'] * items['unit_price']
          merged = items.merge(orders, on='order_id').merge(products, on='product_id')
          completed = merged[merged['status'] == 'completed']
          cat_rev = completed.groupby('category')['line'].sum().sort_values(ascending=False)

          plt.bar(cat_rev.index, cat_rev.values)
          plt.title('รายได้รวมแยกตามหมวดสินค้า')
          plt.xlabel('หมวดสินค้า')
          plt.ylabel('รายได้ (บาท)')
    pitfall:
      text: |
        ถ้าไม่เรียงก่อนวาด (ปล่อยตามลำดับ default ของ groupby ซึ่งเรียงตามตัวอักษร) โค้ดก็ยังรันผ่านไม่มี error
        และตัวเลขก็ยังถูกต้องทุกประการ แต่คนอ่านกราฟจะเทียบ "หมวดไหนเยอะที่สุด" ได้ยากขึ้น เพราะแท่งที่สูงที่สุด
        อาจอยู่ตรงกลางหรือปลายกราฟแทนที่จะอยู่ซ้ายสุด — การเรียงก่อนวาดเป็นสิ่งเล็กๆ ที่ทำให้กราฟอ่านเร็วขึ้นมาก
      code: |
        import pandas as pd
        import matplotlib.pyplot as plt

        orders = pd.read_csv("data/orders.csv")
        items = pd.read_csv("data/order_items.csv")
        products = pd.read_csv("data/products.csv")
        items['line'] = items['quantity'] * items['unit_price']
        merged = items.merge(orders, on='order_id').merge(products, on='product_id')
        completed = merged[merged['status'] == 'completed']
        cat_rev_unsorted = completed.groupby('category')['line'].sum()

        plt.bar(cat_rev_unsorted.index, cat_rev_unsorted.values)
  - id: x3
    title: histogram และ scatter ด้วย seaborn
    lang: python
    prompt: |
      อยากดูการกระจายของราคาสินค้า และความสัมพันธ์ระหว่างราคากับต้นทุน — สองคำถามนี้ตอบด้วย seaborn ได้สั้นกว่า
      matplotlib ดิบๆ
    steps:
      - text: |
          `sns.histplot(data=..., x='price', bins=20)` วาด histogram ได้ในบรรทัดเดียว โดยไม่ต้องคำนวณ bin เอง
          (ต่างจาก `pd.cut()` ที่ต้องทำเองถ้าจะแบ่งช่วงแบบกำหนดเอง)
        code: |
          import pandas as pd
          import seaborn as sns

          products = pd.read_csv("data/products.csv")

          sns.histplot(data=products, x='price', bins=20)
      - text: |
          `sns.scatterplot(data=..., x='price', y='cost')` วาด scatter plot ด้วยการบอกแค่ชื่อคอลัมน์สองคอลัมน์
        code: |
          import pandas as pd
          import seaborn as sns

          products = pd.read_csv("data/products.csv")

          sns.scatterplot(data=products, x='price', y='cost')
    pitfall:
      text: |
        ถ้าลืม `import seaborn as sns` แล้วเรียก `sns.histplot(...)` เลย จะได้ `NameError: name 'sns' is not
        defined` ทันที — นี่เป็น error จริงที่โค้ดรันไม่ผ่านเลย ไม่ใช่แค่กราฟดูแปลกเหมือนสองตัวอย่างก่อนหน้า
        เพราะ seaborn เป็นไลบรารีแยกต่างหาก ไม่ได้ถูก import ติดมากับ pandas หรือ matplotlib โดยอัตโนมัติ
        ต้อง import เองเสมอก่อนเรียกใช้

