  - id: e8
    level: challenge
    lang: python
    prompt: |
      เตรียมข้อมูลสรุปสำหรับดู 2 มุมมองพร้อมกัน: รายได้รวม และจำนวนออเดอร์ ของแต่ละหมวดสินค้า (เฉพาะออเดอร์
      completed) เก็บไว้ในตัวแปร result เป็น DataFrame ที่ index เป็น category มีคอลัมน์ revenue กับ n_orders
    starter: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      items = pd.read_csv("data/order_items.csv")
      products = pd.read_csv("data/products.csv")
      result = ___
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      items = pd.read_csv("data/order_items.csv")
      products = pd.read_csv("data/products.csv")
      items['line'] = items['quantity'] * items['unit_price']
