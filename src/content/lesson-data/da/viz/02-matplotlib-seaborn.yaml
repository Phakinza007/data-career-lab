    check: |
      check_df(result, _sol["result"])
    hints:
      - "ใช้ named aggregation: .agg(revenue=('line', 'sum'), n_orders=('order_id', 'nunique'))"
      - "`nunique()` บนคอลัมน์ order_id นับจำนวนออเดอร์ที่ไม่ซ้ำ (ออเดอร์เดียวอาจมีหลายแถวใน order_items)"
  - id: e9
    level: challenge
    lang: python
    prompt: |
      เตรียมข้อมูลรายได้รายเดือนของปี 2024 และ 2025 รวมกัน ในรูปแบบ long format พร้อมสำหรับ
      `sns.lineplot(data=result, x='month', y='revenue', hue='year')` เก็บไว้ในตัวแปร result เป็น DataFrame
      มีคอลัมน์ year, month (เลข 1-12), revenue
    starter: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      items = pd.read_csv("data/order_items.csv")
      result = ___
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      items = pd.read_csv("data/order_items.csv")
      items['line'] = items['quantity'] * items['unit_price']
      merged = items.merge(orders, on='order_id')
      completed = merged[merged['status'] == 'completed'].copy()
      completed['year'] = pd.to_datetime(completed['order_date']).dt.year
      completed['month'] = pd.to_datetime(completed['order_date']).dt.month
      result = completed.groupby(['year', 'month'])['line'].sum().reset_index().rename(columns={'line': 'revenue'})
    check: |
      check_df(result, _sol["result"])
    hints:
      - "groupby ด้วย list สองคอลัมน์ ['year', 'month'] แล้ว .reset_index() เพื่อให้ year/month กลายเป็นคอลัมน์ปกติ"
      - "long format คือหนึ่งแถวต่อหนึ่ง (year, month) ไม่ใช่ pivot ให้แต่ละปีเป็นคอลัมน์แยกกัน"

quiz:
  - id: q1
    question: seaborn สร้างอยู่บนไลบรารีอะไร
    choices:
      - text: matplotlib
        correct: true
        why: seaborn เป็น wrapper ที่สร้างอยู่บน matplotlib อีกที ไม่ใช่ไลบรารีวาดกราฟแยกอิสระ
      - text: numpy
        why: numpy เป็นไลบรารีคำนวณเชิงตัวเลข ไม่ได้เกี่ยวกับการวาดกราฟโดยตรง
      - text: pandas
        why: pandas เป็นไลบรารีจัดการข้อมูล seaborn อ่านข้อมูลจาก pandas ได้สะดวกแต่ไม่ได้ "สร้างอยู่บน" pandas
      - text: เป็นไลบรารีอิสระ ไม่เกี่ยวกับ matplotlib เลย
        why: ไม่จริง seaborn เรียกใช้ matplotlib เป็นเครื่องมือวาดภาพจริงเบื้องหลังเสมอ
  - id: q2
    question: ข้อดีหลักของ seaborn เทียบกับ matplotlib ดิบๆ คืออะไร
    choices:
      - text: syntax สั้นกว่าและมี default styling ที่อ่านง่ายกว่าสำหรับกราฟสถิติทั่วไป
        correct: true
        why: seaborn ออกแบบมาให้ทำงานกับ DataFrame ได้ตรงๆ และตั้งค่าสีสไตล์ให้อ่านง่ายโดยไม่ต้องปรับเอง
      - text: วาดกราฟได้เร็วกว่าในแง่ performance การประมวลผล
        why: ไม่เกี่ยวกับความเร็วในการประมวลผล seaborn ยังคงเรียก matplotlib เบื้องหลังอยู่ดี
      - text: รองรับชนิดกราฟที่ matplotlib วาดไม่ได้เลย
        why: กราฟส่วนใหญ่ที่ seaborn วาดได้ ก็วาดด้วย matplotlib ดิบๆ ได้เหมือนกัน แค่ต้องเขียนโค้ดเองมากกว่า
      - text: ไม่ต้อง import matplotlib เลย
        why: seaborn ยังพึ่งพา matplotlib อยู่เบื้องหลังเสมอ แค่ผู้ใช้ไม่ต้องเรียก plt เองโดยตรงก็ได้
  - id: q3
    question: กราฟที่ไม่มี title/labels มีปัญหาอะไร
    choices:
      - text: คนอ่านไม่รู้ว่ากราฟกำลังบอกอะไร ต้องเดาหรือถามเพิ่ม
        correct: true
        why: title/label ไม่ได้เปลี่ยนข้อมูล แต่ทำให้กราฟสื่อสารได้ด้วยตัวเองโดยไม่ต้องพึ่งคำอธิบายปากเปล่า
      - text: ทำให้ตัวเลขที่แสดงผิดพลาดไปด้วย
        why: ตัวเลข/ข้อมูลในกราฟยังถูกต้องเหมือนเดิม ปัญหาคือการสื่อสารกับคนอ่าน ไม่ใช่ความถูกต้องของข้อมูล
      - text: ทำให้โค้ดรัน error
        why: กราฟที่ไม่มี title/labels ยังรันผ่านได้ปกติไม่มี error เลย แค่สื่อความหมายได้แย่กว่า
      - text: ไม่มีปัญหาอะไร ถ้าคนวาดเข้าใจข้อมูลอยู่แล้ว
        why: กราฟส่วนใหญ่ทำขึ้นเพื่อให้คนอื่นอ่านต่อ ไม่ใช่แค่คนวาดเข้าใจเองคนเดียว
  - id: q4
    question: "`sns.histplot` กับ `plt.hist` ต่างกันยังไงโดยหลักการ"
    choices:
      - text: ทำสิ่งเดียวกัน (วาด histogram) แค่ syntax และ default styling ต่างกัน seaborn อ่านข้อมูลจาก DataFrame ได้สะดวกกว่า
        correct: true
        why: ทั้งคู่วาด histogram เหมือนกัน seaborn แค่ห่อ matplotlib ให้เขียนสั้นลงและอ่าน DataFrame ได้ตรงๆ
      - text: "`sns.histplot` คำนวณค่าทางสถิติต่างจาก `plt.hist` โดยสิ้นเชิง"
        why: การนับความถี่ต่อช่วงยังใช้หลักการเดียวกัน ไม่ได้มีสูตรคำนวณที่ต่างกันโดยพื้นฐาน
      - text: "`plt.hist` ใช้กับข้อมูลตัวเลขเท่านั้น ส่วน `sns.histplot` ใช้กับข้อความได้ด้วย"
        why: ไม่ใช่ความต่างหลักที่ตั้งใจสื่อในบทนี้ ทั้งคู่ออกแบบมาสำหรับดูการกระจายของข้อมูลตัวเลขเป็นหลัก
      - text: "`sns.histplot` ต้องแปลงข้อมูลเป็น NumPy array ก่อนเสมอ ส่วน `plt.hist` ไม่ต้อง"
        why: ไม่จำเป็น ทั้งสองฟังก์ชันรับ pandas Series/DataFrame ได้โดยตรง

summary:
  - matplotlib คือไลบรารีพื้นฐานสำหรับวาดกราฟ (plt.plot/bar/hist/scatter) ส่วน seaborn เป็น wrapper ที่สร้างอยู่บน matplotlib อีกที ทำให้กราฟสถิติทั่วไปเขียนสั้นลงและมี default styling ที่ดีกว่า
  - กราฟที่ดีต้องมี title และ axis label ที่บอกว่ากำลังแสดงอะไร ไม่ใช่แค่ชื่อคอลัมน์ดิบๆ
  - โจทย์ในบทนี้ตรวจแค่ข้อมูลที่เตรียมไว้ป้อนกราฟ (data prep) เพราะทักษะที่สำคัญที่สุดคือการสรุปข้อมูลให้ถูกต้องก่อนวาดกราฟ

interview:
  - id: i1
    q: ทำไมการใส่ title/axis labels ที่ชัดเจนถึงสำคัญพอๆ กับตัวข้อมูลที่ถูกต้อง
    a: |
      ข้อมูลที่ถูกต้องแต่สื่อสารไม่ได้ ก็เหมือนไม่มีประโยชน์ในทางปฏิบัติ — คนอ่านกราฟ (เช่นผู้บริหาร) มักไม่มีเวลา
      ไล่ดูโค้ดหรือถามที่มาของแต่ละแกน ถ้ากราฟไม่มี title/label ที่ชัดเจน คนอ่านต้องเดาเอง หรือกลับมาถามคนทำอีกที
      ซึ่งทำให้ insight ที่ควรจะสื่อสารได้เร็วกลับช้าลงหรือถูกตีความผิด title/label ที่ดีทำให้กราฟ "ยืนได้ด้วยตัวเอง"
      แม้จะถูกส่งต่อไปโดยไม่มีคนอธิบายประกอบ
  - id: i2
    q: ถ้าต้องเลือกระหว่าง matplotlib กับ seaborn สำหรับงานสำรวจข้อมูลเร็วๆ (exploratory analysis) จะเลือกอะไรและทำไม
    a: |
      สำหรับงานสำรวจข้อมูลเร็วๆ ที่ข้อมูลอยู่ในรูป DataFrame อยู่แล้ว seaborn มักเป็นตัวเลือกที่เร็วกว่า เพราะเขียน
      โค้ดสั้นกว่าและได้กราฟที่อ่านง่ายโดยไม่ต้องปรับสไตล์เอง (เช่น sns.boxplot เทียบหลายกลุ่ม หรือ sns.histplot
      ที่จัดการ bin ให้อัตโนมัติ) แต่ถ้าต้องการควบคุมรายละเอียดที่ seaborn ไม่รองรับตรงๆ หรือทำกราฟที่ไม่ธรรมดา
      (custom layout ซับซ้อน) ก็ยังต้องพึ่ง matplotlib โดยตรง — สองไลบรารีนี้ใช้ร่วมกันได้เสมอ ไม่ต้องเลือกอย่างใดอย่างหนึ่งตลอดไป

