      merged = order_items.merge(completed[['order_id', 'order_date']], on='order_id')
      merged['month'] = merged['order_date'].str[:7]
      monthly = merged[merged['month'].str.startswith('2025')].groupby('month')['line'].sum()

      avg_monthly_2025 = monthly.mean()
      n_above_avg = int((monthly > avg_monthly_2025).sum())
    check: |
      check_value(n_above_avg, _sol["n_above_avg"], name="n_above_avg")
    hints:
      - "เทียบ Series `monthly` กับ `.mean()` ของมันเองด้วย `>` แล้วนับด้วย `.sum()`"
  - id: e8
    level: challenge
    lang: python
    prompt: |
      เตรียมตาราง 2 แถวสำหรับ KPI card สรุป: คอลัมน์ metric, value โดยแถวแรกคือ ("Nov revenue", รายได้
      เดือน พ.ย. 2025) และแถวสองคือ ("MoM % change", % เปลี่ยนแปลงเดือน พ.ย. เทียบ ต.ค. 2025 ปัด 2 ตำแหน่ง
      — ต้องตรงกับค่าที่คำนวณใน e1/e3) เก็บไว้ในตัวแปร result
    starter: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      result = ___
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")

      completed = orders[orders['status'] == 'completed'].copy()
      order_items = order_items.copy()
      order_items['line'] = order_items['quantity'] * order_items['unit_price']
      merged = order_items.merge(completed[['order_id', 'order_date']], on='order_id')
      merged['month'] = merged['order_date'].str[:7]
      monthly = merged[merged['month'].str.startswith('2025')].groupby('month')['line'].sum()

      nov_revenue = monthly['2025-11']
      oct_revenue = monthly['2025-10']
      mom_pct = round((nov_revenue - oct_revenue) / oct_revenue * 100, 2)

      result = pd.DataFrame({
          'metric': ['Nov revenue', 'MoM % change'],
          'value': [nov_revenue, mom_pct],
      })
    check: |
      check_df(result, _sol["result"])
    hints:
      - "สร้างด้วย `pd.DataFrame({'metric': [...], 'value': [...]})` ค่าต้องตรงกับ nov_revenue และ mom_pct"

quiz:
  - id: q1
    question: หลักการสำคัญที่สุดของ dashboard ที่ดีคืออะไร
    choices:
      - text: ตอบคำถามหลักได้ทันทีที่เปิดดู โดยไม่ต้อง scroll หรือคลิกกรองเพิ่ม
        correct: true
        why: นี่คือเป้าหมายหลักของ dashboard — ถ้าผู้อ่านต้องขุดหาคำตอบเอง dashboard นั้นยังทำหน้าที่ไม่สำเร็จ
      - text: ต้องมีกราฟให้ครบทุกชนิดที่ทำได้ในหนึ่งหน้า
        why: ยิ่งมีกราฟที่ไม่เกี่ยวข้องกันเยอะ ยิ่งทำให้หาคำตอบยากขึ้น ไม่ใช่ง่ายขึ้น
      - text: ต้องใช้สีสันให้มากที่สุดเพื่อความสวยงาม
        why: ความสวยงามไม่ใช่เป้าหมายหลัก ความชัดเจนและตอบคำถามได้เร็วต่างหากที่สำคัญ
      - text: ต้องอัปเดตข้อมูลแบบเรียลไทม์เสมอ
        why: ความถี่ในการอัปเดตเป็นเรื่องรอง หลักการเรื่องโครงสร้างและความชัดเจนสำคัญกว่า
  - id: q2
    question: โครงสร้างที่ dashboard งานจริงใช้บ่อยที่สุดประกอบด้วยอะไรบ้าง
    choices:
      - text: KPI card (ตัวเลขสรุป+% เปลี่ยนแปลง) + กราฟเทรนด์ + breakdown ย่อย
        correct: true
        why: สามส่วนนี้ตอบคำถามคนละมุม — ตอนนี้เป็นยังไง, แนวโน้มไปทางไหน, มาจากส่วนไหนบ้าง
      - text: ตารางข้อมูลดิบทั้งหมดแบบไม่ผ่านการสรุป
        why: ตารางดิบไม่ตอบคำถามได้เร็ว ต้องสรุปเป็น KPI/เทรนด์/breakdown ก่อน
      - text: กราฟวงกลมอย่างเดียวหลายๆ วง
        why: กราฟวงกลมอ่านยากเมื่อมีหลายส่วน และไม่ครอบคลุมมุมมองเทรนด์กับ breakdown
      - text: ข้อความสรุปแบบพารากราฟยาวๆ ไม่มีกราฟ
        why: dashboard เน้นให้เห็นภาพและตัวเลขได้เร็ว ข้อความยาวขัดกับเป้าหมายนั้น
  - id: q3
    question: ทำไมความสม่ำเสมอของสี/หน่วย/การปัดเศษถึงสำคัญทั่วทั้ง dashboard
    choices:
      - text: ลดภาระการตีความของผู้อ่าน ทำให้เทียบกราฟต่างๆ ในหน้าเดียวกันได้เร็วขึ้น
        correct: true
        why: ถ้าความหมายของสีหรือหน่วยเปลี่ยนไปมาในแต่ละกราฟ ผู้อ่านต้องหยุดคิดใหม่ทุกครั้ง ทำให้อ่านช้าลง
      - text: เพื่อให้ dashboard ดูมีสีสันสวยงามมากขึ้น
        why: ความสม่ำเสมอเน้นเรื่องความชัดเจนในการสื่อสาร ไม่ใช่ความสวยงามเป็นหลัก
      - text: เพราะเครื่องมือ BI บังคับให้ใช้สีเดียวกันทั้งไฟล์อยู่แล้ว
        why: เครื่องมือ BI ส่วนใหญ่ปรับสี/หน่วยแยกกันได้อิสระ ความสม่ำเสมอเป็นวินัยของผู้สร้าง ไม่ใช่ข้อบังคับของเครื่องมือ
      - text: ไม่สำคัญ ตราบใดที่ตัวเลขในแต่ละกราฟถูกต้อง
        why: ตัวเลขถูกต้องอย่างเดียวไม่พอ ถ้าความหมายของสี/หน่วยไม่ตรงกัน ผู้อ่านจะตีความรวมกันผิดได้ง่าย

summary:
  - dashboard ที่ดีตอบคำถามหลักได้ทันทีที่เปิดดู ไม่ต้อง scroll หรือคลิกกรองเพิ่ม
  - โครงสร้างที่ใช้บ่อย คือ KPI card (ตัวเลข+% เปลี่ยนแปลง) + กราฟเทรนด์ + breakdown ย่อย
  - ความสม่ำเสมอของสี หน่วย และการปัดเศษทั่วทั้ง dashboard ลดภาระการตีความของผู้อ่าน
  - เครื่องมืองานจริง (Power BI, Tableau, Looker Studio) ใช้แนวคิดเดียวกับที่ฝึกด้วย pandas/matplotlib เพียงแค่เปลี่ยนวิธีสร้างจากเขียนโค้ดเป็นลาก-วาง

interview:
  - id: i1
    q: ถ้าต้องออกแบบ dashboard สรุปยอดขายให้ผู้บริหารดูทุกเช้า จะใส่อะไรบ้างและทำไม
    a: |
      เริ่มจาก KPI card ด้านบนสุด: ยอดขายเมื่อวาน/เดือนนี้ พร้อม % เปลี่ยนแปลงเทียบวันก่อน/เดือนก่อน
      (แสดงทั้งตัวเลขดิบและ % คู่กันเสมอ พร้อมสีเขียว/แดงบอกทิศทาง) เพราะนี่คือคำถามแรกที่ผู้บริหารอยากรู้
      เสมอ: "วันนี้ดีขึ้นหรือแย่ลง"

      ต่อด้วยกราฟเทรนด์ (เส้น) แสดงยอดขายย้อนหลัง 30-90 วันหรือรายเดือนย้อนหลังทั้งปี เพื่อให้เห็นภาพว่า
      ตัวเลขล่าสุดอยู่ในบริบทไหน เป็นจุดพีคหรือจุดต่ำผิดปกติหรือเปล่า

      แล้วปิดท้ายด้วย breakdown อย่างน้อยหนึ่งมุม เช่น รายได้แยกตามหมวดสินค้าหรือช่องทางขาย (กราฟแท่ง
      เรียงมากไปน้อย) เพื่อตอบว่าตัวเลขรวมที่เห็นมาจากส่วนไหนเป็นหลัก ถ้ามีที่ว่างอาจเพิ่มอีกหนึ่ง breakdown
      (เช่น ตามภูมิภาคหรือลูกค้าใหม่/เก่า) แต่จะไม่ยัดเกิน 1 หน้าจอ และรักษาสี/หน่วย/การปัดเศษให้เหมือนกัน
      ทั้งหน้า เพื่อให้ผู้บริหารกวาดตาดูรอบเดียวแล้วเข้าใจสถานการณ์ได้ทันที ไม่ต้องมาถามเพิ่ม

