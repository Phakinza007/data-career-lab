goals:
  - dashboard ที่ดีตอบคำถามหลักได้ในสายตาเดียว ไม่ต้อง scroll หรือคลิกเพิ่ม
  - KPI card + กราฟเทรนด์ + breakdown คือโครงสร้างที่ใช้บ่อยที่สุดในงานจริง
  - รักษาความสม่ำเสมอ (สี, หน่วย, การปัดเศษ) ทั่วทั้ง dashboard เพื่อลดภาระการตีความ
  - เข้าใจภาพรวมของเครื่องมือในงานจริง (Power BI, Tableau, Looker Studio) เทียบกับ matplotlib/seaborn

examples:
  - id: x1
    title: "KPI card: รายได้เดือนนี้เทียบเดือนก่อนหน้า"
    lang: python
    prompt: |
      ผู้บริหารอยากเห็นตัวเลขเดียวทุกเช้า: เดือนนี้ยอดขายดีขึ้นหรือแย่ลงเมื่อเทียบกับเดือนก่อน
      นี่คือ KPI card ที่ง่ายและใช้บ่อยที่สุด
    steps:
      - text: |
          เตรียมข้อมูลรายได้รายเดือนของปี 2025 (เฉพาะออเดอร์ที่ status เป็น completed) เหมือนที่เคยทำในบทก่อนๆ
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")

          completed = orders[orders['status'] == 'completed'].copy()
          order_items = order_items.copy()
          order_items['line'] = order_items['quantity'] * order_items['unit_price']
          merged = order_items.merge(completed[['order_id', 'order_date']], on='order_id')
          merged['month'] = merged['order_date'].str[:7]
          monthly = merged[merged['month'].str.startswith('2025')].groupby('month')['line'].sum()
          monthly
      - text: |
          คำนวณ KPI การ์ด: รายได้เดือนล่าสุด (พ.ย. 2025) เทียบกับเดือนก่อนหน้า (ต.ค. 2025) เป็น % เปลี่ยนแปลง
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")

          completed = orders[orders['status'] == 'completed'].copy()
          order_items = order_items.copy()
          order_items['line'] = order_items['quantity'] * order_items['unit_price']
          merged = order_items.merge(completed[['order_id', 'order_date']], on='order_id')
          merged['month'] = merged['order_date'].str[:7]
          monthly = merged[merged['month'].str.startswith('2025')].groupby('month')['line'].sum()

          nov_revenue = monthly['2025-11']
          oct_revenue = monthly['2025-10']
          mom_pct = round((nov_revenue - oct_revenue) / oct_revenue * 100, 2)
          nov_revenue, oct_revenue, mom_pct
      - text: |
          จัดเป็นข้อความสำหรับ KPI card — โชว์ตัวเลขดิบ**คู่กับ** % เปลี่ยนแปลงเสมอ (ของจริงจะใส่สีเขียว/แดง
          กับลูกศรขึ้น/ลงกำกับด้วย เพื่อให้สายตากวาดผ่านแล้วรู้ทันทีว่าดีขึ้นหรือแย่ลง โดยไม่ต้องอ่านตัวเลข)
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")

          completed = orders[orders['status'] == 'completed'].copy()
          order_items = order_items.copy()
          order_items['line'] = order_items['quantity'] * order_items['unit_price']
          merged = order_items.merge(completed[['order_id', 'order_date']], on='order_id')
          merged['month'] = merged['order_date'].str[:7]
          monthly = merged[merged['month'].str.startswith('2025')].groupby('month')['line'].sum()

          nov_revenue = monthly['2025-11']
          oct_revenue = monthly['2025-10']
          mom_pct = round((nov_revenue - oct_revenue) / oct_revenue * 100, 2)

          kpi_text = f"รายได้ พ.ย. 2025: {nov_revenue:,} บาท ({mom_pct:+.2f}% เทียบเดือนก่อน)"
          kpi_text
  - id: x2
    title: "trend + breakdown ในหน้าเดียว ด้วย plt.subplots"
    lang: python
    prompt: |
      อยากทำ dashboard หนึ่งหน้าที่โชว์ทั้งเทรนด์รายได้รายเดือน (ซ้าย) และรายได้แยกตามหมวดสินค้า (ขวา)
      พร้อมกัน — นี่คือรูปแบบ "trend + breakdown ข้างกัน" ที่ dashboard จริงใช้บ่อยที่สุด
    steps:
      - text: |
          สร้าง figure แบบ 1 แถว 2 คอลัมน์ด้วย `plt.subplots(1, 2)` — ช่องซ้ายเป็นกราฟเส้น (เทรนด์)
          ช่องขวาเป็นกราฟแท่ง (breakdown ตามหมวดสินค้า เรียงมากไปน้อย)
        code: |
          import pandas as pd
          import matplotlib.pyplot as plt

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")
          products = pd.read_csv("data/products.csv")

          completed = orders[orders['status'] == 'completed'].copy()
          order_items = order_items.copy()
          order_items['line'] = order_items['quantity'] * order_items['unit_price']

          by_month = order_items.merge(completed[['order_id', 'order_date']], on='order_id')
          by_month['month'] = by_month['order_date'].str[:7]
          monthly = by_month[by_month['month'].str.startswith('2025')].groupby('month')['line'].sum()

          by_cat = order_items.merge(completed[['order_id']], on='order_id')
          by_cat = by_cat.merge(products[['product_id', 'category']], on='product_id')
          cat_rev = by_cat.groupby('category')['line'].sum().sort_values(ascending=False)

          fig, axes = plt.subplots(1, 2, figsize=(11, 4))
          axes[0].plot(monthly.index, monthly.values, marker='o')
          axes[0].set_title('เทรนด์: รายได้รายเดือน 2025')
          axes[0].tick_params(axis='x', rotation=45)

          axes[1].bar(cat_rev.index, cat_rev.values)
          axes[1].set_title('breakdown: รายได้ตามหมวดสินค้า')
          axes[1].tick_params(axis='x', rotation=45)

          fig.tight_layout()
      - text: |
          เพิ่มหัวข้อรวมของทั้ง dashboard ด้วย `fig.suptitle(...)` เพื่อบอกภาพรวมว่าทั้งสองกราฟกำลังตอบ
          คำถามชุดเดียวกัน (สรุปยอดขาย) ไม่ใช่สองเรื่องที่ไม่เกี่ยวกัน
        code: |
          import pandas as pd
          import matplotlib.pyplot as plt

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")
          products = pd.read_csv("data/products.csv")

          completed = orders[orders['status'] == 'completed'].copy()
          order_items = order_items.copy()
          order_items['line'] = order_items['quantity'] * order_items['unit_price']

          by_month = order_items.merge(completed[['order_id', 'order_date']], on='order_id')
          by_month['month'] = by_month['order_date'].str[:7]
          monthly = by_month[by_month['month'].str.startswith('2025')].groupby('month')['line'].sum()

          by_cat = order_items.merge(completed[['order_id']], on='order_id')
          by_cat = by_cat.merge(products[['product_id', 'category']], on='product_id')
          cat_rev = by_cat.groupby('category')['line'].sum().sort_values(ascending=False)

          fig, axes = plt.subplots(1, 2, figsize=(11, 4))
          axes[0].plot(monthly.index, monthly.values, marker='o')
          axes[0].set_title('เทรนด์: รายได้รายเดือน 2025')
          axes[0].tick_params(axis='x', rotation=45)

          axes[1].bar(cat_rev.index, cat_rev.values)
          axes[1].set_title('breakdown: รายได้ตามหมวดสินค้า')
          axes[1].tick_params(axis='x', rotation=45)

          fig.suptitle('สรุปยอดขาย: เทรนด์รายเดือน (ซ้าย) และหมวดสินค้า (ขวา)')
          fig.tight_layout()
    pitfall:
      text: |
        ปัญหาที่พบบ่อยกว่าคือการยัดกราฟที่ไม่เกี่ยวข้องกันหลายใบลงในหน้าจอเดียว (เช่น รายได้, จำนวนลูกค้าใหม่,
        อัตราการคืนสินค้า, เวลาตอบแชท ปนกันหมด) — บังคับให้ผู้อ่านต้องเสาะหาเองว่าอันไหนสำคัญกับคำถามที่ตัวเอง
        มีอยู่ในหัว dashboard ที่ดีควรตอบคำถามหลัก**ชุดเดียว**ต่อหนึ่งหน้าจอ ถ้ามีหลายคำถามให้แยกเป็นหลายหน้า
        หรือหลาย tab แทนที่จะยัดรวมกัน

