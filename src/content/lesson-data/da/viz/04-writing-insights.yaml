goals:
  - เข้าใจโครงสร้างของ insight ที่ดี (สิ่งที่เปลี่ยน + ขนาดที่เปลี่ยน + เทียบกับอะไร + แล้วไง)
  - คำนวณ insight จริงจากข้อมูล ไม่ใช่แค่บรรยายกราฟเฉยๆ (Pareto และ seasonal effect)
  - เลือก baseline ที่เหมาะสมเวลาเปรียบเทียบตัวเลข เพราะเปลี่ยน baseline ผลลัพธ์เปลี่ยนได้มาก

examples:
  - id: x1
    title: "Insight แบบ Pareto: ลูกค้า 20% แรกสร้างรายได้เท่าไร"
    lang: python
    prompt: |
      ผู้บริหารถามว่า "ลูกค้ากลุ่มไหนสำคัญที่สุด" อยากได้คำตอบที่มีตัวเลขชัดเจน ไม่ใช่แค่คำบรรยายกว้างๆ
      ว่า "ลูกค้าบางกลุ่มสำคัญกว่ากลุ่มอื่น"
    steps:
      - text: |
          รวมยอดสั่งซื้อ (เฉพาะออเดอร์ที่ completed) เป็นรายได้ต่อลูกค้าหนึ่งคน เก็บไว้ในตัวแปร `cust_rev`
          เรียงจากมากไปน้อย
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")

          completed = orders[orders['status'] == 'completed']
          items = order_items.merge(completed[['order_id', 'customer_id']], on='order_id')
          items['line'] = items['quantity'] * items['unit_price']

          cust_rev = items.groupby('customer_id')['line'].sum().sort_values(ascending=False)
          cust_rev.head()
      - text: |
          หาว่าลูกค้ากลุ่ม 20% แรก (เรียงรายได้มากไปน้อย) มีกี่คน และสร้างรายได้กี่ % ของรายได้รวมทั้งหมด
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          order_items = pd.read_csv("data/order_items.csv")

          completed = orders[orders['status'] == 'completed']
          items = order_items.merge(completed[['order_id', 'customer_id']], on='order_id')
          items['line'] = items['quantity'] * items['unit_price']

          cust_rev = items.groupby('customer_id')['line'].sum().sort_values(ascending=False)
          top20_n = int(len(cust_rev) * 0.20)
          top20_share_pct = round(cust_rev.head(top20_n).sum() / cust_rev.sum() * 100, 2)
          top20_n, top20_share_pct
      - text: |
          ประกอบตัวเลขที่ได้เป็นประโยค insight ที่มีครบ 4 ส่วน: "อะไรเปลี่ยน" (การกระจายรายได้ไม่เท่ากัน)
          + "เท่าไร" (58.75% จาก 20% ของลูกค้า) + "เทียบกับอะไร" (รายได้รวมทั้งหมด) + "แล้วไง"
          (การรักษาลูกค้ากลุ่มนี้ไว้สำคัญกว่าการหาลูกค้าใหม่จำนวนมาก)
        code: |
          n_paying_customers = 2707
          top20_n = 541
          top20_share_pct = 58.75

          insight = (
              f"รายได้กระจุกตัวสูง: ลูกค้ากลุ่ม 20% แรก ({top20_n} คน จาก {n_paying_customers} คน) "
              f"สร้างรายได้ถึง {top20_share_pct}% ของรายได้รวม ดังนั้นการรักษาลูกค้ากลุ่มนี้ไว้ "
              f"สำคัญกว่าการพยายามหาลูกค้าใหม่จำนวนมาก"
          )
          insight
    pitfall:
      text: |
        การเขียนแค่ "ลูกค้าบางกลุ่มสร้างรายได้เยอะกว่ากลุ่มอื่น" โดยไม่มีตัวเลขกำกับเลย เป็นประโยคที่จริง
        แต่ไม่มีประโยชน์ เพราะผู้อ่านไม่รู้ว่า "เยอะกว่า" นั้นหมายถึงเยอะกว่านิดหน่อยหรือกระจุกตัวรุนแรงขนาด
        58.75% — insight ที่ใช้งานได้จริงต้องมีขนาด (ตัวเลข) กำกับเสมอ
  - id: x2
    title: "Insight ตามฤดูกาล: ยอดออเดอร์ พ.ย.-ธ.ค. สูงกว่าปกติแค่ไหน"
    lang: python
    prompt: |
      ผู้บริหารสังเกตว่าช่วงปลายปีขายดีกว่าปกติ อยากได้ตัวเลขที่ชัดเจนเพื่อใช้วางแผนสต็อกและกำลังคนปีหน้า
    steps:
      - text: |
          นับจำนวนออเดอร์ completed ต่อเดือน (รวมทุกปีที่มีในข้อมูล เข้าด้วยกันตามเลขเดือน 1-12)
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          completed = orders[orders['status'] == 'completed'].copy()
          completed['order_date'] = pd.to_datetime(completed['order_date'])
          completed['month'] = completed['order_date'].dt.month

          monthly_by_month = completed.groupby('month').size()
          monthly_by_month
      - text: |
          เทียบค่าเฉลี่ยของเดือน พ.ย./ธ.ค. กับค่าเฉลี่ยของอีก 10 เดือนที่เหลือ (baseline คือ "เดือนอื่นๆ
          ทั้งหมด" ไม่ใช่แค่เดือนใดเดือนหนึ่ง)
        code: |
          import pandas as pd

          orders = pd.read_csv("data/orders.csv")
          completed = orders[orders['status'] == 'completed'].copy()
          completed['order_date'] = pd.to_datetime(completed['order_date'])
          completed['month'] = completed['order_date'].dt.month

          monthly_by_month = completed.groupby('month').size()
          nov_dec_avg = round(monthly_by_month.loc[[11, 12]].mean(), 1)
          other_avg = round(monthly_by_month.drop([11, 12]).mean(), 1)
          pct_higher = round((nov_dec_avg - other_avg) / other_avg * 100, 1)
          nov_dec_avg, other_avg, pct_higher
      - text: |
          ประกอบเป็นประโยค insight ที่ระบุ baseline ชัดเจนและมี "แล้วไง"
        code: |
          nov_dec_avg = 809.0
          other_avg = 461.4
          pct_higher = 75.3

          insight = (
              f"ยอดออเดอร์เดือน พ.ย.-ธ.ค. สูงกว่าเดือนอื่นๆ เฉลี่ย {pct_higher}% "
              f"({nov_dec_avg} เทียบกับ {other_avg} ออเดอร์/เดือน) "
              f"ทีมควรเตรียมสต็อกและกำลังคนฝ่ายจัดส่งให้เพียงพอล่วงหน้าก่อนเข้าช่วงปลายปี"
          )
          insight
    pitfall:
      text: |
        ถ้าเทียบเดือน พ.ย.-ธ.ค. กับแค่เดือนที่ใกล้ที่สุดเดือนเดียว (เช่น ต.ค.) แทนที่จะเทียบกับค่าเฉลี่ย
        ของเดือนอื่นๆ ทั้งหมด ตัวเลข % ที่ได้อาจดูสูงหรือต่ำผิดปกติไปตามความบังเอิญของเดือนนั้นเดือนเดียว
        — เวลาเขียน insight ที่เปรียบเทียบ ต้องระบุเสมอว่า baseline ที่ใช้เทียบคืออะไร

