    starter: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.linear_model import LogisticRegression

      model = LogisticRegression(max_iter=2000).fit(X_train, y_train)
      gain_pp = ___
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.linear_model import LogisticRegression

      model = LogisticRegression(max_iter=2000).fit(X_train, y_train)
      baseline_acc = max(y_test.mean(), 1 - y_test.mean())
      gain_pp = round((model.score(X_test, y_test) - baseline_acc) * 100, 2)
    check: |
      check_value(gain_pp, _sol["gain_pp"], name="gain_pp", tol=0.05)
    hints:
      - "เอา accuracy ของโมเดลลบ baseline แล้วคูณ 100"
  - id: "e8"
    level: "challenge"
    lang: "python"
    prompt: |
      ลองเพิ่ม feature "จำนวนออเดอร์ทั้งหมดของลูกค้า" (n_orders นับจาก data/orders.csv) เข้าไปแล้วเทรนใหม่ (แบ่งข้อมูลแบบเดิม) เก็บ accuracy บนชุดทดสอบไว้ในตัวแปร leaky_acc
    starter: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      from sklearn.model_selection import train_test_split
      from sklearn.linear_model import LogisticRegression

      orders = pd.read_csv("data/orders.csv")
      leaky_acc = ___
    solution: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      from sklearn.model_selection import train_test_split
      from sklearn.linear_model import LogisticRegression

      orders = pd.read_csv("data/orders.csv")
      n_orders = orders.groupby('customer_id').size().rename('n_orders')
      df2 = df.merge(n_orders, on='customer_id')
      X2 = pd.get_dummies(df2.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y2 = df2['repeated']
      X2_train, X2_test, y2_train, y2_test = train_test_split(X2, y2, test_size=0.25, random_state=42, stratify=y2)
      leaky_model = LogisticRegression(max_iter=5000).fit(X2_train, y2_train)
      leaky_acc = leaky_model.score(X2_test, y2_test)
    check: |
      check_value(leaky_acc, _sol["leaky_acc"], name="leaky_acc", tol=0.001)
    hints:
      - "นับออเดอร์ด้วย orders.groupby(\"customer_id\").size() แล้ว merge เข้า df ก่อน get_dummies"
  - id: "e9"
    level: "challenge"
    lang: "python"
    prompt: |
      ผลจากข้อ e8 ดีจนน่าสงสัยไหม ตอบเป็น True/False โดยถือว่า accuracy > 0.95 คือน่าสงสัยว่ามี leakage เก็บไว้ในตัวแปร is_leaky
    starter: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      from sklearn.model_selection import train_test_split
      from sklearn.linear_model import LogisticRegression

      orders = pd.read_csv("data/orders.csv")
      is_leaky = ___
    solution: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      from sklearn.model_selection import train_test_split
      from sklearn.linear_model import LogisticRegression

      orders = pd.read_csv("data/orders.csv")
      n_orders = orders.groupby('customer_id').size().rename('n_orders')
      df2 = df.merge(n_orders, on='customer_id')
      X2 = pd.get_dummies(df2.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y2 = df2['repeated']
      X2_train, X2_test, y2_train, y2_test = train_test_split(X2, y2, test_size=0.25, random_state=42, stratify=y2)
      leaky_model = LogisticRegression(max_iter=5000).fit(X2_train, y2_train)
      leaky_acc = leaky_model.score(X2_test, y2_test)
      is_leaky = leaky_acc > 0.95
    check: |
      check_value(is_leaky, _sol["is_leaky"], name="is_leaky")
    hints:
      - "ใช้ผลลัพธ์แบบเดียวกับ e8 แล้วเทียบกับ 0.95"
quiz:
  - id: "q1"
    question: "ในโจทย์ supervised learning 'target' (y) คืออะไร"
    choices:
      - text: "ข้อมูลทั้งหมดที่ป้อนเข้าโมเดล"
        why: "นั่นคือ features (X)"
      - text: "ค่าที่เราอยากให้โมเดลทำนาย เช่น repeated"
        correct: true
        why: "ถูกต้อง — target คือคำตอบที่โมเดลเรียนรู้จะทำนาย"
      - text: "ชื่อของอัลกอริทึมที่ใช้"
        why: "อัลกอริทึม/โมเดลไม่ใช่ target"
      - text: "ผลลัพธ์ที่ได้จาก train_test_split"
        why: "train_test_split แบ่งข้อมูล ไม่ใช่ตัวกำหนด target"
  - id: "q2"
    question: "ทำไมต้องแบ่งข้อมูลเป็น train และ test"
    choices:
      - text: "เพื่อให้เทรนเร็วขึ้น"
        why: "ไม่เกี่ยวกับความเร็ว"
      - text: "เพราะ scikit-learn บังคับให้แบ่งเสมอ"
        why: "ไม่ได้บังคับ แต่เป็นหลักปฏิบัติที่จำเป็นเพื่อวัดผลอย่างซื่อสัตย์"
      - text: "เพื่อวัดว่าโมเดลทำนายข้อมูลใหม่ที่ไม่เคยเห็นได้ดีแค่ไหน"
        correct: true
        why: "ถูกต้อง — ผลบนข้อมูลที่เทรนไปแล้วไม่บอกความสามารถจริง"
      - text: "เพื่อลบข้อมูลที่ผิดปกติออก"
        why: "การแบ่ง train/test ไม่ได้ลบข้อมูลใดๆ"
  - id: "q3"
    question: "baseline ในงาน ML มีไว้ทำไม"
    choices:
      - text: "เป็นโมเดลที่แม่นที่สุดเสมอ"
        why: "ตรงข้าม baseline คือวิธีที่ง่ายที่สุด"
      - text: "ใช้แทนการแบ่ง train/test"
        why: "baseline ไม่ได้แทนการแบ่งข้อมูล"
      - text: "ใช้แปลงข้อความเป็นตัวเลข"
        why: "นั่นคือขั้นตอน encoding ไม่ใช่ baseline"
      - text: "เป็นเกณฑ์ขั้นต่ำที่โมเดลจริงต้องชนะ ไม่งั้นโมเดลไม่ได้เพิ่มมูลค่า"
        correct: true
        why: "ถูกต้อง — เช่น ทายคลาสส่วนใหญ่ทุกแถว"
  - id: "q4"
    question: "data leakage คืออะไร"
    choices:
      - text: "ข้อมูลที่ไม่ควรรู้ ณ ตอนทำนายจริงหลุดเข้ามาเป็น feature ทำให้ผลทดสอบดีเกินจริง"
        correct: true
        why: "ถูกต้อง — เช่น จำนวนออเดอร์รวม ซึ่งรู้ได้หลังลูกค้าซื้อซ้ำไปแล้ว"
      - text: "การที่โมเดลจำข้อมูล train ได้ทั้งหมด"
        why: "นั่นคือ overfitting"
      - text: "ข้อมูลหายไปตอนโหลดไฟล์"
        why: "นั่นคือ missing data"
      - text: "การใช้ random_state ซ้ำหลายครั้ง"
        why: "random_state ช่วยให้ทำซ้ำได้ ไม่ใช่ leakage"
summary:
  - "supervised learning ใช้ features (X) ทำนาย target (y) โดยต้องแบ่ง train/test เพื่อวัดผลกับข้อมูลที่ไม่เคยเห็น"
  - "ตั้ง random_state และ stratify เพื่อให้ผลทำซ้ำได้และสัดส่วนคลาสไม่เพี้ยน"
  - "เทียบกับ baseline เสมอ (ในข้อมูลนี้ทายว่าซื้อซ้ำทุกคนก็ได้ ~59%) และระวังผลที่ดีเกินจริง — มักเป็น leakage"
interview:
  - id: "i1"
    q: "อธิบาย data leakage พร้อมยกตัวอย่าง และบอกวิธีสังเกต"
    a: |
      leakage คือการที่ข้อมูลจากอนาคตหรือข้อมูลที่ไม่มีตอนทำนายจริงหลุดเข้ามาเป็น feature เช่น ใช้ "จำนวนออเดอร์ทั้งหมดของลูกค้า" ทำนายว่าลูกค้าจะซื้อซ้ำไหม ซึ่งรู้ได้ก็ต่อเมื่อลูกค้าซื้อซ้ำไปแล้ว

      วิธีสังเกต: ผลบนชุดทดสอบดีเกินจริง (เช่น accuracy ใกล้ 100% ในโจทย์ที่ควรยาก) หรือ feature ตัวหนึ่งมีอิทธิพลสูงผิดปกติ — ให้ไล่ถามทีละ feature ว่า "ตอนใช้งานจริงเรารู้ค่านี้ ณ เวลาที่ต้องทำนายไหม"
  - id: "i2"
    q: "ทำไมผลลัพธ์ของโมเดลถึงต้องเทียบกับ baseline เสมอ"
    a: |
      เพราะตัวเลขอย่าง accuracy 64% ไม่มีความหมายถ้าไม่รู้ว่าวิธีที่ง่ายที่สุดได้เท่าไร ในโจทย์ที่คลาสไม่สมดุล การทายคลาสส่วนใหญ่ก็อาจได้สูงอยู่แล้ว (ในข้อมูลนี้ ~59%) baseline บอกว่าโมเดลเพิ่มมูลค่าจริงเท่าไร และช่วยตัดสินว่าคุ้มกับความซับซ้อนที่เพิ่มขึ้นหรือไม่
flashcards:
  - id: "c1"
    front: "baseline ใน ML คืออะไร"
    back: "โมเดลที่ง่ายที่สุด (เช่น ทายคลาสส่วนใหญ่) ที่โมเดลจริงต้องชนะเพื่อพิสูจน์ว่ามีประโยชน์"
  - id: "c2"
    front: "data leakage คืออะไรในหนึ่งประโยค"
    back: "ข้อมูลที่ไม่มีให้ ณ ตอนทำนายจริงหลุดเข้ามาเป็น feature ทำให้ผลทดสอบดีเกินจริง"
