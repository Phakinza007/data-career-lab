goals:
  - "อธิบาย workflow ของ supervised learning: features (X) กับ target (y)"
  - "แบ่งข้อมูล train/test ให้ถูก (random_state, stratify)"
  - "เทียบโมเดลกับ baseline เสมอ และสังเกต data leakage ได้"
examples:
  - id: "x1"
    title: "สร้าง X/y และแบ่ง train/test"
    lang: "python"
    prompt: |
      เตรียมข้อมูลลูกค้าให้พร้อมเทรนโมเดลทำนายว่าลูกค้าจะซื้อซ้ำไหม
    steps:
      - text: |
          แยก features (X) กับ target (y) — get_dummies แปลงคอลัมน์ข้อความเป็น 0/1
        code: |
          import pandas as pd

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X.shape, round(y.mean(), 4)
      - text: |
          แบ่ง train/test ด้วย stratify=y — สัดส่วนซื้อซ้ำในสองชุดเกือบเท่ากัน (~0.59)
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          X_train.shape, X_test.shape, round(y_train.mean(), 4), round(y_test.mean(), 4)
    pitfall:
      text: |
        ไม่ใส่ `random_state` — โค้ดรันผ่านปกติ แต่ทุกครั้งที่รันจะได้การแบ่งข้อมูลคนละแบบ ผล accuracy เปลี่ยนไปเรื่อยๆ ทำให้เทียบโมเดลสองตัวหรือทำซ้ำผลไม่ได้
  - id: "x2"
    title: "เทียบโมเดลกับ baseline"
    lang: "python"
    prompt: |
      โมเดลที่ได้ accuracy 64% ถือว่าดีไหม?
    steps:
      - text: |
          หา majority baseline — ทายว่า "ซื้อซ้ำ" ทุกแถว (คลาสที่พบมากกว่า) ได้กี่ %
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          baseline_acc = max(y_test.mean(), 1 - y_test.mean())
          round(baseline_acc, 4)
      - text: |
          เทรน LogisticRegression แล้ววัด accuracy บนชุดทดสอบ เทียบกับ baseline
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.linear_model import LogisticRegression

          model = LogisticRegression(max_iter=2000).fit(X_train, y_train)
          from sklearn.metrics import accuracy_score

          baseline_acc = max(y_test.mean(), 1 - y_test.mean())
          test_acc = accuracy_score(y_test, model.predict(X_test))
          round(baseline_acc, 4), round(test_acc, 4)
    pitfall:
      text: |
        ดีใจที่ accuracy ได้ 64% โดยไม่เทียบ baseline — ความจริงถ้าทายว่า "ซื้อซ้ำ" ทุกคนก็ได้ ~59% อยู่แล้ว โมเดลดีกว่าแค่ประมาณ 5 จุดเปอร์เซ็นต์ ซึ่งคือมูลค่าจริงที่โมเดลเพิ่มให้
