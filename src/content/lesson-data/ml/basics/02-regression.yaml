    prompt: |
      โมเดลลด MAE จาก baseline กี่เปอร์เซ็นต์ (baseline_mae − model_mae) / baseline_mae × 100 ปัด 1 ตำแหน่ง เก็บไว้ในตัวแปร improvement_pct
