      ลองเทรนบน log1p ของ target (np.log1p(y_train)) แล้ววัด R² บนสเกล log (เทียบกับ np.log1p(y_test)) และ MAE ที่แปลงกลับเป็นบาทด้วย np.expm1 (ปัดทั้งคู่: r2_log 4 ตำแหน่ง, mae_back 2 ตำแหน่ง) เก็บไว้ในตัวแปร r2_log, mae_back
    starter: |
