    question: "MAE บอกอะไร"
    choices:
      - text: "สัดส่วนที่ทำนายถูก"
        why: "นั่นคือ accuracy ของโจทย์ classification"
      - text: "ค่าคลาดเคลื่อนเฉลี่ยของการทำนาย ในหน่วยเดียวกับ target"
        correct: true
        why: "ถูกต้อง — MAE เป็นบาทเมื่อ target เป็นบาท อ่านง่ายที่สุด"
      - text: "จำนวน feature ที่โมเดลใช้"
        why: "ไม่เกี่ยวกับ MAE"
      - text: "ความแปรปรวนของ target"
        why: "MAE ไม่ใช่ความแปรปรวน"
  - id: "q2"
    question: "โมเดลที่ทายค่าเฉลี่ยของ y_train ทุกแถว ควรได้ R² ประมาณเท่าไรบนชุดทดสอบ"
    choices:
      - text: "ประมาณ 1"
        why: "R² = 1 คือทำนายสมบูรณ์แบบ"
      - text: "ประมาณ 0.5 เสมอ"
        why: "ไม่มีเหตุผลให้เป็น 0.5"
      - text: "ประมาณ 0 (ไม่ดีกว่าการทายค่าเฉลี่ย)"
        correct: true
        why: "ถูกต้อง — R² = 0 หมายถึงเท่ากับ baseline ค่าเฉลี่ย (อาจติดลบเล็กน้อยได้ตามความต่างของชุดข้อมูล)"
      - text: "ประมาณ −1 เสมอ"
        why: "ไม่ใช่"
  - id: "q3"
    question: "ทำไม RMSE มักมากกว่าหรือเท่ากับ MAE เสมอ"
    choices:
      - text: "เพราะ RMSE คิดเป็นเปอร์เซ็นต์"
        why: "RMSE เป็นหน่วยเดียวกับ target"
      - text: "เพราะ RMSE ใช้กับข้อมูล train เท่านั้น"
        why: "ใช้กับข้อมูลชุดใดก็ได้"
      - text: "ไม่จริง RMSE น้อยกว่า MAE เสมอ"
        why: "ตรงข้าม"
      - text: "เพราะ RMSE ยกกำลังสองก่อนเฉลี่ย จึงให้น้ำหนักความผิดพลาดใหญ่มากกว่า"
        correct: true
        why: "ถูกต้อง — ยิ่งมีค่าคลาดเคลื่อนสูงๆ ไม่กี่ตัว RMSE ยิ่งห่างจาก MAE"
  - id: "q4"
