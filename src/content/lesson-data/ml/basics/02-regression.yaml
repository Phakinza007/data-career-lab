summary:
  - "regression ทำนายตัวเลข: เทียบ MAE/RMSE/R² กับ baseline ที่ทายค่าเฉลี่ยเสมอ"
  - "ในข้อมูลนี้ LinearRegression ลด MAE ลงมากจาก baseline แต่ R² ยังแค่ ~0.30 — ทำนายมูลค่าออเดอร์แรกได้แค่พอสมควร"
  - "coefficient อธิบายความสัมพันธ์ ไม่ใช่เหตุและผล และ R² บนสเกล log เทียบกับสเกลเดิมตรงๆ ไม่ได้"
interview:
  - id: "i1"
    q: "อธิบายผลของโมเดล regression ให้ผู้บริหารที่ไม่รู้ ML ฟัง (ใช้ MAE และ R² )"
    a: |
      ใช้ MAE เล่าเป็นหน่วยที่คนเข้าใจ: "โมเดลทำนายมูลค่าออเดอร์แรกคลาดเคลื่อนเฉลี่ย ~3,800 บาท ดีกว่าการทายค่าเฉลี่ยที่คลาดเคลื่อน ~5,000 บาท" แล้วใช้ R² เสริมว่าอธิบายความผันผวนของมูลค่าได้ราว 30% ที่เหลือเป็นปัจจัยที่ยังไม่มีในข้อมูล จากนั้นบอกข้อจำกัดชัดเจนว่าโมเดลยังไม่แม่นพอจะใช้ตัดสินใจรายบุคคล
  - id: "i2"
    q: "ทำไมบางครั้งควรทำนาย log ของ target แทนค่าตรงๆ"
    a: |
      เมื่อ target เบ้ขวามาก (ค่าสูงมากไม่กี่ตัวดึงเส้นถดถอย) การแปลง log ทำให้การกระจายสมมาตรขึ้น โมเดลเส้นตรงเข้ากับข้อมูลได้ดีขึ้น แต่ต้องแปลงคำทำนายกลับก่อนรายงาน และระวังว่า metric บนสเกล log ไม่เท่ากับสเกลเดิม จึงควรเทียบผลบนสเกลบาทเสมอ
