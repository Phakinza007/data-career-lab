    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split
      from sklearn.linear_model import LinearRegression
      from sklearn.metrics import mean_absolute_error, mean_squared_error, r2_score

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['first_order_value']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42)
      import numpy as np

      log_model = LinearRegression().fit(X_train, np.log1p(y_train))
      pred_log = log_model.predict(X_test)
      r2_log = round(r2_score(np.log1p(y_test), pred_log), 4)
      mae_back = round(mean_absolute_error(y_test, np.expm1(pred_log)), 2)
    check: |
      check_value(r2_log, _sol["r2_log"], name="r2_log", tol=0.001)
      check_value(mae_back, _sol["mae_back"], name="mae_back", tol=0.05)
    hints:
      - "เทรนกับ np.log1p(y_train) และแปลงคำทำนายกลับด้วย np.expm1 ก่อนคำนวณ MAE"
quiz:
