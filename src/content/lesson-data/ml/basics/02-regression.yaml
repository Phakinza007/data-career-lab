goals:
  - "ใช้ LinearRegression ทำนาย target ที่เป็นตัวเลข"
  - "วัดผลด้วย MAE, RMSE และ R² เทียบกับ baseline ค่าเฉลี่ย"
  - "อ่านค่า coefficient อย่างระวัง และรู้จักการแปลง log กับ target ที่เบ้"
examples:
  - id: "x1"
    title: "เทียบโมเดลกับ baseline ด้วย MAE"
    lang: "python"
    prompt: |
      ทำนายมูลค่าออเดอร์แรกของลูกค้า แล้ววัดว่าดีกว่าทายค่าเฉลี่ยแค่ไหน
    steps:
      - text: |
          baseline: ทายค่าเฉลี่ยของชุด train ทุกแถว แล้ววัด MAE บนชุดทดสอบ
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split
          from sklearn.linear_model import LinearRegression
          from sklearn.metrics import mean_absolute_error, mean_squared_error, r2_score

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['first_order_value']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42)
          import numpy as np

          baseline_pred = np.full(len(y_test), y_train.mean())
          round(mean_absolute_error(y_test, baseline_pred), 2)
      - text: |
          เทรน LinearRegression แล้ววัด MAE และ R² — MAE ลดลงจากเดิมมาก แต่ R² ยังแค่ ~0.30
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split
          from sklearn.linear_model import LinearRegression
          from sklearn.metrics import mean_absolute_error, mean_squared_error, r2_score

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['first_order_value']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42)
          model = LinearRegression().fit(X_train, y_train)
          pred = model.predict(X_test)
          round(mean_absolute_error(y_test, pred), 2), round(r2_score(y_test, pred), 4)
    pitfall:
      text: |
        ดู R² ตัวเลขเดียวแล้วสรุปว่า "ดี" หรือ "แย่" — R² ≈ 0.30 บอกแค่ว่าอธิบายความแปรปรวนได้ ~30% ต้องดู MAE เป็นบาทควบคู่ด้วย (คลาดเคลื่อนเฉลี่ย ~3,800 บาทเทียบกับมูลค่าออเดอร์เฉลี่ย ~5,300 บาท ยังคลาดเคลื่อนเยอะ)
  - id: "x2"
    title: "อ่านค่า coefficient"
    lang: "python"
    prompt: |
      feature ไหนมีผลต่อมูลค่าออเดอร์แรกมากที่สุดตามโมเดล
    steps:
      - text: |
          เรียง coefficient ตามขนาด (ค่าสัมบูรณ์) — first_has_electronics (มีสินค้า Electronics ในออเดอร์) มีผลมากที่สุด
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split
          from sklearn.linear_model import LinearRegression
          from sklearn.metrics import mean_absolute_error, mean_squared_error, r2_score

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['first_order_value']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42)
          model = LinearRegression().fit(X_train, y_train)
          pred = model.predict(X_test)
          import pandas as pd

          coefs = pd.Series(model.coef_, index=X.columns)
          coefs.sort_values(key=abs, ascending=False).head(3).round(1)
      - text: |
          intercept คือค่าทำนายเมื่อทุก feature เป็น 0
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split
          from sklearn.linear_model import LinearRegression
          from sklearn.metrics import mean_absolute_error, mean_squared_error, r2_score

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['first_order_value']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42)
          model = LinearRegression().fit(X_train, y_train)
          pred = model.predict(X_test)
          round(model.intercept_, 2)
    pitfall:
      text: |
        ตีความ coefficient เป็นเหตุและผล เช่น "ใส่สินค้า Electronics เข้าออเดอร์ทำให้มูลค่าเพิ่ม ~7,600 บาท" — coefficient บอกแค่ความสัมพันธ์ในข้อมูลเมื่อ feature อื่นคงที่ (ที่จริงสินค้า Electronics แพงจึงทำให้มูลค่าสูงอยู่แล้ว) ไม่ใช่ผลของการแทรกแซง
