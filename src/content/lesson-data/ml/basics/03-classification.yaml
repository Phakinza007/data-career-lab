quiz:
  - id: "q1"
    question: "predict_proba ให้อะไร"
    choices:
      - text: "ค่าที่ทำนายเป็น 0/1 เท่านั้น"
        why: "นั่นคือ predict"
      - text: "ความน่าจะเป็นของแต่ละคลาส"
        correct: true
        why: "ถูกต้อง — คอลัมน์ที่ 1 คือความน่าจะเป็นของคลาส 1"
      - text: "accuracy ของโมเดล"
        why: "accuracy ได้จาก score หรือ accuracy_score"
      - text: "ชื่อคลาสที่ถูกต้อง"
        why: "predict_proba ให้ตัวเลข ไม่ใช่ชื่อคลาส"
  - id: "q2"
    question: "ถ้าเพิ่ม threshold จาก 0.5 เป็น 0.7 จำนวนที่ถูกทำนายเป็นคลาส 1 จะเป็นอย่างไร"
    choices:
      - text: "มากขึ้นเสมอ"
        why: "ตรงข้าม"
      - text: "เท่าเดิมเสมอ"
        why: "โดยทั่วไปจะเปลี่ยน"
      - text: "น้อยลงหรือเท่าเดิม เพราะเงื่อนไขเข้มขึ้น"
        correct: true
        why: "ถูกต้อง — proba >= 0.7 เป็นเซตย่อยของ proba >= 0.5"
      - text: "ขึ้นกับ random_state เท่านั้น"
        why: "ไม่เกี่ยวกับ random_state"
  - id: "q3"
    question: "odds ratio ของ feature = 0.11 แปลว่าอะไร"
    choices:
      - text: "feature นี้เพิ่มโอกาสของคลาส 1 ขึ้น 11 เท่า"
        why: "ค่าน้อยกว่า 1 คือลด ไม่ใช่เพิ่ม"
      - text: "โมเดลแม่นยำ 11%"
        why: "odds ratio ไม่ใช่ accuracy"
      - text: "feature นี้ไม่มีผลเลย"
        why: "ไม่มีผลคือ odds ratio = 1"
      - text: "feature นี้ลดโอกาส (odds) ของคลาส 1 เมื่อปัจจัยอื่นคงที่"
        correct: true
        why: "ถูกต้อง — น้อยกว่า 1 คือลด มากกว่า 1 คือเพิ่ม"
  - id: "q4"
    question: "ทำไมไม่ควรยึดเกณฑ์ 0.5 เสมอ"
    choices:
      - text: "เพราะต้นทุนของความผิดพลาดแต่ละแบบในงานจริงไม่เท่ากัน จึงควรเลือกเกณฑ์ให้เหมาะกับงาน"
        correct: true
        why: "ความผิดพลาดสองแบบ (ทำนายบวกผิด/พลาดของจริง) มีต้นทุนต่างกันตามงาน จึงเลื่อนเกณฑ์ตามต้นทุนนั้น (ในบทนี้เกณฑ์สูงขึ้นทำให้ทำนายเป็นคลาส 1 น้อยลง)"
      - text: "เพราะ 0.5 ทำให้โมเดลช้า"
        why: "ไม่เกี่ยวกับความเร็ว"
      - text: "เพราะ scikit-learn ห้ามใช้ 0.5"
        why: "ใช้ได้ เป็นค่าเริ่มต้น"
      - text: "เพราะความน่าจะเป็นไม่เคยเกิน 0.5"
        why: "ความน่าจะเป็นมีค่าตั้งแต่ 0 ถึง 1"
summary:
  - "LogisticRegression คำนวณความน่าจะเป็นของคลาส 1 แล้วตัดสินด้วย threshold (ค่าเริ่มต้น 0.5)"
  - "เกณฑ์สูงขึ้น = ทำนายคลาส 1 น้อยลง — เลือกตามต้นทุนของความผิดพลาดในงานจริง"
  - "exp(coefficient) คือ odds ratio: ช่องทาง promo ลด odds ซื้อซ้ำเหลือราว 0.11 เท่าเมื่อปัจจัยอื่นคงที่"
interview:
  - id: "i1"
    q: "อธิบายความต่างระหว่าง predict และ predict_proba และเมื่อไรควรใช้ตัวไหน"
    a: |
      predict ให้คลาสสุดท้าย (0/1) ที่ตัดสินด้วยเกณฑ์ 0.5 ส่วน predict_proba ให้ความน่าจะเป็นจริง ใช้ predict_proba เมื่ออยากจัดอันดับลูกค้า (ติดต่อคนที่มีโอกาสสูงสุดก่อน) หรืออยากปรับเกณฑ์ตัดสินให้เหมาะกับต้นทุนของงาน และใช้ predict เมื่อต้องการคำตอบสุดท้ายที่ใช้เกณฑ์มาตรฐานแล้ว
  - id: "i2"
    q: "อธิบาย odds ratio ของ channel_promo ที่เท่ากับ ~0.11 ให้ทีมการตลาดฟัง"
    a: |
      ลูกค้าที่มาจากช่องทาง promo มีโอกาส (odds) ซื้อซ้ำต่ำกว่าช่องทางอ้างอิง (ads) มาก — เหลือประมาณ 11% ของ odds เมื่อเทียบกันโดยปัจจัยอื่นเหมือนกัน ซึ่งสอดคล้องกับที่เห็นจากข้อมูลว่าลูกค้า promo ซื้อซ้ำไม่ถึง 13% เทียบกับกว่า 60% ของช่องทางอื่น สรุปได้ว่าแคมเปญ promo ดึงลูกค้ามาก แต่ส่วนใหญ่ไม่กลับมา
