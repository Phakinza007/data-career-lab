goals:
  - "ใช้ LogisticRegression ทำนายคลาส และแยกความต่างของ predict กับ predict_proba"
  - "ปรับ threshold และเข้าใจว่าเกณฑ์เปลี่ยนผลอย่างไร"
  - "อ่าน coefficient เป็น odds ratio"
examples:
  - id: "x1"
    title: "เทรนและดูความน่าจะเป็น"
    lang: "python"
    prompt: |
      ทำนายว่าลูกค้าจะซื้อซ้ำไหม และดูว่าโมเดลมั่นใจแค่ไหน
    steps:
      - text: |
          เทรน LogisticRegression แล้ววัด accuracy บนชุดทดสอบ
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.linear_model import LogisticRegression

          model = LogisticRegression(max_iter=2000).fit(X_train, y_train)
          round(model.score(X_test, y_test), 4)
      - text: |
          ดูความน่าจะเป็นของ 3 แถวแรก — predict ให้แค่ 0/1 แต่ predict_proba บอกความมั่นใจ
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.linear_model import LogisticRegression

          model = LogisticRegression(max_iter=2000).fit(X_train, y_train)
          proba = model.predict_proba(X_test)[:, 1]
          proba[:3].round(3), model.predict(X_test)[:3]
    pitfall:
      text: |
        ใช้แต่ `predict` (0/1) แล้วทิ้งความน่าจะเป็น — ลูกค้าที่โมเดลให้ 0.51 กับ 0.95 ถูกมองเป็นคลาส 1 เหมือนกัน ทั้งที่ระดับความมั่นใจต่างกันมาก ทำให้จัดลำดับความสำคัญของลูกค้าไม่ได้
  - id: "x2"
    title: "ขยับ threshold"
    lang: "python"
    prompt: |
      ถ้าเปลี่ยนเกณฑ์ตัดสินจาก 0.5 จะเกิดอะไรขึ้น
    steps:
      - text: |
          นับจำนวนที่ทำนายว่าซื้อซ้ำและ accuracy ที่เกณฑ์ 0.5 / 0.6 / 0.7 — ยิ่งเกณฑ์สูง จำนวนที่ทำนายเป็นคลาส 1 ยิ่งน้อยลง
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.linear_model import LogisticRegression

          model = LogisticRegression(max_iter=2000).fit(X_train, y_train)
          from sklearn.metrics import accuracy_score

          proba = model.predict_proba(X_test)[:, 1]
          rows = []
          for th in (0.5, 0.6, 0.7):
              pred = (proba >= th).astype(int)
              rows.append((th, int(pred.sum()), round(accuracy_score(y_test, pred), 4)))
          rows
      - text: |
          เทียบกับ baseline ที่ทายว่าซื้อซ้ำทุกคน (accuracy ~0.59) ก่อนสรุปว่าเกณฑ์ไหนดี
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          round(max(y_test.mean(), 1 - y_test.mean()), 4)
    pitfall:
      text: |
        ยึดเกณฑ์ 0.5 เพราะเป็นค่าเริ่มต้นโดยไม่คิดว่าความผิดพลาดแต่ละแบบมีต้นทุนต่างกัน (เช่น พลาดลูกค้าที่จะซื้อซ้ำ vs ส่งโปรโมชันให้คนที่ไม่ซื้อซ้ำ) เกณฑ์ที่เหมาะขึ้นกับงาน ไม่ใช่กฎตายตัว
