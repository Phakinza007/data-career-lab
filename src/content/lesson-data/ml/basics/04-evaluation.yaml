summary:
  - "confusion matrix นับ TN/FP/FN/TP — precision = TP/(TP+FP), recall = TP/(TP+FN), F1 คือค่าเฉลี่ยแบบ harmonic ของสองตัวนี้"
  - "ROC-AUC วัดการจัดอันดับ 0.5 = เดาสุ่ม ในข้อมูลนี้โมเดลได้ประมาณ 0.62"
  - "คลาสหายาก (ออเดอร์ที่ถูกยกเลิก ~6%) ทำให้ accuracy หลอกตา: ทายไม่ยกเลิกทุกแถวได้ ~94% แต่ recall = 0 ควรดู precision/recall และลอง class_weight=\"balanced\""
interview:
  - id: "i1"
    q: "อธิบาย precision กับ recall ให้ผู้บริหารฟังพร้อมตัวอย่างที่ต้องแลกกัน"
    a: |
      precision ตอบว่า "คนที่เราส่งโปรโมชันไป ในนั้นมีกี่ % ที่ควรได้จริง" ส่วน recall ตอบว่า "คนที่ควรได้โปรโมชันทั้งหมด เราส่งถึงกี่ %" — ถ้าลดเกณฑ์ให้ส่งกว้างขึ้น recall เพิ่มแต่ส่งพลาดคนไม่ควรได้มากขึ้น (precision ลด) เลือกจุดสมดุลจากต้นทุนของการส่งเกินกับการพลาดลูกค้า
  - id: "i2"
    q: "เจอโมเดลที่ accuracy 94% ในโจทย์ที่คลาสเป้าหมายมีแค่ 6% จะตรวจสอบอะไรต่อ"
    a: |
      เทียบกับ baseline ที่ทายคลาสส่วนใหญ่ (ซึ่งได้ ~94% อยู่แล้ว) แล้วดู confusion matrix, recall/precision ของคลาสหายาก และ ROC-AUC ถ้า recall ใกล้ 0 แปลว่าโมเดลไม่ได้เรียนรู้อะไรเกี่ยวกับคลาสที่สนใจเลย จากนั้นลองปรับ class_weight หรือ threshold และรายงานตัวชี้วัดที่ตรงกับเป้าหมายทางธุรกิจ
