goals:
  - "อ่าน confusion matrix และคำนวณ precision, recall, F1"
  - "เข้าใจว่า ROC-AUC วัดการจัดอันดับโดยไม่ขึ้นกับ threshold"
  - "รู้ทัน accuracy paradox เมื่อคลาสไม่สมดุล"
examples:
  - id: "x1"
    title: "confusion matrix และ precision/recall"
    lang: "python"
    prompt: |
      โมเดลทำนายซื้อซ้ำ — พลาดแบบไหนบ้าง
    steps:
      - text: |
          นับ TN/FP/FN/TP ของโมเดลบนชุดทดสอบ
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.linear_model import LogisticRegression

          model = LogisticRegression(max_iter=2000).fit(X_train, y_train)
          from sklearn.metrics import confusion_matrix, precision_score, recall_score, f1_score, roc_auc_score

          pred = model.predict(X_test)
          proba = model.predict_proba(X_test)[:, 1]
          tn, fp, fn, tp = confusion_matrix(y_test, pred).ravel()
          tn, fp, fn, tp
      - text: |
          คำนวณ precision, recall, F1 — recall สูงมาก (โมเดลแทบทายว่า "ซื้อซ้ำ" ให้เกือบทุกคน) แต่ precision ยังพอๆ กับสัดส่วนที่ซื้อซ้ำอยู่แล้ว
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.linear_model import LogisticRegression

          model = LogisticRegression(max_iter=2000).fit(X_train, y_train)
          from sklearn.metrics import confusion_matrix, precision_score, recall_score, f1_score, roc_auc_score

          pred = model.predict(X_test)
          proba = model.predict_proba(X_test)[:, 1]
          round(precision_score(y_test, pred), 4), round(recall_score(y_test, pred), 4), round(f1_score(y_test, pred), 4)
    pitfall:
      text: |
        สลับลำดับอาร์กิวเมนต์เป็น `(pred, y_test)` — โค้ดไม่ error แต่ได้ค่าที่ผิดความหมาย (precision ที่สลับ y_true/y_pred จะกลายเป็น recall) ต้องส่ง `y_true` ก่อน `y_pred` เสมอ
      code: |
        import pandas as pd
        from sklearn.model_selection import train_test_split

        df = pd.read_csv("data/ml_customers.csv")
        X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
        y = df['repeated']
        X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
        from sklearn.linear_model import LogisticRegression

        model = LogisticRegression(max_iter=2000).fit(X_train, y_train)
        from sklearn.metrics import confusion_matrix, precision_score, recall_score, f1_score, roc_auc_score

        pred = model.predict(X_test)
        proba = model.predict_proba(X_test)[:, 1]
        round(precision_score(pred, y_test), 4), round(recall_score(y_test, pred), 4)
  - id: "x2"
    title: "accuracy paradox"
    lang: "python"
    prompt: |
      ทำนายว่าออเดอร์แรกจะถูกยกเลิก — accuracy 94% ดีจริงไหม
    steps:
      - text: |
          ดูสัดส่วนออเดอร์แรกที่ถูกยกเลิก และ accuracy ของการทายว่า "ไม่ยกเลิก" ทุกแถว
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split
          from sklearn.linear_model import LogisticRegression
          from sklearn.metrics import recall_score, precision_score, accuracy_score

          df = pd.read_csv("data/ml_customers.csv")
          y = (df['first_status'] == 'cancelled').astype(int)
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value', 'first_status']), drop_first=True)
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          round(y.mean(), 4), round(1 - y_test.mean(), 4)
      - text: |
          เทรนโมเดลจริง — accuracy เท่ากับ baseline เป๊ะ แต่ recall = 0 จับออเดอร์ที่ยกเลิกไม่ได้เลย
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split
          from sklearn.linear_model import LogisticRegression
          from sklearn.metrics import recall_score, precision_score, accuracy_score

          df = pd.read_csv("data/ml_customers.csv")
          y = (df['first_status'] == 'cancelled').astype(int)
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value', 'first_status']), drop_first=True)
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          model = LogisticRegression(max_iter=2000).fit(X_train, y_train)
          pred = model.predict(X_test)
          round(accuracy_score(y_test, pred), 4), recall_score(y_test, pred)
    pitfall:
      text: |
        รายงาน "โมเดลแม่น 94%" โดยไม่ดู recall ของคลาสหายาก — ตัวเลขนี้เท่ากับการทายว่าไม่มีออเดอร์ไหนถูกยกเลิกเลย ในงานที่คลาสหายากคือสิ่งที่สนใจจริง (เช่น ตรวจทุจริต ตรวจออเดอร์ที่จะถูกยกเลิก) ต้องดู precision/recall ของคลาสนั้น
