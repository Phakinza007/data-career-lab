goals:
  - "ระบุ overfitting ได้จากช่องว่างระหว่างคะแนน train กับ test"
  - "ใช้ k-fold cross-validation (พร้อม shuffle) วัดผลอย่างเชื่อถือได้"
  - "เลือก hyperparameter ด้วย CV ไม่ใช่ด้วยชุด test"
examples:
  - id: "x1"
    title: "ความลึกของ tree กับ overfitting"
    lang: "python"
    prompt: |
      ต้นไม้ตัดสินใจลึกแค่ไหนถึงจะดี
    steps:
      - text: |
          เทียบ accuracy ของ train กับ test ที่ความลึกต่างๆ — ยิ่งลึก train ยิ่งสูงแต่ test ยิ่งแย่
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.tree import DecisionTreeClassifier
          rows = []
          for depth in (1, 3, 10, None):
              tree = DecisionTreeClassifier(max_depth=depth, random_state=42).fit(X_train, y_train)
              rows.append((depth, round(tree.score(X_train, y_train), 4), round(tree.score(X_test, y_test), 4)))
          rows
      - text: |
          ไม่จำกัดความลึก: train ~1.0 แต่ test ต่ำกว่า baseline (~0.59) — จำข้อมูลแทนที่จะเรียนรู้
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.tree import DecisionTreeClassifier
          tree = DecisionTreeClassifier(random_state=42).fit(X_train, y_train)
          round(tree.score(X_train, y_train), 4), round(tree.score(X_test, y_test), 4), round(max(y_test.mean(), 1 - y_test.mean()), 4)
    pitfall:
      text: |
        ลองหลายค่า max_depth แล้วเลือกตัวที่ได้ accuracy สูงสุดบนชุด test — ชุด test ถูกใช้ตัดสินใจไปแล้ว ผลที่รายงานจึงดีเกินจริง (test leakage) ควรเลือกด้วย cross-validation บนชุด train แล้วแตะ test ครั้งเดียวตอนท้าย
  - id: "x2"
    title: "cross-validation ที่ถูกวิธี"
    lang: "python"
    prompt: |
      วัดผลให้เชื่อถือได้ไม่ขึ้นกับการแบ่งข้อมูลครั้งเดียว
    steps:
      - text: |
          5-fold CV แบบ shuffle ของ LogisticRegression — ได้ 5 คะแนนที่ไม่ต่างกันมาก
        code: |
          import pandas as pd

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          from sklearn.model_selection import KFold, cross_val_score
          from sklearn.tree import DecisionTreeClassifier
          from sklearn.linear_model import LogisticRegression

          kf = KFold(n_splits=5, shuffle=True, random_state=42)
          scores = cross_val_score(LogisticRegression(max_iter=2000), X, y, cv=kf)
          scores.round(4), round(scores.mean(), 4)
      - text: |
          เทียบ tree ความลึก 3 กับ 10 ด้วย CV — tree ที่ลึกกว่าได้คะแนนต่ำกว่า
        code: |
          import pandas as pd

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          from sklearn.model_selection import KFold, cross_val_score
          from sklearn.tree import DecisionTreeClassifier
          from sklearn.linear_model import LogisticRegression

          kf = KFold(n_splits=5, shuffle=True, random_state=42)
          for depth in (3, 10):
              s = cross_val_score(DecisionTreeClassifier(max_depth=depth, random_state=42), X, y, cv=kf)
              print(depth, round(s.mean(), 4))
    pitfall:
      text: |
        ใช้ `cv=5` เฉยๆ กับข้อมูลที่เรียงตามเวลา (ที่นี่แถวเรียงตามวันสมัครลูกค้า) — โค้ดไม่ error แต่แต่ละ fold เป็นช่วงเวลาต่างกัน คะแนน AUC จึงแกว่งมาก (จาก ~0.27 ถึง ~0.86) เชื่อถือไม่ได้ ต้อง shuffle
      code: |
        import pandas as pd

        df = pd.read_csv("data/ml_customers.csv")
        X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
        y = df['repeated']
        from sklearn.model_selection import KFold, cross_val_score
        from sklearn.tree import DecisionTreeClassifier
        from sklearn.linear_model import LogisticRegression

        kf = KFold(n_splits=5, shuffle=True, random_state=42)
        unshuffled = cross_val_score(LogisticRegression(max_iter=2000), X, y, cv=5, scoring='roc_auc')
        unshuffled.round(3)
