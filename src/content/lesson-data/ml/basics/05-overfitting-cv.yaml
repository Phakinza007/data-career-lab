    prompt: |
      เทียบ std ของคะแนน ROC-AUC 5-fold ของ LogisticRegression ระหว่าง cv=5 แบบไม่ shuffle กับ StratifiedKFold(5, shuffle=True, random_state=42): แบบไม่ shuffle มี std สูงกว่าไหม (True/False) เก็บไว้ในตัวแปร unshuffled_is_noisier
    starter: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      from sklearn.model_selection import KFold, cross_val_score
      from sklearn.tree import DecisionTreeClassifier
