    solution: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      from sklearn.model_selection import KFold, cross_val_score
      from sklearn.tree import DecisionTreeClassifier
      from sklearn.linear_model import LogisticRegression

      kf = KFold(n_splits=5, shuffle=True, random_state=42)
      from sklearn.model_selection import StratifiedKFold

      model = LogisticRegression(max_iter=2000)
      unshuffled = cross_val_score(model, X, y, cv=5, scoring='roc_auc')
      shuffled = cross_val_score(model, X, y, cv=StratifiedKFold(5, shuffle=True, random_state=42), scoring='roc_auc')
      unshuffled_is_noisier = bool(unshuffled.std() > shuffled.std())
    check: |
      check_value(unshuffled_is_noisier, _sol["unshuffled_is_noisier"], name="unshuffled_is_noisier")
    hints:
      - "ใช้ scoring=\"roc_auc\" ทั้งสองแบบแล้วเทียบ .std()"
quiz:
  - id: "q1"
    question: "สัญญาณของ overfitting คือข้อไหน"
    choices:
      - text: "คะแนนบน train และ test ต่ำพอๆ กัน"
        why: "นั่นคือสัญญาณของ underfitting"
      - text: "คะแนนบน train สูงมากแต่บน test ต่ำกว่ามาก (ช่องว่างกว้าง)"
        correct: true
        why: "ถูกต้อง — เช่น tree ไม่จำกัดความลึก train ~1.0 แต่ test ต่ำกว่า baseline"
      - text: "คะแนนบน test สูงกว่า train เสมอ"
        why: "ไม่ใช่สัญญาณ overfitting"
      - text: "โมเดลรันช้า"
        why: "ความเร็วไม่เกี่ยวกับ overfitting"
  - id: "q2"
    question: "ข้อดีของ k-fold cross-validation เมื่อเทียบกับการแบ่ง train/test ครั้งเดียว"
    choices:
      - text: "ไม่ต้องใช้ข้อมูลเลย"
        why: "ยังใช้ข้อมูลทั้งหมดในการวัดผล"
      - text: "ทำให้โมเดลแม่นขึ้นเสมอ"
        why: "CV วัดผลให้ซื่อสัตย์ ไม่ได้ทำให้โมเดลแม่นขึ้นโดยตรง"
      - text: "ได้ค่าเฉลี่ยและความผันผวนของคะแนนจากหลายการแบ่ง เชื่อถือได้มากกว่า"
        correct: true
        why: "การแบ่งครั้งเดียวอาจโชคดี/ร้าย; k-fold ทดสอบทุกแถวหนึ่งครั้งและได้คะแนนหลายค่า จึงเห็นทั้งค่าเฉลี่ยและความแกว่ง (ในบทนี้ CV แบบไม่ shuffle บนข้อมูลเรียงตามเวลาให้ AUC แกว่ง 0.27–0.86)"
      - text: "ใช้ได้กับ regression เท่านั้น"
        why: "ใช้ได้ทั้ง regression และ classification"
  - id: "q3"
    question: "ทำไมต้องใส่ shuffle=True ให้ KFold กับข้อมูลที่แถวเรียงตามเวลา"
    choices:
      - text: "เพราะ shuffle ทำให้โมเดลเร็วขึ้น"
        why: "ไม่เกี่ยวกับความเร็ว"
      - text: "เพราะ KFold ทำงานไม่ได้ถ้าไม่ shuffle"
        why: "ทำงานได้ แต่ผลอาจไม่น่าเชื่อถือ"
      - text: "เพราะ shuffle เพิ่มจำนวนแถว"
        why: "shuffle ไม่เพิ่มจำนวนแถว"
      - text: "เพราะ fold ที่ไม่สลับจะเป็นคนละช่วงเวลา หน้าตาต่างกันมาก คะแนนแต่ละ fold จึงแกว่งและเชื่อถือไม่ได้"
        correct: true
        why: "ถูกต้อง — ตัวอย่างในบท: AUC ต่อ fold ตั้งแต่ ~0.27 ถึง ~0.86"
  - id: "q4"
    question: "ถ้า max_depth หลายค่าให้คะแนน CV เท่ากัน ควรเลือกอย่างไร"
    choices:
      - text: "เลือกตัวที่ง่ายกว่า (depth น้อยกว่า) เพราะเสี่ยง overfit น้อยกว่าและตีความง่ายกว่า"
        correct: true
        why: "ถูกต้อง — หลัก \"ง่ายที่สุดที่ยังดีพอ\""
      - text: "เลือกตัวลึกที่สุด"
        why: "ไม่มีเหตุผลรองรับเมื่อคะแนนเท่ากัน"
      - text: "เลือกสุ่ม"
        why: "ควรมีหลักการ ไม่ใช่สุ่ม"
      - text: "รันใหม่จนกว่าจะต่างกัน"
        why: "ไม่ใช่วิธีที่ถูกต้อง"
summary:
  - "overfitting = train สูง test ต่ำ (tree ไม่จำกัดความลึก train ~1.0 test ~0.55) — จำกัดความซับซ้อนเพื่อลดช่องว่าง"
  - "ใช้ KFold(shuffle=True, random_state=...) กับข้อมูลที่แถวเรียงตามเวลา ไม่งั้นคะแนนแต่ละ fold แกว่งรุนแรง"
  - "เลือก hyperparameter ด้วยค่าเฉลี่ย CV ถ้าเท่ากันเลือกโมเดลที่ง่ายกว่า (ในข้อมูลนี้ tree ตื้นๆ ชนะ tree ลึก)"
interview:
  - id: "i1"
    q: "อธิบายว่าทำไมการเลือกโมเดลจากคะแนนบนชุด test หลายรอบจึงเป็นปัญหา"
    a: |
      เพราะทุกครั้งที่เลือกจากผลบนชุด test ข้อมูลชุดนั้นถูกใช้ตัดสินใจไปแล้ว คะแนนสุดท้ายจึงดีเกินจริงและไม่ใช่ตัวแทนของข้อมูลใหม่ (test leakage) วิธีที่ถูกคือเลือกโมเดล/hyperparameter ด้วย cross-validation บนชุด train แล้วใช้ชุด test วัดผลรอบสุดท้ายเพียงครั้งเดียว
  - id: "i2"
    q: "เจอโมเดลที่ train accuracy 99% แต่ test 55% จะทำอย่างไร"
    a: |
      วินิจฉัยว่าเป็น overfitting แล้วลดความซับซ้อนของโมเดล (เช่น จำกัด max_depth, เพิ่ม regularization), เพิ่มข้อมูล หรือลดจำนวน feature จากนั้นวัดซ้ำด้วย cross-validation และเทียบกับ baseline ว่าโมเดลที่ง่ายขึ้นยังชนะ baseline หรือไม่
flashcards:
  - id: "c1"
    front: "overfitting คืออะไร"
    back: "โมเดลจำข้อมูล train (รวมสัญญาณรบกวน) จนคะแนน train สูงแต่ใช้กับข้อมูลใหม่ได้แย่"
  - id: "c2"
    front: "ทำไม KFold ควร shuffle"
    back: "ถ้าแถวเรียงตามเวลา fold ที่ไม่สลับจะต่างกันมาก ทำให้คะแนนแกว่งและเชื่อถือไม่ได้"
