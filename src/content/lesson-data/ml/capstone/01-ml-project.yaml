goals:
  - "ทำโปรเจกต์ ML แบบ end-to-end ที่ทำนายการซื้อซ้ำ โดยมี baseline, CV และการทดสอบครั้งสุดท้ายที่ซื่อตรง"
  - "ใช้ rubric ตรวจงานตัวเอง (leakage, pipeline, การเทียบกับ baseline, ข้อจำกัด) ก่อนเผยแพร่"
  - "เผยแพร่ notebook พร้อม README บน GitHub"
