goals:
  - "คำนวณ neuron และ layer ด้วยมือ (weighted sum + activation) ด้วย numpy"
  - "เทรน MLPClassifier, นับพารามิเตอร์ และอธิบายว่าทำไมต้อง scale"
  - "เข้าใจว่าโมเดลใหญ่ไม่ได้ดีกว่าเสมอเมื่อข้อมูลน้อยและสัญญาณอ่อน"
examples:
  - id: "x1"
    title: "neuron ด้วยมือ (numpy)"
    lang: "python"
    prompt: |
      คำนวณ weighted sum และ activation เอง
    steps:
      - text: |
          z = w·x + b แล้วส่งผ่าน ReLU และ sigmoid: z = 0.9, ReLU = 0.9, sigmoid ≈ 0.7109
        code: |
          import numpy as np

          x = np.array([1.0, 2.0, 1.0])
          w = np.array([0.5, -0.25, 0.8])
          b = 0.1
          z = w @ x + b
          relu = max(0.0, z)
          sigmoid = 1 / (1 + np.exp(-z))
          round(float(z), 4), round(float(relu), 4), round(float(sigmoid), 4)
      - text: |
          layer 2 neuron: Z = W @ x + b_vec แล้ว ReLU — neuron แรก active (0.9) ส่วนที่สองถูกตัดเป็น 0
        code: |
          import numpy as np

          x = np.array([1.0, 2.0, 1.0])
          w = np.array([0.5, -0.25, 0.8])
          b = 0.1
          W = np.array([[0.5, -0.25, 0.8], [-1.0, 0.5, 0.2]])
          b_vec = np.array([0.1, -0.3])
          z_vec = W @ x + b_vec
          np.maximum(z_vec, 0).round(4)
    pitfall:
      text: |
        ซ้อนหลาย layer โดยไม่ใช้ activation ที่ไม่เป็นเส้นตรง — W2 @ (W1 @ x) = (W2 @ W1) @ x เทียบเท่าโมเดลเชิงเส้นชั้นเดียว ความลึกไม่ได้ให้อะไรเพิ่ม
  - id: "x2"
    title: "MLPClassifier และการนับพารามิเตอร์"
    lang: "python"
    prompt: |
      เทรน MLP เล็กๆ บนข้อมูล scale แล้ว
    steps:
      - text: |
          fit MLP hidden (16,) แล้วดูรูปร่างของน้ำหนัก: [(21, 16), (16, 1)] รวม 369 พารามิเตอร์
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          import numpy as np
          from sklearn.preprocessing import StandardScaler
          from sklearn.neural_network import MLPClassifier

          scaler = StandardScaler().fit(X_train)
          Z_train = scaler.transform(X_train)
          Z_test = scaler.transform(X_test)
          mlp = MLPClassifier(hidden_layer_sizes=(16,), max_iter=200, random_state=42).fit(Z_train, y_train)
          [c.shape for c in mlp.coefs_], sum(c.size for c in mlp.coefs_) + sum(v.size for v in mlp.intercepts_)
      - text: |
          train 0.7027 แต่ test แค่ 0.5986 — พารามิเตอร์ 369 ตัวบนข้อมูล 2,129 แถวที่สัญญาณอ่อนพร้อมจำ noise
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          import numpy as np
          from sklearn.preprocessing import StandardScaler
          from sklearn.neural_network import MLPClassifier

          scaler = StandardScaler().fit(X_train)
          Z_train = scaler.transform(X_train)
          Z_test = scaler.transform(X_test)
          mlp = MLPClassifier(hidden_layer_sizes=(16,), max_iter=200, random_state=42).fit(Z_train, y_train)
          round(mlp.score(Z_train, y_train), 4), round(mlp.score(Z_test, y_test), 4)
    pitfall:
      text: |
        ส่ง X_train ที่ไม่ scale เข้า MLPClassifier แล้วสรุปว่าโมเดลใช้ได้ — ไม่ error แต่ optimizer ถูกครอบงำโดย feature ช่วงกว้างและอาจหยุดเร็วเกินไป (ในข้อมูลนี้หยุดที่ 57 รอบ train 0.6318) scale ด้วย StandardScaler ที่ fit บน train เสมอ
