      mlp_auc = ___
      logreg_auc = ___
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      import numpy as np
      from sklearn.preprocessing import StandardScaler
      from sklearn.neural_network import MLPClassifier

      scaler = StandardScaler().fit(X_train)
      Z_train = scaler.transform(X_train)
      Z_test = scaler.transform(X_test)
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import roc_auc_score

      mlp = MLPClassifier(hidden_layer_sizes=(8,), max_iter=200, random_state=42).fit(Z_train, y_train)
      logreg = LogisticRegression(max_iter=2000).fit(Z_train, y_train)
      mlp_auc = round(roc_auc_score(y_test, mlp.predict_proba(Z_test)[:, 1]), 4)
      logreg_auc = round(roc_auc_score(y_test, logreg.predict_proba(Z_test)[:, 1]), 4)
    check: |
      check_value(mlp_auc, _sol["mlp_auc"], name="mlp_auc", tol=0.001)
      check_value(logreg_auc, _sol["logreg_auc"], name="logreg_auc", tol=0.001)
    hints:
      - "predict_proba(...)[:, 1] ของทั้งสองโมเดล"
quiz:
  - id: "q1"
    question: "ทำไม neural network ต้องมี activation ที่ไม่เป็นเส้นตรง"
    choices:
      - text: "เพื่อให้เทรนเร็วขึ้น"
        why: "ไม่ใช่เหตุผลหลัก"
      - text: "ถ้าไม่มี การซ้อนหลาย layer เท่ากับโมเดลเชิงเส้นชั้นเดียว ความลึกไม่ให้ความสามารถเพิ่ม"
        correct: true
        why: "W2(W1x) = (W2W1)x — คูณเมทริกซ์ต่อกันก็ยังเป็นการแปลงเชิงเส้นเดียว activation แบบ ReLU/tanh ทำให้แต่ละ layer เพิ่มความสามารถจริง"
      - text: "เพื่อลดจำนวนพารามิเตอร์"
        why: "ไม่เกี่ยว"
      - text: "เพื่อไม่ต้อง scale ข้อมูล"
        why: "ยังต้อง scale"
  - id: "q2"
    question: "MLP ที่มี 21 input, hidden 16 หน่วย และ output 1 หน่วยมีพารามิเตอร์กี่ตัว (รวม bias)"
    choices:
      - text: "336"
        why: "ลืมนับ bias"
      - text: "22"
        why: "นั่นคือ logistic regression"
      - text: "369"
        correct: true
        why: "(21×16+16) + (16×1+1) = 369"
      - text: "16"
        why: "นั่นคือจำนวน hidden"
  - id: "q3"
    question: "ทำไมต้อง scale ข้อมูลก่อนเข้า MLP"
    choices:
      - text: "เพราะ MLP รับเฉพาะค่า 0–1"
        why: "ไม่จำเป็นต้อง 0–1 แต่ควรมีสเกลใกล้กัน"
      - text: "เพื่อเพิ่มจำนวนแถว"
        why: "ไม่เกี่ยว"
      - text: "ไม่จำเป็น เหมือนต้นไม้"
        why: "ต่างจากต้นไม้"
      - text: "feature ช่วงกว้างครอบงำการอัปเดตน้ำหนัก scale ให้ optimizer ทำงานราบรื่น (fit scaler บน train เท่านั้น)"
        correct: true
        why: "feature ที่มีช่วงกว้าง (เช่น days_since_first_order 3–728 เทียบกับ dummy 0/1) ทำให้ gradient ของน้ำหนักแต่ละตัวต่างสเกลกันมาก optimizer ก้าวไม่สม่ำเสมอ; ในบทนี้ MLP ที่ไม่ scale หยุดที่ 57 รอบด้วย train 0.6318"
  - id: "q4"
    question: "ในบทนี้ MLP (16,) ที่ scale แล้ว train 0.7027 แต่ test 0.5986 และ AUC ต่ำกว่า logistic regression บอกอะไร"
    choices:
      - text: "โมเดลใหญ่จำ noise ในข้อมูลที่สัญญาณอ่อน ความซับซ้อนไม่การันตีผลที่ดีกว่า"
        correct: true
        why: "MLP มี 369 พารามิเตอร์บนข้อมูลเทรน 2,129 แถว ที่สัญญาณแทบมีแค่ promo — train สูงถึง 0.7027 แต่ test 0.5986 และ AUC 0.5746 ต่ำกว่า logistic regression (0.625) แสดงว่าจำ noise"
      - text: "MLP ดีกว่าเสมอ"
        why: "ผลจริงตรงกันข้าม"
      - text: "ต้องมีข้อมูลผิดพลาด"
        why: "ไม่มีหลักฐาน"
      - text: "เพราะไม่ได้ใช้ ReLU"
        why: "ใช้ ReLU เป็นค่าเริ่มต้น"
summary:
  - "neuron = weighted sum + bias แล้วผ่าน activation; layer = neuron หลายตัว; MLP = layer ซ้อนกัน"
  - "พารามิเตอร์ของ MLP (21→16→1) = 369 ตัว; ต้อง scale input และ activation ไม่เป็นเส้นตรงจึงจะได้ประโยชน์จากความลึก"
  - "ในข้อมูลของเรา MLP train 0.7027 / test 0.5986 (AUC 0.5746) ไม่ชนะ logistic regression — โมเดลใหญ่ต้องการข้อมูลและสัญญาณมากกว่า"
interview:
  - id: "i1"
    q: "อธิบาย MLP สั้นๆ ว่าคำนวณอย่างไร"
    a: |
      input คูณน้ำหนักของ layer แรกบวก bias แล้วผ่าน activation (เช่น ReLU) ได้ค่า hidden จากนั้นทำซ้ำกับ layer ถัดไปจนถึง output ซึ่ง sigmoid/softmax แปลงเป็นความน่าจะเป็น ทั้งหมดเป็นการคูณเมทริกซ์และฟังก์ชันไม่เชิงเส้นซ้อนกัน พารามิเตอร์ (น้ำหนักและ bias) ถูกเรียนรู้ด้วย gradient descent
  - id: "i2"
    q: "ทำไม neural network ถึงต้อง scale feature"
    a: |
      การอัปเดตน้ำหนักด้วย gradient ขึ้นกับขนาดของ input feature ที่ช่วงกว้างจะทำให้ loss surface บิดเบี้ยว ทำให้ optimizer ต้องใช้ learning rate เล็กหรือติดขัด การ standardize (fit บน train เท่านั้น) ทำให้ทุก feature อยู่ในสเกลใกล้กันและการเทรนเสถียรขึ้น
