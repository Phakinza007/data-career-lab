      from sklearn.neural_network import MLPClassifier

      scaler = StandardScaler().fit(X_train)
      Z_train = scaler.transform(X_train)
      Z_test = scaler.transform(X_test)
      mlp = MLPClassifier(hidden_layer_sizes=(4,), max_iter=200, random_state=42).fit(Z_train, y_train)
      row = Z_test[0]
      hidden = np.maximum(row @ mlp.coefs_[0] + mlp.intercepts_[0], 0)
      out = hidden @ mlp.coefs_[1] + mlp.intercepts_[1]
      manual_proba = round(float(1 / (1 + np.exp(-out[0]))), 4)
      sklearn_proba = round(float(mlp.predict_proba(Z_test[:1])[0, 1]), 4)
    check: |
      check_value(manual_proba, _sol["manual_proba"], name="manual_proba", tol=0.001)
      check_value(sklearn_proba, _sol["sklearn_proba"], name="sklearn_proba", tol=0.001)
    hints:
      - "ทั้งสองต้องได้ค่าเท่ากัน: ReLU ที่ hidden แล้ว sigmoid ที่ output"
