      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      import numpy as np
      from sklearn.preprocessing import StandardScaler
      from sklearn.neural_network import MLPClassifier

      scaler = StandardScaler().fit(X_train)
      Z_train = scaler.transform(X_train)
      Z_test = scaler.transform(X_test)
      def build(sizes):
          mlp = MLPClassifier(hidden_layer_sizes=sizes, max_iter=200, random_state=42).fit(Z_train, y_train)
          n = sum(c.size for c in mlp.coefs_) + sum(v.size for v in mlp.intercepts_)
          return n, round(mlp.score(Z_test, y_test), 4)


      params_4, acc_4 = build((4,))
      params_16_8, acc_16_8 = build((16, 8))
    check: |
      check_value(params_4, _sol["params_4"], name="params_4")
      check_value(params_16_8, _sol["params_16_8"], name="params_16_8")
      check_value(acc_4, _sol["acc_4"], name="acc_4", tol=0.001)
      check_value(acc_16_8, _sol["acc_16_8"], name="acc_16_8", tol=0.001)
