    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      import numpy as np
      from sklearn.preprocessing import StandardScaler
      from sklearn.neural_network import MLPClassifier

      scaler = StandardScaler().fit(X_train)
      Z_train = scaler.transform(X_train)
      Z_test = scaler.transform(X_test)
      mlp = MLPClassifier(hidden_layer_sizes=(16,), max_iter=200, random_state=42).fit(Z_train, y_train)
      curve = mlp.loss_curve_
      n_epochs = len(curve)
      first_loss = round(float(curve[0]), 4)
      final_loss = round(float(curve[-1]), 4)
      n_increases = sum(1 for a, b in zip(curve, curve[1:]) if b > a)
    check: |
      check_value(n_epochs, _sol["n_epochs"], name="n_epochs")
      check_value(first_loss, _sol["first_loss"], name="first_loss", tol=0.001)
      check_value(final_loss, _sol["final_loss"], name="final_loss", tol=0.001)
      check_value(n_increases, _sol["n_increases"], name="n_increases")
    hints:
      - "zip(curve, curve[1:]) เปรียบเทียบคู่รอบติดกัน"
  - id: "e9"
    level: "challenge"
    lang: "python"
    prompt: |
      fit MLP (16,) (max_iter=200, random_state=42) บน Z_train ด้วย learning_rate_init = 0.001, 0.01 และ 0.1 เก็บจำนวน iteration ที่ใช้จริง (n_iter_) ไว้ใน it_0001, it_001, it_01 ตามลำดับ
    starter: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      import numpy as np
      from sklearn.preprocessing import StandardScaler
      from sklearn.neural_network import MLPClassifier

      scaler = StandardScaler().fit(X_train)
      Z_train = scaler.transform(X_train)
      Z_test = scaler.transform(X_test)
      it_0001 = ___
      it_001 = ___
      it_01 = ___
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      import numpy as np
      from sklearn.preprocessing import StandardScaler
      from sklearn.neural_network import MLPClassifier

      scaler = StandardScaler().fit(X_train)
      Z_train = scaler.transform(X_train)
      Z_test = scaler.transform(X_test)
      def iters(lr):
          mlp = MLPClassifier(hidden_layer_sizes=(16,), max_iter=200, learning_rate_init=lr, random_state=42).fit(Z_train, y_train)
          return mlp.n_iter_


      it_0001 = iters(0.001)
      it_001 = iters(0.01)
      it_01 = iters(0.1)
    check: |
      check_value(it_0001, _sol["it_0001"], name="it_0001")
      check_value(it_001, _sol["it_001"], name="it_001")
      check_value(it_01, _sol["it_01"], name="it_01")
    hints:
      - "ส่ง learning_rate_init ให้ MLPClassifier"
