summary:
  - "gradient descent: w ← w − lr × gradient ทำซ้ำเพื่อลด loss"
  - "lr เล็กช้า, พอดีลงตัว, ใหญ่เกิน diverge (ตัวอย่าง lr 0.25 ระเบิดเป็น ~10³⁷)"
  - "ReLU สำหรับ hidden, sigmoid สำหรับ output ของ binary; loss_curve_ ลดลงบน train ไม่ได้การันตีผลบนข้อมูลใหม่"
interview:
  - id: "i1"
    q: "อธิบาย gradient descent และบทบาทของ learning rate"
    a: |
      ทำซ้ำ: คำนวณ gradient ของ loss ต่อพารามิเตอร์ แล้วขยับพารามิเตอร์สวนทิศ gradient ด้วยก้าว learning rate ถ้า lr เล็กเกินจะช้า ถ้าใหญ่เกินจะข้ามจุดต่ำสุดหรือ diverge จึงมักใช้ lr ที่ปรับด้วย optimizer (เช่น Adam) และตรวจ loss curve
  - id: "i2"
    q: "ถ้า loss ของโมเดลเพิ่มขึ้นหรือเป็น nan ระหว่างเทรน ควรตรวจอะไร"
    a: |
      สงสัย learning rate สูงเกินไปก่อน (ลดลง), ตรวจว่า scale input แล้ว, ค่าที่มีปัญหา (NaN/inf ในข้อมูล), และ gradient ระเบิด จากนั้นลองเทรนบนข้อมูลเล็กมากๆ ให้ loss ลดจนเกือบ 0 เพื่อตรวจว่าโค้ดถูก
flashcards:
