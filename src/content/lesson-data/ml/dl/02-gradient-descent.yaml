goals:
  - "คำนวณ loss gradient และอัปเดตพารามิเตอร์ด้วย gradient descent เอง"
  - "อธิบายผลของ learning rate (ช้า / ลงตัว / diverge)"
  - "รู้จัก ReLU / tanh / sigmoid และอ่าน loss_curve_ ของ MLP"
examples:
  - id: "x1"
    title: "gradient descent หนึ่งก้าว"
    lang: "python"
    prompt: |
      คำนวณ loss gradient และอัปเดตพารามิเตอร์ด้วยมือ
    steps:
      - text: |
          loss ที่ w = b = 0 คือ 33.0 และ gradient คือ (−28, −10)
        code: |
          import numpy as np

          x = np.array([0.0, 1.0, 2.0, 3.0, 4.0])
          y = 2 * x + 1
          w, b = 0.0, 0.0
          pred = w * x + b
          loss = np.mean((pred - y) ** 2)
          grad_w = 2 * np.mean((pred - y) * x)
          grad_b = 2 * np.mean(pred - y)
          loss, grad_w, grad_b
      - text: |
          อัปเดตด้วย lr = 0.05: w = 1.4, b = 0.5 และ loss ลดลง
        code: |
          import numpy as np

          x = np.array([0.0, 1.0, 2.0, 3.0, 4.0])
          y = 2 * x + 1
          w, b, lr = 0.0, 0.0, 0.05
          pred = w * x + b
          w_new = w - lr * 2 * np.mean((pred - y) * x)
          b_new = b - lr * 2 * np.mean(pred - y)
          w_new, b_new, float(np.mean((w_new * x + b_new - y) ** 2))
    pitfall:
      text: |
        อัปเดตในทิศเดียวกับ gradient (w += lr * grad) — นั่นคือการ 'เพิ่ม' loss ให้ลบก้าวด้วย gradient เสมอ: w -= lr * grad
  - id: "x2"
    title: "learning rate ที่ต่างกัน"
    lang: "python"
    prompt: |
      รัน gradient descent 100 ก้าวด้วย learning rate ต่างกัน
    steps:
      - text: |
          lr 0.05 และ 0.1 เข้าใกล้ค่าจริง (w=2, b=1)
        code: |
          import numpy as np

          x = np.array([0.0, 1.0, 2.0, 3.0, 4.0])
          y = 2 * x + 1


          def gradient_descent(lr, steps=100):
              w, b = 0.0, 0.0
              for _ in range(steps):
                  pred = w * x + b
                  grad_w = 2 * np.mean((pred - y) * x)
                  grad_b = 2 * np.mean(pred - y)
                  w -= lr * grad_w
                  b -= lr * grad_b
              return w, b
          [tuple(round(float(v), 4) for v in gradient_descent(lr)) for lr in (0.01, 0.05, 0.1)]
      - text: |
          lr 0.25 ใหญ่เกิน — ค่าระเบิดไปเป็นตัวเลขมหาศาล (diverge)
        code: |
          import numpy as np

          x = np.array([0.0, 1.0, 2.0, 3.0, 4.0])
          y = 2 * x + 1


          def gradient_descent(lr, steps=100):
              w, b = 0.0, 0.0
              for _ in range(steps):
                  pred = w * x + b
                  grad_w = 2 * np.mean((pred - y) * x)
                  grad_b = 2 * np.mean(pred - y)
                  w -= lr * grad_w
                  b -= lr * grad_b
              return w, b
          w, b = gradient_descent(0.25)
          abs(w) > 1e6
    pitfall:
      text: |
        ดู loss ตอนเทรนแล้วเห็นเป็นตัวเลขใหญ่ขึ้นเรื่อยๆ หรือ nan แล้วเพิ่มจำนวนรอบ — นั่นคืออาการ learning rate สูงเกินไป ให้ลด lr ไม่ใช่เพิ่มรอบ
