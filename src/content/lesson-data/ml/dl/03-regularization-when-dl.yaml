goals:
  - "ลด overfitting ของ MLP ด้วย alpha, early_stopping และขนาดโมเดล"
  - "รายงานผลของโมเดลสุ่มอย่างซื่อตรง (หลาย seed, ค่าเฉลี่ย ± std)"
  - "ตัดสินใจได้ว่าเมื่อไรควรและไม่ควรใช้ deep learning"
examples:
  - id: "x1"
    title: "ลด overfitting ด้วย alpha และ early stopping"
    lang: "python"
    prompt: |
      เทียบ MLP (16,) แบบเดิม กับ alpha สูงและ early stopping
    steps:
      - text: |
          alpha = 1.0: train ลดเหลือ 0.6914 และ test เพิ่มเป็น 0.6169 (จาก 0.5986)
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          import numpy as np
          from sklearn.preprocessing import StandardScaler
          from sklearn.neural_network import MLPClassifier

          scaler = StandardScaler().fit(X_train)
          Z_train = scaler.transform(X_train)
          Z_test = scaler.transform(X_test)
          mlp = MLPClassifier(hidden_layer_sizes=(16,), alpha=1.0, max_iter=200, random_state=42).fit(Z_train, y_train)
          round(mlp.score(Z_train, y_train), 4), round(mlp.score(Z_test, y_test), 4)
      - text: |
          early_stopping=True: หยุดที่รอบ 27 (แทนที่จะครบ 200) และ best_validation_score_ ≈ 0.6056
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          import numpy as np
          from sklearn.preprocessing import StandardScaler
          from sklearn.neural_network import MLPClassifier

          scaler = StandardScaler().fit(X_train)
          Z_train = scaler.transform(X_train)
          Z_test = scaler.transform(X_test)
          mlp = MLPClassifier(hidden_layer_sizes=(16,), early_stopping=True, max_iter=200, random_state=42).fit(Z_train, y_train)
          mlp.n_iter_, round(mlp.best_validation_score_, 4), round(mlp.score(Z_test, y_test), 4)
    pitfall:
      text: |
        ตั้ง early_stopping=True แล้วประเมินโมเดลด้วยตัว validation ที่มันกันไว้เองเป็นผลสุดท้าย — ค่านั้นถูกใช้ตัดสินใจหยุด จึงดีเกินจริงเล็กน้อย ยังต้องวัดบนชุด test ที่แยกไว้ตั้งแต่ต้น
  - id: "x2"
    title: "ความแกว่งข้าม seed"
    lang: "python"
    prompt: |
      รันหลาย seed แล้วรายงานค่าเฉลี่ยและ std
    steps:
      - text: |
          MLP (16,) 5 seed (0–4) ไม่ใช้ early stopping: test 0.5873–0.6296 (ค่าเฉลี่ยราว 0.61)
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          import numpy as np
          from sklearn.preprocessing import StandardScaler
          from sklearn.neural_network import MLPClassifier

          scaler = StandardScaler().fit(X_train)
          Z_train = scaler.transform(X_train)
          Z_test = scaler.transform(X_test)
          accs = [MLPClassifier(hidden_layer_sizes=(16,), max_iter=200, random_state=s).fit(Z_train, y_train).score(Z_test, y_test) for s in range(5)]
          [round(a, 4) for a in accs], round(float(np.mean(accs)), 4), round(float(np.std(accs)), 4)
      - text: |
          เทียบกับ logistic regression ซึ่งไม่ขึ้นกับ seed: accuracy 0.6437 บน test เดียวกัน
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          import numpy as np
          from sklearn.preprocessing import StandardScaler
          from sklearn.neural_network import MLPClassifier

          scaler = StandardScaler().fit(X_train)
          Z_train = scaler.transform(X_train)
          Z_test = scaler.transform(X_test)
          from sklearn.ensemble import GradientBoostingClassifier
          from sklearn.linear_model import LogisticRegression
          from sklearn.metrics import roc_auc_score
          from sklearn.model_selection import StratifiedKFold, cross_val_score
          from sklearn.pipeline import make_pipeline
          round(LogisticRegression(max_iter=2000).fit(X_train, y_train).score(X_test, y_test), 4)
    pitfall:
      text: |
        รัน MLP หนึ่งครั้ง ได้ผลดีกว่าโมเดลอื่นเล็กน้อย แล้วประกาศว่า 'neural network ชนะ' — ความต่างระดับ 0.01–0.04 อยู่ในช่วงที่เปลี่ยน seed แล้วกลับกันได้ ทดสอบหลาย seed หรือ CV ก่อนสรุป
