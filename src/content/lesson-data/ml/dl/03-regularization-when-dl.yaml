        why: "ข้อมูลเหมือนเดิม"
      - text: "เป็นบั๊กของ sklearn"
        why: "ไม่ใช่บั๊ก"
      - text: "น้ำหนักเริ่มต้นและลำดับ mini-batch เป็นค่าสุ่ม การเทรนจึงไปจบที่ต่างกัน"
        correct: true
        why: "น้ำหนักเริ่มต้นสุ่ม (และลำดับ mini-batch สุ่มตามที่ solver adam ใช้) การเทรนจึงลงหลุมต่างกัน — 5 seed ให้ test 0.5873–0.6296 จากข้อมูลและโมเดลเดียวกัน"
      - text: "MLP ไม่มีความสุ่ม"
        why: "มีความสุ่ม"
  - id: "q3"
    question: "ข้อมูลใดที่ deep learning มักเหมาะที่สุด"
    choices:
      - text: "ตารางลูกค้าขนาด 3,000 แถว"
        why: "มักไม่ได้ประโยชน์จาก DL"
      - text: "ข้อมูลที่ต้องการอธิบายกฎเป็นข้อๆ"
        why: "อธิบายยากกว่า"
      - text: "ไม่มีข้อมูลเลย"
        why: "ต้องมีข้อมูล"
      - text: "รูปภาพ ข้อความ เสียง หรือข้อมูลขนาดใหญ่มาก โดยเฉพาะใช้ pretrained model"
        correct: true
        why: "ข้อมูลไม่มีโครงสร้างตาราง (พิกเซล ข้อความ เสียง) ต้องเรียนรู้ representation เองและมี pretrained model ให้ยืม ส่วนข้อมูลตารางเล็กๆ อย่างของเราโมเดลง่ายๆ ก็ได้ผลเท่ากันหรือดีกว่า"
