summary:
  - "MLP overfit ง่าย: alpha สูง (1.0: test 0.6169), early_stopping (หยุดที่รอบ 27, test 0.6282) หรือโมเดลเล็กลงช่วยลดช่องว่าง train−test"
  - "ผลขึ้นกับ seed (test 0.5873–0.6296 ใน 5 seed) จึงต้องรายงานค่าเฉลี่ย ± std หรือใช้ CV"
  - "ข้อมูลตารางขนาดเล็ก–กลางมักเหมาะกับ logistic regression / gradient boosting มากกว่า DL; DL เด่นกับรูปภาพ ข้อความ เสียง และข้อมูลขนาดใหญ่"
interview:
  - id: "i1"
    q: "จะทำอย่างไรถ้า neural network overfit ข้อมูลตาราง"
    a: |
      ลดความจุของโมเดล (hidden layer เล็กลง), regularization (L2/alpha, dropout ใน framework อื่น), early stopping ด้วย validation set, เพิ่มข้อมูลหรือ augmentation ถ้าทำได้ และเทียบกับ baseline ง่ายๆ เช่น logistic regression/gradient boosting เสมอ เพราะบนข้อมูลตารางขนาดเล็กโมเดลง่ายมักดีเท่ากันหรือกว่า
  - id: "i2"
    q: "เมื่อไรที่คุณจะเลือกใช้ deep learning แทน gradient boosting"
    a: |
      เมื่อข้อมูลเป็นรูปภาพ ข้อความ เสียง หรือลำดับ (ที่ต้องเรียนรู้ representation เอง) เมื่อมีข้อมูลมหาศาล หรือมี pretrained model ให้ทำ transfer learning สำหรับข้อมูลตารางทั่วไป gradient boosting มักเป็นตัวเลือกแรกเพราะเร็ว แม่น และอธิบายง่ายกว่า
