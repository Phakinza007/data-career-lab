    question: "วิธีใดช่วยลด overfitting ของ MLP ใน scikit-learn"
    choices:
      - text: "เพิ่ม max_iter ให้มากที่สุด"
        why: "ทำให้จำมากขึ้น"
      - text: "เพิ่ม alpha (L2), เปิด early_stopping หรือใช้ hidden layer เล็กลง"
        correct: true
        why: "ทั้งสามวิธีลดความสามารถในการจำ: alpha=1.0 ทำให้ test 0.5986→0.6169, early stopping หยุดที่รอบ 27 (test 0.6282), hidden (4,) test 0.6324 ขณะที่ (16, 8) แย่ลงเหลือ 0.5775"
      - text: "เพิ่มจำนวน hidden layer เรื่อยๆ"
        why: "ทำให้จำมากขึ้น"
      - text: "เอา scaling ออก"
        why: "ไม่ช่วย"
