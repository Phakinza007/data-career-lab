      te_gap = ___
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
      cat = ['city', 'channel', 'first_payment_method', 'first_status']
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
      train_df = pd.concat([X_train, y_train], axis=1)
      full_promo = df.groupby('channel')['repeated'].mean()['promo']
      train_promo = train_df.groupby('channel')['repeated'].mean()['promo']
      te_gap = round(full_promo - train_promo, 4)
    check: |
      check_value(te_gap, _sol["te_gap"], name="te_gap", tol=0.0001)
    hints:
      - "คำนวณค่าเฉลี่ยของ promo จาก df ทั้งชุดและจาก train_df แล้วลบกัน"
quiz:
  - id: "q1"
    question: "ทำไมต้องแปลงคอลัมน์หมวดหมู่เป็นตัวเลขก่อนเข้าโมเดลส่วนใหญ่ใน scikit-learn"
    choices:
      - text: "เพราะข้อความทำให้โมเดลช้า"
        why: "ประเด็นหลักไม่ใช่ความเร็ว แต่โมเดลรับข้อความไม่ได้"
      - text: "เพราะโมเดลคำนวณด้วยตัวเลข ไม่รับข้อความตรงๆ"
        correct: true
        why: "ถูกต้อง — จึงต้องมี encoding เช่น one-hot"
      - text: "เพราะตัวเลขแม่นกว่าข้อความเสมอ"
        why: "ไม่เกี่ยวกับความแม่น"
      - text: "ไม่จำเป็น scikit-learn แปลงให้เองเสมอ"
        why: "ไม่แปลงให้อัตโนมัติ"
  - id: "q2"
    question: "drop_first=True ใน get_dummies มีไว้ทำไม"
    choices:
      - text: "ทำให้โมเดลแม่นขึ้นเสมอ"
        why: "ไม่รับประกันความแม่น"
      - text: "ลบแถวแรกของข้อมูล"
        why: "ไม่ได้ลบแถว ตัดคอลัมน์ของหมวดแรก"
      - text: "ตัดคอลัมน์ที่คำนวณได้จากคอลัมน์อื่นออก ลดความซ้ำซ้อน"
        correct: true
        why: "ถูกต้อง — ถ้าทุกคอลัมน์ที่เหลือเป็น 0 ก็คือหมวดที่ถูกตัดออก"
      - text: "เรียงหมวดตามตัวอักษร"
        why: "ไม่เกี่ยวกับการเรียง"
  - id: "q3"
    question: "handle_unknown=\"ignore\" ของ OneHotEncoder ทำอะไร"
    choices:
      - text: "ลบหมวดที่พบน้อยออก"
        why: "ไม่ได้ลบหมวดใด"
      - text: "สุ่มหมวดให้แทน"
        why: "ไม่สุ่ม"
      - text: "ทำให้ fit ไม่ต้องใช้ข้อมูล"
        why: "ยังต้อง fit"
      - text: "หมวดที่ไม่เคยเห็นตอน fit จะกลายเป็นแถวที่เป็น 0 ทั้งหมด แทนที่จะ error"
        correct: true
        why: "ถูกต้อง — ในบทนี้ลูกค้า Hat Yai ถูกแปลงเป็นแถวศูนย์"
  - id: "q4"
    question: "ทำไมไม่ควรใช้ OrdinalEncoder กับวิธีชำระเงิน (cod, promptpay, …)"
    choices:
      - text: "เพราะจะสร้างลำดับปลอมที่โมเดลเส้นตรงอาจตีความเป็นมาก-น้อย ทั้งที่ข้อมูลไม่มีลำดับ"
        correct: true
        why: "ถูกต้อง — ควรใช้ one-hot กับข้อมูลที่ไม่มีลำดับ"
      - text: "เพราะ OrdinalEncoder ใช้กับข้อความไม่ได้"
        why: "ใช้กับข้อความได้"
      - text: "เพราะจะทำให้ข้อมูลหาย"
        why: "ข้อมูลไม่หาย"
      - text: "เพราะช้ากว่า one-hot มาก"
        why: "ไม่เกี่ยวกับความเร็ว"
summary:
  - "one-hot: หนึ่งหมวดต่อหนึ่งคอลัมน์ 0/1 (drop_first ตัดคอลัมน์ซ้ำซ้อน) — OrdinalEncoder ใช้เฉพาะข้อมูลที่มีลำดับจริง"
  - "fit encoder บน train แล้ว transform ทั้ง train/test และตั้ง handle_unknown=\"ignore\" เพื่อรับหมวดใหม่โดยไม่ error"
  - "target encoding ต้องคำนวณจาก train เท่านั้น — ถ้าใช้ข้อมูลทั้งชุด ค่าเฉลี่ยของ promo เพี้ยนไปจากค่าที่ควรเป็น (ตัวอย่างในบทต่างกัน ~0.004) เพราะ target ของ test รั่วเข้ามา"
interview:
  - id: "i1"
    q: "one-hot กับ ordinal encoding ต่างกันยังไง และเลือกใช้เมื่อไร"
    a: |
      one-hot สร้างคอลัมน์ 0/1 ต่อหนึ่งหมวด ไม่สร้างลำดับ จึงเหมาะกับข้อมูลที่ไม่มีลำดับ (เมือง ช่องทาง วิธีชำระเงิน) ส่วน ordinal แปลงเป็นเลข 0,1,2 ตามลำดับหมวด เหมาะเมื่อหมวดมีลำดับจริงและระยะห่างพอสมเหตุสมผล (เช่น ระดับความพึงพอใจ) ถ้าใช้ ordinal กับข้อมูลที่ไม่มีลำดับ โมเดลเส้นตรงอาจตีความเป็นมาก-น้อยที่ไม่มีอยู่จริง
  - id: "i2"
    q: "เจอคอลัมน์ที่มีหมวดเป็นพันๆ ค่า (high cardinality) เช่น รหัสสินค้า จะจัดการอย่างไร"
    a: |
      one-hot ตรงๆ จะสร้างคอลัมน์มหาศาลและกระจัดกระจาย ทางเลือกได้แก่ รวมหมวดที่พบน้อยเป็น "อื่นๆ", ใช้ target encoding (คำนวณจาก train เท่านั้น หรือทำแบบ cross-fitted เพื่อกัน leakage), ใช้ embedding หรือโมเดลที่รับหมวดได้โดยตรง และเลือกวิธีด้วย cross-validation
flashcards:
  - id: "c1"
    front: "เหตุผลที่ต้อง fit OneHotEncoder บน train เท่านั้น"
    back: "เพื่อให้ชุดคอลัมน์เหมือนกันทั้ง train/test และไม่ให้ข้อมูล test มีผลต่อการเรียนรู้หมวด"
  - id: "c2"
    front: "target encoding ทำให้เกิด leakage เมื่อไร"
    back: "เมื่อคำนวณค่าเฉลี่ยของ target จากข้อมูลทั้งชุดรวมแถว test — target ของแถว test รั่วเข้าไปใน feature"
