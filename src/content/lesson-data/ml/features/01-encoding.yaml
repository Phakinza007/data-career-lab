goals:
  - "แปลงข้อมูลหมวดหมู่เป็นตัวเลขด้วย one-hot และเลือกใช้ ordinal เมื่อมีลำดับจริงเท่านั้น"
  - "ใช้ OneHotEncoder ที่ fit บน train เพื่อให้คอลัมน์ตรงกันและรับหมวดใหม่ได้"
  - "รู้ว่า target encoding ต้องคำนวณจาก train เท่านั้น"
examples:
  - id: "x1"
    title: "one-hot ด้วย get_dummies"
    lang: "python"
    prompt: |
      แปลงคอลัมน์เมืองให้โมเดลใช้ได้
    steps:
      - text: |
          เมืองมี 8 หมวด → get_dummies ได้ 8 คอลัมน์
        code: |
          import pandas as pd

          df = pd.read_csv("data/ml_customers.csv")
          df['city'].nunique(), pd.get_dummies(df['city']).shape[1]
      - text: |
          drop_first=True ตัดคอลัมน์ที่ซ้ำซ้อนออก เหลือ 7
        code: |
          import pandas as pd

          df = pd.read_csv("data/ml_customers.csv")
          pd.get_dummies(df['city'], drop_first=True).shape[1]
    pitfall:
      text: |
        แปลง train กับ test ด้วย `get_dummies` แยกกัน — ถ้าหมวดหนึ่งไม่มีในชุดใดชุดหนึ่ง คอลัมน์จะไม่ตรงกัน (ตัวอย่างนี้ train มี 7 คอลัมน์แต่ชุดที่มีแต่ Hat Yai มีแค่ 1) แล้วโมเดลจะ error หรือได้ผลผิดตอน predict ควรใช้ OneHotEncoder ที่ fit บน train แล้ว transform ทั้งสองชุด
      code: |
        import pandas as pd

        df = pd.read_csv("data/ml_customers.csv")
        train = df[df['city'] != 'Hat Yai']
        hatyai = df[df['city'] == 'Hat Yai']
        pd.get_dummies(train['city']).shape[1], pd.get_dummies(hatyai['city']).shape[1]
  - id: "x2"
    title: "OneHotEncoder กับหมวดที่ไม่เคยเห็น"
    lang: "python"
    prompt: |
      ลูกค้าจากเมืองที่ไม่มีในข้อมูลเทรนจะเป็นอย่างไร
    steps:
      - text: |
          fit encoder บนข้อมูลที่ไม่มี Hat Yai — ได้ 7 หมวด
        code: |
          import pandas as pd

          df = pd.read_csv("data/ml_customers.csv")
          from sklearn.preprocessing import OneHotEncoder

          train = df[df['city'] != 'Hat Yai']
          hatyai = df[df['city'] == 'Hat Yai']
          encoder = OneHotEncoder(handle_unknown='ignore').fit(train[['city']])
          len(encoder.categories_[0])
      - text: |
          transform ลูกค้า Hat Yai (194 คน) — ทุกแถวเป็น 0 หมดแทนที่จะ error
        code: |
          import pandas as pd

          df = pd.read_csv("data/ml_customers.csv")
          from sklearn.preprocessing import OneHotEncoder

          train = df[df['city'] != 'Hat Yai']
          hatyai = df[df['city'] == 'Hat Yai']
          encoder = OneHotEncoder(handle_unknown='ignore').fit(train[['city']])
          encoded = encoder.transform(hatyai[['city']]).toarray()
          len(hatyai), encoded.sum()
    pitfall:
      text: |
        ไม่ตั้ง `handle_unknown='ignore'` แล้วเจอหมวดใหม่ตอนใช้งานจริง — OneHotEncoder จะ error ทันที (ValueError: Found unknown categories) ทำให้ระบบล่มทั้งที่แค่มีลูกค้าจากเมืองใหม่หนึ่งคน
