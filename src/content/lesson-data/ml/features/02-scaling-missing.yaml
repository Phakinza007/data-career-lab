    solution: |
      import numpy as np
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
      cat = ['city', 'channel', 'first_payment_method', 'first_status']
      df.loc[df['customer_id'] % 10 == 0, 'days_to_first_order'] = np.nan
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.impute import SimpleImputer
      imputer = SimpleImputer(strategy='median').fit(X_train[['days_to_first_order']])
      filled = imputer.transform(X_test[['days_to_first_order']])
      filled_test_mean = round(float(filled.mean()), 4)
    check: |
      check_value(filled_test_mean, _sol["filled_test_mean"], name="filled_test_mean", tol=0.001)
    hints:
      - "transform ชุดทดสอบด้วย imputer ที่ fit บน train"
quiz:
  - id: "q1"
    question: "ทำไมต้อง fit StandardScaler บนชุด train เท่านั้น"
    choices:
      - text: "เพราะ scaler ไม่ทำงานกับชุด test"
        why: "ทำงานได้ด้วย transform"
      - text: "เพื่อไม่ให้ข้อมูล test ปนเข้ามาใน mean/std ที่ใช้ปรับสเกล (ป้องกัน leakage)"
        correct: true
        why: "ถูกต้อง — แล้ว transform ทั้ง train และ test ด้วยค่าเดียวกัน"
      - text: "เพื่อให้ test มี mean = 0 พอดี"
        why: "ผลตรงกันข้าม: test จะเบี่ยงจาก 0 เล็กน้อย ซึ่งปกติ"
      - text: "เพราะเร็วกว่า"
        why: "ไม่ใช่เหตุผลหลัก"
  - id: "q2"
    question: "โมเดลแบบไหนได้ประโยชน์จากการ scale มากที่สุด"
    choices:
      - text: "decision tree เท่านั้น"
        why: "tree ไม่ไวต่อสเกล"
      - text: "ทุกโมเดลเท่ากัน"
        why: "ต่างกัน tree ไม่ไวต่อสเกล"
      - text: "โมเดลที่ใช้ระยะทางหรือ regularization/gradient เช่น KNN, logistic regression, neural network"
        correct: true
        why: "ถูกต้อง — decision tree ไม่สนสเกล"
      - text: "ไม่มีโมเดลไหนได้ประโยชน์"
        why: "มีโมเดลหลายแบบที่ไวต่อสเกล"
  - id: "q3"
    question: "ในบทนี้ KNN ที่ scale แล้วได้ accuracy สูงกว่าแบบไม่ scale หรือไม่"
    choices:
      - text: "ใช่ scale แล้วดีขึ้นเสมอ"
        why: "ผลจริงในข้อมูลนี้ตรงกันข้าม"
      - text: "เท่ากันเป๊ะ"
        why: "ค่าต่างกันเล็กน้อย"
      - text: "วัดไม่ได้"
        why: "วัดได้ด้วย score บนชุดทดสอบ"
      - text: "ไม่ — ได้ต่ำกว่าเล็กน้อย scaling ไม่ได้ช่วยเสมอไป"
        correct: true
        why: "ถูกต้อง — accuracy ~0.58 เทียบกับ ~0.60 เมื่อไม่ scale"
  - id: "q4"
    question: "เมื่อข้อมูลเบ้ขวา ควรเติมค่าที่หายด้วยอะไร"
    choices:
      - text: "ค่ามัธยฐาน (median) เพราะทนต่อค่าสุดโต่งกว่า mean"
        correct: true
        why: "ถูกต้อง — และต้องคำนวณจาก train เท่านั้น"
      - text: "ค่าสูงสุดเสมอ"
        why: "ไม่มีเหตุผลรองรับ"
      - text: "0 เสมอ"
        why: "0 อาจไม่สมเหตุสมผลกับข้อมูลจริง"
      - text: "ลบทุกแถวที่มี NaN เสมอ"
        why: "อาจทิ้งข้อมูลจำนวนมาก ไม่ใช่ทางเลือกเดียว"
summary:
  - "StandardScaler และ SimpleImputer ต้อง fit บน train เท่านั้น แล้ว transform ทั้ง train และ test"
  - "scaling เปลี่ยนว่า feature ไหนมีอิทธิพลต่อระยะทาง — ในข้อมูลนี้ KNN ที่ scale แล้วได้ accuracy ต่ำกว่า จึงต้องวัดเสมอ"
  - "โมเดลส่วนใหญ่ error เมื่อมี NaN; เติมด้วย median จะทนค่าสุดโต่งกว่า mean"
interview:
  - id: "i1"
    q: "อธิบายว่าทำไมการ fit scaler บนข้อมูลทั้งชุดก่อนแบ่ง train/test จึงเป็น leakage"
    a: |
      เพราะ mean/std ที่ใช้ปรับสเกลถูกคำนวณจากข้อมูลที่รวมชุด test — ข้อมูล test จึงมีผลต่อการแปลง feature ที่โมเดลเห็นตอนเทรน ทำให้ผลทดสอบดีเกินจริงเล็กน้อยและไม่ตรงกับสถานการณ์จริงที่ข้อมูลใหม่ยังไม่เคยมีอยู่ตอนเทรน วิธีที่ถูกคือ fit บน train แล้ว transform test ด้วยค่าเดิม (หรือใส่ไว้ใน Pipeline)
  - id: "i2"
    q: "ถ้าข้อมูลมี missing 5% ควรเลือกวิธีจัดการอย่างไร"
    a: |
      ดูก่อนว่าหายแบบสุ่มหรือมีแบบแผน (เช่น หายเฉพาะกลุ่มลูกค้าบางกลุ่ม) แล้วเลือกจากลบแถว เติม median/mean/ค่าคงที่ หรือเพิ่มคอลัมน์ flag ว่าค่านี้เคยหาย และวัดผลด้วย cross-validation โดยต้องคำนวณค่าที่เติมจาก train เท่านั้น
