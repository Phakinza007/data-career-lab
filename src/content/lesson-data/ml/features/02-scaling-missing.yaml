goals:
  - "ใช้ StandardScaler โดย fit บน train เท่านั้น และรู้ว่าโมเดลแบบไหนไวต่อสเกล"
  - "ไม่เชื่อว่า scaling ช่วยเสมอไป — วัดผลก่อนตัดสินใจ"
  - "เติม missing values ด้วย SimpleImputer โดยใช้ค่าจาก train"
examples:
  - id: "x1"
    title: "StandardScaler ที่ fit บน train"
    lang: "python"
    prompt: |
      ปรับสเกล feature ตัวเลขโดยไม่ให้ข้อมูล test ปนเข้ามา
    steps:
      - text: |
          fit scaler บน train — ดู mean และ std ของ days_to_first_order ที่เรียนรู้ได้
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
          cat = ['city', 'channel', 'first_payment_method', 'first_status']
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.preprocessing import StandardScaler

          scaler = StandardScaler().fit(X_train[num])
          round(scaler.mean_[1], 3), round(scaler.scale_[1], 3)
      - text: |
          transform แล้ว train มี mean = 0 พอดี แต่ test เบี่ยงเล็กน้อย (ปกติ เพราะใช้ mean/std จาก train)
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
          cat = ['city', 'channel', 'first_payment_method', 'first_status']
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.preprocessing import StandardScaler

          scaler = StandardScaler().fit(X_train[num])
          Z_train = scaler.transform(X_train[num])
          Z_test = scaler.transform(X_test[num])
          round(Z_train.mean(axis=0)[1], 6), round(Z_test.mean(axis=0)[1], 4)
    pitfall:
      text: |
        fit scaler บนข้อมูลทั้งชุดก่อนแบ่ง train/test — โค้ดรันได้ปกติ แต่ mean/std ที่ได้มีข้อมูล test ปนอยู่ (ตัวอย่างนี้ mean ของ days_to_first_order เป็น 6.95 แทนที่จะเป็น 7.073 จาก train) จึงเป็น leakage เล็กๆ ที่สะสมได้เมื่อมีหลายขั้นตอน
      code: |
        import pandas as pd
        from sklearn.model_selection import train_test_split

        df = pd.read_csv("data/ml_customers.csv")
        num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
        cat = ['city', 'channel', 'first_payment_method', 'first_status']
        y = df['repeated']
        X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
        from sklearn.preprocessing import StandardScaler

        leaky = StandardScaler().fit(df[num])
        round(leaky.mean_[1], 3)
  - id: "x2"
    title: "scaling กับ KNN"
    lang: "python"
    prompt: |
      KNN ใช้ระยะทาง — scale แล้วดีขึ้นไหม
    steps:
      - text: |
          KNN (k=15) บน feature ตัวเลขทั้ง 6 ตัวโดยไม่ scale
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
          cat = ['city', 'channel', 'first_payment_method', 'first_status']
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.neighbors import KNeighborsClassifier
          from sklearn.preprocessing import StandardScaler
          knn = KNeighborsClassifier(n_neighbors=15).fit(X_train[num], y_train)
          round(knn.score(X_test[num], y_test), 4)
      - text: |
          scale ก่อน — accuracy ลดลงเล็กน้อย เพราะ feature ที่ไม่มีสัญญาณมีน้ำหนักเท่ากับ feature ที่มีสัญญาณ
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
          cat = ['city', 'channel', 'first_payment_method', 'first_status']
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.neighbors import KNeighborsClassifier
          from sklearn.preprocessing import StandardScaler
          scaler = StandardScaler().fit(X_train[num])
          knn = KNeighborsClassifier(n_neighbors=15).fit(scaler.transform(X_train[num]), y_train)
          round(knn.score(scaler.transform(X_test[num]), y_test), 4)
    pitfall:
      text: |
        เชื่อว่า "scale แล้วดีขึ้นเสมอ" โดยไม่วัด — scaling ไม่ได้ทำให้โมเดลแม่นขึ้นโดยอัตโนมัติ มันแค่เปลี่ยนว่า feature ไหนมีอิทธิพลต่อระยะทาง (ในตัวอย่างนี้ผลแย่ลงเล็กน้อย) ต้องเทียบผลด้วยข้อมูลทดสอบหรือ CV
  - id: "x3"
    title: "เติมค่าที่หายไปด้วย SimpleImputer"
    lang: "python"
    prompt: |
      บางแถวไม่มีค่า days_to_first_order — เติมยังไงให้ไม่รั่ว
    steps:
      - text: |
          จำลองข้อมูลหาย: ตั้ง days_to_first_order เป็น NaN ให้ลูกค้า customer_id ที่หาร 10 ลงตัว
        code: |
          import numpy as np
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
          cat = ['city', 'channel', 'first_payment_method', 'first_status']
          df.loc[df['customer_id'] % 10 == 0, 'days_to_first_order'] = np.nan
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
          int(df['days_to_first_order'].isna().sum())
      - text: |
          fit imputer (median) บน train แล้วเติมค่าให้ชุดทดสอบด้วยค่าเดียวกัน
        code: |
          import numpy as np
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
          cat = ['city', 'channel', 'first_payment_method', 'first_status']
          df.loc[df['customer_id'] % 10 == 0, 'days_to_first_order'] = np.nan
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.impute import SimpleImputer
          imputer = SimpleImputer(strategy='median').fit(X_train[['days_to_first_order']])
          filled = imputer.transform(X_test[['days_to_first_order']])
          imputer.statistics_[0], int(X_test['days_to_first_order'].isna().sum()), int(np.isnan(filled).sum())
    pitfall:
      text: |
        ส่งข้อมูลที่ยังมี NaN เข้า LogisticRegression ตรงๆ — จะเกิด ValueError: Input contains NaN ต้องเติมค่า (หรือใช้โมเดลที่รับ NaN ได้) ก่อนเสมอ และเติมด้วยค่าที่คำนวณจาก train เท่านั้น
