quiz:
  - id: "q1"
    question: "ข้อดีหลักของ Pipeline คืออะไร"
    choices:
      - text: "ทำให้โมเดลแม่นกว่าเสมอ"
        why: "ไม่รับประกันความแม่น"
      - text: "รวมขั้นตอนเตรียมข้อมูลและโมเดลเป็นก้อนเดียว fit บน train เท่านั้นโดยอัตโนมัติ ลดโอกาส leakage"
        correct: true
        why: "ถูกต้อง"
      - text: "ทำให้ไม่ต้องแบ่ง train/test"
        why: "ยังต้องแบ่งและวัดผลเหมือนเดิม"
      - text: "ใช้ได้เฉพาะกับ logistic regression"
        why: "ใช้กับโมเดลใดก็ได้"
  - id: "q2"
    question: "ColumnTransformer ใช้ทำอะไร"
    choices:
      - text: "เปลี่ยนชื่อคอลัมน์"
        why: "ไม่ใช่หน้าที่หลัก"
      - text: "ลบคอลัมน์ที่ซ้ำ"
        why: "ไม่ใช่หน้าที่หลัก"
      - text: "ใช้ตัวแปลงต่างกันกับคอลัมน์แต่ละกลุ่ม เช่น scale ตัวเลข และ one-hot ตัวหมวด"
        correct: true
        why: "ถูกต้อง"
      - text: "เทรนโมเดล"
        why: "ColumnTransformer แปลงข้อมูล ไม่ได้เทรนโมเดล"
  - id: "q3"
    question: "ส่ง Pipeline เข้า cross_val_score ต่างจากส่งข้อมูลที่ scale ไปแล้วอย่างไร"
    choices:
      - text: "ไม่ต่างกัน"
        why: "ต่างกันในเรื่อง leakage"
      - text: "Pipeline ช้ากว่าเสมอจึงไม่ควรใช้"
        why: "ความเร็วไม่ใช่เกณฑ์ตัดสิน"
      - text: "cross_val_score ใช้กับ Pipeline ไม่ได้"
        why: "ใช้ได้ตรงๆ"
      - text: "แต่ละ fold จะ fit ตัวแปลงใหม่บนส่วน train ของ fold นั้น จึงไม่มี leakage จากการเตรียมข้อมูล"
        correct: true
        why: "ถูกต้อง"
  - id: "q4"
    question: "ทำไม pipeline ในบทนี้ทำนายลูกค้าจากเมืองใหม่ได้โดยไม่ error"
    choices:
      - text: "เพราะ OneHotEncoder ตั้ง handle_unknown=\"ignore\" หมวดใหม่จึงกลายเป็นแถวที่เป็น 0 ทั้งหมด"
        correct: true
        why: "ถูกต้อง"
      - text: "เพราะ pipeline เดาชื่อเมืองเอง"
        why: "ไม่ได้เดา"
      - text: "เพราะ LogisticRegression ไม่สนใจคอลัมน์ city"
        why: "โมเดลใช้ผลของ one-hot แต่หมวดใหม่เป็น 0"
      - text: "ไม่จริง จะ error เสมอ"
        why: "ไม่ error เพราะตั้ง handle_unknown=\"ignore\""
summary:
  - "Pipeline + ColumnTransformer รวม scale/one-hot/โมเดลเป็นก้อนเดียวและ fit ตัวแปลงบน train เท่านั้น"
  - "ส่ง pipeline ทั้งก้อนเข้า cross_val_score เพื่อไม่ให้การเตรียมข้อมูลรั่วข้าม fold (ในข้อมูลนี้ AUC เฉลี่ย ~0.64, std ~0.02)"
  - "handle_unknown=\"ignore\" ทำให้ pipeline รับหมวดใหม่ (เช่น เมืองที่ไม่เคยเห็น) ตอนใช้งานจริงได้โดยไม่ error"
interview:
  - id: "i1"
    q: "อธิบายว่า Pipeline ช่วยป้องกัน data leakage อย่างไร"
    a: |
      Pipeline ห่อขั้นตอนเตรียมข้อมูลและโมเดลไว้ด้วยกัน ตอน fit จะเรียนรู้ตัวแปลง (mean/std ของ scaler, หมวดของ encoder) จากข้อมูล train เท่านั้น และตอน predict/transform จะใช้ค่าที่เรียนรู้ไว้แล้วกับข้อมูลใหม่ เมื่อใช้ร่วมกับ cross-validation แต่ละ fold จะ fit ตัวแปลงใหม่บนส่วน train ของ fold นั้น ข้อมูลทดสอบจึงไม่มีผลต่อการเตรียมข้อมูลเลย
  - id: "i2"
    q: "ถ้าต้องส่งโมเดลไปใช้งานจริง ทำไมควรส่งเป็น pipeline ทั้งก้อน"
    a: |
      เพราะข้อมูลดิบที่เข้ามาต้องผ่านการแปลงเหมือนตอนเทรนทุกขั้นตอน ถ้าแยกตัวแปลงกับโมเดลออกจากกัน เสี่ยงที่จะใช้ตัวแปลงคนละชุดหรือลืมขั้นตอน pipeline เดียวช่วยให้ทำนายจากข้อมูลดิบได้ตรงกับตอนเทรนเสมอ และเวอร์ชันของตัวแปลงกับโมเดลอยู่ด้วยกัน
flashcards:
  - id: "c1"
    front: "ColumnTransformer ทำอะไร"
    back: "ใช้ตัวแปลงต่างชนิดกับคอลัมน์แต่ละกลุ่ม (เช่น scale ตัวเลข one-hot ตัวหมวด) แล้วรวมผลเป็นตารางเดียว"
