goals:
  - "รวมขั้นตอนเตรียมข้อมูลกับโมเดลด้วย Pipeline และ ColumnTransformer"
  - "วัดผลทั้ง pipeline ด้วย cross-validation โดยไม่มี leakage"
  - "ส่งข้อมูลดิบเข้า pipeline ที่เทรนแล้วเพื่อทำนายได้เลย"
examples:
  - id: "x1"
    title: "สร้างและเทรน Pipeline"
    lang: "python"
    prompt: |
      รวม scale + one-hot + LogisticRegression ไว้ในวัตถุเดียว
    steps:
      - text: |
          fit pipeline บน train แล้ววัด accuracy และ AUC บนชุดทดสอบ
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
          cat = ['city', 'channel', 'first_payment_method', 'first_status']
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.compose import ColumnTransformer
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import OneHotEncoder, StandardScaler
          from sklearn.linear_model import LogisticRegression
          from sklearn.metrics import roc_auc_score

          pre = ColumnTransformer([('num', StandardScaler(), num), ('cat', OneHotEncoder(handle_unknown='ignore'), cat)])
          pipe = Pipeline([('pre', pre), ('model', LogisticRegression(max_iter=2000))])
          pipe.fit(X_train, y_train)
          round(pipe.score(X_test, y_test), 4), round(roc_auc_score(y_test, pipe.predict_proba(X_test)[:, 1]), 4)
      - text: |
          ดูจำนวน feature หลังแปลง: 6 ตัวเลข + one-hot ของ 4 คอลัมน์หมวด = 25 คอลัมน์
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
          cat = ['city', 'channel', 'first_payment_method', 'first_status']
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.compose import ColumnTransformer
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import OneHotEncoder, StandardScaler
          from sklearn.linear_model import LogisticRegression
          from sklearn.metrics import roc_auc_score

          pre = ColumnTransformer([('num', StandardScaler(), num), ('cat', OneHotEncoder(handle_unknown='ignore'), cat)])
          pipe = Pipeline([('pre', pre), ('model', LogisticRegression(max_iter=2000))])
          pipe.fit(X_train, y_train)
          len(pipe.named_steps['pre'].get_feature_names_out())
    pitfall:
      text: |
        scale/impute ข้อมูลทั้งชุดด้วยมือก่อนแบ่ง train/test แล้วค่อยเทรน — ตัวแปลงเรียนรู้จากข้อมูล test ไปแล้ว (leakage) ใส่ทุกขั้นตอนไว้ใน Pipeline เพื่อให้ fit บน train เท่านั้นโดยอัตโนมัติ
  - id: "x2"
    title: "cross-validation ของทั้ง pipeline"
    lang: "python"
    prompt: |
      วัดผลที่เชื่อถือได้โดยไม่รั่วจากการเตรียมข้อมูล
    steps:
      - text: |
          5-fold stratified CV วัด ROC-AUC ของทั้ง pipeline — ค่าเฉลี่ยประมาณ 0.64 มี std ประมาณ 0.02
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
          cat = ['city', 'channel', 'first_payment_method', 'first_status']
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.compose import ColumnTransformer
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import OneHotEncoder, StandardScaler
          from sklearn.linear_model import LogisticRegression
          from sklearn.metrics import roc_auc_score

          pre = ColumnTransformer([('num', StandardScaler(), num), ('cat', OneHotEncoder(handle_unknown='ignore'), cat)])
          pipe = Pipeline([('pre', pre), ('model', LogisticRegression(max_iter=2000))])
          from sklearn.model_selection import StratifiedKFold, cross_val_score

          skf = StratifiedKFold(5, shuffle=True, random_state=42)
          X_all = df[num + cat]
          scores = cross_val_score(pipe, X_all, df['repeated'], cv=skf, scoring='roc_auc')
          scores.round(4), round(scores.mean(), 4), round(scores.std(), 4)
      - text: |
          เทียบกับ accuracy แบบ CV เดียวกัน
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
          cat = ['city', 'channel', 'first_payment_method', 'first_status']
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.compose import ColumnTransformer
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import OneHotEncoder, StandardScaler
          from sklearn.linear_model import LogisticRegression
          from sklearn.metrics import roc_auc_score

          pre = ColumnTransformer([('num', StandardScaler(), num), ('cat', OneHotEncoder(handle_unknown='ignore'), cat)])
          pipe = Pipeline([('pre', pre), ('model', LogisticRegression(max_iter=2000))])
          from sklearn.model_selection import StratifiedKFold, cross_val_score

          skf = StratifiedKFold(5, shuffle=True, random_state=42)
          X_all = df[num + cat]
          acc = cross_val_score(pipe, X_all, df['repeated'], cv=skf, scoring='accuracy')
          round(acc.mean(), 4)
    pitfall:
      text: |
        ใส่ข้อมูลที่ scale ไปแล้วทั้งชุดเข้า cross_val_score — แต่ละ fold ทดสอบด้วยข้อมูลที่ mean/std เคยเห็นแล้ว ผลจึงดีกว่าความจริงเล็กน้อย ส่ง pipeline ทั้งก้อนเข้า CV แทน เพราะแต่ละ fold จะ fit ตัวแปลงใหม่บนส่วน train ของ fold นั้น
