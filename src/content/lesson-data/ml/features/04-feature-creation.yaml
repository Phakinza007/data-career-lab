goals:
  - "สร้าง feature ใหม่ด้วย log transform, อัตราส่วน, flag และการจัดกลุ่ม"
  - "ตรวจว่า feature ใหม่ไม่ leak (รู้ได้ ณ เวลาทำนายจริง)"
  - "ตัดสินใจเก็บ feature ด้วย cross-validation ไม่ใช่ความรู้สึก"
examples:
  - id: "x1"
    title: "log transform แก้ข้อมูลเบ้"
    lang: "python"
    prompt: |
      มูลค่าออเดอร์แรกเบ้ขวามาก — ลอง log
    steps:
      - text: |
          skew ของ first_order_value ดิบ ≈ 3.3 (หางขวายาวมาก)
        code: |
          import pandas as pd

          df = pd.read_csv("data/ml_customers.csv")
          import numpy as np
          round(df['first_order_value'].skew(), 3)
      - text: |
          log1p แล้ว skew ≈ 0 (การกระจายสมมาตรขึ้นมาก)
        code: |
          import pandas as pd

          df = pd.read_csv("data/ml_customers.csv")
          import numpy as np
          round(np.log1p(df['first_order_value']).skew(), 3)
    pitfall:
      text: |
        ใช้ `np.log` กับคอลัมน์ที่อาจมีค่า 0 — log(0) ได้ −inf ทำให้โมเดลพัง ใช้ `np.log1p` (คำนวณ log(1 + x)) แทน ซึ่งปลอดภัยกับ 0 และเหมาะกับตัวเลขที่ไม่ติดลบ
  - id: "x2"
    title: "เพิ่ม feature แล้ววัดด้วย CV"
    lang: "python"
    prompt: |
      feature ใหม่ช่วยโมเดลจริงไหม
    steps:
      - text: |
          สร้างฟังก์ชัน cv_auc ที่ประกอบ pipeline แล้ววัด AUC แบบ 5-fold แล้ววัด baseline
        code: |
          import numpy as np
          import pandas as pd
          from sklearn.compose import ColumnTransformer
          from sklearn.linear_model import LogisticRegression
          from sklearn.model_selection import StratifiedKFold, cross_val_score
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import OneHotEncoder, StandardScaler

          df = pd.read_csv("data/ml_customers.csv")
          num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
          cat = ['city', 'channel', 'first_payment_method', 'first_status']


          def cv_auc(data, num_cols, cat_cols):
              pre = ColumnTransformer([('num', StandardScaler(), num_cols), ('cat', OneHotEncoder(handle_unknown='ignore'), cat_cols)])
              pipe = Pipeline([('pre', pre), ('model', LogisticRegression(max_iter=2000))])
              skf = StratifiedKFold(5, shuffle=True, random_state=42)
              return cross_val_score(pipe, data[num_cols + cat_cols], data['repeated'], cv=skf, scoring='roc_auc').mean()
          round(cv_auc(df, num, cat), 4)
      - text: |
          เพิ่ม fast_first หรือ value_per_item + log_value + first_order_value — AUC ไม่ได้ดีขึ้น
        code: |
          import numpy as np
          import pandas as pd
          from sklearn.compose import ColumnTransformer
          from sklearn.linear_model import LogisticRegression
          from sklearn.model_selection import StratifiedKFold, cross_val_score
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import OneHotEncoder, StandardScaler

          df = pd.read_csv("data/ml_customers.csv")
          num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
          cat = ['city', 'channel', 'first_payment_method', 'first_status']


          def cv_auc(data, num_cols, cat_cols):
              pre = ColumnTransformer([('num', StandardScaler(), num_cols), ('cat', OneHotEncoder(handle_unknown='ignore'), cat_cols)])
              pipe = Pipeline([('pre', pre), ('model', LogisticRegression(max_iter=2000))])
              skf = StratifiedKFold(5, shuffle=True, random_state=42)
              return cross_val_score(pipe, data[num_cols + cat_cols], data['repeated'], cv=skf, scoring='roc_auc').mean()
          df['fast_first'] = (df['days_to_first_order'] <= 3).astype(int)
          df['value_per_item'] = df['first_order_value'] / df['first_n_items']
          df['log_value'] = np.log1p(df['first_order_value'])
          round(cv_auc(df, num + ['fast_first'], cat), 4), round(cv_auc(df, num + ['value_per_item', 'log_value', 'first_order_value'], cat), 4)
    pitfall:
      text: |
        เก็บ feature ไว้เพราะ "น่าจะช่วย" โดยไม่วัด — ในตัวอย่างนี้ทั้งสองชุด feature ใหม่ให้ AUC ไม่สูงกว่า baseline (ต่ำกว่าเล็กน้อยด้วยซ้ำ) เพราะสัญญาณหลักมาจากช่องทางสมัครอยู่แล้ว feature ที่ไม่ช่วยเพิ่มความซับซ้อนและความเสี่ยง overfit โดยเปล่าประโยชน์
