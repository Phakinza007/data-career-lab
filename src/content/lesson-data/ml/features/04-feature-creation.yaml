quiz:
  - id: "q1"
    question: "ทำไมใช้ np.log1p แทน np.log กับข้อมูลที่ไม่ติดลบ"
    choices:
      - text: "log1p เร็วกว่า log เสมอ"
        why: "ไม่เกี่ยวกับความเร็ว"
      - text: "log1p คำนวณ log(1 + x) จึงปลอดภัยเมื่อค่าเป็น 0 (log(0) ได้ −inf)"
        correct: true
        why: "log(0) = −∞ ซึ่งทำลายโมเดล ส่วน log(1 + 0) = 0 ใช้ได้ log1p จึงเหมาะกับค่าที่เป็น 0 ได้จริง เช่น first_discount_pct ที่ไม่มีส่วนลด"
      - text: "log1p ให้ผลเหมือน log ทุกประการ"
        why: "ต่างกันที่ +1"
      - text: "log1p ใช้ได้กับข้อความ"
        why: "ใช้กับตัวเลขเท่านั้น"
  - id: "q2"
    question: "feature ใหม่ที่สร้างขึ้นต้องมีคุณสมบัติข้อไหนเสมอ"
    choices:
      - text: "ต้องมีค่าเป็นเลขจำนวนเต็ม"
        why: "ไม่จำเป็น"
      - text: "ต้องมีความสัมพันธ์เชิงเส้นกับ target"
        why: "ไม่จำเป็น"
      - text: "ต้องคำนวณได้จากข้อมูลที่มี ณ เวลาที่ต้องทำนายจริง (ไม่ leak)"
        correct: true
        why: "ถ้า feature ใช้ข้อมูลที่ยังไม่มีตอนต้องทำนาย (เช่นข้อมูลหลังเกิดเหตุการณ์ที่จะทำนาย) โมเดลจะดูเก่งในการทดสอบแต่ใช้จริงไม่ได้ — ต้องตรวจทุก feature ว่ารู้ ณ เวลาทำนาย"
      - text: "ต้องมีค่ามากกว่า 0"
        why: "ไม่จำเป็น"
  - id: "q3"
    question: "ในบทนี้เมื่อเพิ่ม fast_first เข้าโมเดล CV AUC เป็นอย่างไร"
    choices:
      - text: "ดีขึ้นมากอย่างชัดเจน"
        why: "ผลจริงไม่ได้ดีขึ้น"
      - text: "โมเดลพัง"
        why: "โมเดลทำงานปกติ"
      - text: "เท่ากันเป๊ะ"
        why: "ต่างกันเล็กน้อย"
      - text: "ไม่ดีขึ้น (ต่ำกว่า baseline เล็กน้อย) จึงไม่ควรเก็บไว้เพียงเพราะดูสมเหตุสมผล"
        correct: true
        why: "ถูกต้อง — 0.6344 เทียบกับ 0.6361"
  - id: "q4"
    question: "จะตัดสินใจเก็บ feature ใหม่หรือไม่ควรใช้อะไรเป็นหลัก"
    choices:
      - text: "ผล cross-validation เทียบกับ baseline"
        correct: true
        why: "ถูกต้อง — วัดด้วยข้อมูลไม่ใช่ความรู้สึก"
      - text: "ความรู้สึกว่าน่าจะช่วย"
        why: "ไม่น่าเชื่อถือ"
      - text: "จำนวน feature ที่มากที่สุด"
        why: "feature เยอะไม่ได้แปลว่าดีขึ้น"
      - text: "ผลบนชุด train เท่านั้น"
        why: "ผลบน train บอกไม่ได้ว่าใช้กับข้อมูลใหม่ได้"
summary:
  - "log1p ลดความเบ้ขวาของ first_order_value (skew 3.33 → ≈0) และปลอดภัยกับค่า 0"
  - "feature ใหม่ต้องคำนวณได้จากข้อมูล ณ เวลาที่ต้องทำนายจริง"
  - "เพิ่ม feature แล้ววัดด้วย CV — ในข้อมูลนี้ fast_first หรือ value_per_item ไม่ทำให้ AUC ดีขึ้น (สัญญาณหลักอยู่ที่ช่องทางสมัคร) จึงไม่ควรเก็บ feature ที่ไม่ช่วย"
interview:
  - id: "i1"
    q: "บอกวิธีตัดสินใจว่า feature ที่สร้างขึ้นใหม่ควรเก็บหรือไม่"
    a: |
      สร้างเป็นชุดสมมติฐาน (เช่น อัตราส่วน flag การจัดกลุ่ม) แล้วเพิ่มทีละกลุ่มเข้า pipeline เดียวกัน วัดด้วย cross-validation เทียบกับ baseline ที่ไม่มี feature นั้น ดูทั้งค่าเฉลี่ยและความผันผวน (std) ถ้าไม่ดีขึ้นอย่างมีความหมายก็ตัดออก เพราะ feature ที่ไม่ช่วยเพิ่มความซับซ้อนและความเสี่ยง overfit และตรวจด้วยว่า feature นั้นรู้ได้ ณ เวลาทำนายจริง
  - id: "i2"
    q: "ยกตัวอย่าง feature ที่ leak และวิธีเลี่ยง"
    a: |
      ตัวอย่าง: จำนวนออเดอร์ทั้งหมดของลูกค้า หรือค่าเฉลี่ยของ target ที่คำนวณจากข้อมูลทั้งชุด — ทั้งคู่ใช้ข้อมูลที่ยังไม่มีตอนทำนายจริง วิธีเลี่ยงคือกำหนดจุดเวลาที่ทำนาย (เช่น ณ ออเดอร์แรก) แล้วสร้าง feature จากข้อมูลก่อนหน้านั้นเท่านั้น และคำนวณสถิติที่ใช้ target จาก train เท่านั้น
flashcards:
  - id: "c1"
    front: "ทำไมใช้ log1p กับข้อมูลเบ้ขวา"
    back: "ลดความเบ้ทำให้การกระจายสมมาตรขึ้น และ log1p ปลอดภัยกับค่า 0"
  - id: "c2"
    front: "feature ใหม่ที่ดูสมเหตุสมผลรับประกันว่าโมเดลดีขึ้นหรือไม่"
    back: "ไม่ — ต้องวัดด้วย cross-validation เทียบกับ baseline (ในข้อมูลนี้ fast_first ไม่ช่วย)"
