      from sklearn.tree import DecisionTreeClassifier
      leaves_used = ___
      biggest_leaf_share = ___
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.tree import DecisionTreeClassifier
      tree = DecisionTreeClassifier(max_depth=3, random_state=42).fit(X_train, y_train)
      leaf_ids = pd.Series(tree.apply(X_test))
      leaves_used = leaf_ids.nunique()
      biggest_leaf_share = round(leaf_ids.value_counts(normalize=True).max(), 4)
    check: |
      check_value(leaves_used, _sol["leaves_used"], name="leaves_used")
      check_value(biggest_leaf_share, _sol["biggest_leaf_share"], name="biggest_leaf_share", tol=0.001)
    hints:
      - "`tree.apply(X_test)` บอกว่าแต่ละแถวตกใบไหน แล้วใช้ nunique / value_counts(normalize=True)"
