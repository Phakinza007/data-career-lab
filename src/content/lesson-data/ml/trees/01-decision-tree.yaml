      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.tree import DecisionTreeClassifier
      tree = DecisionTreeClassifier(max_depth=3, random_state=42).fit(X_train, y_train)
      imp = pd.Series(tree.feature_importances_, index=X.columns)
      top_feature = imp.idxmax()
      top_importance = round(imp.max(), 3)
    check: |
      check_value(top_feature, _sol["top_feature"], name="top_feature")
      check_value(top_importance, _sol["top_importance"], name="top_importance", tol=0.001)
    hints:
      - "ทำ pd.Series(tree.feature_importances_, index=X.columns) แล้วใช้ idxmax และ max"
