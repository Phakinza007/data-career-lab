      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.tree import DecisionTreeClassifier
      shallow = DecisionTreeClassifier(max_depth=3, random_state=42).fit(X_train, y_train)
      full = DecisionTreeClassifier(random_state=42).fit(X_train, y_train)
      gap_depth3 = round(shallow.score(X_train, y_train) - shallow.score(X_test, y_test), 4)
      gap_full = round(full.score(X_train, y_train) - full.score(X_test, y_test), 4)
    check: |
      check_value(gap_depth3, _sol["gap_depth3"], name="gap_depth3", tol=0.001)
      check_value(gap_full, _sol["gap_full"], name="gap_full", tol=0.001)
