  - "ไม่จำกัดความลึก → 664 ใบ train 0.9995 แต่ test 0.5493 (แย่กว่า baseline 0.5901) คือ overfitting"
  - "คุมด้วย max_depth/min_samples_leaf เลือกด้วย CV และเมื่อเสมอให้เลือกต้นไม้ที่เล็กกว่า"
interview:
  - id: "i1"
    q: "Decision tree เลือกจุดแยก (split) อย่างไร"
    a: |
      ลองทุกคำถามที่เป็นไปได้ (ทุก feature ทุกค่าตัด) แล้วเลือกคำถามที่ทำให้ impurity (เช่น Gini) ของโหนดลูกที่ถ่วงน้ำหนักตามจำนวนแถวลดลงมากที่สุด จากนั้นทำซ้ำในแต่ละกิ่ง (greedy, ทีละขั้น) จนถึงเงื่อนไขหยุด เช่น max_depth, min_samples_leaf หรือโหนดบริสุทธิ์
  - id: "i2"
    q: "ทำไม decision tree ถึง overfit ง่ายและแก้อย่างไร"
    a: |
      ถ้าปล่อยให้โตเต็มที่ มันจะแบ่งจนทุกใบบริสุทธิ์ คือจำข้อมูลเทรนรวมทั้ง noise แก้โดยจำกัดขนาด (max_depth, min_samples_leaf, max_leaf_nodes), pruning หรือใช้ ensemble อย่าง random forest / boosting และเลือกไฮเปอร์พารามิเตอร์ด้วย cross-validation
