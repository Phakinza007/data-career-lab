goals:
  - "อธิบายได้ว่า decision tree เลือกคำถามด้วย Gini impurity อย่างไร"
  - "อ่านกฎของต้นไม้ด้วย export_text และดูจำนวนใบ/ความลึก"
  - "เห็นว่าต้นไม้ไม่จำกัดความลึกจำข้อมูลเทรน และควบคุมด้วย max_depth / min_samples_leaf"
examples:
  - id: "x1"
    title: "อ่านกฎจากต้นไม้"
    lang: "python"
    prompt: |
      fit ต้นไม้เล็กๆ แล้วดูว่ามันตั้งคำถามอะไร
    steps:
      - text: |
          fit ต้นไม้ max_depth=2 แล้วพิมพ์กฎด้วย export_text — บรรทัดแรกคือคำถามที่ดีที่สุด (channel_promo <= 0.5)
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.tree import DecisionTreeClassifier
          tree = DecisionTreeClassifier(max_depth=2, random_state=42).fit(X_train, y_train)
          from sklearn.tree import export_text
          print(export_text(tree, feature_names=list(X.columns)))
      - text: |
          accuracy ของต้นไม้บน train และ test (0.6585 และ 0.6493) และจำนวนใบ (4)
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.tree import DecisionTreeClassifier
          tree = DecisionTreeClassifier(max_depth=2, random_state=42).fit(X_train, y_train)
          round(tree.score(X_train, y_train), 4), round(tree.score(X_test, y_test), 4), tree.get_n_leaves()
    pitfall:
      text: |
        ตีความ feature_importances_ ของต้นไม้ที่ overfit ว่าเป็น 'สิ่งที่ขับเคลื่อนพฤติกรรมลูกค้า' — ต้นไม้ลึกๆ กระจายความสำคัญไปยังสัญญาณรบกวนด้วย ให้ดูควบคู่กับผลบน validation เสมอ
  - id: "x2"
    title: "ความลึกกับ overfitting"
    lang: "python"
    prompt: |
      เทียบ train/test accuracy ตามความลึกของต้นไม้
    steps:
      - text: |
          วนหลายค่าของ max_depth: train สูงขึ้นเรื่อยๆ แต่ test ลดลง (ลึก 8: 0.7078 / 0.6056)
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.tree import DecisionTreeClassifier
          for d in [1, 3, 5, 8]:
              t = DecisionTreeClassifier(max_depth=d, random_state=42).fit(X_train, y_train)
              print(d, t.get_n_leaves(), round(t.score(X_train, y_train), 4), round(t.score(X_test, y_test), 4))
      - text: |
          ไม่จำกัดความลึก: ได้ 664 ใบ ลึก 28 train 0.9995 แต่ test 0.5493
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.tree import DecisionTreeClassifier
          full = DecisionTreeClassifier(random_state=42).fit(X_train, y_train)
          full.get_n_leaves(), full.get_depth(), round(full.score(X_train, y_train), 4), round(full.score(X_test, y_test), 4)
    pitfall:
      text: |
        เลือก max_depth จากค่าที่ให้ test accuracy สูงสุดแล้วรายงานตัวเลขนั้นเป็นผลสุดท้าย — เท่ากับใช้ test ตัดสินใจ (test รั่วเข้าไปในการเลือกโมเดล) ใช้ cross-validation บน train เลือกค่า แล้วแตะ test ครั้งเดียวตอนท้าย
