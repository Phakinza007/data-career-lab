  - id: "e5"
    level: "applied"
    lang: "python"
    prompt: |
      ใช้ StratifiedKFold 5-fold (skf ที่ให้ไว้) วัด accuracy เฉลี่ยของต้นไม้ที่ max_depth = 1..8 (random_state=42) เก็บ depth ที่ CV accuracy สูงสุดไว้ใน best_cv_depth (ถ้าเสมอให้เลือกค่าน้อยกว่า) และ accuracy ของมัน (ปัด 4 ตำแหน่ง) ไว้ใน best_cv_acc
    starter: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      from sklearn.model_selection import StratifiedKFold, cross_val_score
      from sklearn.tree import DecisionTreeClassifier

      skf = StratifiedKFold(5, shuffle=True, random_state=42)
      best_cv_depth = ___
      best_cv_acc = ___
    solution: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      from sklearn.model_selection import StratifiedKFold, cross_val_score
      from sklearn.tree import DecisionTreeClassifier

      skf = StratifiedKFold(5, shuffle=True, random_state=42)
      scores = {d: cross_val_score(DecisionTreeClassifier(max_depth=d, random_state=42), X, y, cv=skf).mean() for d in range(1, 9)}
      best_cv_depth = min(d for d, s in scores.items() if s == max(scores.values()))
      best_cv_acc = round(scores[best_cv_depth], 4)
    check: |
      check_value(best_cv_depth, _sol["best_cv_depth"], name="best_cv_depth")
      check_value(best_cv_acc, _sol["best_cv_acc"], name="best_cv_acc", tol=0.001)
    hints:
      - "สร้าง dict depth → คะแนนเฉลี่ย แล้วหาค่าสูงสุด (ใช้ min ของ depth ที่ได้คะแนนสูงสุดเพื่อตัดเสมอ)"
