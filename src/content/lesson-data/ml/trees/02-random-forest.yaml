goals:
  - "อธิบายได้ว่า random forest ใช้ bootstrap + สุ่ม feature + โหวตเพื่อลดความไม่นิ่งของต้นไม้เดี่ยว"
  - "ปรับ n_estimators, min_samples_leaf, max_features และอ่าน OOB score"
  - "เปรียบเทียบ forest กับต้นไม้เดี่ยวและ baseline ด้วย cross-validation อย่างตรงไปตรงมา"
examples:
  - id: "x1"
    title: "forest ค่าเริ่มต้น vs ต้นไม้เดี่ยว"
    lang: "python"
    prompt: |
      ดูว่า ensemble ช่วยลดการจำข้อมูลเทรนได้แค่ไหน
    steps:
      - text: |
          forest 100 ต้น: train 0.9995 แต่ test 0.6197 (เทียบกับต้นไม้เดี่ยวที่ test 0.5493)
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.ensemble import RandomForestClassifier
          rf = RandomForestClassifier(n_estimators=100, random_state=42).fit(X_train, y_train)
          round(rf.score(X_train, y_train), 4), round(rf.score(X_test, y_test), 4)
      - text: |
          จำกัดใบให้ใหญ่ขึ้น min_samples_leaf=10: train ตกเหลือระดับเดียวกับ test มากขึ้น และ test เป็น 0.6451
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.ensemble import RandomForestClassifier
          rf = RandomForestClassifier(n_estimators=100, min_samples_leaf=10, random_state=42).fit(X_train, y_train)
          round(rf.score(X_train, y_train), 4), round(rf.score(X_test, y_test), 4)
    pitfall:
      text: |
        ตีความว่า 'forest ใหญ่ขึ้น (n_estimators มากขึ้น) จะ overfit มากขึ้น' — จำนวนต้นที่มากขึ้นทำให้ผลนิ่งขึ้นและแทบไม่ overfit เพิ่ม สิ่งที่ทำให้ overfit คือความลึก/ขนาดใบของแต่ละต้น (ควบคุมด้วย max_depth, min_samples_leaf)
  - id: "x2"
    title: "OOB score และ CV"
    lang: "python"
    prompt: |
      ประมาณการความแม่นโดยไม่ใช้ test
    steps:
      - text: |
          เปิด oob_score=True แล้วอ่าน oob_score_ (≈ 0.6534) — ประมาณการความแม่นจากแถวที่แต่ละต้นไม่เคยเห็น
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.ensemble import RandomForestClassifier
          rf = RandomForestClassifier(n_estimators=100, min_samples_leaf=10, oob_score=True, random_state=42).fit(X_train, y_train)
          round(rf.oob_score_, 4), round(rf.score(X_test, y_test), 4)
      - text: |
          เทียบกับ cross-validation 5-fold: forest (leaf 10) ได้ ≈ 0.6432 เทียบกับต้นไม้ไม่จำกัด ≈ 0.5696
        code: |
          import pandas as pd

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          from sklearn.model_selection import StratifiedKFold, cross_val_score
          from sklearn.ensemble import RandomForestClassifier
          from sklearn.tree import DecisionTreeClassifier

          skf = StratifiedKFold(5, shuffle=True, random_state=42)
          rf = RandomForestClassifier(n_estimators=100, min_samples_leaf=10, random_state=42)
          round(cross_val_score(rf, X, y, cv=skf).mean(), 4), round(cross_val_score(DecisionTreeClassifier(random_state=42), X, y, cv=skf).mean(), 4)
    pitfall:
      text: |
        ใช้ oob_score_ เมื่อ n_estimators น้อยมาก (เช่น 5–10) — แต่ละแถวอาจอยู่ out-of-bag ในไม่กี่ต้น ทำให้ค่าประมาณไม่นิ่ง (และ sklearn อาจเตือน) ใช้ต้นไม้ให้มากพอ (ร้อยขึ้นไป)
