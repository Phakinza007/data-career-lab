      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.ensemble import RandomForestClassifier
      mean_proba = ___
      share_pos = ___
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.ensemble import RandomForestClassifier
      rf = RandomForestClassifier(n_estimators=100, min_samples_leaf=10, random_state=42).fit(X_train, y_train)
      proba = rf.predict_proba(X_test)[:, 1]
      mean_proba = round(proba.mean(), 4)
      share_pos = round((proba >= 0.5).mean(), 4)
    check: |
      check_value(mean_proba, _sol["mean_proba"], name="mean_proba", tol=0.001)
      check_value(share_pos, _sol["share_pos"], name="share_pos", tol=0.001)
    hints:
      - "predict_proba(X_test)[:, 1]"
quiz:
  - id: "q1"
    question: "Random forest ลด overfitting ของต้นไม้เดี่ยวได้อย่างไร"
    choices:
      - text: "จำกัดความลึกทุกต้นเป็น 1"
        why: "ไม่ได้จำกัดโดยอัตโนมัติ"
      - text: "เทรนต้นไม้หลายต้นบนข้อมูล/feature ที่สุ่มต่างกัน แล้วโหวตเฉลี่ย ทำให้ความผิดพลาดที่ไม่สม่ำเสมอหักล้างกัน"
        correct: true
        why: "ต้นไม้แต่ละต้นเห็นข้อมูลและ feature ต่างกัน จึงพลาดต่างกัน การโหวตเฉลี่ยทำให้ความผิดพลาดแบบสุ่มหักล้างกัน (ลด variance) ในบทนี้ forest ได้ test 0.6197 เทียบต้นไม้เดี่ยว 0.5493"
      - text: "ตัด feature ที่ไม่สำคัญทิ้ง"
        why: "ไม่ใช่กลไกหลัก"
      - text: "scale ข้อมูลก่อน"
        why: "ต้นไม้ไม่ต้อง scale"
  - id: "q2"
    question: "OOB score คืออะไร"
    choices:
      - text: "ความแม่นบนชุด test"
        why: "ไม่ใช่ test"
      - text: "ความแม่นบน train"
        why: "ไม่ใช่ train"
      - text: "ความแม่นที่ประมาณจากแถวที่แต่ละต้นไม่ได้ใช้เทรน (out-of-bag) โดยไม่ต้องแบ่ง validation"
        correct: true
        why: "bootstrap ทำให้แต่ละต้นไม่เห็นแถวราว 37% แถวเหล่านั้นเป็นชุดทดสอบให้ต้นนั้นได้เอง รวมผลทุกต้นได้ประมาณการความแม่น (ในบทนี้ OOB 0.6534 ใกล้ test 0.6451)"
      - text: "จำนวนต้นไม้ที่ผิด"
        why: "ไม่ใช่"
  - id: "q3"
    question: "ในบทนี้ forest (leaf 10) กับต้นไม้ depth 3 ให้ CV accuracy ใกล้กัน (0.6432 กับ 0.6562) บอกอะไร"
    choices:
      - text: "forest ผิดปกติ ต้องแก้โค้ด"
        why: "ไม่ใช่ข้อผิดพลาด"
      - text: "ต้นไม้เดี่ยวดีกว่าเสมอ"
        why: "สรุปเกินหลักฐาน"
      - text: "CV ใช้ไม่ได้กับ forest"
        why: "ใช้ได้"
      - text: "ข้อมูลนี้มีสัญญาณอ่อน (แทบมีแค่ promo) โมเดลซับซ้อนกว่าไม่ได้ทำให้ดีขึ้นมาก"
        correct: true
        why: "CV accuracy 0.6432 กับ 0.6562 ต่างกันน้อยกว่าความแกว่งระหว่าง fold; ข้อมูลนี้มีสัญญาณแรงเพียง promo ซึ่งต้นไม้ตื้นจับได้แล้ว โมเดลที่ซับซ้อนกว่าจึงไม่ได้อะไรเพิ่ม"
  - id: "q4"
    question: "จะลด overfitting ของ forest ที่ train 0.9995 / test 0.6197 ควรปรับอะไร"
    choices:
      - text: "จำกัดต้นไม้ย่อย เช่น min_samples_leaf มากขึ้นหรือ max_depth"
        correct: true
        why: "ความลึกไม่จำกัดของแต่ละต้นเป็นต้นเหตุ (train 0.9995) การเพิ่ม min_samples_leaf/จำกัด max_depth ทำให้ต้นไม้ย่อยเล็กลง (min_samples_leaf=10 ได้ test 0.6451) ส่วน n_estimators ช่วยความนิ่ง ไม่ใช่ตัวคุม overfit"
      - text: "เพิ่ม max_depth เป็นไม่จำกัด"
        why: "ค่าเริ่มต้นก็ไม่จำกัดอยู่แล้ว ทำให้จำมากขึ้น"
      - text: "ลด n_estimators เหลือ 1"
        why: "กลายเป็นต้นไม้เดี่ยว"
      - text: "เอา random_state ออก"
        why: "ไม่เกี่ยวกับ overfitting"
summary:
  - "Random forest = ต้นไม้หลายต้นจาก bootstrap + สุ่ม feature ต่อ split แล้วโหวตเฉลี่ย ช่วยลด variance"
  - "ค่าเริ่มต้นยังจำข้อมูลเทรนได้ (train 0.9995 / test 0.6197) จำกัดขนาดต้นไม้ย่อยด้วย min_samples_leaf/max_depth"
  - "OOB score = validation ฟรี; ในข้อมูลนี้ forest ไม่ชนะต้นไม้ตื้นหรือ logistic regression (ต่างกันราว 0.01) เพราะสัญญาณอ่อน"
interview:
  - id: "i1"
    q: "Random forest ต่างจาก bagging ของ decision tree ธรรมดาอย่างไร"
    a: |
      Bagging สุ่มแถวแบบ bootstrap ให้แต่ละต้น แล้วเฉลี่ย Random forest เพิ่มการสุ่ม feature ที่แต่ละ split (max_features) เพื่อให้ต้นไม้ไม่สัมพันธ์กันมากนัก ทำให้เฉลี่ยแล้วลด variance ได้มากกว่า
  - id: "i2"
    q: "เมื่อไรที่ random forest ไม่ช่วย"
    a: |
      เมื่อสัญญาณในข้อมูลอ่อนหรือ noise สูง ต้นไม้ทุกต้นเรียนรู้ได้ไม่ต่างกันมาก ensemble จึงได้ผลใกล้กับโมเดลง่ายๆ (เช่นในข้อมูล repeat ของเรา) หรือเมื่อ feature engineering สำคัญกว่าตัวโมเดล
flashcards:
  - id: "c1"
    front: "Bootstrap คืออะไรใน random forest"
    back: "สุ่มแถวแบบใส่คืนจากข้อมูล train ให้แต่ละต้น (~63% ของแถวไม่ซ้ำ ที่เหลือเป็น out-of-bag)"
  - id: "c2"
    front: "ไฮเปอร์พารามิเตอร์ที่คุมการ overfit ของ forest"
    back: "min_samples_leaf, max_depth ของต้นไม้ย่อย (n_estimators ช่วยความนิ่ง ไม่ใช่ตัวคุม overfit)"
