      GB 100 รอบ (random_state=42) เทียบ learning_rate สูง (0.5) กับต่ำ (0.01): accuracy บน train และ test ของแต่ละแบบ (ปัด 4 ตำแหน่ง) เก็บไว้ใน fast_train, fast_test, slow_train, slow_test
