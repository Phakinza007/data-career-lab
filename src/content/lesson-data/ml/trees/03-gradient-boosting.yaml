      from sklearn.ensemble import GradientBoostingClassifier
      fast_train = ___
      fast_test = ___
      slow_train = ___
      slow_test = ___
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.ensemble import GradientBoostingClassifier
      fast = GradientBoostingClassifier(learning_rate=0.5, random_state=42).fit(X_train, y_train)
      slow = GradientBoostingClassifier(learning_rate=0.01, random_state=42).fit(X_train, y_train)
      fast_train = round(fast.score(X_train, y_train), 4)
      fast_test = round(fast.score(X_test, y_test), 4)
      slow_train = round(slow.score(X_train, y_train), 4)
      slow_test = round(slow.score(X_test, y_test), 4)
    check: |
      check_value(fast_train, _sol["fast_train"], name="fast_train", tol=0.001)
      check_value(fast_test, _sol["fast_test"], name="fast_test", tol=0.001)
      check_value(slow_train, _sol["slow_train"], name="slow_train", tol=0.001)
      check_value(slow_test, _sol["slow_test"], name="slow_test", tol=0.001)
    hints:
      - "fit สองโมเดลที่ต่างกันแค่ learning_rate"
quiz:
  - id: "q1"
    question: "gradient boosting ต่างจาก random forest ตรงไหนเป็นหลัก"
    choices:
      - text: "boosting ไม่ใช้ต้นไม้"
        why: "ใช้ต้นไม้ย่อย"
      - text: "boosting สร้างต้นไม้ตื้นทีละต้นโดยแต่ละต้นแก้ความผิดพลาดของต้นก่อนหน้า ส่วน forest สร้างต้นไม้ลึกแบบขนานแล้วเฉลี่ย"
        correct: true
        why: "ถูกต้อง"
      - text: "forest ใช้ learning_rate"
        why: "learning_rate เป็นของ boosting"
      - text: "ทั้งสองเหมือนกัน"
        why: "กลไกต่างกัน"
  - id: "q2"
    question: "learning_rate ใน gradient boosting ทำอะไร"
    choices:
      - text: "กำหนดความลึกต้นไม้"
        why: "นั่นคือ max_depth"
      - text: "กำหนดสัดส่วน validation"
        why: "นั่นคือ validation_fraction"
      - text: "ย่อขนาดการเพิ่มของแต่ละรอบ ค่าเล็กต้องใช้รอบมากขึ้นแต่มักนิ่งกว่า"
        correct: true
        why: "ถูกต้อง"
      - text: "กำหนดจำนวน feature"
        why: "ไม่เกี่ยว"
  - id: "q3"
    question: "ในบทนี้ test accuracy ของ GB สูงสุดราว 25 รอบ (0.6535) แล้วลดที่ 100 รอบ (0.6394) ขณะ train เพิ่ม บ่งบอกว่าอะไร"
    choices:
      - text: "โมเดลเรียนรู้เพิ่มขึ้นจึงดีขึ้นเรื่อยๆ"
        why: "test ลดลง ไม่ใช่ดีขึ้น"
      - text: "ข้อมูล test สุ่มผิด"
        why: "ไม่มีหลักฐาน"
      - text: "ควรเพิ่มรอบอีก"
        why: "จะ overfit หนักขึ้น"
      - text: "รอบมากเกินไปทำให้ overfit — ควรหยุดก่อนด้วย early stopping"
        correct: true
        why: "ถูกต้อง"
  - id: "q4"
    question: "ทำไมการเลือกจำนวนรอบจาก staged_predict บน X_test แล้วรายงานผล X_test จึงไม่ควร"
    choices:
      - text: "เพราะ test ถูกใช้ตัดสินใจแล้ว ผลที่รายงานจึงดีเกินจริง (leakage เชิงการเลือกโมเดล)"
        correct: true
        why: "ถูกต้อง"
      - text: "เพราะ staged_predict ผิด"
        why: "ใช้ได้ แต่ควรกับ validation"
      - text: "เพราะ test เล็กเกิน"
        why: "ไม่ใช่เหตุผล"
      - text: "ไม่มีปัญหาอะไร"
        why: "มีปัญหา"
summary:
  - "Gradient boosting เพิ่มต้นไม้ตื้นทีละต้นเพื่อแก้ความผิดพลาดของโมเดลรวม; learning_rate ย่อแต่ละก้าว"
  - "รอบมากเกินไป overfit ได้ (ข้อมูลนี้ test สูงสุดที่ ~25 รอบ 0.6535 แล้วลดเหลือ 0.6394 ที่ 100 รอบ) เลือกรอบด้วย validation/early stopping ไม่ใช่ test"
  - "GB ค่าเริ่มต้นได้ CV AUC 0.6526 เทียบ forest 0.6420 — ต่างกันเล็กน้อยเท่านั้น"
interview:
  - id: "i1"
    q: "อธิบาย gradient boosting ให้คนที่รู้จักแต่ decision tree"
    a: |
      เริ่มจากคำตอบง่ายๆ แล้วสร้างต้นไม้เล็กๆ ทีละต้นเพื่อทำนาย "ส่วนที่ยังพลาด" (gradient ของ loss) ของโมเดลปัจจุบัน แล้วบวกเข้าไปโดยคูณ learning_rate ทำซ้ำหลายรอบ ผลรวมของต้นไม้ตื้นๆ เหล่านี้จึงสร้างขอบเขตการตัดสินใจที่ซับซ้อนได้
  - id: "i2"
    q: "จะเลือก n_estimators และ learning_rate อย่างไรไม่ให้ overfit"
    a: |
      ทั้งสองแลกกัน (ก้าวเล็ก = ต้องรอบมาก) ตั้ง learning_rate ค่อนข้างเล็กแล้วใช้ early stopping (n_iter_no_change + validation_fraction) หรือ validation set แยกเพื่อหยุดตอน validation หยุดดีขึ้น และยืนยันด้วย cross-validation แล้วแตะ test ครั้งเดียว
