goals:
  - "อธิบายกลไกของ gradient boosting (ต้นไม้ตื้นทีละต้น แก้ความผิดพลาดต่อเนื่อง)"
  - "ปรับ n_estimators / learning_rate / max_depth และดูเส้นโค้งด้วย staged_predict บน validation"
  - "ใช้ early stopping ในตัวเพื่อเลือกจำนวนรอบ"
examples:
  - id: "x1"
    title: "GB ค่าเริ่มต้นและจำนวนรอบ"
    lang: "python"
    prompt: |
      ดูว่าผลเปลี่ยนตามจำนวนรอบอย่างไร
    steps:
      - text: |
          fit GB 100 รอบ (lr 0.1, depth 3): train 0.7172 test 0.6394
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.ensemble import GradientBoostingClassifier
          gb = GradientBoostingClassifier(random_state=42).fit(X_train, y_train)
          round(gb.score(X_train, y_train), 4), round(gb.score(X_test, y_test), 4)
      - text: |
          ใช้ staged_predict ดูความแม่นบน test หลังรอบที่ 1, 5, 10, 25, 50, 100 (0.5901 → 0.6535 ที่ 25 → 0.6394 ที่ 100)
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.ensemble import GradientBoostingClassifier
          gb = GradientBoostingClassifier(random_state=42).fit(X_train, y_train)
          stages = list(gb.staged_predict(X_test))
          [round(float((stages[i - 1] == y_test).mean()), 4) for i in (1, 5, 10, 25, 50, 100)]
    pitfall:
      text: |
        ใช้ staged_predict บน X_test เพื่อเลือกจำนวนรอบที่ดีที่สุด แล้วรายงานผลบน X_test เดียวกัน — test ถูกใช้ตัดสินใจไปแล้ว ให้แยก validation จาก train (หรือใช้ early stopping ในตัว) แล้วแตะ test ครั้งเดียวตอนท้าย
  - id: "x2"
    title: "early stopping ในตัว"
    lang: "python"
    prompt: |
      ให้ GB หยุดเองเมื่อ validation ไม่ดีขึ้น
    steps:
      - text: |
          ตั้ง n_estimators=500 แต่เปิด n_iter_no_change=10 — มันหยุดที่ 25 รอบ (n_estimators_) แทนที่จะครบ 500
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.ensemble import GradientBoostingClassifier
          gb = GradientBoostingClassifier(n_estimators=500, validation_fraction=0.1, n_iter_no_change=10, random_state=42).fit(X_train, y_train)
          gb.n_estimators_
      - text: |
          ผล: train 0.6656 / test 0.6423 — ช่องว่างเล็ก และไม่ต้องเดาจำนวนรอบเอง
        code: |
          import pandas as pd
          from sklearn.model_selection import train_test_split

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          from sklearn.ensemble import GradientBoostingClassifier
          gb = GradientBoostingClassifier(n_estimators=500, validation_fraction=0.1, n_iter_no_change=10, random_state=42).fit(X_train, y_train)
          round(gb.score(X_train, y_train), 4), round(gb.score(X_test, y_test), 4)
    pitfall:
      text: |
        ตั้ง n_estimators สูงมาก (เช่น 2000) โดยไม่มี early stopping และ learning_rate สูงด้วย — ใช้เวลาเทรนนานและ overfit ตั้ง n_iter_no_change เพื่อให้หยุดเอง
