  - id: "e8"
    level: "challenge"
    lang: "python"
    prompt: |
      CV 5-fold (skf ที่ให้ไว้) ของ ROC-AUC เฉลี่ย เทียบ GB ค่าเริ่มต้น (random_state=42) กับ random forest (100 ต้น, min_samples_leaf=10, random_state=42) ปัด 4 ตำแหน่ง เก็บไว้ในตัวแปร gb_cv_auc, rf_cv_auc
    starter: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      from sklearn.model_selection import StratifiedKFold, cross_val_score
      from sklearn.ensemble import GradientBoostingClassifier, RandomForestClassifier

      skf = StratifiedKFold(5, shuffle=True, random_state=42)
      gb_cv_auc = ___
      rf_cv_auc = ___
    solution: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      from sklearn.model_selection import StratifiedKFold, cross_val_score
      from sklearn.ensemble import GradientBoostingClassifier, RandomForestClassifier

      skf = StratifiedKFold(5, shuffle=True, random_state=42)
      gb_cv_auc = round(cross_val_score(GradientBoostingClassifier(random_state=42), X, y, cv=skf, scoring='roc_auc').mean(), 4)
      rf_cv_auc = round(cross_val_score(RandomForestClassifier(n_estimators=100, min_samples_leaf=10, random_state=42), X, y, cv=skf, scoring='roc_auc').mean(), 4)
    check: |
      check_value(gb_cv_auc, _sol["gb_cv_auc"], name="gb_cv_auc", tol=0.001)
      check_value(rf_cv_auc, _sol["rf_cv_auc"], name="rf_cv_auc", tol=0.001)
    hints:
      - "scoring='roc_auc'"
