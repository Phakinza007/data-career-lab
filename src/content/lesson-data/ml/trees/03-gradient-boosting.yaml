  - id: "e6"
    level: "applied"
    lang: "python"
    prompt: |
      ใช้ชุด validation (X_tr/X_val/y_tr/y_val ที่แบ่งจาก train ไว้ให้แล้ว) เทรน GB 100 รอบ (random_state=42) แล้วหาจำนวนรอบที่ให้ accuracy บน X_val สูงสุด (ถ้าเสมอเอาน้อยสุด) เก็บไว้ใน best_stage และ accuracy ของมัน (ปัด 4 ตำแหน่ง) ไว้ใน best_val_acc
    starter: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.ensemble import GradientBoostingClassifier
      import numpy as np
      from sklearn.model_selection import train_test_split

      X_tr, X_val, y_tr, y_val = train_test_split(X_train, y_train, test_size=0.25, random_state=42, stratify=y_train)
      best_stage = ___
      best_val_acc = ___
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.ensemble import GradientBoostingClassifier
      import numpy as np
      from sklearn.model_selection import train_test_split

      X_tr, X_val, y_tr, y_val = train_test_split(X_train, y_train, test_size=0.25, random_state=42, stratify=y_train)
      gb = GradientBoostingClassifier(n_estimators=100, random_state=42).fit(X_tr, y_tr)
      val_accs = [float((p == y_val).mean()) for p in gb.staged_predict(X_val)]
      best_stage = int(np.argmax(val_accs)) + 1
      best_val_acc = round(max(val_accs), 4)
    check: |
      check_value(best_stage, _sol["best_stage"], name="best_stage")
      check_value(best_val_acc, _sol["best_val_acc"], name="best_val_acc", tol=0.001)
    hints:
      - "np.argmax ให้ index ของค่าสูงสุดตัวแรก (เสมอ = น้อยสุด) แล้ว +1"
