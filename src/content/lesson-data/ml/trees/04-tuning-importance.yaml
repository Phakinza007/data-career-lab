summary:
  - "GridSearchCV ลองทุกชุดใน grid ด้วย CV บน train (จำนวน fit = ชุด × fold) แล้ว refit ชุดที่ดีที่สุด — แตะ test ครั้งเดียวตอนท้าย"
  - "impurity importance เอนเอียง: คอลัมน์สุ่ม noise ได้อันดับ 2 (0.1761) แต่ permutation importance ≈ 0.002 (promo ≈ 0.046)"
  - "tree/forest/GB ต่างกันราว 0.01 AUC ในข้อมูลนี้ เลือกตัวที่เรียบง่าย อธิบายได้ และรายงานความไม่แน่นอน"
interview:
  - id: "i1"
    q: "อธิบายขั้นตอนจูนโมเดลอย่างถูกต้องโดยไม่ให้ test รั่ว"
    a: |
      แบ่ง train/test ก่อน จากนั้นใช้ cross-validation บนเฉพาะ train เพื่อเปรียบเทียบชุด hyperparameter (GridSearchCV/RandomizedSearchCV) เลือกชุดที่ดีที่สุด refit บน train ทั้งหมด แล้วประเมินบน test เพียงครั้งเดียวเพื่อรายงานผล ถ้าต้องการผลที่ไม่เอนเอียงมากขึ้นใช้ nested CV
  - id: "i2"
    q: "feature importance ของ random forest เชื่อถือได้แค่ไหน"
    a: |
      impurity importance คำนวณจากข้อมูลเทรนและเอนเอียงไปหา feature ต่อเนื่อง/มีหลายค่า (ทดลองใส่คอลัมน์สุ่มก็ยังได้อันดับสูง) permutation importance บน validation/test เชื่อถือกว่าเพราะวัดผลกระทบต่อคะแนนจริง แต่ก็ไม่ใช่สาเหตุ และ feature ที่สัมพันธ์กันจะแบ่งความสำคัญกัน
flashcards:
  - id: "c1"
    front: "GridSearchCV ทำอะไรบ้างตามลำดับ"
    back: "ลองทุกชุดใน grid ด้วย CV, เลือกชุดคะแนนเฉลี่ยสูงสุด, refit บนข้อมูลทั้งหมดที่ส่งเข้าไป (refit=True), ให้ best_params_/best_score_/predict"
  - id: "c2"
