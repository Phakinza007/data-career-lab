goals:
  - "จูน hyperparameter ด้วย GridSearchCV บน train และอ่านผลจาก cv_results_"
  - "เข้าใจว่า impurity importance เอนเอียง และตรวจซ้ำด้วย permutation importance"
  - "เลือกโมเดลสุดท้ายอย่างซื่อตรงเมื่อผลต่างกันเพียงเล็กน้อย"
examples:
  - id: "x1"
    title: "GridSearchCV บนต้นไม้"
    lang: "python"
    prompt: |
      ค้นหา max_depth และ min_samples_leaf ด้วย CV
    steps:
      - text: |
          grid 4×3 = 12 ชุด แต่ละชุด CV 5 fold: ได้ max_depth=4, min_samples_leaf=60 และ CV AUC ≈ 0.6387
        code: |
          import pandas as pd

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          from sklearn.model_selection import StratifiedKFold, GridSearchCV, train_test_split
          from sklearn.tree import DecisionTreeClassifier
          from sklearn.ensemble import RandomForestClassifier
          from sklearn.inspection import permutation_importance

          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          skf = StratifiedKFold(5, shuffle=True, random_state=42)

          param_grid = {'max_depth': [2, 3, 4, 5], 'min_samples_leaf': [10, 30, 60]}
          gs = GridSearchCV(DecisionTreeClassifier(random_state=42), param_grid, cv=skf, scoring='roc_auc').fit(X_train, y_train)
          gs.best_params_, round(gs.best_score_, 4), len(gs.cv_results_['params'])
      - text: |
          ดูตารางคะแนนของ 4 อันดับแรก — ชุดที่ต่างกันเล็กน้อยมีคะแนนแทบเท่ากัน
        code: |
          import pandas as pd

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          from sklearn.model_selection import StratifiedKFold, GridSearchCV, train_test_split
          from sklearn.tree import DecisionTreeClassifier
          from sklearn.ensemble import RandomForestClassifier
          from sklearn.inspection import permutation_importance

          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          skf = StratifiedKFold(5, shuffle=True, random_state=42)

          param_grid = {'max_depth': [2, 3, 4, 5], 'min_samples_leaf': [10, 30, 60]}
          gs = GridSearchCV(DecisionTreeClassifier(random_state=42), param_grid, cv=skf, scoring='roc_auc').fit(X_train, y_train)
          res = pd.DataFrame(gs.cv_results_)[['params', 'mean_test_score', 'rank_test_score']]
          print(res.sort_values('rank_test_score').head(4).to_string())
    pitfall:
      text: |
        ตั้ง grid ใหญ่เกินไป เช่น 5 ค่า × 5 ค่า × 5 ค่า กับ 5 fold = 625 ครั้งของการ fit บน forest — ช้ามากและไม่คุ้ม เริ่มจาก grid หยาบ ดูว่าคะแนนเปลี่ยนแค่ไหน แล้วค่อยแคบลง (หรือใช้ RandomizedSearchCV)
  - id: "x2"
    title: "impurity vs permutation importance"
    lang: "python"
    prompt: |
      ทดลองใส่ feature สุ่มล้วนเข้าไปแล้วดูว่า importance วิธีไหนถูกหลอก
    steps:
      - text: |
          เพิ่มคอลัมน์ noise แล้ว fit forest — impurity importance ให้ noise อันดับ 2 (ความสำคัญ 0.1761)
        code: |
          import pandas as pd

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          from sklearn.model_selection import StratifiedKFold, GridSearchCV, train_test_split
          from sklearn.tree import DecisionTreeClassifier
          from sklearn.ensemble import RandomForestClassifier
          from sklearn.inspection import permutation_importance

          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          skf = StratifiedKFold(5, shuffle=True, random_state=42)
          import numpy as np

          rng = np.random.RandomState(0)
          Xn_train = X_train.assign(noise=rng.rand(len(X_train)))
          Xn_test = X_test.assign(noise=rng.rand(len(X_test)))
          rf = RandomForestClassifier(n_estimators=100, random_state=42).fit(Xn_train, y_train)
          imp = pd.Series(rf.feature_importances_, index=Xn_train.columns)
          imp.rank(ascending=False)['noise'], round(imp['noise'], 4)
      - text: |
          permutation importance (AUC บน test): noise ≈ 0.002 ขณะที่ channel_promo ≈ 0.046
        code: |
          import pandas as pd

          df = pd.read_csv("data/ml_customers.csv")
          X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
          y = df['repeated']
          from sklearn.model_selection import StratifiedKFold, GridSearchCV, train_test_split
          from sklearn.tree import DecisionTreeClassifier
          from sklearn.ensemble import RandomForestClassifier
          from sklearn.inspection import permutation_importance

          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
          skf = StratifiedKFold(5, shuffle=True, random_state=42)
          import numpy as np

          rng = np.random.RandomState(0)
          Xn_train = X_train.assign(noise=rng.rand(len(X_train)))
          Xn_test = X_test.assign(noise=rng.rand(len(X_test)))
          rf = RandomForestClassifier(n_estimators=100, random_state=42).fit(Xn_train, y_train)
          pi = permutation_importance(rf, Xn_test, y_test, n_repeats=5, random_state=42, scoring='roc_auc')
          perm = pd.Series(pi.importances_mean, index=Xn_train.columns)
          round(perm['noise'], 4), round(perm['channel_promo'], 4)
    pitfall:
      text: |
        อ่านผล feature_importances_ ของ forest ตรงๆ แล้วสรุปว่า feature ที่สำคัญสุดคือ 'ตัวขับเคลื่อน' — impurity importance เอนเอียงไปหา feature ต่อเนื่อง/หลายค่า (ดังที่ noise ได้อันดับ 2) ให้ตรวจซ้ำด้วย permutation importance บนข้อมูล test
