      noise_perm = ___
    solution: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      from sklearn.model_selection import StratifiedKFold, GridSearchCV, train_test_split
      from sklearn.tree import DecisionTreeClassifier
      from sklearn.ensemble import RandomForestClassifier
      from sklearn.inspection import permutation_importance

      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      skf = StratifiedKFold(5, shuffle=True, random_state=42)
      import numpy as np

      rng = np.random.RandomState(0)
      Xn_train = X_train.assign(noise=rng.rand(len(X_train)))
      Xn_test = X_test.assign(noise=rng.rand(len(X_test)))
      rf = RandomForestClassifier(n_estimators=100, random_state=42).fit(Xn_train, y_train)
      noise_rank = pd.Series(rf.feature_importances_, index=Xn_train.columns).rank(ascending=False)['noise']
      pi = permutation_importance(rf, Xn_test, y_test, n_repeats=5, random_state=42, scoring='roc_auc')
      noise_perm = round(pd.Series(pi.importances_mean, index=Xn_train.columns)['noise'], 3)
    check: |
      check_value(noise_rank, _sol["noise_rank"], name="noise_rank")
      check_value(noise_perm, _sol["noise_perm"], name="noise_perm", tol=0.001)
    hints:
      - "rank(ascending=False) ของ Series impurity importance; permutation ใช้ Xn_test"
