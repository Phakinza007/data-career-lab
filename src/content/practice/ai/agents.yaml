          {'q': 'Where is order 1?', 'expected_tools': ['get_order'], 'expected_text': 'completed'},
          {'q': 'How many orders does customer 675 have?', 'expected_tools': ['count_orders'], 'expected_text': '14'},
          {'q': 'Where is order 6000 and how many orders does customer 3015 have?', 'expected_tools': ['get_order', 'count_orders'], 'expected_text': 'completed'},
          {'q': 'Hello', 'expected_tools': [], 'expected_text': "can't help"},
          {'q': 'Where is order 999999?', 'expected_tools': ['get_order'], 'expected_text': 'could not find'},
      ]


      def sloppy_model(messages):
          """โมเดลที่บกพร่อง: ใช้ get_order แทน count_orders (เลือกเครื่องมือผิด)"""
          block = mock_model(messages)
