      import json

      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      products = pd.read_csv("data/products.csv")


      def get_order(order_id: int) -> dict:
          """Look up an order by id"""
          row = orders[orders['order_id'] == order_id]
          if row.empty:
              return {'error': 'order not found'}
          r = row.iloc[0]
          return {'order_id': int(r['order_id']), 'customer_id': int(r['customer_id']), 'status': r['status'], 'order_date': r['order_date']}


      def count_orders(customer_id: int, status: str = None) -> int:
          """Count orders of a customer, optionally by status"""
          sel = orders[orders['customer_id'] == customer_id]
          if status is not None:
              sel = sel[sel['status'] == status]
          return int(len(sel))


      def get_product(product_id: int) -> dict:
          """Look up a product by id"""
          row = products[products['product_id'] == product_id]
          if row.empty:
              return {'error': 'product not found'}
          r = row.iloc[0]
          return {'product_id': int(r['product_id']), 'name': r['product_name'], 'category': r['category'], 'price': float(r['price'])}


      REGISTRY = {'get_order': get_order, 'count_orders': count_orders, 'get_product': get_product}
      TYPES = {'integer': int, 'string': str}

      TOOL_SCHEMAS = [
          {'name': 'get_order', 'description': 'Look up an order by id',
           'input_schema': {'type': 'object', 'properties': {'order_id': {'type': 'integer'}}, 'required': ['order_id']}},
          {'name': 'count_orders', 'description': 'Count orders of a customer, optionally by status',
           'input_schema': {'type': 'object', 'properties': {'customer_id': {'type': 'integer'}, 'status': {'type': 'string'}}, 'required': ['customer_id']}},
          {'name': 'get_product', 'description': 'Look up a product by id',
           'input_schema': {'type': 'object', 'properties': {'product_id': {'type': 'integer'}}, 'required': ['product_id']}},
      ]


      def dispatch(call):
          """รับ {'name': ..., 'input': {...}} คืน {'ok': True, 'result': ...} หรือ {'ok': False, 'error': ...}"""
          name, args = call['name'], call.get('input', {})
          if name not in REGISTRY:
              return {'ok': False, 'error': 'unknown tool: ' + name}
          schema = next(s for s in TOOL_SCHEMAS if s['name'] == name)['input_schema']
          for arg in schema['required']:
              if arg not in args:
                  return {'ok': False, 'error': 'missing argument: ' + arg}
          for arg, value in args.items():
              expected = schema['properties'].get(arg, {}).get('type')
              if expected is None:
                  return {'ok': False, 'error': 'unexpected argument: ' + arg}
              if not isinstance(value, TYPES[expected]) or isinstance(value, bool):
                  return {'ok': False, 'error': f'bad type for {arg}: expected {expected}'}
          try:
              return {'ok': True, 'result': REGISTRY[name](**args)}
          except Exception as e:
              return {'ok': False, 'error': f'{type(e).__name__}: {e}'}


      import re

      TOOL_FOR = {'order': ('get_order', 'order_id'), 'customer': ('count_orders', 'customer_id')}


      def make_plan(text):
          """ตัวแทนความสามารถของโมเดล (สคริปต์ ไม่ใช่โมเดลจริง): หา 'order N' / 'customer N' ตามลำดับที่ปรากฏ"""
          plan = []
          for kind, number in re.findall(r"(order|customer) (\d+)", text, re.I):
              tool, arg = TOOL_FOR[kind.lower()]
              plan.append({'name': tool, 'input': {arg: int(number)}})
          return plan


      def mock_model(messages):
          """จำลองโมเดล: ขอเรียกเครื่องมือตามแผนทีละอัน พอครบแล้วสรุปเป็นข้อความ"""
          plan = make_plan(messages[0]['content'])
          results = [json.loads(m['content'][0]['content']) for m in messages
                     if m['role'] == 'user' and isinstance(m['content'], list)]
          if len(results) < len(plan):
              step = plan[len(results)]
              return {'type': 'tool_use', 'id': f'tu_{len(results) + 1}', 'name': step['name'], 'input': step['input']}
          if not plan:
              return {'type': 'text', 'text': "Sorry, I can't help with that."}
          parts = []
          for r in results:
              if not r['ok']:
                  parts.append('A tool call failed: ' + r['error'] + '.')
              elif isinstance(r['result'], int):
                  parts.append(f"That customer has {r['result']} orders.")
              elif 'error' in r['result']:
                  parts.append('I could not find that order.')
              else:
                  parts.append(f"Order {r['result']['order_id']} is {r['result']['status']}.")
          return {'type': 'text', 'text': ' '.join(parts)}


      def looping_model(messages):
          """โมเดลที่ไม่ยอมจบ: ขอเรียกเครื่องมือเดิมซ้ำตลอด"""
          return {'type': 'tool_use', 'id': f'tu_{len(messages)}', 'name': 'get_order', 'input': {'order_id': 1}}


      def run_agent(question, model, max_steps=5):
          messages = [{'role': 'user', 'content': question}]
          for step in range(1, max_steps + 1):
              block = model(messages)
              messages.append({'role': 'assistant', 'content': [block]})
              if block['type'] == 'text':
                  return {'final': block['text'], 'steps': step, 'stopped': 'done', 'messages': messages}
              result = dispatch({'name': block['name'], 'input': block['input']})
              messages.append({'role': 'user', 'content': [{'type': 'tool_result', 'tool_use_id': block['id'], 'content': json.dumps(result)}]})
          return {'final': None, 'steps': max_steps, 'stopped': 'max_steps', 'messages': messages}


      ACTIONS = []   # บันทึกการกระทำที่มีผลข้างเคียง (จำลอง — ไม่ได้แก้ข้อมูลจริง)


      def cancel_order(order_id: int) -> str:
          """Cancel an order (write action)"""
          ACTIONS.append(f'cancel_order:{order_id}')
          return f'order {order_id} cancelled'


      REGISTRY['cancel_order'] = cancel_order
      TOOL_SCHEMAS.append({'name': 'cancel_order', 'description': 'Cancel an order',
                           'input_schema': {'type': 'object', 'properties': {'order_id': {'type': 'integer'}}, 'required': ['order_id']}})
      READ_ONLY = {'get_order', 'count_orders', 'get_product'}
      WRITE_TOOLS = {'cancel_order'}


      def safe_dispatch(call, allowed, confirmed=False, seen=None):
          name = call['name']
          if name not in allowed:
              return {'ok': False, 'error': 'tool not allowed: ' + name}
          if name in WRITE_TOOLS and not confirmed:
              return {'ok': False, 'error': 'confirmation required'}
          if seen is not None:
              key = json.dumps(call, sort_keys=True)
              if key in seen:
                  return {'ok': True, 'result': 'duplicate ignored'}
              seen.add(key)
          return dispatch(call)


