title: "ชุดฝึกท้าย module: พื้นฐาน LLM และ API"
exercises:
  - id: "p1"
    level: "basic"
    lang: "python"
    prompt: |
      ประมาณ token ของคำถามทั้ง 30 ข้อใน qs (est_tokens ของแต่ละคำถาม) รวมกันเป็นเท่าไร เก็บไว้ในตัวแปร question_tokens_total
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      docs = pd.read_csv("data/kb_docs.csv")
      qs = pd.read_csv("data/kb_questions.csv")
      import math
      import re

      PRICE_IN = 3.0    # USD ต่อ 1 ล้าน input token (ตัวเลขสมมติ ไม่ใช่ราคาจริง)
      PRICE_OUT = 15.0  # USD ต่อ 1 ล้าน output token (ตัวเลขสมมติ ไม่ใช่ราคาจริง)


      def est_tokens(text):
          return math.ceil(len(text) / 4)


      def toy_tokens(text):
          return re.findall(r"\w+|[^\w\s]", text)
      import hashlib
      import json
      import random
      from collections import Counter

      import numpy as np

      tokens = ['the', 'a', 'cat', 'dog']
      logits = np.array([2.0, 1.0, 0.5, 0.1])


      def softmax(values, temperature=1.0):
          z = values / temperature
          z = z - z.max()
          e = np.exp(z)
          return e / e.sum()


      class RateLimitError(Exception):
          pass


      def make_flaky(fail_times):
          state = {'calls': 0}

          def call(prompt):
              state['calls'] += 1
              if state['calls'] <= fail_times:
                  raise RateLimitError('429')
              return 'ok: ' + prompt

          return call
      question_tokens_total = int(qs['question'].map(est_tokens).sum())
    check: |
      check_value(question_tokens_total, _sol["question_tokens_total"], name="question_tokens_total")
    hints:
      - "map(est_tokens).sum()"
