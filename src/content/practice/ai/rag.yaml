      MRR แยกตามหมวดของเอกสารเฉลย: หมวด shipping และ returns (ใช้ gold ที่ให้ไว้) ปัด 4 ตำแหน่ง เก็บไว้ในตัวแปร shipping_mrr, returns_mrr
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      docs = pd.read_csv("data/kb_docs.csv")
      qs = pd.read_csv("data/kb_questions.csv")
      import math
      import re

      import numpy as np
      from sklearn.feature_extraction.text import ENGLISH_STOP_WORDS, TfidfVectorizer
      from sklearn.metrics.pairwise import cosine_similarity

      vec = TfidfVectorizer(stop_words='english')
      D = vec.fit_transform(docs['text'])
      sims = cosine_similarity(vec.transform(qs['question']), D)

      TEMPLATE_RAG = (
          "Answer the question using ONLY the context below. Cite the doc ids in square brackets. "
          "If the answer is not in the context, reply exactly: I don't know.\n\n"
          "Context:\n{context}\n\n"
          "Question: {question}\n"
          "Answer:"
      )


      def est_tokens(text):
          return math.ceil(len(text) / 4)


      def retrieve(question, k=3):
          """คืน [(doc_id, คะแนน cosine)] ของ k เอกสารที่คล้ายที่สุด"""
          s = cosine_similarity(vec.transform([question]), D)[0]
          order = np.argsort(-s, kind='stable')[:k]
          return [(docs['doc_id'][j], float(s[j])) for j in order]


      def sentences(text):
          return [s.strip() for s in re.split(r"(?<=[.;])\s+", text) if s.strip()]


      def content_words(text):
          return {w for w in re.findall(r"[a-z0-9]+", text.lower()) if w not in ENGLISH_STOP_WORDS}


      def mock_answer(question, doc_ids):
          """ตัวแทน LLM แบบสกัดประโยค (ไม่ใช่โมเดลจริง): เลือกประโยคที่มีคำสำคัญร่วมกับคำถามมากที่สุด (เสมอ = ประโยคแรกที่เจอ)"""
          best, best_score = None, -1
          for doc_id in doc_ids:
              text = docs.loc[docs['doc_id'] == doc_id, 'text'].iloc[0]
              for s in sentences(text):
                  score = len(content_words(question) & content_words(s))
                  if score > best_score:
                      best, best_score = (doc_id, s), score
          return best

      from sklearn.decomposition import TruncatedSVD


      def gold_ranks(vec, texts=None):
          """อันดับ (เริ่มที่ 1) ของเอกสารเฉลยของแต่ละคำถาม เมื่อค้นด้วย vectorizer ที่ให้"""
          D = vec.fit_transform(docs['text'] if texts is None else texts)
          sims = cosine_similarity(vec.transform(qs['question']), D)
          out = []
          for i, gold in enumerate(qs['gold_doc_id']):
              order = np.argsort(-sims[i], kind='stable')
              out.append(list(docs['doc_id'].values[order]).index(gold) + 1)
          return np.array(out)

      ranks = gold_ranks(TfidfVectorizer(stop_words='english'))
      gold = qs.merge(docs[['doc_id', 'category']], left_on='gold_doc_id', right_on='doc_id')
      rr = pd.Series(1 / ranks, index=gold.index)
      by_cat = rr.groupby(gold['category']).mean()
      shipping_mrr = round(float(by_cat['shipping']), 4)
      returns_mrr = round(float(by_cat['returns']), 4)
    check: |
      check_value(shipping_mrr, _sol["shipping_mrr"], name="shipping_mrr", tol=0.001)
      check_value(returns_mrr, _sol["returns_mrr"], name="returns_mrr", tol=0.001)
