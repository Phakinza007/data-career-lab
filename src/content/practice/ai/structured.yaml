title: "ชุดฝึกท้าย module: Prompt และ structured output"
exercises:
  - id: "p1"
    level: "basic"
    lang: "python"
    prompt: |
      จำนวนหมวดที่ไม่ซ้ำใน docs["category"] เก็บไว้ในตัวแปร n_labels
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      docs = pd.read_csv("data/kb_docs.csv")
      qs = pd.read_csv("data/kb_questions.csv")
      import json
      import math
      import re

      import pandas as pd

      LABELS = ['shipping', 'returns', 'payment', 'orders', 'promo', 'account', 'privacy', 'warranty', 'products', 'support']

      # ผลลัพธ์ที่ "จำลอง" ว่าโมเดลตอบกลับมา (ไม่ได้เรียก API จริง) — ไม่ตรงรูปแบบทุกอัน
      RAW = [
          '{"category": "shipping", "confidence": 0.92}',
          'Sure! Here is the JSON:\n```json\n{"category": "returns", "confidence": 0.81}\n```',
          '{"category": "payment", "confidence": "0.7"}',
          "{'category': 'orders', 'confidence': 0.6}",
          '{"category": "billing", "confidence": 0.5}',
          '{"category": "promo"}',
          'The category is account.',
          '{"category": "support", "confidence": 1.4}',
      ]


      def parse_lenient(text):
          try:
              return json.loads(text)
          except json.JSONDecodeError:
              pass
          match = re.search(r"\{.*\}", text, re.S)
          if match:
              try:
                  return json.loads(match.group(0))
              except json.JSONDecodeError:
                  return None
          return None


      def first_error(obj, coerce=False):
          if obj is None:
              return 'unparseable'
          if 'category' not in obj or 'confidence' not in obj:
              return 'missing_' + ('confidence' if 'confidence' not in obj else 'category')
          if obj['category'] not in LABELS:
              return 'bad_category'
          conf = obj['confidence']
          if coerce and isinstance(conf, str):
              try:
                  conf = float(conf)
              except ValueError:
                  return 'bad_confidence_type'
          if not isinstance(conf, (int, float)) or isinstance(conf, bool):
              return 'bad_confidence_type'
          if not 0 <= conf <= 1:
              return 'confidence_range'
          return None


      EMAIL = r"[\w.+-]+@[\w-]+\.[\w.]+"
      PHONE = r"\b0\d{1,2}-?\d{3}-?\d{4}\b"
      INJECTION = [r"ignore (all )?(previous|prior) instructions", r"system prompt", r"you are now"]
      TEXT = "Contact me at customer00001@example.com or 081-234-5678 about order 1234."


      TEMPLATE = (
          "You are a support triage assistant.\n"
          "Classify the ticket into one of: {labels}.\n\n"
          "{examples}"
          "Ticket: {ticket}\n"
          "Category:"
      )
      gold = qs.merge(docs[['doc_id', 'category']], left_on='gold_doc_id', right_on='doc_id')
      examples = list(zip(gold['question'], gold['category']))[:8]


      def est_tokens(text):
          return math.ceil(len(text) / 4)


      class MockLLM:
          def __init__(self, replies):
              self.replies = list(replies)
              self.calls = []

          def __call__(self, messages):
              self.calls.append(list(messages))
              return self.replies[min(len(self.calls) - 1, len(self.replies) - 1)]


      def validate(reply):
          try:
              obj = json.loads(reply)
          except json.JSONDecodeError:
              return 'not valid JSON'
          if obj.get('category') not in LABELS:
              return 'category must be one of ' + ', '.join(LABELS)
          return None


      def ask_with_retry(llm, prompt, max_retries=3):
          messages = [{'role': 'user', 'content': prompt}]
          for attempt in range(1, max_retries + 2):
              reply = llm(messages)
              error = validate(reply)
              if error is None:
                  return json.loads(reply), attempt
              messages.append({'role': 'assistant', 'content': reply})
              messages.append({'role': 'user', 'content': 'Your reply was rejected: ' + error + '. Return only valid JSON.'})
          return None, max_retries + 1
      n_labels = docs['category'].nunique()
    check: |
      check_value(n_labels, _sol["n_labels"], name="n_labels")
    hints:
      - "nunique()"
