  - id: p5
    level: basic
    lang: sql
    prompt: |
      conversion rate รวมของ funnel เป็นเปอร์เซ็นต์ปัด 2 ตำแหน่ง แสดงคอลัมน์เดียวชื่อ cvr_pct
    starter: |
      -- เขียน SQL ตรงนี้
      SELECT ___
    solution: |
      SELECT ROUND(COUNT(DISTINCT CASE WHEN event_type = 'purchase' THEN session_id END) * 100.0
                   / COUNT(DISTINCT CASE WHEN event_type = 'visit' THEN session_id END), 2) AS cvr_pct
      FROM events
    hints:
      - นับ session ของสองขั้นในแถวเดียวด้วย CASE WHEN
  - id: p6
    level: applied
    lang: sql
    prompt: |
      ลูกค้าที่ซื้อมากที่สุด 10 อันดับแรก (เฉพาะ `completed`) แสดง customer_id, orders, revenue
      เรียงตามรายได้จากมากไปน้อย
    starter: |
      -- เขียน SQL ตรงนี้
      SELECT ___
    solution: |
      SELECT o.customer_id,
             COUNT(DISTINCT o.order_id) AS orders,
             SUM(li.quantity * li.unit_price) AS revenue
      FROM orders o
      JOIN order_items li ON li.order_id = o.order_id
      WHERE o.status = 'completed'
      GROUP BY 1
      ORDER BY revenue DESC
      LIMIT 10
    ordered: true
    hints:
      - จัดกลุ่มระดับลูกค้าแล้วเรียงด้วยรายได้
  - id: p7
    level: applied
    lang: sql
    prompt: |
      รายได้รายเดือนของปี 2025 พร้อมค่าเฉลี่ยเคลื่อนที่ 3 เดือน (ปัด 2 ตำแหน่ง)
      แสดง month, revenue, moving_avg_3m เรียงตามเดือน
    starter: |
      -- เขียน SQL ตรงนี้
      SELECT ___
    solution: |
      WITH monthly AS (
        SELECT DATE_TRUNC('month', o.order_date) AS month,
               SUM(li.quantity * li.unit_price) AS revenue
        FROM orders o
        JOIN order_items li ON li.order_id = o.order_id
        WHERE o.status = 'completed' AND EXTRACT(year FROM o.order_date) = 2025
        GROUP BY 1
      )
      SELECT month, revenue,
             ROUND(AVG(revenue) OVER (ORDER BY month ROWS BETWEEN 2 PRECEDING AND CURRENT ROW), 2) AS moving_avg_3m
      FROM monthly
      ORDER BY month
    ordered: true
    hints:
      - "AVG(...) OVER (ORDER BY month ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) คือค่าเฉลี่ย 3 เดือนล่าสุด"
  - id: p8
    level: applied
    lang: sql
    prompt: |
      retention เดือนที่ 1 ของ cohort ปี 2025 แสดง cohort_month, cohort_size, m1_pct (ปัด 1 ตำแหน่ง)
      เรียงตามเดือน
    starter: |
      -- เขียน SQL ตรงนี้
      SELECT ___
    solution: |
      WITH first_order AS (
        SELECT customer_id, DATE_TRUNC('month', MIN(order_date)) AS cohort_month
        FROM orders WHERE status = 'completed' GROUP BY 1
      ), activity AS (
        SELECT f.cohort_month, o.customer_id,
               DATEDIFF('month', f.cohort_month, DATE_TRUNC('month', o.order_date)) AS month_no
        FROM orders o
        JOIN first_order f ON f.customer_id = o.customer_id
        WHERE o.status = 'completed'
      ), grid AS (
        SELECT cohort_month, month_no, COUNT(DISTINCT customer_id) AS customers
        FROM activity GROUP BY 1, 2
      )
      SELECT g.cohort_month, s.cohort_size,
             ROUND(g.customers * 100.0 / s.cohort_size, 1) AS m1_pct
      FROM grid g
      JOIN (SELECT cohort_month, customers AS cohort_size FROM grid WHERE month_no = 0) s
        ON s.cohort_month = g.cohort_month
      WHERE g.month_no = 1 AND EXTRACT(year FROM g.cohort_month) = 2025
      ORDER BY g.cohort_month
    ordered: true
    hints:
      - ทบทวน module business metrics บทที่ 3
  - id: p9
    level: applied
    lang: python
    prompt: |
      ทำความสะอาดคอลัมน์ city ของ `data/raw/customers_raw.csv` (ตัดช่องว่างหน้า-หลังและจัดตัวพิมพ์
