title: "ชุดฝึกรวมท้ายสาย DA"
exercises:
  - id: p1
    level: basic
    lang: sql
    prompt: |
      จำนวนออเดอร์ รายได้ และ AOV (ปัด 2 ตำแหน่ง) ของทั้งชุดข้อมูล เฉพาะ `completed`
      แสดง orders, revenue, aov
    starter: |
      -- เขียน SQL ตรงนี้
      SELECT ___
    solution: |
      SELECT COUNT(DISTINCT o.order_id) AS orders,
             SUM(li.quantity * li.unit_price) AS revenue,
             ROUND(SUM(li.quantity * li.unit_price) / COUNT(DISTINCT o.order_id), 2) AS aov
      FROM orders o
      JOIN order_items li ON li.order_id = o.order_id
      WHERE o.status = 'completed'
    hints:
      - หลัง JOIN หนึ่งแถวคือหนึ่งรายการสินค้า ต้องนับออเดอร์แบบไม่ซ้ำ
  - id: p2
    level: basic
    lang: sql
    prompt: |
      สินค้า 5 อันดับแรกที่ทำรายได้สูงสุด (เฉพาะ `completed`) แสดง product_name, revenue
      เรียงจากมากไปน้อย
    starter: |
      -- เขียน SQL ตรงนี้
      SELECT ___
    solution: |
      SELECT p.product_name, SUM(li.quantity * li.unit_price) AS revenue
      FROM orders o
      JOIN order_items li ON li.order_id = o.order_id
      JOIN products p ON p.product_id = li.product_id
      WHERE o.status = 'completed'
      GROUP BY 1
      ORDER BY revenue DESC
      LIMIT 5
    ordered: true
    hints:
      - join ถึงตาราง products เพื่อให้ได้ชื่อสินค้า
