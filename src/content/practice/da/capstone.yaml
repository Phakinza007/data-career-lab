  - id: p10
    level: applied
    lang: python
    prompt: |
      ช่วงความเชื่อมั่น 95% ของยอดขายเฉลี่ยต่อออเดอร์ (เฉพาะ `completed`)
      เก็บขอบล่างไว้ในตัวแปร ci_low และขอบบนไว้ในตัวแปร ci_high
    starter: |
      import pandas as pd
      import scipy.stats as stats

      orders = pd.read_csv("data/orders.csv")
      items = pd.read_csv("data/order_items.csv")
      ci_low, ci_high = ___
    solution: |
      import pandas as pd
      import numpy as np
      import scipy.stats as stats

      orders = pd.read_csv("data/orders.csv")
      items = pd.read_csv("data/order_items.csv")
      items['line'] = items['quantity'] * items['unit_price']
      sales = items.merge(orders, on='order_id')
      sales = sales[sales['status'] == 'completed']
      order_rev = sales.groupby('order_id')['line'].sum()
      mean = order_rev.mean()
      se = order_rev.std(ddof=1) / np.sqrt(len(order_rev))
      ci_low, ci_high = stats.norm.interval(0.95, loc=mean, scale=se)
    check: |
      check_value(ci_low, _sol["ci_low"], name="ci_low")
      check_value(ci_high, _sol["ci_high"], name="ci_high")
    hints:
      - สรุปยอดต่อออเดอร์ก่อนด้วย groupby('order_id')
      - "standard error = ส่วนเบี่ยงเบนมาตรฐาน ÷ รากที่สองของจำนวนตัวอย่าง"
  - id: p11
    level: applied
    lang: python
    prompt: |
      ทดสอบว่า purchase rate ของ variant B ต่างจาก variant A อย่างมีนัยสำคัญไหม
      (ใช้ข้อมูล session ที่อยู่ในการทดลองจาก events) เก็บ z_stat และ p_value
    starter: |
      import pandas as pd
      import numpy as np
      import scipy.stats as stats

      events = pd.read_csv("data/events.csv")
      z_stat, p_value = ___
    solution: |
      import pandas as pd
      import numpy as np
      import scipy.stats as stats

      events = pd.read_csv("data/events.csv")
      ev = events[events['variant'].notna()]
      sessions = (
          ev.groupby(['session_id', 'variant'])['event_type']
          .apply(lambda s: (s == 'purchase').any())
          .rename('purchased')
          .reset_index()
      )
      counts = sessions.groupby('variant')['purchased'].agg(['size', 'sum'])
      nA, bA = counts.loc['A', 'size'], counts.loc['A', 'sum']
      nB, bB = counts.loc['B', 'size'], counts.loc['B', 'sum']
      p_pool = (bA + bB) / (nA + nB)
      se = np.sqrt(p_pool * (1 - p_pool) * (1 / nA + 1 / nB))
      z_stat = (bB / nB - bA / nA) / se
      p_value = stats.norm.sf(abs(z_stat)) * 2
    check: |
      check_value(z_stat, _sol["z_stat"], name="z_stat")
      check_value(p_value, _sol["p_value"], name="p_value")
    hints:
      - ยุบข้อมูลให้เป็นระดับ session (ซื้อ/ไม่ซื้อ) ก่อนนับ
      - ทบทวน module สถิติ บทที่ 5 (A/B testing)
  - id: p12
    level: applied
    lang: sql
    prompt: |
      กำไรขั้นต้นและ margin แยกตามหมวดสินค้า (เฉพาะ `completed`) แสดง category, gross_profit
      (ปัด 2 ตำแหน่ง), margin_pct (ปัด 1 ตำแหน่ง) เรียงตาม margin_pct จากมากไปน้อย
    starter: |
      -- เขียน SQL ตรงนี้
      SELECT ___
    solution: |
      SELECT p.category,
             ROUND(SUM(li.quantity * (li.unit_price - p.cost)), 2) AS gross_profit,
             ROUND(SUM(li.quantity * (li.unit_price - p.cost)) * 100.0
                   / SUM(li.quantity * li.unit_price), 1) AS margin_pct
      FROM orders o
      JOIN order_items li ON li.order_id = o.order_id
      JOIN products p ON p.product_id = li.product_id
      WHERE o.status = 'completed'
      GROUP BY 1
      ORDER BY margin_pct DESC
    ordered: true
    hints:
      - margin คิดจากผลรวมหารผลรวม
  - id: p13
    level: applied
    lang: python
    prompt: |
      ตาราง RFM ระดับลูกค้า (recency ถึง 31 ธ.ค. 2025, frequency, monetary) เฉพาะ `completed`
      แล้วเก็บเฉพาะลูกค้า 10 อันดับแรกที่ monetary สูงสุด (เรียงจากมากไปน้อย)
      เก็บ DataFrame ไว้ในตัวแปร result
    starter: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      items = pd.read_csv("data/order_items.csv")
      result = ___
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      items = pd.read_csv("data/order_items.csv")
      items['line'] = items['quantity'] * items['unit_price']
      sales = items.merge(orders, on='order_id')
      sales = sales[sales['status'] == 'completed']
      asof = pd.Timestamp('2025-12-31')
      rfm = sales.groupby('customer_id').agg(
          recency=('order_date', lambda s: (asof - s.max()).days),
          frequency=('order_id', 'nunique'),
          monetary=('line', 'sum'),
      )
      result = rfm.sort_values('monetary', ascending=False).head(10)
    check: |
      check_df(result, _sol["result"], ordered=True)
    hints:
      - ทบทวน module business metrics บทที่ 4 (RFM)
  - id: p14
    level: challenge
    lang: sql
    prompt: |
      ลูกค้าที่ซื้อครั้งแรกปี 2025 และกลับมาซื้ออีกอย่างน้อยหนึ่งครั้งภายในปีเดียวกัน
      แสดง cohort_month, new_customers, repeat_customers, repeat_pct (ปัด 1 ตำแหน่ง) เรียงตามเดือน
    starter: |
      -- เขียน SQL ตรงนี้
      SELECT ___
    solution: |
      WITH first_order AS (
        SELECT customer_id, MIN(order_date) AS first_day
        FROM orders WHERE status = 'completed' GROUP BY 1
      ), repeats AS (
        SELECT f.customer_id,
               DATE_TRUNC('month', f.first_day) AS cohort_month,
               COUNT(DISTINCT CASE WHEN o.order_date > f.first_day
                                    AND EXTRACT(year FROM o.order_date) = 2025
                                   THEN o.order_id END) AS later_orders
        FROM first_order f
        JOIN orders o ON o.customer_id = f.customer_id AND o.status = 'completed'
        WHERE EXTRACT(year FROM f.first_day) = 2025
        GROUP BY 1, 2
      )
      SELECT cohort_month,
             COUNT(*) AS new_customers,
             COUNT(CASE WHEN later_orders > 0 THEN 1 END) AS repeat_customers,
             ROUND(COUNT(CASE WHEN later_orders > 0 THEN 1 END) * 100.0 / COUNT(*), 1) AS repeat_pct
      FROM repeats
      GROUP BY 1
      ORDER BY 1
    ordered: true
    hints:
      - นับออเดอร์ที่เกิดหลังวันซื้อครั้งแรกของลูกค้าคนนั้น
      - แยกการนับ "ลูกค้าทั้งหมด" กับ "ลูกค้าที่ซื้อซ้ำ" ด้วย CASE WHEN
  - id: p15
    level: challenge
    lang: python
    prompt: |
      ตารางสรุปสำหรับรายงาน — รายได้ กำไรขั้นต้น และ margin_pct (ปัด 1 ตำแหน่ง) รายเดือนของปี 2025
      (เฉพาะ `completed`) โดย index เป็นเดือนแบบ `2025-01` เก็บ DataFrame ไว้ในตัวแปร result
    starter: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      items = pd.read_csv("data/order_items.csv")
      products = pd.read_csv("data/products.csv")
      result = ___
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv", parse_dates=['order_date'])
      items = pd.read_csv("data/order_items.csv")
      products = pd.read_csv("data/products.csv")
      sales = items.merge(orders, on='order_id').merge(products, on='product_id')
      sales = sales[(sales['status'] == 'completed') & (sales['order_date'].dt.year == 2025)].copy()
      sales['line'] = sales['quantity'] * sales['unit_price']
      sales['profit'] = sales['quantity'] * (sales['unit_price'] - sales['cost'])
      sales['month'] = sales['order_date'].dt.to_period('M').astype(str)
      result = sales.groupby('month').agg(revenue=('line', 'sum'), gross_profit=('profit', 'sum'))
      result['margin_pct'] = (result['gross_profit'] / result['revenue'] * 100).round(1)
    check: |
      check_df(result, _sol["result"], ordered=True)
    hints:
      - merge ให้ถึงตาราง products เพื่อได้ต้นทุน
      - คำนวณคอลัมน์อัตราส่วนหลังจากรวมยอดแล้ว
  - id: p16
    level: challenge
    lang: sql
    prompt: |
      หาสินค้าที่ "ขายดีแต่กำไรน้อย" — สินค้าที่รายได้ติด 10 อันดับแรกแต่ margin ต่ำกว่า 25%
      แสดง product_name, revenue, margin_pct (ปัด 1 ตำแหน่ง) เรียงตามรายได้จากมากไปน้อย
      (เฉพาะออเดอร์ `completed`)
    starter: |
      -- เขียน SQL ตรงนี้
      SELECT ___
    solution: |
      WITH per_product AS (
        SELECT p.product_name,
               SUM(li.quantity * li.unit_price) AS revenue,
               ROUND(SUM(li.quantity * (li.unit_price - p.cost)) * 100.0
                     / SUM(li.quantity * li.unit_price), 1) AS margin_pct
        FROM orders o
        JOIN order_items li ON li.order_id = o.order_id
        JOIN products p ON p.product_id = li.product_id
        WHERE o.status = 'completed'
        GROUP BY 1
      ), top10 AS (
        SELECT * FROM per_product ORDER BY revenue DESC LIMIT 10
      )
      SELECT product_name, revenue, margin_pct
      FROM top10
      WHERE margin_pct < 25
      ORDER BY revenue DESC
    ordered: true
    hints:
      - หา 10 อันดับแรกก่อนใน CTE แล้วค่อยกรอง margin
      - ถ้ากรอง margin ก่อนจะได้คนละคำตอบ เพราะ "10 อันดับแรก" ต้องมาจากสินค้าทั้งหมด
