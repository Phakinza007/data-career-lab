    level: basic
    lang: python
    prompt: |
      จำนวน session ต่อขั้นของ funnel ทั้งหมด (Series, index ตามลำดับ visit, view_product, add_to_cart, checkout, purchase)
      เก็บไว้ในตัวแปร result
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      events = pd.read_csv("data/events.csv")
      FUNNEL = ["visit", "view_product", "add_to_cart", "checkout", "purchase"]
      counts = events.groupby('event_type')['session_id'].nunique()
      result = counts.reindex(FUNNEL)
    check: |
      check_series(result, _sol["result"])
