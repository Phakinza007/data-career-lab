  - id: p12
    level: challenge
    lang: python
    prompt: |
      จำนวนลูกค้าในกลุ่ม Champions (RFM: r_score==4 และ f_score==4 และ m_score==4) เก็บไว้ในตัวแปร n_champions
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      snapshot = pd.Timestamp('2026-01-01')
      orders_dt = orders.copy()
      orders_dt['order_date'] = pd.to_datetime(orders_dt['order_date'])
      comp = orders_dt[orders_dt['status'] == 'completed']
      rev = order_items.merge(orders, on='order_id')
      rev = rev[rev['status'] == 'completed'].assign(line=lambda d: d.quantity * d.unit_price)
      rfm_r = (snapshot - comp.groupby('customer_id')['order_date'].max()).dt.days.rename('recency')
      rfm_f = comp.groupby('customer_id').size().rename('frequency')
      rfm_m = rev.groupby('customer_id')['line'].sum().rename('monetary')
      rfm = pd.concat([rfm_r, rfm_f, rfm_m], axis=1).dropna()
      rfm['r_score'] = pd.qcut(rfm['recency'], 4, labels=[4, 3, 2, 1]).astype(int)
      rfm['f_score'] = pd.qcut(rfm['frequency'].rank(method='first'), 4, labels=[1, 2, 3, 4]).astype(int)
      rfm['m_score'] = pd.qcut(rfm['monetary'], 4, labels=[1, 2, 3, 4]).astype(int)
      champions = (rfm['r_score'] == 4) & (rfm['f_score'] == 4) & (rfm['m_score'] == 4)
      n_champions = int(champions.sum())
    check: |
      check_value(n_champions, _sol["n_champions"], name="n_champions")
    hints:
      - ทบทวนบทที่ 4
