  - id: p15
    level: challenge
    lang: python
    prompt: |
      เดือนที่มีลูกค้า active มากที่สุดและน้อยที่สุดในปี 2025 (สองตัวแปร) เก็บไว้ในตัวแปร peak_month, low_month
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      o25 = orders[(orders['status'] == 'completed') & (orders['order_date'].str.startswith('2025'))]
      mac = o25.assign(month=lambda d: d.order_date.str[:7]).groupby('month')['customer_id'].nunique()
      peak_month = mac.idxmax()
      low_month = mac.idxmin()
    check: |
      check_value(peak_month, _sol["peak_month"], name="peak_month")
      check_value(low_month, _sol["low_month"], name="low_month")
    hints:
      - ทบทวนบทที่ 1
  - id: p16
    level: challenge
    lang: python
    prompt: |
      จำนวนลูกค้าที่เคยซื้อสำเร็จ (completed) และจำนวนที่ซื้อซ้ำ (≥2 ครั้ง completed, สองตัวแปร)
      เก็บไว้ในตัวแปร n_paying, n_repeat
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      rev = order_items.merge(orders, on='order_id')
      rev = rev[rev['status'] == 'completed'].assign(line=lambda d: d.quantity * d.unit_price)
      cust_order_count = rev.groupby('customer_id')['order_id'].nunique()
      n_paying = len(cust_order_count)
      n_repeat = int((cust_order_count >= 2).sum())
    check: |
      check_value(n_paying, _sol["n_paying"], name="n_paying")
      check_value(n_repeat, _sol["n_repeat"], name="n_repeat")
    hints:
      - ทบทวนบทที่ 1
