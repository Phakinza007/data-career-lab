  - id: p9
    level: applied
    lang: python
    prompt: |
      รายได้เฉลี่ยต่อลูกค้า active เดือน ธ.ค. 2025 และ ม.ค. 2025 (สองตัวแปร) เก็บไว้ในตัวแปร dec_avg, jan_avg
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      o25 = orders[(orders['status'] == 'completed') & (orders['order_date'].str.startswith('2025'))]
      r25 = order_items.merge(o25, on='order_id').assign(line=lambda d: d.quantity * d.unit_price)
      r25 = r25.assign(month=lambda d: d.order_date.str[:7])
      monthly_rev = r25.groupby('month')['line'].sum()
      monthly_mac = o25.assign(month=lambda d: d.order_date.str[:7]).groupby('month')['customer_id'].nunique()
      dec_avg = round(monthly_rev['2025-12'] / monthly_mac['2025-12'], 2)
      jan_avg = round(monthly_rev['2025-01'] / monthly_mac['2025-01'], 2)
    check: |
      check_value(dec_avg, _sol["dec_avg"], name="dec_avg", tol=0.1)
      check_value(jan_avg, _sol["jan_avg"], name="jan_avg", tol=0.1)
    hints:
      - ทบทวนบทที่ 1
  - id: p10
    level: applied
    lang: python
    prompt: |
      recency/frequency/monetary เฉลี่ยของลูกค้าทั้งหมด (สามตัวแปร, snapshot 2026-01-01)
      เก็บไว้ในตัวแปร avg_recency, avg_frequency, avg_monetary
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      snapshot = pd.Timestamp('2026-01-01')
      orders_dt = orders.copy()
      orders_dt['order_date'] = pd.to_datetime(orders_dt['order_date'])
      comp = orders_dt[orders_dt['status'] == 'completed']
      rev = order_items.merge(orders, on='order_id')
      rev = rev[rev['status'] == 'completed'].assign(line=lambda d: d.quantity * d.unit_price)
      recency = (snapshot - comp.groupby('customer_id')['order_date'].max()).dt.days
      frequency = comp.groupby('customer_id').size()
      monetary = rev.groupby('customer_id')['line'].sum()
      avg_recency = round(recency.mean(), 2)
      avg_frequency = round(frequency.mean(), 2)
      avg_monetary = round(monetary.mean(), 2)
    check: |
      check_value(avg_recency, _sol["avg_recency"], name="avg_recency", tol=0.1)
      check_value(avg_frequency, _sol["avg_frequency"], name="avg_frequency", tol=0.01)
      check_value(avg_monetary, _sol["avg_monetary"], name="avg_monetary", tol=0.1)
    hints:
      - ทบทวนบทที่ 4 (RFM)
