  - id: p6
    level: applied
    lang: python
    prompt: |
      จำนวนออเดอร์ (completed) ที่มี z-score ของยอดขายเกิน 3 ในค่าสัมบูรณ์ (|z|>3) เก็บไว้ในตัวแปร n_outliers_z
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      rev = order_items.merge(orders, on='order_id')
      rev = rev[rev['status'] == 'completed'].assign(line=lambda d: d.quantity * d.unit_price)
      order_rev = rev.groupby('order_id')['line'].sum()
      z = (order_rev - order_rev.mean()) / order_rev.std()
      n_outliers_z = int((z.abs() > 3).sum())
    check: |
      check_value(n_outliers_z, _sol["n_outliers_z"], name="n_outliers_z")
    hints:
      - z-score คือ (x - mean) / std
  - id: p7
    level: applied
    lang: python
    prompt: |
      สุ่มตัวอย่างยอดขายต่อออเดอร์ (completed) ด้วย rng = np.random.default_rng(42), sample(size=200, replace=False)
      หา mean และ std ของตัวอย่าง เก็บไว้ในตัวแปร sample_mean, sample_std
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      import numpy as np

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      rev = order_items.merge(orders, on='order_id')
      rev = rev[rev['status'] == 'completed'].assign(line=lambda d: d.quantity * d.unit_price)
      order_rev = rev.groupby('order_id')['line'].sum()
      rng = np.random.default_rng(42)
      sample = rng.choice(order_rev.values, size=200, replace=False)
      sample_mean = sample.mean()
      sample_std = sample.std(ddof=1)
    check: |
      check_value(sample_mean, _sol["sample_mean"], name="sample_mean", tol=0.01)
      check_value(sample_std, _sol["sample_std"], name="sample_std", tol=0.01)
    hints:
      - ต้องใช้ seed=42, size=200, replace=False ให้ตรงกัน ผลถึงจะตรวจผ่าน
  - id: p8
    level: applied
    lang: python
    prompt: |
      หาช่วงความเชื่อมั่น 95% (t-distribution, df=199) ของตัวอย่างในข้อ p7 เก็บไว้ในตัวแปร ci_low, ci_high
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      import numpy as np
      from scipy import stats

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      rev = order_items.merge(orders, on='order_id')
      rev = rev[rev['status'] == 'completed'].assign(line=lambda d: d.quantity * d.unit_price)
      order_rev = rev.groupby('order_id')['line'].sum()
      rng = np.random.default_rng(42)
      sample = rng.choice(order_rev.values, size=200, replace=False)
      sample_mean = sample.mean()
      se = sample.std(ddof=1) / np.sqrt(200)
      tcrit = stats.t.ppf(0.975, df=199)
      ci_low = sample_mean - tcrit * se
      ci_high = sample_mean + tcrit * se
    check: |
      check_value(ci_low, _sol["ci_low"], name="ci_low", tol=0.1)
      check_value(ci_high, _sol["ci_high"], name="ci_high", tol=0.1)
    hints:
      - "CI = sample_mean ± t_crit * standard_error"
  - id: p9
    level: applied
    lang: python
    prompt: |
      ทดสอบ one-sample t-test ว่ายอดขายต่อออเดอร์เฉลี่ย (จากตัวอย่างในข้อ p7) ต่างจาก 5000 บาทอย่างมีนัยสำคัญไหม
      เก็บ p-value ไว้ในตัวแปร p_value
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      import numpy as np
      from scipy import stats

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      rev = order_items.merge(orders, on='order_id')
      rev = rev[rev['status'] == 'completed'].assign(line=lambda d: d.quantity * d.unit_price)
      order_rev = rev.groupby('order_id')['line'].sum()
      rng = np.random.default_rng(42)
      sample = rng.choice(order_rev.values, size=200, replace=False)
      t_stat, p_value = stats.ttest_1samp(sample, 5000)
    check: |
      check_value(p_value, _sol["p_value"], name="p_value", tol=0.001)
    hints:
      - "`scipy.stats.ttest_1samp(sample, 5000)`"
  - id: p10
    level: applied
    lang: python
    prompt: |
      คำนวณ z-statistic ของการทดสอบสองสัดส่วน (two-proportion z-test) เปรียบเทียบ purchase rate ของ variant A กับ B
      เก็บไว้ในตัวแปร z_stat
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      import numpy as np

      events = pd.read_csv("data/events.csv")
      exp = events[events['variant'].notna()]
      sess = exp.groupby(['session_id', 'variant'])['event_type'].apply(lambda s: (s == 'purchase').any()).reset_index(name='purchased')
      g = sess.groupby('variant')['purchased'].agg(['sum', 'count'])
      nA, bA = g.loc['A', 'count'], g.loc['A', 'sum']
      nB, bB = g.loc['B', 'count'], g.loc['B', 'sum']
      pA, pB = bA / nA, bB / nB
      p_pool = (bA + bB) / (nA + nB)
      se_pool = np.sqrt(p_pool * (1 - p_pool) * (1 / nA + 1 / nB))
      z_stat = (pB - pA) / se_pool
    check: |
      check_value(z_stat, _sol["z_stat"], name="z_stat", tol=0.005)
    hints:
      - ดูโค้ดเต็มในบทที่ 5 (A/B testing)
  - id: p11
    level: applied
    lang: python
    prompt: |
      จากผลการทดสอบใน p10 การทดลอง A/B นี้มีนัยสำคัญทางสถิติที่ α=0.05 ไหม เก็บไว้ในตัวแปร is_significant
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      import numpy as np
      from scipy import stats

      events = pd.read_csv("data/events.csv")
      exp = events[events['variant'].notna()]
      sess = exp.groupby(['session_id', 'variant'])['event_type'].apply(lambda s: (s == 'purchase').any()).reset_index(name='purchased')
      g = sess.groupby('variant')['purchased'].agg(['sum', 'count'])
      nA, bA = g.loc['A', 'count'], g.loc['A', 'sum']
      nB, bB = g.loc['B', 'count'], g.loc['B', 'sum']
      pA, pB = bA / nA, bB / nB
      p_pool = (bA + bB) / (nA + nB)
      se_pool = np.sqrt(p_pool * (1 - p_pool) * (1 / nA + 1 / nB))
      z_stat = (pB - pA) / se_pool
      p_value = 2 * (1 - stats.norm.cdf(abs(z_stat)))
      is_significant = p_value < 0.05
    check: |
      check_value(is_significant, _sol["is_significant"], name="is_significant")
    hints:
      - แปลง z เป็น p-value ด้วย scipy.stats.norm.cdf แล้วเทียบกับ 0.05
