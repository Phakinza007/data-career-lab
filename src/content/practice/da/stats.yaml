  - id: p16
    level: challenge
    lang: python
    prompt: |
      chi-square statistic ของตาราง contingency สำหรับ A/B purchase (variant × purchased) เก็บไว้ในตัวแปร chi2_stat
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from scipy import stats

      events = pd.read_csv("data/events.csv")
      exp = events[events['variant'].notna()]
      sess = exp.groupby(['session_id', 'variant'])['event_type'].apply(lambda s: (s == 'purchase').any()).reset_index(name='purchased')
      ct = pd.crosstab(sess['variant'], sess['purchased'])
      chi2_stat, p, dof, expected = stats.chi2_contingency(ct)
    check: |
      check_value(chi2_stat, _sol["chi2_stat"], name="chi2_stat", tol=0.01)
    hints:
      - "`scipy.stats.chi2_contingency(ตาราง crosstab)`"
