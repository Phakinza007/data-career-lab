title: "ชุดฝึกท้าย module: สถิติสำหรับ DA"
exercises:
  - id: p1
    level: basic
    lang: python
    prompt: |
      ราคาเฉลี่ยของสินค้าทั้งหมด เก็บไว้ในตัวแปร mean_price
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      products = pd.read_csv("data/products.csv")
      mean_price = products['price'].mean()
    check: |
      check_value(mean_price, _sol["mean_price"], name="mean_price")
    hints:
      - ทบทวนบทที่ 1 (descriptive statistics)
  - id: p2
    level: basic
    lang: python
    prompt: |
      median ของยอดขายต่อออเดอร์ (เฉพาะ completed) เก็บไว้ในตัวแปร median_order_rev
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      rev = order_items.merge(orders, on='order_id')
      rev = rev[rev['status'] == 'completed'].assign(line=lambda d: d.quantity * d.unit_price)
      order_rev = rev.groupby('order_id')['line'].sum()
      median_order_rev = order_rev.median()
    check: |
      check_value(median_order_rev, _sol["median_order_rev"], name="median_order_rev")
    hints:
      - merge order_items กับ orders กรอง completed แล้ว group by order_id
  - id: p3
    level: basic
    lang: python
    prompt: |
      IQR ของราคาสินค้า (products['price']) เก็บไว้ในตัวแปร iqr_price
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      products = pd.read_csv("data/products.csv")
      q1, q3 = products['price'].quantile(0.25), products['price'].quantile(0.75)
      iqr_price = q3 - q1
    check: |
      check_value(iqr_price, _sol["iqr_price"], name="iqr_price")
    hints:
      - IQR คือ Q3 - Q1
  - id: p4
    level: basic
    lang: python
    prompt: |
      จำนวนออเดอร์ (completed) ที่มียอดขายสูงกว่า upper fence ของ IQR เก็บไว้ในตัวแปร n_outliers
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      rev = order_items.merge(orders, on='order_id')
      rev = rev[rev['status'] == 'completed'].assign(line=lambda d: d.quantity * d.unit_price)
      order_rev = rev.groupby('order_id')['line'].sum()
      q1, q3 = order_rev.quantile(0.25), order_rev.quantile(0.75)
      iqr = q3 - q1
      upper = q3 + 1.5 * iqr
      n_outliers = int((order_rev > upper).sum())
    check: |
      check_value(n_outliers, _sol["n_outliers"], name="n_outliers")
    hints:
      - upper fence คือ Q3 + 1.5*IQR
