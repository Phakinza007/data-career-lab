title: "ชุดฝึกท้าย module: Visualization และ storytelling"
exercises:
  - id: p1
    level: basic
    lang: python
    prompt: |
      เตรียมยอดขายรายเดือนปี 2025 (completed) เพื่อเอาไปวาดกราฟเส้น เก็บไว้ในตัวแปร result
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      o25 = orders[(orders['status'] == 'completed') & (orders['order_date'].str.startswith('2025'))]
      r25 = order_items.merge(o25, on='order_id').assign(line=lambda d: d.quantity * d.unit_price)
      result = r25.assign(month=lambda d: d.order_date.str[:7]).groupby('month')['line'].sum()
    check: |
      check_series(result, _sol["result"])
    hints:
      - กรองปี 2025 และ completed ก่อน group by เดือน
  - id: p2
    level: basic
    lang: python
    prompt: |
      เตรียมรายได้แยกตามหมวดสินค้า เรียงมากไปน้อย เพื่อเอาไปวาดกราฟแท่ง เก็บไว้ในตัวแปร result
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      products = pd.read_csv("data/products.csv")
      rev = order_items.merge(orders, on='order_id')
      rev = rev[rev['status'] == 'completed'].assign(line=lambda d: d.quantity * d.unit_price)
      rev_cat = rev.merge(products[['product_id', 'category']], on='product_id')
      result = rev_cat.groupby('category')['line'].sum().sort_values(ascending=False)
    check: |
      check_series(result, _sol["result"], ordered=True)
    hints:
      - merge order_items กับ products เพื่อได้ category แล้ว sort_values
