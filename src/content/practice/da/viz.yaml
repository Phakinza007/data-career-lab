  - id: p8
    level: applied
    lang: python
    prompt: |
      หารายได้เดือน พ.ย. 2025 และ ต.ค. 2025 พร้อมคำนวณ % เปลี่ยนแปลง (MoM) เก็บไว้ในตัวแปร nov_revenue, oct_revenue, mom_pct
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      o25 = orders[(orders['status'] == 'completed') & (orders['order_date'].str.startswith('2025'))]
      r25 = order_items.merge(o25, on='order_id').assign(line=lambda d: d.quantity * d.unit_price)
      monthly = r25.assign(month=lambda d: d.order_date.str[:7]).groupby('month')['line'].sum()
      nov_revenue = monthly['2025-11']
      oct_revenue = monthly['2025-10']
      mom_pct = (nov_revenue - oct_revenue) / oct_revenue * 100
    check: |
      check_value(nov_revenue, _sol["nov_revenue"], name="nov_revenue")
      check_value(oct_revenue, _sol["oct_revenue"], name="oct_revenue")
      check_value(mom_pct, _sol["mom_pct"], name="mom_pct", tol=0.05)
    hints:
      - "MoM% = (เดือนนี้ - เดือนก่อน) / เดือนก่อน * 100"
  - id: p9
    level: applied
    lang: python
    prompt: |
      จำนวนลูกค้าที่เคยซื้อของ (paying customers) และจำนวนลูกค้า 20% อันดับต้นตามรายได้ เก็บไว้ในตัวแปร n_paying_customers, top20_n
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      rev = order_items.merge(orders, on='order_id')
      rev = rev[rev['status'] == 'completed'].assign(line=lambda d: d.quantity * d.unit_price)
      cust_rev = rev.groupby('customer_id')['line'].sum().sort_values(ascending=False)
      n_paying_customers = len(cust_rev)
      top20_n = int(n_paying_customers * 0.2)
    check: |
      check_value(n_paying_customers, _sol["n_paying_customers"], name="n_paying_customers")
      check_value(top20_n, _sol["top20_n"], name="top20_n")
    hints:
      - "top20_n = int(จำนวนลูกค้าทั้งหมด * 0.2)"
  - id: p10
    level: applied
    lang: python
    prompt: |
      % ของรายได้รวมที่ลูกค้า 20% อันดับต้นสร้างขึ้น เก็บไว้ในตัวแปร top20_share_pct
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      orders = pd.read_csv("data/orders.csv")
      order_items = pd.read_csv("data/order_items.csv")
      rev = order_items.merge(orders, on='order_id')
      rev = rev[rev['status'] == 'completed'].assign(line=lambda d: d.quantity * d.unit_price)
      cust_rev = rev.groupby('customer_id')['line'].sum().sort_values(ascending=False)
      top20_n = int(len(cust_rev) * 0.2)
