  - id: "p10"
    level: "applied"
    lang: "python"
    prompt: |
      จำนวนลูกค้าในชุดทดสอบที่โมเดลทำนายว่าจะซื้อซ้ำเมื่อใช้เกณฑ์ 0.7 เก็บไว้ในตัวแปร n_pos_07
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.linear_model import LogisticRegression

      model = LogisticRegression(max_iter=2000).fit(X_train, y_train)
      proba = model.predict_proba(X_test)[:, 1]
      n_pos_07 = int((proba >= 0.7).sum())
    check: |
      check_value(n_pos_07, _sol["n_pos_07"], name="n_pos_07")
    hints:
      - "ทบทวนบทที่ 3 (threshold)"
  - id: "p11"
    level: "applied"
    lang: "python"
    prompt: |
      coefficient ของ channel_promo และ odds ratio (exp ของ coefficient) ปัด 3 ตำแหน่ง เก็บไว้ในตัวแปร coef_promo, odds_ratio_promo
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.linear_model import LogisticRegression

      model = LogisticRegression(max_iter=2000).fit(X_train, y_train)
      import numpy as np

      coef_promo = model.coef_[0][list(X.columns).index('channel_promo')]
      odds_ratio_promo = round(float(np.exp(coef_promo)), 3)
      coef_promo = round(float(coef_promo), 3)
    check: |
      check_value(coef_promo, _sol["coef_promo"], name="coef_promo", tol=0.01)
      check_value(odds_ratio_promo, _sol["odds_ratio_promo"], name="odds_ratio_promo", tol=0.005)
    hints:
      - "ทบทวนบทที่ 3"
  - id: "p12"
    level: "challenge"
    lang: "python"
    prompt: |
      เพิ่ม feature "จำนวนออเดอร์ทั้งหมดของลูกค้า" (นับจาก data/orders.csv) แล้วเทรนใหม่บน split แบบเดิม: accuracy บนชุดทดสอบ เก็บไว้ในตัวแปร leaky_acc
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      from sklearn.model_selection import train_test_split
      from sklearn.linear_model import LogisticRegression

      orders = pd.read_csv("data/orders.csv")
      n_orders = orders.groupby('customer_id').size().rename('n_orders')
      df2 = df.merge(n_orders, on='customer_id')
      X2 = pd.get_dummies(df2.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y2 = df2['repeated']
      X2_train, X2_test, y2_train, y2_test = train_test_split(X2, y2, test_size=0.25, random_state=42, stratify=y2)
      leaky_model = LogisticRegression(max_iter=5000).fit(X2_train, y2_train)
      leaky_acc = leaky_model.score(X2_test, y2_test)
    check: |
      check_value(leaky_acc, _sol["leaky_acc"], name="leaky_acc", tol=0.001)
    hints:
      - "ทบทวนบทที่ 1 (leakage)"
  - id: "p13"
    level: "challenge"
    lang: "python"
    prompt: |
      โจทย์ทำนายออเดอร์แรกที่ถูกยกเลิก: accuracy ของการทาย "ไม่ยกเลิก" ทุกแถว และ recall ของ LogisticRegression ปกติบนชุดทดสอบ (ปัด always0_acc 4 ตำแหน่ง) เก็บไว้ในตัวแปร always0_acc, cancel_recall
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import recall_score, precision_score, accuracy_score

      df = pd.read_csv("data/ml_customers.csv")
      y = (df['first_status'] == 'cancelled').astype(int)
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value', 'first_status']), drop_first=True)
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      always0_acc = round(accuracy_score(y_test, [0] * len(y_test)), 4)
      model = LogisticRegression(max_iter=2000).fit(X_train, y_train)
      cancel_recall = recall_score(y_test, model.predict(X_test))
    check: |
      check_value(always0_acc, _sol["always0_acc"], name="always0_acc", tol=0.0001)
      check_value(cancel_recall, _sol["cancel_recall"], name="cancel_recall", tol=0.0001)
    hints:
      - "ทบทวนบทที่ 4 (accuracy paradox)"
  - id: "p14"
    level: "challenge"
    lang: "python"
    prompt: |
      โจทย์เดียวกับ p13 แต่ใช้ class_weight="balanced": recall ของคลาสยกเลิกบนชุดทดสอบ ปัด 4 ตำแหน่ง เก็บไว้ในตัวแปร recall_bal
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import recall_score, precision_score, accuracy_score

      df = pd.read_csv("data/ml_customers.csv")
      y = (df['first_status'] == 'cancelled').astype(int)
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value', 'first_status']), drop_first=True)
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      model = LogisticRegression(max_iter=2000, class_weight='balanced').fit(X_train, y_train)
      recall_bal = round(recall_score(y_test, model.predict(X_test)), 4)
    check: |
      check_value(recall_bal, _sol["recall_bal"], name="recall_bal", tol=0.001)
    hints:
      - "ทบทวนบทที่ 4"
  - id: "p15"
    level: "challenge"
    lang: "python"
    prompt: |
      DecisionTreeClassifier(random_state=42) ไม่จำกัดความลึกบน split มาตรฐานของโจทย์ซื้อซ้ำ: train accuracy และช่องว่าง (train − test) ปัด 4 ตำแหน่ง เก็บไว้ในตัวแปร full_train_acc, gap_full
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.tree import DecisionTreeClassifier
      tree = DecisionTreeClassifier(random_state=42).fit(X_train, y_train)
      full_train_acc = round(tree.score(X_train, y_train), 4)
      gap_full = round(tree.score(X_train, y_train) - tree.score(X_test, y_test), 4)
    check: |
      check_value(full_train_acc, _sol["full_train_acc"], name="full_train_acc", tol=0.001)
      check_value(gap_full, _sol["gap_full"], name="gap_full", tol=0.001)
    hints:
      - "ทบทวนบทที่ 5"
  - id: "p16"
    level: "challenge"
    lang: "python"
    prompt: |
      5-fold CV (KFold shuffle, random_state=42, X และ y ทั้งชุด) ค่าเฉลี่ย accuracy ของ DecisionTreeClassifier(max_depth=3, random_state=42) และของ LogisticRegression(max_iter=2000) ปัด 4 ตำแหน่ง เก็บไว้ในตัวแปร depth3_cv_mean, logreg_cv_mean
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      from sklearn.model_selection import KFold, cross_val_score
      from sklearn.tree import DecisionTreeClassifier
      from sklearn.linear_model import LogisticRegression

      kf = KFold(n_splits=5, shuffle=True, random_state=42)
      depth3_cv_mean = round(cross_val_score(DecisionTreeClassifier(max_depth=3, random_state=42), X, y, cv=kf).mean(), 4)
      logreg_cv_mean = round(cross_val_score(LogisticRegression(max_iter=2000), X, y, cv=kf).mean(), 4)
    check: |
      check_value(depth3_cv_mean, _sol["depth3_cv_mean"], name="depth3_cv_mean", tol=0.001)
      check_value(logreg_cv_mean, _sol["logreg_cv_mean"], name="logreg_cv_mean", tol=0.001)
    hints:
      - "ทบทวนบทที่ 5"
