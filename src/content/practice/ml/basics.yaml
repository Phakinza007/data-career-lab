title: "ชุดฝึกท้าย module: พื้นฐาน ML และ scikit-learn"
exercises:
  - id: "p1"
    level: "basic"
    lang: "python"
    prompt: |
      ตาราง ml_customers.csv มีกี่แถวและกี่คอลัมน์ เก็บไว้ในตัวแปร n_rows, n_cols
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      n_rows = len(df)
      n_cols = df.shape[1]
    check: |
      check_value(n_rows, _sol["n_rows"], name="n_rows")
      check_value(n_cols, _sol["n_cols"], name="n_cols")
    hints:
      - "ทบทวนบทที่ 1 (workflow)"
  - id: "p2"
    level: "basic"
    lang: "python"
    prompt: |
      สัดส่วนลูกค้าที่ซื้อซ้ำ (repeated = 1) ปัด 4 ตำแหน่ง เก็บไว้ในตัวแปร repeat_rate
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      repeat_rate = round(df['repeated'].mean(), 4)
    check: |
      check_value(repeat_rate, _sol["repeat_rate"], name="repeat_rate", tol=0.0001)
    hints:
      - "ค่าเฉลี่ยของคอลัมน์ 0/1"
  - id: "p3"
    level: "basic"
    lang: "python"
    prompt: |
      แบ่ง train/test (test_size=0.25, random_state=42, stratify=y) แล้วเก็บจำนวนแถว train และ test ไว้ในตัวแปร n_train, n_test
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      from sklearn.model_selection import train_test_split
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      n_train = len(X_train)
      n_test = len(X_test)
    check: |
      check_value(n_train, _sol["n_train"], name="n_train")
      check_value(n_test, _sol["n_test"], name="n_test")
    hints:
      - "ใช้ get_dummies(drop_first=True) สร้าง X ก่อน (ตัด customer_id, repeated, first_order_value)"
  - id: "p4"
    level: "basic"
    lang: "python"
    prompt: |
      accuracy ของ majority baseline บนชุดทดสอบ ปัด 4 ตำแหน่ง เก็บไว้ในตัวแปร baseline_acc
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      baseline_acc = round(max(y_test.mean(), 1 - y_test.mean()), 4)
    check: |
      check_value(baseline_acc, _sol["baseline_acc"], name="baseline_acc", tol=0.0001)
    hints:
      - "ทบทวนบทที่ 1"
  - id: "p5"
    level: "basic"
    lang: "python"
    prompt: |
      accuracy ของ LogisticRegression(max_iter=2000) บนชุดทดสอบ ปัด 4 ตำแหน่ง เก็บไว้ในตัวแปร test_acc
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.linear_model import LogisticRegression

      model = LogisticRegression(max_iter=2000).fit(X_train, y_train)
      test_acc = round(model.score(X_test, y_test), 4)
    check: |
      check_value(test_acc, _sol["test_acc"], name="test_acc", tol=0.001)
    hints:
      - "ทบทวนบทที่ 1 และ 3"
  - id: "p6"
    level: "applied"
    lang: "python"
    prompt: |
      โจทย์ regression (target = first_order_value, split 75/25 random_state=42 ไม่ stratify): MAE ของ baseline ที่ทายค่าเฉลี่ย y_train ปัด 2 ตำแหน่ง เก็บไว้ในตัวแปร baseline_mae
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split
      from sklearn.linear_model import LinearRegression
      from sklearn.metrics import mean_absolute_error, mean_squared_error, r2_score

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['first_order_value']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42)
      import numpy as np

      baseline_mae = round(mean_absolute_error(y_test, np.full(len(y_test), y_train.mean())), 2)
    check: |
      check_value(baseline_mae, _sol["baseline_mae"], name="baseline_mae", tol=0.01)
    hints:
      - "ทบทวนบทที่ 2"
  - id: "p7"
    level: "applied"
    lang: "python"
    prompt: |
      LinearRegression จากโจทย์ในข้อ p6: MAE และ R² บนชุดทดสอบ (MAE ปัด 2 ตำแหน่ง, R² ปัด 4 ตำแหน่ง) เก็บไว้ในตัวแปร model_mae, r2
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split
      from sklearn.linear_model import LinearRegression
      from sklearn.metrics import mean_absolute_error, mean_squared_error, r2_score

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['first_order_value']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42)
      model = LinearRegression().fit(X_train, y_train)
      pred = model.predict(X_test)
      model_mae = round(mean_absolute_error(y_test, pred), 2)
      r2 = round(r2_score(y_test, pred), 4)
    check: |
      check_value(model_mae, _sol["model_mae"], name="model_mae", tol=0.01)
      check_value(r2, _sol["r2"], name="r2", tol=0.001)
    hints:
      - "ทบทวนบทที่ 2"
  - id: "p8"
    level: "applied"
    lang: "python"
    prompt: |
      โมเดลทำนายซื้อซ้ำ (LogisticRegression บน split มาตรฐาน): precision และ recall บนชุดทดสอบ ปัด 4 ตำแหน่ง เก็บไว้ในตัวแปร precision, recall
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.linear_model import LogisticRegression

      model = LogisticRegression(max_iter=2000).fit(X_train, y_train)
      from sklearn.metrics import confusion_matrix, precision_score, recall_score, f1_score, roc_auc_score

      pred = model.predict(X_test)
      proba = model.predict_proba(X_test)[:, 1]
      precision = round(precision_score(y_test, pred), 4)
      recall = round(recall_score(y_test, pred), 4)
    check: |
      check_value(precision, _sol["precision"], name="precision", tol=0.001)
      check_value(recall, _sol["recall"], name="recall", tol=0.001)
    hints:
      - "ทบทวนบทที่ 4"
  - id: "p9"
    level: "applied"
    lang: "python"
    prompt: |
      ROC-AUC ของโมเดลเดียวกัน (ใช้ความน่าจะเป็น) ปัด 4 ตำแหน่ง เก็บไว้ในตัวแปร auc
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
