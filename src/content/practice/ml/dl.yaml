    lang: "python"
    prompt: |
      CV 5-fold (StratifiedKFold shuffle=True, random_state=42) บน X, y ทั้งชุด วัด ROC-AUC เฉลี่ยของ pipeline StandardScaler + MLPClassifier((8,), early_stopping=True, max_iter=200, random_state=42) และ StandardScaler + LogisticRegression(max_iter=2000) ปัด 4 ตำแหน่ง เก็บไว้ในตัวแปร mlp_cv_auc, logreg_cv_auc
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      import numpy as np
      from sklearn.preprocessing import StandardScaler
      from sklearn.neural_network import MLPClassifier
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import roc_auc_score
      from sklearn.model_selection import StratifiedKFold, cross_val_score
      from sklearn.pipeline import make_pipeline

      scaler = StandardScaler().fit(X_train)
      Z_train = scaler.transform(X_train)
      Z_test = scaler.transform(X_test)
      skf = StratifiedKFold(5, shuffle=True, random_state=42)
      mlp_pipe = make_pipeline(StandardScaler(), MLPClassifier(hidden_layer_sizes=(8,), early_stopping=True, max_iter=200, random_state=42))
      lr_pipe = make_pipeline(StandardScaler(), LogisticRegression(max_iter=2000))
      mlp_cv_auc = round(cross_val_score(mlp_pipe, X, y, cv=skf, scoring='roc_auc').mean(), 4)
      logreg_cv_auc = round(cross_val_score(lr_pipe, X, y, cv=skf, scoring='roc_auc').mean(), 4)
    check: |
      check_value(mlp_cv_auc, _sol["mlp_cv_auc"], name="mlp_cv_auc", tol=0.001)
      check_value(logreg_cv_auc, _sol["logreg_cv_auc"], name="logreg_cv_auc", tol=0.001)
    hints:
      - "make_pipeline + cross_val_score(scoring=\"roc_auc\")"
  - id: "p16"
    level: "challenge"
    lang: "python"
    prompt: |
      ด้วยข้อมูล x, y ที่ให้ไว้ ทำ gradient descent 100 ก้าวจาก w = b = 0 ที่ lr = 0.2: เก็บ MSE สุดท้าย (float) ไว้ใน loss_02 และ True/False ว่า MSE < 1e-6 ไว้ใน converged
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import numpy as np

      x = np.array([0.0, 1.0, 2.0, 3.0, 4.0])
      y = 2 * x + 1
      w, b = 0.0, 0.0
      for _ in range(100):
          pred = w * x + b
          w -= 0.2 * 2 * np.mean((pred - y) * x)
          b -= 0.2 * 2 * np.mean(pred - y)
      loss_02 = float(np.mean((w * x + b - y) ** 2))
      converged = bool(loss_02 < 1e-6)
    check: |
      check_value(loss_02, _sol["loss_02"], name="loss_02", tol=1e-06)
      check_value(converged, _sol["converged"], name="converged")
    hints:
      - "ก้าวใหญ่ขึ้น (0.2) ยังลงตัวหรือไม่"
