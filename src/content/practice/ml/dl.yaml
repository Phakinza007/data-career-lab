  - id: "p14"
    level: "challenge"
    lang: "python"
    prompt: |
      ผลของขนาดข้อมูลเทรน: fit MLP (8,) ที่เปิด early_stopping=True (max_iter=200, random_state=42) บน 500 แถวแรกของ Z_train, 1,000 แถวแรก และทั้งหมด แล้ววัด accuracy บน Z_test (ปัด 4 ตำแหน่ง) เก็บไว้ในตัวแปร acc_500, acc_1000, acc_all
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      import numpy as np
      from sklearn.preprocessing import StandardScaler
      from sklearn.neural_network import MLPClassifier
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import roc_auc_score
      from sklearn.model_selection import StratifiedKFold, cross_val_score
      from sklearn.pipeline import make_pipeline

      scaler = StandardScaler().fit(X_train)
      Z_train = scaler.transform(X_train)
      Z_test = scaler.transform(X_test)
      def acc(n):
          mlp = MLPClassifier(hidden_layer_sizes=(8,), early_stopping=True, max_iter=200, random_state=42).fit(Z_train[:n], y_train.iloc[:n])
          return round(mlp.score(Z_test, y_test), 4)


      acc_500 = acc(500)
      acc_1000 = acc(1000)
      acc_all = acc(len(Z_train))
    check: |
      check_value(acc_500, _sol["acc_500"], name="acc_500", tol=0.001)
      check_value(acc_1000, _sol["acc_1000"], name="acc_1000", tol=0.001)
      check_value(acc_all, _sol["acc_all"], name="acc_all", tol=0.001)
