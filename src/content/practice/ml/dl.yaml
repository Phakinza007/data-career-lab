title: "ชุดฝึกท้าย module: Deep learning เบื้องต้น"
exercises:
  - id: "p1"
    level: "basic"
    lang: "python"
    prompt: |
      neuron หนึ่งตัวมีน้ำหนัก w = [0.4, −0.6], bias b = 0.2 และรับ x = [2.0, 1.0]: คำนวณ z, ผลผ่าน ReLU และผลผ่าน sigmoid (ปัด 4 ตำแหน่ง) เก็บไว้ในตัวแปร z, relu_out, sigmoid_out
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import numpy as np
      w = np.array([0.4, -0.6])
      x = np.array([2.0, 1.0])
      b = 0.2
      z = round(float(w @ x + b), 4)
      relu_out = round(float(max(0.0, w @ x + b)), 4)
      sigmoid_out = round(float(1 / (1 + np.exp(-(w @ x + b)))), 4)
    check: |
      check_value(z, _sol["z"], name="z", tol=0.001)
      check_value(relu_out, _sol["relu_out"], name="relu_out", tol=0.001)
      check_value(sigmoid_out, _sol["sigmoid_out"], name="sigmoid_out", tol=0.001)
    hints:
      - "z = w @ x + b"
  - id: "p2"
    level: "basic"
    lang: "python"
    prompt: |
      จำนวนพารามิเตอร์ (น้ำหนัก + bias) ของ MLP ที่มี input 21 → hidden 32 → output 1 (n_params_32) และ 21 → 16 → 8 → 1 (n_params_16_8) เก็บไว้ในตัวแปรตามชื่อ
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import numpy as np
      n_params_32 = (21 * 32 + 32) + (32 * 1 + 1)
      n_params_16_8 = (21 * 16 + 16) + (16 * 8 + 8) + (8 * 1 + 1)
    check: |
      check_value(n_params_32, _sol["n_params_32"], name="n_params_32")
      check_value(n_params_16_8, _sol["n_params_16_8"], name="n_params_16_8")
    hints:
      - "แต่ละ layer มี n_in × n_out + n_out"
  - id: "p3"
    level: "basic"
    lang: "python"
    prompt: |
      MLPClassifier(hidden_layer_sizes=(8,), max_iter=200, random_state=42) บน Z_train: accuracy บนชุดทดสอบ ปัด 4 ตำแหน่ง เก็บไว้ในตัวแปร test_acc
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      import numpy as np
      from sklearn.preprocessing import StandardScaler
      from sklearn.neural_network import MLPClassifier
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import roc_auc_score
      from sklearn.model_selection import StratifiedKFold, cross_val_score
      from sklearn.pipeline import make_pipeline

      scaler = StandardScaler().fit(X_train)
      Z_train = scaler.transform(X_train)
      Z_test = scaler.transform(X_test)
      mlp = MLPClassifier(hidden_layer_sizes=(8,), max_iter=200, random_state=42).fit(Z_train, y_train)
      test_acc = round(mlp.score(Z_test, y_test), 4)
    check: |
      check_value(test_acc, _sol["test_acc"], name="test_acc", tol=0.001)
    hints:
      - "fit บน Z_train แล้ว .score(Z_test, y_test)"
  - id: "p4"
    level: "basic"
    lang: "python"
    prompt: |
      โมเดล ŷ = w·x + b ที่ w = 1, b = 0 บนข้อมูลตัวอย่าง (x, y ที่ให้ไว้): MSE loss เก็บไว้ในตัวแปร mse
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import numpy as np

      x = np.array([0.0, 1.0, 2.0, 3.0, 4.0])
      y = 2 * x + 1
      w, b = 1.0, 0.0
      mse = float(np.mean((w * x + b - y) ** 2))
    check: |
      check_value(mse, _sol["mse"], name="mse", tol=0.001)
    hints:
      - "np.mean((pred - y) ** 2)"
  - id: "p5"
    level: "basic"
    lang: "python"
    prompt: |
      gradient ของ MSE ที่ w = 1, b = 0 (ข้อมูลเดิม): grad_w = 2·mean((ŷ − y)·x), grad_b = 2·mean(ŷ − y) เก็บไว้ในตัวแปร grad_w, grad_b
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import numpy as np

      x = np.array([0.0, 1.0, 2.0, 3.0, 4.0])
      y = 2 * x + 1
      w, b = 1.0, 0.0
      pred = w * x + b
      grad_w = float(2 * np.mean((pred - y) * x))
      grad_b = float(2 * np.mean(pred - y))
    check: |
      check_value(grad_w, _sol["grad_w"], name="grad_w", tol=0.001)
      check_value(grad_b, _sol["grad_b"], name="grad_b", tol=0.001)
    hints:
      - "ใช้สูตรเดียวกับในบทเรียน"
  - id: "p6"
    level: "applied"
    lang: "python"
    prompt: |
      เริ่มที่ w = b = 0 ทำ gradient descent 10 ก้าวด้วย lr = 0.05 (ข้อมูล x, y ที่ให้ไว้) เก็บ w และ b ที่ได้ (ปัด 4 ตำแหน่ง) ไว้ในตัวแปร w10, b10
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import numpy as np

      x = np.array([0.0, 1.0, 2.0, 3.0, 4.0])
      y = 2 * x + 1
      w, b = 0.0, 0.0
      for _ in range(10):
          pred = w * x + b
          grad_w = 2 * np.mean((pred - y) * x)
          grad_b = 2 * np.mean(pred - y)
          w -= 0.05 * grad_w
          b -= 0.05 * grad_b
      w10 = round(float(w), 4)
      b10 = round(float(b), 4)
    check: |
      check_value(w10, _sol["w10"], name="w10", tol=0.001)
      check_value(b10, _sol["b10"], name="b10", tol=0.001)
    hints:
      - "วนลูป 10 ครั้ง อัปเดตแบบ w -= lr * grad"
  - id: "p7"
    level: "applied"
    lang: "python"
    prompt: |
      ด้วย lr = 0.1 เริ่ม w = b = 0 ต้องใช้กี่ก้าวจึงทำให้ MSE ต่ำกว่า 0.001 เป็นครั้งแรก (นับก้าวที่หนึ่งเป็น 1) เก็บไว้ในตัวแปร steps_needed
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import numpy as np

      x = np.array([0.0, 1.0, 2.0, 3.0, 4.0])
      y = 2 * x + 1
      w, b = 0.0, 0.0
      steps_needed = None
      for step in range(1, 1001):
          pred = w * x + b
          w -= 0.1 * 2 * np.mean((pred - y) * x)
          b -= 0.1 * 2 * np.mean(pred - y)
          if np.mean((w * x + b - y) ** 2) < 0.001:
              steps_needed = step
              break
    check: |
      check_value(steps_needed, _sol["steps_needed"], name="steps_needed")
    hints:
      - "อัปเดตแล้วค่อยตรวจ MSE ในแต่ละก้าว"
