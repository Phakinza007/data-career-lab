  - id: "p11"
    level: "applied"
    lang: "python"
    prompt: |
      fit MLP (8,) (max_iter=200, random_state=42) แล้ว forward pass ด้วยมือสำหรับแถวแรกของชุดทดสอบ (ReLU ที่ hidden, sigmoid ที่ output): เก็บความน่าจะเป็นที่คำนวณเอง (ปัด 4 ตำแหน่ง) ไว้ใน manual_proba และคลาสที่ทำนาย (1 ถ้า proba ≥ 0.5 ไม่งั้น 0, เป็น int) ไว้ใน manual_class
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      import numpy as np
      from sklearn.preprocessing import StandardScaler
      from sklearn.neural_network import MLPClassifier
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import roc_auc_score
      from sklearn.model_selection import StratifiedKFold, cross_val_score
      from sklearn.pipeline import make_pipeline

      scaler = StandardScaler().fit(X_train)
      Z_train = scaler.transform(X_train)
      Z_test = scaler.transform(X_test)
      mlp = MLPClassifier(hidden_layer_sizes=(8,), max_iter=200, random_state=42).fit(Z_train, y_train)
      hidden = np.maximum(Z_test[0] @ mlp.coefs_[0] + mlp.intercepts_[0], 0)
      out = hidden @ mlp.coefs_[1] + mlp.intercepts_[1]
      prob = float(1 / (1 + np.exp(-out[0])))
      manual_proba = round(prob, 4)
      manual_class = int(prob >= 0.5)
    check: |
      check_value(manual_proba, _sol["manual_proba"], name="manual_proba", tol=0.001)
      check_value(manual_class, _sol["manual_class"], name="manual_class")
    hints:
      - "coefs_[0], intercepts_[0], coefs_[1], intercepts_[1]"
  - id: "p12"
    level: "challenge"
    lang: "python"
    prompt: |
      เทรน MLP (16,) (early_stopping=True, max_iter=200) ด้วย random_state = 0..4 แล้ววัด ROC-AUC บนชุดทดสอบของแต่ละ seed: ค่าเฉลี่ยและ std (np.std) ปัด 4 ตำแหน่ง เก็บไว้ในตัวแปร auc_mean, auc_std
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      import numpy as np
      from sklearn.preprocessing import StandardScaler
      from sklearn.neural_network import MLPClassifier
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import roc_auc_score
      from sklearn.model_selection import StratifiedKFold, cross_val_score
      from sklearn.pipeline import make_pipeline

      scaler = StandardScaler().fit(X_train)
      Z_train = scaler.transform(X_train)
      Z_test = scaler.transform(X_test)
      aucs = []
      for s in range(5):
          mlp = MLPClassifier(hidden_layer_sizes=(16,), early_stopping=True, max_iter=200, random_state=s).fit(Z_train, y_train)
          aucs.append(roc_auc_score(y_test, mlp.predict_proba(Z_test)[:, 1]))
      auc_mean = round(float(np.mean(aucs)), 4)
      auc_std = round(float(np.std(aucs)), 4)
    check: |
      check_value(auc_mean, _sol["auc_mean"], name="auc_mean", tol=0.001)
      check_value(auc_std, _sol["auc_std"], name="auc_std", tol=0.001)
    hints:
      - "วนสร้างโมเดลต่อ seed แล้วเก็บ AUC"
