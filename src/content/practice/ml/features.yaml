  - id: "p12"
    level: "challenge"
    lang: "python"
    prompt: |
      อัตราซื้อซ้ำของลูกค้าที่ fast_first (days_to_first_order <= 3) เป็น 1 และ 0 ปัด 4 ตำแหน่ง เก็บไว้ในตัวแปร repeat_fast, repeat_slow
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      import numpy as np
      df['fast_first'] = (df['days_to_first_order'] <= 3).astype(int)
      rates = df.groupby('fast_first')['repeated'].mean()
      repeat_fast = round(rates[1], 4)
      repeat_slow = round(rates[0], 4)
    check: |
