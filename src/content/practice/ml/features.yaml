  - id: "p4"
    level: "basic"
    lang: "python"
    prompt: |
      fit OneHotEncoder(handle_unknown="ignore") บนลูกค้าที่ไม่ใช่ Hat Yai แล้ว transform ลูกค้า Hat Yai: เก็บผลรวมของค่าทั้งหมดหลัง transform ไว้ในตัวแปร unseen_sum
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      from sklearn.preprocessing import OneHotEncoder

      train = df[df['city'] != 'Hat Yai']
      hatyai = df[df['city'] == 'Hat Yai']
      encoder = OneHotEncoder(handle_unknown='ignore').fit(train[['city']])
      unseen_sum = float(encoder.transform(hatyai[['city']]).toarray().sum())
    check: |
      check_value(unseen_sum, _sol["unseen_sum"], name="unseen_sum", tol=0.001)
    hints:
      - "ทบทวนบทที่ 1"
  - id: "p5"
    level: "basic"
    lang: "python"
    prompt: |
      mean และ std (scale_) ของ days_to_first_order ที่ StandardScaler เรียนรู้จากชุด train ปัด 3 ตำแหน่ง เก็บไว้ในตัวแปร train_mean, train_scale
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
      cat = ['city', 'channel', 'first_payment_method', 'first_status']
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.preprocessing import StandardScaler

      scaler = StandardScaler().fit(X_train[num])
      train_mean = round(scaler.mean_[1], 3)
      train_scale = round(scaler.scale_[1], 3)
    check: |
      check_value(train_mean, _sol["train_mean"], name="train_mean", tol=0.001)
      check_value(train_scale, _sol["train_scale"], name="train_scale", tol=0.001)
    hints:
      - "ทบทวนบทที่ 2 (scaling)"
  - id: "p6"
    level: "applied"
    lang: "python"
    prompt: |
      หลังจำลอง NaN (customer_id หาร 10 ลงตัว → days_to_first_order เป็น NaN) มีกี่แถวที่หาย และมัธยฐานที่ SimpleImputer เรียนรู้จาก train คือเท่าไร เก็บไว้ในตัวแปร n_missing, train_median
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import numpy as np
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
      cat = ['city', 'channel', 'first_payment_method', 'first_status']
      df.loc[df['customer_id'] % 10 == 0, 'days_to_first_order'] = np.nan
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.impute import SimpleImputer
      n_missing = int(df['days_to_first_order'].isna().sum())
      imputer = SimpleImputer(strategy='median').fit(X_train[['days_to_first_order']])
      train_median = imputer.statistics_[0]
    check: |
      check_value(n_missing, _sol["n_missing"], name="n_missing")
      check_value(train_median, _sol["train_median"], name="train_median", tol=0.001)
    hints:
      - "ทบทวนบทที่ 2 (missing values)"
  - id: "p7"
    level: "applied"
    lang: "python"
    prompt: |
      KNN (n_neighbors=15) บน feature ตัวเลข 6 ตัว: accuracy บนชุดทดสอบเมื่อไม่ scale และเมื่อ scale (ปัด 4 ตำแหน่ง) เก็บไว้ในตัวแปร knn_acc_unscaled, knn_acc_scaled
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
      cat = ['city', 'channel', 'first_payment_method', 'first_status']
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.neighbors import KNeighborsClassifier
      from sklearn.preprocessing import StandardScaler
      knn = KNeighborsClassifier(n_neighbors=15).fit(X_train[num], y_train)
      knn_acc_unscaled = round(knn.score(X_test[num], y_test), 4)
      scaler = StandardScaler().fit(X_train[num])
      knn_s = KNeighborsClassifier(n_neighbors=15).fit(scaler.transform(X_train[num]), y_train)
      knn_acc_scaled = round(knn_s.score(scaler.transform(X_test[num]), y_test), 4)
    check: |
      check_value(knn_acc_unscaled, _sol["knn_acc_unscaled"], name="knn_acc_unscaled", tol=0.001)
      check_value(knn_acc_scaled, _sol["knn_acc_scaled"], name="knn_acc_scaled", tol=0.001)
    hints:
      - "ทบทวนบทที่ 2"
  - id: "p8"
    level: "applied"
    lang: "python"
    prompt: |
      fit pipeline (StandardScaler + OneHotEncoder + LogisticRegression) บน train: จำนวน feature หลังแปลง และ ROC-AUC บนชุดทดสอบ (ปัด 4 ตำแหน่ง) เก็บไว้ในตัวแปร n_features_out, test_auc
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
      cat = ['city', 'channel', 'first_payment_method', 'first_status']
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.compose import ColumnTransformer
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import OneHotEncoder, StandardScaler
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import roc_auc_score

      pre = ColumnTransformer([('num', StandardScaler(), num), ('cat', OneHotEncoder(handle_unknown='ignore'), cat)])
      pipe = Pipeline([('pre', pre), ('model', LogisticRegression(max_iter=2000))])
      pipe.fit(X_train, y_train)
      n_features_out = len(pipe.named_steps['pre'].get_feature_names_out())
      test_auc = round(roc_auc_score(y_test, pipe.predict_proba(X_test)[:, 1]), 4)
    check: |
      check_value(n_features_out, _sol["n_features_out"], name="n_features_out")
      check_value(test_auc, _sol["test_auc"], name="test_auc", tol=0.001)
    hints:
      - "ทบทวนบทที่ 3 (pipeline)"
  - id: "p9"
