  - id: "p10"
    level: "applied"
    lang: "python"
    prompt: |
      fit pipeline บน train แล้วทำนายความน่าจะเป็นที่จะซื้อซ้ำของลูกค้าใหม่ที่มาจากช่องทาง promo และ organic (ฟังก์ชัน new_customer ที่ให้ไว้ ปัด 4 ตำแหน่ง) เก็บไว้ในตัวแปร proba_promo, proba_organic
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
      cat = ['city', 'channel', 'first_payment_method', 'first_status']
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.compose import ColumnTransformer
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import OneHotEncoder, StandardScaler
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import roc_auc_score

      pre = ColumnTransformer([('num', StandardScaler(), num), ('cat', OneHotEncoder(handle_unknown='ignore'), cat)])
      pipe = Pipeline([('pre', pre), ('model', LogisticRegression(max_iter=2000))])
      import pandas as pd

      def new_customer(channel, city='Bangkok'):
          return pd.DataFrame([{'signup_month': 6, 'days_to_first_order': 2, 'first_discount_pct': 0, 'first_n_items': 1, 'first_has_electronics': 0, 'days_since_first_order': 300, 'city': city, 'channel': channel, 'first_payment_method': 'cod', 'first_status': 'completed'}])
      pipe.fit(X_train, y_train)
      proba_promo = round(pipe.predict_proba(new_customer('promo'))[0, 1], 4)
      proba_organic = round(pipe.predict_proba(new_customer('organic'))[0, 1], 4)
    check: |
      check_value(proba_promo, _sol["proba_promo"], name="proba_promo", tol=0.001)
