title: "ชุดฝึกท้าย module: Feature engineering"
exercises:
  - id: "p1"
    level: "basic"
    lang: "python"
    prompt: |
      คอลัมน์ city มีกี่หมวด และ pd.get_dummies(df["city"], drop_first=True) ได้กี่คอลัมน์ เก็บไว้ในตัวแปร n_cities, n_dummy_drop
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd

      df = pd.read_csv("data/ml_customers.csv")
      n_cities = df['city'].nunique()
      n_dummy_drop = pd.get_dummies(df['city'], drop_first=True).shape[1]
    check: |
      check_value(n_cities, _sol["n_cities"], name="n_cities")
      check_value(n_dummy_drop, _sol["n_dummy_drop"], name="n_dummy_drop")
    hints:
      - "ทบทวนบทที่ 1 (encoding)"
