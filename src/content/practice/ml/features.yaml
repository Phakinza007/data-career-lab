  - id: "p14"
    level: "challenge"
    lang: "python"
    prompt: |
      CV AUC เฉลี่ยของ baseline (ใช้ฟังก์ชัน cv_auc ที่ให้ไว้) และเมื่อเพิ่ม fast_first เข้า feature ตัวเลข (ปัด 4 ตำแหน่ง) เก็บไว้ในตัวแปร auc_base, auc_with_fast
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import numpy as np
      import pandas as pd
      from sklearn.compose import ColumnTransformer
      from sklearn.linear_model import LogisticRegression
      from sklearn.model_selection import StratifiedKFold, cross_val_score
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import OneHotEncoder, StandardScaler

      df = pd.read_csv("data/ml_customers.csv")
      num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
      cat = ['city', 'channel', 'first_payment_method', 'first_status']


      def cv_auc(data, num_cols, cat_cols):
          pre = ColumnTransformer([('num', StandardScaler(), num_cols), ('cat', OneHotEncoder(handle_unknown='ignore'), cat_cols)])
          pipe = Pipeline([('pre', pre), ('model', LogisticRegression(max_iter=2000))])
          skf = StratifiedKFold(5, shuffle=True, random_state=42)
          return cross_val_score(pipe, data[num_cols + cat_cols], data['repeated'], cv=skf, scoring='roc_auc').mean()
      df['fast_first'] = (df['days_to_first_order'] <= 3).astype(int)
      auc_base = round(cv_auc(df, num, cat), 4)
      auc_with_fast = round(cv_auc(df, num + ['fast_first'], cat), 4)
    check: |
      check_value(auc_base, _sol["auc_base"], name="auc_base", tol=0.001)
      check_value(auc_with_fast, _sol["auc_with_fast"], name="auc_with_fast", tol=0.001)
    hints:
      - "ทบทวนบทที่ 4"
  - id: "p15"
    level: "challenge"
    lang: "python"
    prompt: |
      target encoding: อัตราซื้อซ้ำของ promo จากชุด train เท่านั้น และผลต่างเมื่อคำนวณจากข้อมูลทั้งชุด (full − train) ปัด 4 ตำแหน่ง เก็บไว้ในตัวแปร te_train_promo, te_gap
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
      cat = ['city', 'channel', 'first_payment_method', 'first_status']
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
      train_df = pd.concat([X_train, y_train], axis=1)
      full_promo = df.groupby('channel')['repeated'].mean()['promo']
      te_train_promo = round(train_df.groupby('channel')['repeated'].mean()['promo'], 4)
      te_gap = round(full_promo - train_df.groupby('channel')['repeated'].mean()['promo'], 4)
    check: |
      check_value(te_train_promo, _sol["te_train_promo"], name="te_train_promo", tol=0.0001)
      check_value(te_gap, _sol["te_gap"], name="te_gap", tol=0.0001)
    hints:
      - "ทบทวนบทที่ 1 (target encoding leakage)"
  - id: "p16"
    level: "challenge"
    lang: "python"
    prompt: |
      ค่าเฉลี่ย accuracy จาก 5-fold CV เดียวกันของทั้ง pipeline และจำนวนขั้นตอนของ pipeline (ปัด 4 ตำแหน่ง) เก็บไว้ในตัวแปร cv_acc_mean, n_steps
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      num = ['signup_month', 'days_to_first_order', 'first_discount_pct', 'first_n_items', 'first_has_electronics', 'days_since_first_order']
      cat = ['city', 'channel', 'first_payment_method', 'first_status']
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(df[num + cat], y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.compose import ColumnTransformer
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import OneHotEncoder, StandardScaler
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import roc_auc_score

      pre = ColumnTransformer([('num', StandardScaler(), num), ('cat', OneHotEncoder(handle_unknown='ignore'), cat)])
      pipe = Pipeline([('pre', pre), ('model', LogisticRegression(max_iter=2000))])
      from sklearn.model_selection import StratifiedKFold, cross_val_score

      skf = StratifiedKFold(5, shuffle=True, random_state=42)
      X_all = df[num + cat]
      scores = cross_val_score(pipe, X_all, df['repeated'], cv=skf, scoring='accuracy')
      cv_acc_mean = round(scores.mean(), 4)
      n_steps = len(pipe.steps)
    check: |
      check_value(cv_acc_mean, _sol["cv_acc_mean"], name="cv_acc_mean", tol=0.001)
      check_value(n_steps, _sol["n_steps"], name="n_steps")
    hints:
      - "ทบทวนบทที่ 3"
