  - id: "p6"
    level: "applied"
    lang: "python"
    prompt: |
      CV 5-fold (skf) วัด ROC-AUC เฉลี่ยของต้นไม้ที่ max_depth = 1..8 (random_state=42) เก็บ depth ที่ AUC สูงสุดไว้ใน best_depth (เสมอเอาน้อยสุด) และค่า AUC (ปัด 4 ตำแหน่ง) ไว้ใน best_auc
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.metrics import roc_auc_score
      from sklearn.model_selection import StratifiedKFold, cross_val_score, GridSearchCV
      from sklearn.tree import DecisionTreeClassifier
      from sklearn.ensemble import RandomForestClassifier, GradientBoostingClassifier
      from sklearn.linear_model import LogisticRegression
      from sklearn.dummy import DummyClassifier
      from sklearn.inspection import permutation_importance

      skf = StratifiedKFold(5, shuffle=True, random_state=42)
      scores = {d: cross_val_score(DecisionTreeClassifier(max_depth=d, random_state=42), X, y, cv=skf, scoring='roc_auc').mean() for d in range(1, 9)}
      best_depth = min(d for d, s in scores.items() if s == max(scores.values()))
      best_auc = round(scores[best_depth], 4)
    check: |
      check_value(best_depth, _sol["best_depth"], name="best_depth")
      check_value(best_auc, _sol["best_auc"], name="best_auc", tol=0.001)
    hints:
      - "สร้าง dict depth → AUC แล้วหาสูงสุด"
