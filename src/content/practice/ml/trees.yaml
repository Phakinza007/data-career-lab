  - id: "p12"
    level: "challenge"
    lang: "python"
    prompt: |
      GB ค่าเริ่มต้น (random_state=42): permutation importance บนชุดทดสอบ (n_repeats=5, random_state=42, scoring="roc_auc") feature ไหนสำคัญสุด (string) เก็บไว้ใน top_feature และค่า (ปัด 3 ตำแหน่ง) ไว้ใน top_value
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.metrics import roc_auc_score
      from sklearn.model_selection import StratifiedKFold, cross_val_score, GridSearchCV
      from sklearn.tree import DecisionTreeClassifier
      from sklearn.ensemble import RandomForestClassifier, GradientBoostingClassifier
      from sklearn.linear_model import LogisticRegression
      from sklearn.dummy import DummyClassifier
      from sklearn.inspection import permutation_importance

      skf = StratifiedKFold(5, shuffle=True, random_state=42)
      gb = GradientBoostingClassifier(random_state=42).fit(X_train, y_train)
      pi = permutation_importance(gb, X_test, y_test, n_repeats=5, random_state=42, scoring='roc_auc')
      perm = pd.Series(pi.importances_mean, index=X.columns)
      top_feature = perm.idxmax()
      top_value = round(perm.max(), 3)
    check: |
      check_value(top_feature, _sol["top_feature"], name="top_feature")
      check_value(top_value, _sol["top_value"], name="top_value", tol=0.001)
    hints:
      - "ทำ Series ของ importances_mean แล้ว idxmax"
  - id: "p13"
    level: "challenge"
    lang: "python"
    prompt: |
      เฉลี่ย predict_proba (คลาส 1) ของต้นไม้ depth 3, forest (100 ต้น, min_samples_leaf=10) และ GB ค่าเริ่มต้น (ทุกตัว random_state=42) แล้ววัด ROC-AUC บนชุดทดสอบ เก็บไว้ใน blend_auc และ AUC ที่ดีที่สุดในสามโมเดลเดี่ยวไว้ใน best_single_auc (ปัด 4 ตำแหน่ง)
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.metrics import roc_auc_score
      from sklearn.model_selection import StratifiedKFold, cross_val_score, GridSearchCV
      from sklearn.tree import DecisionTreeClassifier
      from sklearn.ensemble import RandomForestClassifier, GradientBoostingClassifier
      from sklearn.linear_model import LogisticRegression
      from sklearn.dummy import DummyClassifier
      from sklearn.inspection import permutation_importance

      skf = StratifiedKFold(5, shuffle=True, random_state=42)
      models = [DecisionTreeClassifier(max_depth=3, random_state=42), RandomForestClassifier(n_estimators=100, min_samples_leaf=10, random_state=42), GradientBoostingClassifier(random_state=42)]
      probas = [m.fit(X_train, y_train).predict_proba(X_test)[:, 1] for m in models]
      blend_auc = round(roc_auc_score(y_test, sum(probas) / 3), 4)
      best_single_auc = round(max(roc_auc_score(y_test, p) for p in probas), 4)
