  - id: "p11"
    level: "applied"
    lang: "python"
    prompt: |
      CV 5-fold (skf บน X, y ทั้งชุด) ROC-AUC เฉลี่ยของ LogisticRegression(max_iter=2000) และ GradientBoostingClassifier(random_state=42) ปัด 4 ตำแหน่ง เก็บไว้ในตัวแปร logreg_auc, gb_auc
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

