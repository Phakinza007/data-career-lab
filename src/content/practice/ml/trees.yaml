title: "ชุดฝึกท้าย module: Tree และ boosting"
exercises:
  - id: "p1"
    level: "basic"
    lang: "python"
    prompt: |
      ต้นไม้ที่ไม่จำกัดความลึก (DecisionTreeClassifier(random_state=42)) บน train มีกี่ใบ ลึกกี่ชั้น เก็บไว้ในตัวแปร n_leaves, depth
    starter: |
      # เขียนโค้ด Python ตรงนี้
    solution: |
      import pandas as pd
      from sklearn.model_selection import train_test_split

      df = pd.read_csv("data/ml_customers.csv")
      X = pd.get_dummies(df.drop(columns=['customer_id', 'repeated', 'first_order_value']), drop_first=True)
      y = df['repeated']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)
      from sklearn.metrics import roc_auc_score
      from sklearn.model_selection import StratifiedKFold, cross_val_score, GridSearchCV
      from sklearn.tree import DecisionTreeClassifier
      from sklearn.ensemble import RandomForestClassifier, GradientBoostingClassifier
      from sklearn.linear_model import LogisticRegression
      from sklearn.dummy import DummyClassifier
      from sklearn.inspection import permutation_importance

      skf = StratifiedKFold(5, shuffle=True, random_state=42)
      full = DecisionTreeClassifier(random_state=42).fit(X_train, y_train)
      n_leaves = full.get_n_leaves()
      depth = full.get_depth()
    check: |
      check_value(n_leaves, _sol["n_leaves"], name="n_leaves")
      check_value(depth, _sol["depth"], name="depth")
    hints:
      - "get_n_leaves() และ get_depth()"
