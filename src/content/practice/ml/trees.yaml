  - id: "p9"
    level: "applied"
    lang: "python"
    prompt: |
      ROC-AUC บนชุดทดสอบของ forest ที่มี 10 ต้น และ 200 ต้น (min_samples_leaf=10, random_state=42) ปัด 4 ตำแหน่ง เก็บไว้ในตัวแปร auc_10, auc_200
